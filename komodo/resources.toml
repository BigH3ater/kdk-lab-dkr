run_build = true    # run docker compose build before up
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"

[[procedure]]
tags = ["kdk-lab"]
name = "book-sync"
[procedure.config]
schedule_format = "Cron"
# :25 every hour -- off the gitops-sync :00/:15/:30/:45 slots and clear of
# remarkable-ocr (:20) / storage-health (:35) / tdarr-verify (:40) / -remediate (:50).
schedule = "0 25 * * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "sync"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "book-sync", enabled = true },
]

# Readwise articles -> KOReader: fetch Reader docs tagged 'remarkable', render each to
# EPUB (Calibre), deliver as files into /home/root/books/Readwise (KOReader reads files,
