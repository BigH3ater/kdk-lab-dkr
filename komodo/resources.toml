# The two config-SHA echoes run AFTER op inject -o .env (which truncates the file)
# so they append, not get wiped. DASHBOARD_GUIDES_SHA / DASHBOARD_VIKUNJA_SHA feed
# the kdk.config-sha labels on the guides (nginx) and vikunja services, so a
# guides.nginx.conf or (rendered) vikunja-config.yml change recreates just that
# container instead of silently keeping the stale single-file bind mount.
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env && op inject -f -i vikunja-config.yml.tpl -o vikunja-config.yml && chmod 644 vikunja-config.yml && echo DASHBOARD_GUIDES_SHA=$(sha256sum guides.nginx.conf | cut -c1-12) >> .env && echo DASHBOARD_VIKUNJA_SHA=$(sha256sum vikunja-config.yml | cut -c1-12) >> .env'"

# ---- procedures ----
[[procedure]]
tags = ["kdk-lab"]
name = "nightly-backups"
[procedure.config]
# schedule_format MUST be "Cron" to match the 6-field cron value below.
# With the default "English" format Komodo's parser can't read a cron string
# and the job fires erratically (observed running every minute 2026-09-13/14).
schedule_format = "Cron"
# 03:20, NOT 03:00 -- gitops-sync runs on every :00/:15/:30/:45 (0 */15) and a
# concurrent RunSync holds the backup stacks' lock, so a :00 start fails with
# "Resource is busy" (same collision that hit publish-docs). :20 avoids every
# gitops-sync slot.
schedule = "0 20 3 * * *"
schedule_timezone = "America/Chicago"
# Each stack sets destroy_before_deploy = true, so a SINGLE DeployStack does the
# down+up under one lock and always recreates the one-shot fresh. Do NOT use a
# separate DestroyStack + DeployStack in one stage: Komodo runs a stage's
# executions in PARALLEL, so the two race on the stack lock and one fails with
# "Resource is busy" (observed 2026-09-14). destroy_before_deploy also clears
# stale external-network IDs (identity_default/immich_internal change whenever
# identity/immich redeploy) that would otherwise make pg_dump fail "network not
# found".
#
# Stage order matters: all hosts must STAGE their data to the NFS tree before
# OFFSITE ships it, and VERIFY runs last so it sees the whole pass. The staging
# stages are best-effort (their containers exit 0 even on error); backup-verify
# is the single source of truth and pages Pushover on any failure.
[[procedure.config.stage]]
name = "stage-dkr-01"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-dkr-01", enabled = true },
]
[[procedure.config.stage]]
name = "stage-dmz"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-dmz", enabled = true },
]
[[procedure.config.stage]]
name = "stage-collect"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-collect", enabled = true },
]
[[procedure.config.stage]]
name = "offsite"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-offsite", enabled = true },
]
[[procedure.config.stage]]
name = "verify"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-verify", enabled = true },
]

# ---- GitOps automation: procedure gitops-sync + action gitops-reconcile ----
# Komodo Core is LAN-only, so GitHub push webhooks can't reach it; this pair
# polls instead, every 15 minutes.
#
# WHY a procedure wrapping an action, not RunSync inside the action: the sync
# updates the action's own config, and Komodo refuses to update a resource
# that is mid-run ("Action busy"). An action that awaits its own RunSync can
# therefore never receive updates to itself (observed 2026-09-14). The
# procedure's stage barrier guarantees the action has exited before RunSync
# starts, so sync-applied edits to the action always land.
[[action]]
tags = ["kdk-lab"]
name = "gitops-reconcile"
[action.config]
schedule_enabled = false   # driven by the gitops-sync procedure
failure_alert = true
file_contents = '''
const SYNC = "kdk-lab-dkr";
const TAG = "kdk-lab";
const BUILT_INS = new Set(["Backup Core Database", "Global Auto Update"]);

// Enforce tags FIRST: the sync only matches resources carrying match_tags, so
// an untagged resource is invisible to it -- the sync then tries to re-create
// it (name conflict) and runs "deploy on creation" against the live stack.
// Tagging everything non-built-in keeps the sync matching instead of creating.
const KINDS: [string, string][] = [
  ["Server", "ListServers"],
  ["Stack", "ListStacks"],
  ["Repo", "ListRepos"],
  ["Procedure", "ListProcedures"],
  ["Action", "ListActions"],
];
const tags: any[] = await komodo.read("ListTags", {});
const tagId = tags.find((t) => t.name === TAG)?._id?.$oid ?? TAG;
for (const [type, list] of KINDS) {
  const items: any[] = await komodo.read(list as any, {});
  for (const item of items) {
    if (BUILT_INS.has(item.name)) continue;
    const has = (item.tags ?? []).some((t: string) => t === tagId || t === TAG);
    if (!has) {
      // NOTE: 2.3.3 has no UpdateTagsOnResource -- tags are set via
      // UpdateResourceMeta (tags takes tag ids).
      await komodo.write("UpdateResourceMeta", {
        target: { type, id: item.id } as any,
        tags: [tagId],
      });
      console.log(`tagged ${type}/${item.name}`);
    }
  }
}

// Pull the linked repo + recompute the sync's pending state. The procedure's
// next stage (RunSync) applies whatever this surfaces.
await komodo.write("RefreshResourceSyncPending", { sync: SYNC });
const s: any = await komodo.read("GetResourceSync", { sync: SYNC });
const info = s.info ?? {};
console.log(`refreshed: last=${info.last_sync_hash ?? "?"} pending=${info.pending_hash ?? "?"}`);
'''

# Deploys every git-linked kdk-lab stack whose DEPLOYED commit is behind the
# repo HEAD AND whose run_directory has a changed file since that commit
# (HEAD + file list from the GitHub API; a komodo/resources.toml change deploys
# every stack not at HEAD; GitHub unreachable -> old latest_hash comparison).
# Repo-is-control semantic: a push re-converges the fleet, a stack nobody
# touched is skipped (2026-10-29: 36-41 no-op deploys per merge before this).
# NOT DeployStackIfChanged: Komodo's contents diff covers compose.yaml only, so
# config-dir-only changes (HA dashboards!) never register; this covers any file
# under the stack directory.
# Excluded: backup-* (nightly-backups owns their cadence; off-schedule offsite
# risks the Proton auth cooldown), files_on_host/adopted stacks, and stopped
# one-shot job stacks (their own procedures/schedules run them).
[[action]]
tags = ["kdk-lab"]
name = "deploy-changed"
[action.config]
schedule_enabled = false   # driven by the gitops-sync procedure
failure_alert = true
file_contents = '''
const TAG = "kdk-lab";
const REPO = "BigH3ater/kdk-lab-dkr";
// Never deploy the `komodo` stack from here: DeployStack on it recreates Core
// while this action runs inside Core, the update ends with "Komodo shutdown
// during execution" and every stack after it waits for the next tick
// (2026-10-28, PR #72). Core is applied by hand (docs/services/komodo.md).
const SKIP = /^(backup-|komodo$)/;
const NOTE = /^komodo$/;
const tags: any[] = await komodo.read("ListTags", {});
const tagId = tags.find((t) => t.name === TAG)?._id?.$oid ?? TAG;
// ListStacks/ListFullStacks return at most 50 stacks (2026-10-29: 50 of 65, so
// tailscale-*, trailarr, tandoor, wizarr*, tdarr-*, trivy-scan-* were never
// deployed). List per server instead; every host is well under 50.
const servers: any[] = await komodo.read("ListServers", {});
const seen = new Set<string>();
const stacks: any[] = [];
for (const sv of servers) {
  const part: any[] = await komodo.read("ListStacks", { query: { specific: { server_ids: [sv.id] } } });
  for (const s of part) if (!seen.has(s.name)) { seen.add(s.name); stacks.push(s); }
}
console.log(`deploy-changed: ${stacks.length} stacks across ${servers.length} servers`);

// Komodo's per-stack latest_hash is a cache that lags HEAD after a burst of
// merges (2026-10-29 05:32: 11 different values across 65 stacks, and
// RefreshStackCache did not move it within 15 s), so "deployed == latest" is
// not proof of being current. Take HEAD from GitHub (public repo, no token)
// and ask the compare API which files changed since each stack's deployed
// commit; deploy a stack only when a file under its run_directory changed.
// A change to komodo/resources.toml (stack env/config) falls back to "every
// stack not at HEAD", because the toml patch does not say which stack it is.
// If GitHub is unreachable, fall back to the old latest_hash comparison.
const gh = async (path: string) => {
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, {
    headers: { "Accept": "application/vnd.github+json", "User-Agent": "kdk-lab deploy-changed" },
  });
  if (!r.ok) throw new Error(`GitHub ${path}: HTTP ${r.status}`);
  return await r.json();
};
let head = "";
try { head = (await gh("/commits/main")).sha; } catch (e) { console.log(`HEAD lookup failed, falling back to latest_hash: ${e}`); }
const changed = new Map<string, string[] | null>();   // deployed short hash -> files (null = unknown)
const filesSince = async (dep: string): Promise<string[] | null> => {
  if (changed.has(dep)) return changed.get(dep)!;
  let files: string[] | null = null;
  try {
    const c = await gh(`/compare/${dep}...${head}`);
    files = (c.files ?? []).map((f: any) => f.filename);
    if (c.files && c.files.length >= 300) files = null;   // truncated: treat as unknown
  } catch (e) { console.log(`compare ${dep}...${head.slice(0, 7)} failed: ${e}`); }
  changed.set(dep, files);
  return files;
};

let fired = 0, behind: string[] = [], skipped = 0;
for (const s of stacks) {
  const tagged = (s.tags ?? []).some((t: string) => t === tagId || t === TAG);
  if (!tagged) continue;
  if (NOTE.test(s.name)) {
    const k: any = await komodo.read("GetStack", { stack: s.name });
    const dep = k?.info?.deployed_hash;
    const lat = head ? head.slice(0, 7) : k?.info?.latest_hash;
    if (dep && lat && !lat.startsWith(dep) && !dep.startsWith(lat))
      console.log(`komodo stack behind (${dep}->${lat}): apply by hand, never from deploy-changed`);
    continue;
  }
  if (SKIP.test(s.name)) continue;
  if (!s.info?.repo || s.info?.files_on_host) continue;
  if (s.info?.state === "stopped") continue;
  const st: any = await komodo.read("GetStack", { stack: s.name });
  const dep: string | undefined = st?.info?.deployed_hash;
  if (!dep) continue;                       // never deployed through Komodo: not ours to start
  let isBehind = false, why = "";
  // A stack from another repo (network-sre-learning) has a deployed_hash the
  // compare API cannot find in kdk-lab-dkr (404 -> "unknown" -> deployed every
  // run, 2026-10-29). Those keep the latest_hash comparison.
  const ownRepo = !st?.config?.repo || st.config.repo === REPO;
  if (head && ownRepo) {
    if (head.startsWith(dep)) { skipped++; continue; }
    const files = await filesSince(dep);
    if (files === null) { isBehind = true; why = `${dep}->${head.slice(0, 7)} (compare unknown)`; }
    else {
      const dir = (st?.config?.run_directory ?? `stacks/${s.name}`).replace(/\/+$/, "") + "/";
      const toml = files.includes("komodo/resources.toml");
      const mine = files.filter((f) => f.startsWith(dir));
      if (mine.length) { isBehind = true; why = `${dep}->${head.slice(0, 7)} ${mine.length} file(s): ${mine.slice(0, 3).join(",")}`; }
      else if (toml) { isBehind = true; why = `${dep}->${head.slice(0, 7)} resources.toml changed`; }
      else { skipped++; continue; }         // commits since dep touched other stacks only
    }
  } else {
    try { await komodo.write("RefreshStackCache", { stack: s.name }); } catch (e) {}
    const st2: any = await komodo.read("GetStack", { stack: s.name });
    const lat = st2?.info?.latest_hash;
    if (!lat || dep === lat) continue;
    isBehind = true; why = `${dep}->${lat} (latest_hash)`;
  }
  if (!isBehind) continue;
  behind.push(`${s.name} ${why}`);
  try {
    await komodo.execute("DeployStack", { stack: s.name });
    fired++;
  } catch (e) {
    console.log(`FAILED to queue ${s.name}: ${e}`);
  }
  // DeployStack returns as soon as it is queued, so without a pause every
  // behind stack pulls images in the same second. 2026-10-19 19:00: 33 deploys
  // -> media hit the registry burst limit ("allowed: 44000/minute") and two
  // stacks lost a containerd lease race on a shared base image. A few seconds
  // between queues spreads the pulls; 33 stacks still converge inside ~3 min.
  await new Promise((r) => setTimeout(r, 5000));
}
console.log(`head: ${head ? head.slice(0, 7) : "unknown"}; up to date or untouched: ${skipped}`);
console.log(`behind: ${behind.join(", ") || "none"}`);
console.log(`deploy-changed: queued ${fired} deploys`);
'''

# SELF-EDIT GOTCHA (2026-09-21): edits to THIS procedure cannot apply through
# its own RunSync stage — Komodo won't update a mid-run resource, so the sync
# retries until "procedure sync loop exited after max iterations" and FAILS
# every 15 min (failure_alert pages). After changing gitops-sync's stages,
# trigger one standalone RunSync (API /execute RunSync, or the sync webhook)
# so the procedure is idle when updated.
# lldap serves the LE wildcard cert dumped from the DMZ Traefik's acme.json but does
# not reload the files; restart just the lldap service twice a month so a renewed
# cert (issued 30 days before expiry) is picked up within ~15 days. 04:20 is outside
# the backup window and the dns-reconcile slot.
[[procedure]]
tags = ["kdk-lab"]
name = "identity-ldaps-refresh"
[procedure.config]
schedule_format = "Cron"
schedule = "0 20 4 1,15 * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
[[procedure.config.stage]]
name = "restart-lldap"
enabled = true
executions = [
  { execution.type = "RestartStack", execution.params.stack = "identity", execution.params.services = ["lldap"], enabled = true },
]

# Roborock local server cert, twice a month. Stage 1 deploys the roborock-cert
# one-shot (destroy_before_deploy, so the lego container re-runs each time): lego
# obtains the api-slave.kmkdp.com cert on the first run and renews it when within
# 30 days of expiry, else no-ops; its deploy hook writes /opt/kdk-lab/apps/roborock
# /tls/{tls.crt,tls.key}. Stage 2 restarts the roborock service so the server (it
# reads the cert only at start) picks the new file up. The restart always runs:
# on no-renewal cycles it is a harmless reload of the same cert, and on the one
# renewal cycle the new cert is served within ~15 days (the next 1st/15th restart),
# the same "renewal is 30 days ahead" margin identity-ldaps-refresh relies on.
# 04:40 is after the vacuum's nightly MQTT reconnect (~03:45) and before the first
# clean (08:30); the restart just drops and re-establishes the vacuum's MQTT
# session, which it does routinely (~1 min).
[[procedure]]
tags = ["kdk-lab"]
name = "roborock-cert-refresh"
[procedure.config]
schedule_format = "Cron"
schedule = "0 40 4 1,15 * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
[[procedure.config.stage]]
name = "issue-cert"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "roborock-cert", enabled = true },
]

[[procedure]]
tags = ["kdk-lab"]
name = "roborock-cert-apply"
# Second half of the Roborock cert cycle: restart the roborock server so it loads the
# tls.crt/tls.key the lego deploy hook wrote. Runs 30 min after roborock-cert-refresh
# because DeployStack returns as soon as the one-shot is started, not when it finishes
# (the first run restarted roborock while lego was still waiting on DNS).
[procedure.config]
schedule_format = "Cron"
schedule = "0 10 5 1,15 * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
[[procedure.config.stage]]
name = "restart-roborock"
enabled = true
executions = [
  { execution.type = "RestartStack", execution.params.stack = "apps", execution.params.services = ["roborock"], enabled = true },
]

[[procedure]]
tags = ["kdk-lab"]
name = "gitops-sync"
[procedure.config]
schedule_format = "Cron"
schedule = "0 */15 * * * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
[[procedure.config.stage]]
name = "prep"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params.action = "gitops-reconcile", enabled = true },
]
[[procedure.config.stage]]
name = "sync"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "kdk-lab-dkr", enabled = true },
]
# Close the GitOps loop for FILE changes: RunSync only reconciles resources.toml;
# it never redeploys a stack whose repo files changed (proven 2026-09-21 — two
# sync windows ignored pushed dashboard/theme changes). Implemented as a Deno
# action (NOT a BatchDeployStackIfChanged stage: that execution type made the
# 2.3.3 procedure sync loop "exit after max iterations", failing every RunSync
# on 2026-09-21). DeployStackIfChanged compares deployed vs latest contents per
# stack, so unrelated pushes leave one-shot/backup stacks alone. Public repo, but
# Core clones through the BigH3ater git-provider account (op://kdk-cluster/
# komodo-github-pat, read-only) so pulls are not rate-limited anonymously.
[[procedure.config.stage]]
name = "deploy-changed"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params.action = "deploy-changed", enabled = true },
]
# After sync, reconcile AdGuard DNS from the (now-current) compose Host() labels.
# destroy_before_deploy recreates the one-shot fresh each run so it re-clones the
# repo and reads HEAD; runs after "sync" so a just-added stack's record lands.
[[procedure.config.stage]]
name = "dns"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "dns-reconcile", enabled = true },
]

# NOTE: the built-in "Backup Core Database" and "Global Auto Update" procedures
# are Komodo init resources (auto-created) and are NOT declared here -- sync
# validation rejects them (spaced names / built-in execution types). They stay
# managed by Komodo itself; do not enable `managed` sync deletion without
# confirming these are exempt, or they would be pruned.

# Rebuild the Quartz docs site every 6h: destroy+deploy forces the one-shot
# builder to re-run (a plain `up -d` leaves the resident builder untouched).
# Destroy and deploy are in SEPARATE stages (sequential), NOT one stage: a
# stage's executions run in parallel and would race the docs lock ("Resource is
# busy", observed 2026-09-14). The `site` volume persists across the cycle.
[[procedure]]
tags = ["kdk-lab"]
name = "publish-docs"
[procedure.config]
schedule_format = "Cron"
# xx:05, not xx:00 -- gitops-sync owns the :00/:15/:30/:45 slots.
schedule = "0 5 */6 * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "down"
enabled = true
executions = [
  { execution.type = "DestroyStack", execution.params.stack = "docs", enabled = true },
]
[[procedure.config.stage]]
name = "up"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "docs", enabled = true },
]

