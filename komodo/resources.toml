# TAILSCALE_DNS_COREFILE_SHA feeds the coredns kdk.config-sha label so a Corefile
# edit recreates CoreDNS on deploy (single-file bind mount, no reload plugin).
# APPEND (>>): Komodo's "Write Environment File" stage writes .env BEFORE
# pre_deploy, so `>` would wipe any Komodo-managed env (convention, see
# cloudflare-watch / #178); duplicate lines on a re-deploy are harmless, compose
# takes the last value. ATTENDED: a recreate is a brief tailnet-DNS blip -- merge
# with a person watching, like tailscale-*.
pre_deploy.command = "sh -c 'echo TAILSCALE_DNS_COREFILE_SHA=$(sha256sum Corefile | cut -c1-12) >> .env'"
webhook_enabled = true

