# ---- procedures ----
[[procedure]]
tags = ["kdk-lab"]
name = "nightly-backups"
[procedure.config]
# schedule_format MUST be "Cron" to match the 6-field cron value below.
# With the default "English" format Komodo's parser can't read a cron string
# and the job fires erratically (observed running every minute 2026-09-13/14).
schedule_format = "Cron"
# 03:20, NOT 03:00 -- gitops-sync runs on every :00/:15/:30/:45 (0 */15) and a
# concurrent RunSync holds the backup stacks' lock, so a :00 start fails with
# "Resource is busy" (same collision that hit publish-docs). :20 avoids every
# gitops-sync slot.
schedule = "0 20 3 * * *"
schedule_timezone = "America/Chicago"
# Each stack sets destroy_before_deploy = true, so a SINGLE DeployStack does the
# down+up under one lock and always recreates the one-shot fresh. Do NOT use a
# separate DestroyStack + DeployStack in one stage: Komodo runs a stage's
# executions in PARALLEL, so the two race on the stack lock and one fails with
# "Resource is busy" (observed 2026-09-14). destroy_before_deploy also clears
# stale external-network IDs (identity_default/immich_internal change whenever
# identity/immich redeploy) that would otherwise make pg_dump fail "network not
# found".
#
# Stage order matters: all hosts must STAGE their data to the NFS tree before
# OFFSITE ships it, and VERIFY runs last so it sees the whole pass. The staging
# stages are best-effort (their containers exit 0 even on error); backup-verify
# is the single source of truth and pages Pushover on any failure.
[[procedure.config.stage]]
name = "stage-dkr-01"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-dkr-01", enabled = true },
]
[[procedure.config.stage]]
name = "stage-dmz"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-dmz", enabled = true },
]
[[procedure.config.stage]]
name = "stage-collect"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-collect", enabled = true },
]
[[procedure.config.stage]]
name = "offsite"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-offsite", enabled = true },
]
[[procedure.config.stage]]
name = "verify"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "backup-verify", enabled = true },
]

# ---- GitOps automation: procedure gitops-sync + action gitops-reconcile ----
# Komodo Core is LAN-only, so GitHub push webhooks can't reach it; this pair
# polls instead, every 15 minutes.
#
# WHY a procedure wrapping an action, not RunSync inside the action: the sync
# updates the action's own config, and Komodo refuses to update a resource
# that is mid-run ("Action busy"). An action that awaits its own RunSync can
# therefore never receive updates to itself (observed 2026-09-14). The
# procedure's stage barrier guarantees the action has exited before RunSync
# starts, so sync-applied edits to the action always land.
[[action]]
tags = ["kdk-lab"]
name = "gitops-reconcile"
[action.config]
schedule_enabled = false   # driven by the gitops-sync procedure
failure_alert = true
file_contents = '''
const SYNC = "kdk-lab-dkr";
const TAG = "kdk-lab";
const BUILT_INS = new Set(["Backup Core Database", "Global Auto Update"]);

// Enforce tags FIRST: the sync only matches resources carrying match_tags, so
// an untagged resource is invisible to it -- the sync then tries to re-create
// it (name conflict) and runs "deploy on creation" against the live stack.
// Tagging everything non-built-in keeps the sync matching instead of creating.
const KINDS: [string, string][] = [
  ["Server", "ListServers"],
  ["Stack", "ListStacks"],
  ["Repo", "ListRepos"],
  ["Procedure", "ListProcedures"],
  ["Action", "ListActions"],
];
const tags: any[] = await komodo.read("ListTags", {});
const tagId = tags.find((t) => t.name === TAG)?._id?.$oid ?? TAG;
for (const [type, list] of KINDS) {
  const items: any[] = await komodo.read(list as any, {});
  for (const item of items) {
    if (BUILT_INS.has(item.name)) continue;
    const has = (item.tags ?? []).some((t: string) => t === tagId || t === TAG);
    if (!has) {
      // NOTE: 2.3.3 has no UpdateTagsOnResource -- tags are set via
      // UpdateResourceMeta (tags takes tag ids).
      await komodo.write("UpdateResourceMeta", {
        target: { type, id: item.id } as any,
        tags: [tagId],
      });
      console.log(`tagged ${type}/${item.name}`);
    }
  }
}

// Pull the linked repo + recompute the sync's pending state. The procedure's
// next stage (RunSync) applies whatever this surfaces.
await komodo.write("RefreshResourceSyncPending", { sync: SYNC });
const s: any = await komodo.read("GetResourceSync", { sync: SYNC });
const info = s.info ?? {};
console.log(`refreshed: last=${info.last_sync_hash ?? "?"} pending=${info.pending_hash ?? "?"}`);
'''

[[procedure]]
tags = ["kdk-lab"]
name = "gitops-sync"
[procedure.config]
schedule_format = "Cron"
schedule = "0 */15 * * * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
[[procedure.config.stage]]
name = "prep"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params.action = "gitops-reconcile", enabled = true },
]
[[procedure.config.stage]]
name = "sync"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "kdk-lab-dkr", enabled = true },
]
# After sync, reconcile AdGuard DNS from the (now-current) compose Host() labels.
# destroy_before_deploy recreates the one-shot fresh each run so it re-clones the
# repo and reads HEAD; runs after "sync" so a just-added stack's record lands.
[[procedure.config.stage]]
name = "dns"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "dns-reconcile", enabled = true },
]

# NOTE: the built-in "Backup Core Database" and "Global Auto Update" procedures
# are Komodo init resources (auto-created) and are NOT declared here -- sync
# validation rejects them (spaced names / built-in execution types). They stay
# managed by Komodo itself; do not enable `managed` sync deletion without
# confirming these are exempt, or they would be pruned.

# Rebuild the Quartz docs site every 6h: destroy+deploy forces the one-shot
# builder to re-run (a plain `up -d` leaves the resident builder untouched).
# Destroy and deploy are in SEPARATE stages (sequential), NOT one stage: a
# stage's executions run in parallel and would race the docs lock ("Resource is
# busy", observed 2026-09-14). The `site` volume persists across the cycle.
[[procedure]]
tags = ["kdk-lab"]
name = "publish-docs"
[procedure.config]
schedule_format = "Cron"
# xx:05, not xx:00 -- gitops-sync owns the :00/:15/:30/:45 slots.
schedule = "0 5 */6 * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "down"
enabled = true
executions = [
  { execution.type = "DestroyStack", execution.params.stack = "docs", enabled = true },
]
[[procedure.config.stage]]
name = "up"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "docs", enabled = true },
]

# Hourly Tdarr transcode-failure validator (pages Pushover on DEE-wrapper down,
# Tdarr server unreachable, or rising transcode-error count).
[[stack]]
tags = ["kdk-lab"]
name = "tdarr-verify"
deploy = false   # run hourly by the tdarr-verify Procedure
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/tdarr-verify"
destroy_before_deploy = true   # one locked down+up (stage execs run in parallel)

[[procedure]]
tags = ["kdk-lab"]
name = "tdarr-verify"
[procedure.config]
schedule_format = "Cron"
# :40 every hour -- off the gitops-sync :00/:15/:30/:45 slots to avoid the
# "Resource is busy" lock race.
schedule = "0 40 * * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "verify"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "tdarr-verify", enabled = true },
]

