# Komodo Resource Sync -- servers, the source repo, and git-linked stacks.
# Each stack clones this repo on the periphery host and runs
# stacks/<name>/compose.yaml. Stacks with a .env.tpl render .env from
# 1Password Connect in pre_deploy (op CLI + /etc/komodo/op.env on the host).

# The git source of everything. The ResourceSync `kdk-lab-dkr` reads
# komodo/resources.toml through this Repo resource (sync.linked_repo -> here),
# so the repo definition lives in exactly one place. The sync itself cannot be
# declared in this file (self-reference fails validation) -- its config is the
# one Core-side resource maintained in the UI.
[[repo]]
tags = ["kdk-lab"]
name = "kdk-lab-dkr"
[repo.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
branch = "main"

[[server]]
tags = ["kdk-lab"]
name = "kdk-dkr-01"
[server.config]
address = "https://10.1.20.20:8120"
enabled = true

[[server]]
tags = ["kdk-lab"]
name = "kdk-dkr-dmz-01"
[server.config]
address = "https://192.168.191.20:8120"
enabled = true

[[server]]
tags = ["kdk-lab"]
name = "kdk-dkr-02"
[server.config]
address = "https://10.1.30.21:8120"
enabled = true

[[server]]
tags = ["kdk-lab"]
name = "kdk-dkr-03"
[server.config]
address = "https://10.1.30.22:8120"
enabled = true

[[server]]
tags = ["kdk-lab"]
name = "kdk-mon-01"
[server.config]
address = "https://10.1.20.30:8120"
enabled = true

# Log host (VM 320 on kdk-hyp-01): Loki + syslog receiver. Periphery binds
# 10.1.20.21 only and the nft policy admits :8120 from kdk-dkr-01 only.
[[server]]
tags = ["kdk-lab"]
name = "kdk-log-01"
[server.config]
address = "https://10.1.20.21:8120"
enabled = true

# Internal compose host (VM `kdkdkr04` on kdk-nas-01): the second internal
# Docker host, added 2026-10-30 to split the heavy render/encode work off the
# over-committed kdk-dkr-01. Periphery binds 10.1.20.22 only and the nft
# host_guard admits :8120 from Komodo Core (kdk-dkr-01) on same-subnet VLAN 20.
[[server]]
tags = ["kdk-lab"]
name = "kdk-dkr-04"
[server.config]
address = "https://10.1.20.22:8120"
enabled = true

# ---- kdk-dkr-01 stacks ----
[[stack]]
tags = ["kdk-lab"]
name = "proxy"
deploy = true
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/proxy"
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"
webhook_enabled = true

[[stack]]
tags = ["kdk-lab"]
name = "op-connect"
deploy = true
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/op-connect"
webhook_enabled = true

[[stack]]
tags = ["kdk-lab"]
name = "docs"
deploy = true
after = ["proxy"]
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/docs"
# DOCS_NGINX_SHA feeds the nginx service's kdk.config-sha label so an nginx.conf
# edit recreates nginx on deploy (single-file bind mount; otherwise it only self-
# heals on the 6-hourly publish-docs destroy+deploy). APPEND (>>): Komodo's "Write
# Environment File" stage writes .env BEFORE pre_deploy, so `>` would wipe any
# Komodo-managed env (convention, see cloudflare-watch / #178). docs has no
# Komodo env today, and a duplicate line on a re-deploy is harmless -- compose
# takes the last value.
pre_deploy.command = "sh -c 'echo DOCS_NGINX_SHA=$(sha256sum nginx.conf | cut -c1-12) >> .env'"
webhook_enabled = true

[[stack]]
tags = ["kdk-lab"]
name = "media"
deploy = true
after = ["proxy"]
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/media"
# A service removed from the compose (wizarr -> DMZ, 2026-10-27) is otherwise left
# running as an orphan by `up -d`; this makes the deploy remove it.
extra_args = ["--remove-orphans"]
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"
webhook_enabled = true

