pre_deploy.command = "sh -c 'cp -f traefik-dynamic/*.yml /opt/kdk-lab/home-assistant/traefik/dynamic/ && mkdir -p /opt/kdk-lab/home-assistant/config/dashboards /opt/kdk-lab/home-assistant/config/themes /opt/kdk-lab/home-assistant/config/packages && cp -f config/dashboards/*.yaml /opt/kdk-lab/home-assistant/config/dashboards/ && cp -f config/themes/*.yaml /opt/kdk-lab/home-assistant/config/themes/ && cp -f config/packages/*.yaml /opt/kdk-lab/home-assistant/config/packages/ && { [ -e /opt/kdk-lab/home-assistant/node-red/settings.js.pre-gitops ] || [ ! -e /opt/kdk-lab/home-assistant/node-red/settings.js ] || cp -p /opt/kdk-lab/home-assistant/node-red/settings.js /opt/kdk-lab/home-assistant/node-red/settings.js.pre-gitops; } && cp -f node-red/settings.js /opt/kdk-lab/home-assistant/node-red/settings.js'"
webhook_enabled = true

# GitOps-owned since 2026-09-20 (was files-on-host). Data dir stays at
# /opt/kdk-lab/scrypted; network_mode: host (HomeKit mDNS). No secrets.
# Homebridge was removed 2026-10-28 (zero accessories, setup never claimed); the
# stack keeps its old name because a rename is a destroy/recreate -- rename to
# `scrypted` later as its own change.
[[stack]]
tags = ["kdk-lab"]
name = "scrypted-homebridge"
deploy = true
[stack.config]
server = "kdk-dkr-03"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/scrypted-homebridge"
# The removed homebridge service would otherwise keep running as an orphan
# after `up -d`; this makes the deploy remove it.
extra_args = ["--remove-orphans"]
webhook_enabled = true

# GitOps-owned since 2026-09-20 (was files-on-host; repo dir already existed and
# matched the live compose byte-for-byte). project_name=monitoring preserved so
# container/network names don't churn. Secrets stay in the HOST-managed
# /opt/kdk-lab/monitoring/.env (mon-01 deliberately has no op CLI — keep-lean
# directive); pre_deploy copies it next to the cloned compose for interpolation.
[[stack]]
tags = ["kdk-lab"]
name = "monitoring-ext"
deploy = true
[stack.config]
server = "kdk-mon-01"
project_name = "monitoring"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/monitoring"
auto_pull = false  # images already local; Docker Hub rate-limits the Pi (registry denied) -- pull explicitly on version bumps
# Alertmanager reads its Pushover/SMTP credentials from FILES bind-mounted out
# of ./alertmanager/. Git does not carry them, so on a fresh clone Docker
# "helpfully" creates empty DIRECTORIES at those paths and Alertmanager fails
# every notification with "read token_file: is a directory" -- which is exactly
# how paging was silently dead from 2026-09-21 until found 2026-10-19 (five
# alert batches never reached Pushover). The Pi has no op CLI, so the files are
# pre-rendered once into /opt/kdk-lab/monitoring/alertmanager/ (0400, uid 65534
# = the alertmanager user) and installed into the clone here before every up.
# rmdir only removes an EMPTY placeholder directory, so a real file is never
# clobbered by mistake; install fails loudly if a source file is missing.
# The trailing echoes append BLACKBOX_CONFIG_SHA to the host-copied .env (a blank
# line first, since the host file's final newline is not guaranteed) so the
# blackbox-exporter kdk.config-sha label recreates it on a blackbox.yml change --
# prometheus/alertmanager already pick up edits via the whole-directory mount +
# post_deploy /-/reload, but blackbox :9115 is expose-only and not reloaded.
pre_deploy.command = "sh -c 'cp -f /opt/kdk-lab/monitoring/.env .env && for f in pushover-app-token pushover-user-key proton-bridge-smtp-password; do if [ -d alertmanager/$f ]; then rmdir alertmanager/$f; fi; install -m 0400 -o 65534 -g 65534 /opt/kdk-lab/monitoring/alertmanager/$f alertmanager/$f || exit 1; done && echo >> .env && echo BLACKBOX_CONFIG_SHA=$(sha256sum blackbox/blackbox.yml | cut -c1-12) >> .env'"
# Apply prometheus.yml / rules and alertmanager.yml edits without a restart
# (both bind-mount their config, so compose never recreates them for an edit).
# Retries ride out the container (re)starting; a 500 here = invalid config, and
# failing the deploy is the signal. A rejected Alertmanager reload keeps the
# previous config running, so paging never goes dark on a bad edit.
post_deploy.command = "sh -c 'curl -fsS --retry 12 --retry-all-errors --retry-delay 5 -X POST http://10.1.20.30:9090/-/reload && curl -fsS --retry 12 --retry-all-errors --retry-delay 5 -X POST http://10.1.20.30:9093/-/reload'"
webhook_enabled = true

[[stack]]
tags = ["kdk-lab"]
name = "komodo"
deploy = false
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/komodo"
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"

# network-sre-learning site (learn.kmkdp.com) — built from the PRIVATE
# BigH3ater/network-sre-learning repo, so it needs a git credential to clone:
# Komodo git-provider account `BigH3ater` (PAT in op://kdk-cluster/komodo-github-pat,
# Contents r/w on both repos; also enables the sync's toml write-back). Uses that
# repo's compose.komodo.yaml (site-only, Traefik on the proxy net, LAN-gated) and
# builds the MkDocs image on kdk-dkr-01. deploy=false until compose.komodo.yaml is
# on the learning repo's main (PR #10) — then flip true + DeployStack.
[[stack]]
tags = ["kdk-lab"]
name = "network-sre-learning"
deploy = true
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/network-sre-learning"
git_account = "BigH3ater"
branch = "main"
run_directory = "."
file_paths = ["compose.komodo.yaml"]
auto_pull = false
run_build = true
webhook_enabled = true

# ---- security detection: weekly advisory-watch + trivy-scan (security plan B4) ----
# advisory-watch: upstream advisories (GitHub/OSV/NVD/RSS) vs every pinned image
# tag in stacks/, one logfmt line per advisory -> Loki job="advisory-watch" on the
# same host; stacks/loki/rules/advisories.yml pages. deploy=false (run by the
# procedure); destroy_before_deploy = fresh repo clone each run. pre_deploy:
# kdk-log-01 has no op CLI/op.env by design, so .env (optional GITHUB_TOKEN) is
# only rendered where /etc/komodo/op.env exists; otherwise it is left empty and
# the job runs unauthenticated (it waits out GitHub's 60 req/h window).
[[stack]]
tags = ["kdk-lab"]
name = "advisory-watch"
deploy = false   # run weekly by the advisory-watch Procedure
[stack.config]
server = "kdk-log-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/advisory-watch"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
pre_deploy.command = "sh -c 'if [ -r /etc/komodo/op.env ]; then . /etc/komodo/op.env && op inject -f -i .env.tpl -o .env; else : > .env; fi'"

[[procedure]]
tags = ["kdk-lab"]
name = "advisory-watch"
[procedure.config]
schedule_format = "Cron"
# Monday 07:03 -- after trivy-scan (06:03), off the gitops-sync :00/:15/:30/:45 slots.
schedule = "0 3 7 * * Mon"
schedule_enabled = true
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "watch"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "advisory-watch", enabled = true },
]

# trivy-scan: one stack per compose host (same compose, NODE_NAME differs), each
# scanning the images RUNNING on its host through a GET-only socket proxy that
# exists only for the run. Read-only for the host (no POST), so dkr-03 (NUT) is
# safe to include. Lines -> Loki job="trivy",host=<NODE_NAME>. All six run in
# one stage (different hosts, no shared lock).
[[stack]]
tags = ["kdk-lab"]
name = "trivy-scan-dkr01"
deploy = false   # run weekly by the trivy-scan Procedure
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/trivy-scan"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
environment = "NODE_NAME=kdk-dkr-01\nLOKI_URL=http://10.1.20.21:3100"

