# reMarkable <-> Readwise pipeline (migrated from the decommissioned dockge host).
# Three prebuilt legs on kdk-dkr-01 talking to the live rmfakecloud over the
# apps_default network. Readwise token via op read in pre_deploy; needs GHCR pull access for
# the private ghcr.io/bigh3ater/* images and a one-time rmapi registration.
[[stack]]
tags = ["kdk-lab"]
name = "readwise-to-remarkable"
deploy = true
after = ["apps", "media"]
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/readwise-to-remarkable"
# The token is rendered here (not by a one-shot sidecar, whose exited container
# kept the stack "unhealthy") into ./secrets, which the compose mounts at
# /secrets:ro. 0644 as before: the prebuilt image's user is not pinned to root.
# --remove-orphans removes the retired `secrets` container on the first deploy.
extra_args = ["--remove-orphans"]
pre_deploy.command = "sh -c '. /etc/komodo/op.env && mkdir -p secrets && op read -n -f -o secrets/readwise-token \"op://kdk-cluster/readwise-token-ro/credential\" && chmod 644 secrets/readwise-token'"
webhook_enabled = true

