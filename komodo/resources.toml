]

# reMarkable handwriting -> OCR (Ollama qwen2.5vl on the 4090) -> Obsidian vault.
# One-shot `pipeline.py run`: enqueue changed notebook pages when the tablet is on
# Wi-Fi, drain the durable queue when the workstation is up. Both halves no-op if
# their dependency is offline, so nothing is lost (tablet sleeps; 4090 intermittent).
# pre_deploy op-injects the tablet root password; destroy_before_deploy re-runs it.
[[stack]]
tags = ["kdk-lab"]
name = "remarkable-ocr"
deploy = false   # run hourly by the remarkable-ocr Procedure
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/remarkable-ocr"
auto_pull = false   # image is built locally (no registry) -> skip compose pull
run_build = true    # run docker compose build before up
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"

[[procedure]]
tags = ["kdk-lab"]
name = "remarkable-ocr"
[procedure.config]
schedule_format = "Cron"
