# ---- procedures ----
[[procedure]]
tags = ["kdk-lab"]
name = "nightly-backups"
[procedure.config]
# schedule_format MUST be "Cron" to match the 6-field cron value below.
# With the default "English" format Komodo's parser can't read a cron string
# and the job fires erratically (observed running every minute 2026-09-13/14).
schedule_format = "Cron"
schedule = "0 0 3 * * *"
schedule_timezone = "America/Chicago"
# DestroyStack before DeployStack so the one-shot backup containers are always
# recreated fresh each run: `docker compose up -d` skips already-exited
# one-shots, and stale external-network IDs (identity_default/immich_internal,
# which change whenever identity/immich are redeployed) would make pg_dump fail
# with "network not found". Destroy+deploy re-runs the dumps every night.
[[procedure.config.stage]]
name = "dkr-01"
enabled = true
executions = [
  { execution.type = "DestroyStack", execution.params.stack = "backup-dkr-01", enabled = true },
  { execution.type = "DeployStack", execution.params.stack = "backup-dkr-01", enabled = true },
]
[[procedure.config.stage]]
name = "dmz"
enabled = true
executions = [
  { execution.type = "DestroyStack", execution.params.stack = "backup-dmz", enabled = true },
  { execution.type = "DeployStack", execution.params.stack = "backup-dmz", enabled = true },
]

# ---- actions ----
# GitOps reconciler: Komodo Core is LAN-only, so GitHub push webhooks can't
# reach it. This Action polls instead: refresh the sync (pulls the linked repo,
# recomputes pending), and if the repo moved or resources drifted, RunSync
# applies komodo/resources.toml. Runs on Core (Deno) every 15 minutes.
[[action]]
tags = ["kdk-lab"]
name = "gitops-reconcile"
[action.config]
schedule_format = "Cron"
schedule = "0 */15 * * * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
file_contents = '''
const SYNC = "kdk-lab-dkr";
const TAG = "kdk-lab";
const BUILT_INS = new Set(["Backup Core Database", "Global Auto Update"]);

// Enforce tags FIRST: the sync only matches resources carrying match_tags, so
// an untagged resource is invisible to it -- the sync then tries to re-create
// it (name conflict) and runs "deploy on creation" against the live stack.
// Tagging everything non-built-in keeps the sync matching instead of creating.
const KINDS: [string, string][] = [
  ["Server", "ListServers"],
  ["Stack", "ListStacks"],
  ["Repo", "ListRepos"],
  ["Procedure", "ListProcedures"],
  ["Action", "ListActions"],
];
const tags: any[] = await komodo.read("ListTags", {});
const tagId = tags.find((t) => t.name === TAG)?._id?.$oid ?? TAG;
for (const [type, list] of KINDS) {
  const items: any[] = await komodo.read(list as any, {});
  for (const item of items) {
    if (BUILT_INS.has(item.name)) continue;
    const has = (item.tags ?? []).some((t: string) => t === tagId || t === TAG);
    if (!has) {
      await komodo.write("UpdateTagsOnResource", {
        target: { type, id: item.id } as any,
        tags: [TAG],
      });
      console.log(`tagged ${type}/${item.name}`);
    }
  }
}

// Pull the linked repo + recompute the sync's pending state.
await komodo.write("RefreshResourceSyncPending", { sync: SYNC });

const s: any = await komodo.read("GetResourceSync", { sync: SYNC });
const info = s.info ?? {};
const last = info.last_sync_hash ?? "";
const pendingHash = info.pending_hash ?? "";

// Count pending updates defensively across the info shapes Komodo reports.
const updates =
  (info.resource_updates?.length ?? 0) +
  (info.variable_updates?.length ?? 0) +
  (info.user_group_updates?.length ?? 0) +
  (typeof info.pending_deploy?.to_deploy === "number" ? info.pending_deploy.to_deploy : 0);

const repoMoved = pendingHash !== "" && pendingHash !== last;

if (!repoMoved && updates === 0) {
  console.log(`in sync at ${last || "(no hash)"} -- nothing to do`);
} else {
  console.log(`reconciling: ${last || "(none)"} -> ${pendingHash || last} (${updates} pending updates)`);
  // execute() returns the queued Update -- poll it to completion so failures
  // actually fail this action (and alert) instead of reporting stale success.
  let update: any = await komodo.execute("RunSync", { sync: SYNC });
  const updateId = update?._id?.$oid ?? update?.id;
  for (let i = 0; i < 90 && updateId && update?.status !== "Complete"; i++) {
    await new Promise((r) => setTimeout(r, 2000));
    update = await komodo.read("GetUpdate", { id: updateId });
  }
  if (update?.success === false) {
    const errs = (update?.logs ?? [])
      .filter((l: any) => (l.stderr ?? "") !== "")
      .map((l: any) => `[${l.stage}] ${l.stderr}`)
      .join("\n");
    throw new Error(`RunSync failed:\n${errs || JSON.stringify(update)}`);
  }
  const after: any = await komodo.read("GetResourceSync", { sync: SYNC });
  console.log(`applied ${after.info?.last_sync_hash ?? "?"} (${after.info?.last_sync_message ?? ""})`);
}
'''

# One-shot tag backfill: the sync only applies tags when it CREATES a
# resource -- pre-existing resources keep their old (empty) tags. This action
# stamps kdk-lab on every non-built-in resource so match_tags scoping works.
# Not scheduled; run manually (Execute) if untagged resources ever reappear.
[[action]]
tags = ["kdk-lab"]
name = "tag-backfill"
[action.config]
schedule_enabled = false
file_contents = '''
const TAG = "kdk-lab";
const SKIP = new Set(["Backup Core Database", "Global Auto Update"]);
const KINDS: [string, string][] = [
  ["Server", "ListServers"],
  ["Stack", "ListStacks"],
  ["Repo", "ListRepos"],
  ["Procedure", "ListProcedures"],
  ["Action", "ListActions"],
];

for (const [type, list] of KINDS) {
  const items: any[] = await komodo.read(list as any, {});
  for (const item of items) {
    if (SKIP.has(item.name)) continue;
    await komodo.write("UpdateTagsOnResource", {
      target: { type, id: item.id } as any,
      tags: [TAG],
    });
    console.log(`tagged ${type}/${item.name}`);
  }
}
console.log("tag backfill complete");
'''

# NOTE: the built-in "Backup Core Database" and "Global Auto Update" procedures
# are Komodo init resources (auto-created) and are NOT declared here -- sync
# validation rejects them (spaced names / built-in execution types). They stay
# managed by Komodo itself; do not enable `managed` sync deletion without
# confirming these are exempt, or they would be pruned.

# Rebuild the Quartz docs site every 6h: destroy+deploy forces the one-shot
# builder to re-run (a plain `up -d` leaves the resident builder untouched).
# The `site` volume persists across the cycle, so nginx keeps serving.
[[procedure]]
tags = ["kdk-lab"]
name = "publish-docs"
[procedure.config]
schedule_format = "Cron"
schedule = "0 0 */6 * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "rebuild"
enabled = true
executions = [
  { execution.type = "DestroyStack", execution.params.stack = "docs", enabled = true },
  { execution.type = "DeployStack", execution.params.stack = "docs", enabled = true },
]

