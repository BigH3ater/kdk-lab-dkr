tags = ["kdk-lab"]
name = "arr-list-guard"
deploy = false   # run every 6 h by the arr-list-guard Procedure
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/arr-list-guard"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs

[[procedure]]
tags = ["kdk-lab"]
name = "arr-list-guard"
[procedure.config]
schedule_format = "Cron"
# :32 every 6 h -- a free minute, off the gitops-sync :00/:15/:30/:45 slots.
schedule = "0 32 */6 * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "guard"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "arr-list-guard", enabled = true },
]

# wizarr-sync: finish Wizarr LDAP invites on kdk-dkr-dmz-01. Each "Create LDAP
# user" invite leaves the account out of the jellyfin-users lldap group, on the
# default Jellyfin auth provider, and unknown to Seerr -- so the invitee cannot
# log in via LDAP/SSO. Every 15 min this adds the group, flips the Jellyfin
# provider to the LDAP plugin, and imports the user into Seerr. Idempotent; no-op
# when nothing is pending. deploy=false (run by the Procedure);
# destroy_before_deploy re-runs the one-shot; pre_deploy op-injects the lldap
# admin password + Jellyfin API key. See stacks/wizarr-sync/.
[[stack]]
tags = ["kdk-lab"]
name = "wizarr-sync"
deploy = false   # run every 15 min by the wizarr-sync Procedure
[stack.config]
server = "kdk-dkr-dmz-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/wizarr-sync"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"

[[procedure]]
tags = ["kdk-lab"]
name = "wizarr-sync"
[procedure.config]
schedule_format = "Cron"
# :07,:22,:37,:52 every hour (every 15 min, offset) -- off the gitops-sync
# :00/:15/:30/:45 slots to avoid the "Resource is busy" lock race.
schedule = "0 7,22,37,52 * * * *"
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "sync"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "wizarr-sync", enabled = true },
]

