# Obsidian vault -> PDFs -> tablet (/home/root/books/kodiak-codex) for KOReader. ONE image,
# TWO services: (1) a long-running WATCHER that polls _remarkable/queue/ and delivers a
# "Send to reMarkable" request within seconds; (2) the scheduled one-shot below (this stack's
# DeployStack), which drains the queue as a fallback if the watcher is down and then
# reconciles the whole tree -- SYNC_FOLDERS (default 20.Work) per-note + every other
# top-level section combined. A /state lock stops the two processing the same request twice.
# Requests arrive via Obsidian Sync (no network/token). PDFs mirror the vault folder tree.
# Mermaid blocks render to SVG via the kroki stack above over kroki_default -- so deploy
# kroki FIRST. destroy_before_deploy recreates both services each scheduled run (watcher gap
# is seconds; the one-shot is the fallback). RM_DEST was renamed from books/Homelab; the
# first run migrates the old folder once (mv, keeping .sdr, never deleting).
[[stack]]
tags = ["kdk-lab"]
name = "obsidian-to-koreader"
deploy = false   # the one-shot is run by the obsidian-to-koreader Procedure; the watcher stays up
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/obsidian-to-koreader"
auto_pull = false
run_build = true
destroy_before_deploy = true
# As root on the host: create the vault request queue (_remarkable/{queue,done}) owned
# 1000:1000 so the uid-1000 sync agent can write the plugin's queue files there and manage
# the renderer's done/ files (idempotent; also fixes a pre-existing root:root dir). Chown
# the state dir so the now-unprivileged container can write its state/build. Then op-inject
# the tablet password.
pre_deploy.command = "sh -c 'install -d -o 1000 -g 1000 /opt/kdk-lab/obsidian/vault/_remarkable /opt/kdk-lab/obsidian/vault/_remarkable/queue /opt/kdk-lab/obsidian/vault/_remarkable/done && chown -R 1000:1000 /opt/kdk-lab/obsidian-to-koreader && . /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"

[[procedure]]
tags = ["kdk-lab"]
name = "obsidian-to-koreader"
[procedure.config]
schedule_format = "Cron"
schedule = "0 48 */6 * * *"   # after docs-to-vault (:42)
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "sync"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "obsidian-to-koreader", enabled = true },
]

