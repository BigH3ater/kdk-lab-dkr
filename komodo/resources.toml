# Komodo Resource Sync -- servers and git-linked stacks.
# Each stack clones this repo on the periphery host and runs
# stacks/<name>/compose.yaml. Stacks with a .env.tpl render .env from
# 1Password Connect in pre_deploy (op CLI + /etc/komodo/op.env on the host).

[[server]]
name = "kdk-dkr-01"
[server.config]
address = "https://10.1.20.40:8120"
enabled = true

[[server]]
name = "kdk-dkr-dmz-01"
[server.config]
address = "https://192.168.191.20:8120"
enabled = true

[[server]]
name = "kdk-dkr-02"
[server.config]
address = "https://10.1.30.21:8120"
enabled = false   # enabled at Pi adoption

[[server]]
name = "kdk-dkr-03"
[server.config]
address = "https://10.1.30.22:8120"
enabled = false

[[server]]
name = "kdk-mon-01"
[server.config]
address = "https://10.1.20.30:8120"
enabled = false

# ---- kdk-dkr-01 stacks ----
[[stack]]
name = "proxy"
deploy = true
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
git_account = "BigH3ater"
run_directory = "stacks/proxy"
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"
webhook_enabled = true

[[stack]]
name = "op-connect"
deploy = true
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
git_account = "BigH3ater"
run_directory = "stacks/op-connect"
webhook_enabled = true

[[stack]]
name = "docs"
deploy = true
after = ["proxy"]
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
git_account = "BigH3ater"
run_directory = "stacks/docs"
webhook_enabled = true

[[stack]]
name = "media"
deploy = true
after = ["proxy"]
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
git_account = "BigH3ater"
run_directory = "stacks/media"
webhook_enabled = true

[[stack]]
name = "apps"
deploy = true
after = ["proxy"]
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
git_account = "BigH3ater"
run_directory = "stacks/apps"
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"
webhook_enabled = true

[[stack]]
name = "backup-dkr-01"
deploy = false   # deployed nightly by the backup Procedure
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
git_account = "BigH3ater"
run_directory = "stacks/backup-dkr-01"

