# ---- cloudflare-watch: read-only Cloudflare edge watch (kmkdp.com zone) ----
# Two one-shot stacks share stacks/cloudflare-watch (deploy=false,
# destroy_before_deploy = a fresh locked down+up each run), on kdk-log-01:
#   cloudflare-watch         hourly  -> tunnel/SSL/zone-settings/firewall-events
#   cloudflare-watch-weekly  Monday  -> rule + DNS sha drift (--weekly via env)
# Each prints JSON lines to stdout and pushes them to Loki directly (LOKI_URL;
# {job="cloudflare-watch", container="cloudflare-watch"/"cloudflare-watch-weekly"})
# -- a one-shot exits before Alloy can scrape it -- and cloudflare.yml pages.
# CFWATCH_SUFFIX keeps the two container names distinct (two one-shots can't
# share a name on one host). Pinned python image (no local build). pre_deploy:
# kdk-log-01 has no op.env, so .env (CF_API_TOKEN) renders only where op.env
# exists; otherwise the token comes from /etc/kdk/cloudflare-watch.env (host).
[[stack]]
tags = ["kdk-lab"]
name = "cloudflare-watch"
deploy = false   # run hourly by the cloudflare-watch procedure
[stack.config]
server = "kdk-log-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/cloudflare-watch"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
# Append op-rendered vars; never clobber .env (see the weekly stack below).
pre_deploy.command = "sh -c 'if [ -r /etc/komodo/op.env ]; then . /etc/komodo/op.env && op inject -f -i .env.tpl -o .env.op && cat .env.op >> .env; fi'"

[[stack]]
tags = ["kdk-lab"]
name = "cloudflare-watch-weekly"
deploy = false   # run weekly by the cloudflare-watch-weekly procedure
[stack.config]
server = "kdk-log-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/cloudflare-watch"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs
environment = "CFWATCH_MODE=weekly\nCFWATCH_SUFFIX=-weekly"
# Append op-rendered vars; never clobber .env. Komodo's Write-Environment stage
# writes `environment` (CFWATCH_SUFFIX) to .env BEFORE pre_deploy, so overwriting
# it here dropped the suffix and the weekly run reused the hourly container name
# (Conflict: "/cloudflare-watch" already in use). No else branch: on kdk-log-01
# (no op.env) .env is left exactly as Komodo wrote it.
pre_deploy.command = "sh -c 'if [ -r /etc/komodo/op.env ]; then . /etc/komodo/op.env && op inject -f -i .env.tpl -o .env.op && cat .env.op >> .env; fi'"

[[procedure]]
tags = ["kdk-lab"]
name = "cloudflare-watch"
[procedure.config]
schedule_format = "Cron"
# Hourly at :17 -- off the gitops-sync :00/:15/:30/:45 slots.
schedule = "0 17 * * * *"
schedule_enabled = true
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "watch"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "cloudflare-watch", enabled = true },
]

[[procedure]]
tags = ["kdk-lab"]
name = "cloudflare-watch-weekly"
[procedure.config]
schedule_format = "Cron"
# Monday 07:10 -- off the gitops-sync :00/:15/:30/:45 slots.
schedule = "0 10 7 * * Mon"
schedule_enabled = true
schedule_timezone = "America/Chicago"
[[procedure.config.stage]]
name = "watch"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "cloudflare-watch-weekly", enabled = true },
]
