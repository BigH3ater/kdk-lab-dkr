[[stack]]
tags = ["kdk-lab"]
name = "arr-upgrade-search"
deploy = false   # run weekly by the arr-upgrade-search Procedure
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/arr-upgrade-search"
destroy_before_deploy = true   # one locked down+up so the one-shot re-runs

[[procedure]]
tags = ["kdk-lab"]
name = "arr-upgrade-search"
[procedure.config]
schedule_format = "Cron"
# Sunday 04:25 -- off the gitops-sync :00/:15/:30/:45 slots, clear of the :20
