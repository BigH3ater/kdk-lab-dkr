# Weekly unused-image prune on every host. Docker never removes old images by
# itself, so every Renovate/pin bump leaves the previous tag on disk (the #64 pin
# wave left ~3.5 GB on kdk-dkr-dmz-01 alone). PruneImages runs
# `docker image prune -a -f` on the server: removes every image no container
# (running OR exited) references. A one-shot's image survives because its exited
# container still references it; never PruneSystem (that adds --volumes).
# Sunday 05:10 -- off the gitops-sync :00/:15/:30/:45 slots and the :05/:07/:20
# jobs, after the 04:25 arr-upgrade-search.
# Stage executions run in parallel (one per server), kdk-log-01 included.
[[procedure]]
tags = ["kdk-lab"]
name = "prune-images"
[procedure.config]
schedule_format = "Cron"
schedule = "0 10 5 * * Sun"
schedule_enabled = true
schedule_timezone = "America/Chicago"
failure_alert = true
[[procedure.config.stage]]
name = "prune"
enabled = true
executions = [
  { execution.type = "PruneImages", execution.params.server = "kdk-dkr-01", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "kdk-dkr-dmz-01", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "kdk-mon-01", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "kdk-dkr-02", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "kdk-dkr-03", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "kdk-log-01", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "kdk-dkr-04", enabled = true },
]

