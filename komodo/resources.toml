# NUT (Network UPS Tools) server for the Eaton 5PX 1500 (network NMC 10.1.3.63,
# netxml-ups, read-only/anonymous). upsd :3493 for Home Assistant's NUT client.
# NUT runs on kdk-dkr-03 (Pi, VLAN 30) because that host has a tagged VLAN 1
# leg (eth1.1, 10.1.3.62, hosts/kdk-dkr-03/kdk-ups-l2.nmconnection) on the UPS
# card's L2. The card stops answering ROUTED TCP after its switch reboots, which
# crash-looped NUT on kdk-dkr-01 (2026-10-07, 2026-10-17). No op CLI on the Pi:
# the monuser password lives in the HOST-managed /opt/kdk-lab/nut/.env (0600).
[[stack]]
tags = ["kdk-lab"]
name = "nut"
deploy = true
[stack.config]
server = "kdk-dkr-03"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/nut"
# NO --force-recreate here (removed 2026-10-26): deploy-changed redeploys every
# behind-HEAD stack on each merge, and force-recreate turned that no-op `up -d`
# into an upsd restart six times a day. upsmon clients treat a lost upsd during
# a battery self-test as a dead UPS and shut down (kdk-hyp-01, 2026-10-26 21:02).
# ups.conf edits still deploy: it is a compose `config` (content-hashed).
pre_deploy.command = "sh -c 'cp -f /opt/kdk-lab/nut/.env .env'"
webhook_enabled = true

# AdGuard DNS reconciler (one-shot, run by the gitops-sync procedure's "dns"
# stage). destroy_before_deploy so each run re-clones the repo and reads HEAD.
[[stack]]
tags = ["kdk-lab"]
name = "dns-reconcile"
deploy = true
[stack.config]
server = "kdk-dkr-01"
repo = "BigH3ater/kdk-lab-dkr"
run_directory = "stacks/dns-reconcile"
destroy_before_deploy = true
pre_deploy.command = "sh -c '. /etc/komodo/op.env && op inject -f -i .env.tpl -o .env'"

[[stack]]
