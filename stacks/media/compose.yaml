# Media acquisition + transcode on kdk-dkr-01. arr auth is External (Authelia).
# Volume layout: sabnzbd/sonarr/radarr get ONE media mount, /mnt/media:/data/media
# (the tankz3/media NFS export), so downloads (/data/media/staging) and libraries
# (/data/media/{movies,tv}) live on the same mount and imports use instant
# hardlinks instead of full copies. SAB complete_dir=/data/media/staging;
# incomplete stays on local SSD. Never split staging + library into separate bind
# mounts -- that triggers EXDEV and Radarr/Sonarr fall back to slow copies.
name: media
x-common: &common
  restart: unless-stopped
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: America/Chicago
  networks: [default, proxy]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  prowlarr:
    <<: *common
    image: ghcr.io/linuxserver/prowlarr:2.7.0.5723-ls167@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    environment:
      <<: *env
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: Enabled
    volumes:
      - /opt/kdk-lab/media/prowlarr:/config
    labels:
      traefik.enable: "true"
      traefik.http.routers.prowlarr.rule: "Host(`prowlarr.kmkdp.com`)"
      traefik.http.routers.prowlarr.middlewares: "forwardauth@file"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"

  sabnzbd:
    <<: *common
    image: ghcr.io/linuxserver/sabnzbd:5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    environment:
      <<: *env
      # Non-secret base URL for the `lazylibrarian` post-processing trigger
      # (sabnzbd/scripts/lazylibrarian-process.py). Same `default` network as
      # the lazylibrarian service, reached by its compose service name -- like
      # Prowlarr's http://lazylibrarian:5299.
      LL_URL: "http://lazylibrarian:5299"
    env_file:
      # Host-managed secret, op-read hand step (see docs/services/lazylibrarian.md):
      # one line, LL_API_KEY=... . Mounted via env_file (read at compose time),
      # never committed. required: false so a missing file can never stop the
      # whole media stack from starting -- mirrors the lazylibrarian service's
      # /etc/kdk/abs-notify.env; the trigger just logs that LL_API_KEY is unset.
      - path: /etc/kdk/sab-ll.env
        required: false
    volumes:
      - /opt/kdk-lab/media/sabnzbd:/config
      # Incomplete stays on local SSD for fast assembly + par2 repair.
      - /opt/kdk-lab/media/sabnzbd-incomplete:/incomplete-downloads
      # Single media mount: completed downloads (complete_dir=/data/media/staging)
      # land on the SAME mount as the *arr libraries, so Radarr/Sonarr import by
      # instant hardlink instead of a full copy. Do NOT bind subdirs separately
      # (staging + library on different mounts => EXDEV => copy fallback).
      - /mnt/media:/data/media
      # Post-processing scripts. Read-only: SABnzbd only executes them. The
      # `lazylibrarian` category's script calls LazyLibrarian forceProcess on a
      # completed download (LazyLibrarian's PostProcessor is only scheduled while
      # something is Snatched and can miss re-adding the job). Owner sets the
      # Scripts Folder to /scripts and the category's Script in the UI -- see
      # docs/services/lazylibrarian.md ("Import trigger").
      - ./sabnzbd/scripts:/scripts:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.sabnzbd.rule: "Host(`sabnzbd.kmkdp.com`)"
      traefik.http.routers.sabnzbd.middlewares: "forwardauth@file"
      traefik.http.services.sabnzbd.loadbalancer.server.port: "8080"

  sonarr:
    <<: *common
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    environment:
      <<: *env
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: Enabled
    volumes:
      - /opt/kdk-lab/media/sonarr:/config
      # Single mount: downloads (/data/media/staging) + library (/data/media/tv)
      # share one mount so imports hardlink instead of copy. Root folder
      # /data/media/tv is unchanged.
      - /mnt/media:/data/media
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.rule: "Host(`sonarr.kmkdp.com`)"
      traefik.http.routers.sonarr.middlewares: "forwardauth@file"
      traefik.http.routers.sonarr-api.rule: "Host(`sonarr.kmkdp.com`) && PathPrefix(`/api`)"
      traefik.http.routers.sonarr-api.priority: "100"
      traefik.http.routers.sonarr-api.service: "sonarr"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"

  radarr:
    <<: *common
    image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    environment:
      <<: *env
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: Enabled
    volumes:
      - /opt/kdk-lab/media/radarr:/config
      # Single mount: downloads (/data/media/staging) + library
      # (/data/media/movies) share one mount so imports hardlink instead of copy.
      # Root folder /data/media/movies is unchanged.
      - /mnt/media:/data/media
    labels:
      traefik.enable: "true"
      traefik.http.routers.radarr.rule: "Host(`radarr.kmkdp.com`)"
      traefik.http.routers.radarr.middlewares: "forwardauth@file"
      traefik.http.routers.radarr-api.rule: "Host(`radarr.kmkdp.com`) && PathPrefix(`/api`)"
      traefik.http.routers.radarr-api.priority: "100"
      traefik.http.routers.radarr-api.service: "radarr"
      traefik.http.services.radarr.loadbalancer.server.port: "7878"

  # Books (ebooks + audiobooks) are managed by LazyLibrarian, defined below. It
  # replaced Chaptarr, which was decommissioned 2026-11-03 (Readarr, archived
  # upstream, was removed 2026-09-16). The books already on disk under
  # /mnt/media/books/{ebook,audiobook} belong to the library and stay.

  bazarr:
    <<: *common
    image: ghcr.io/linuxserver/bazarr:development-v1.6.3-beta.22-ls31@sha256:1ee154277cb74285df43048712af15e1662970a955e5990d59c4dd6dc6e64934
    volumes:
      - /opt/kdk-lab/media/bazarr:/config
      - /mnt/media/staging:/data/staging
      - /mnt/media/tv:/data/media/tv
      - /mnt/media/movies:/data/media/movies
    labels:
      traefik.enable: "true"
      traefik.http.routers.bazarr.rule: "Host(`bazarr.kmkdp.com`)"
      traefik.http.routers.bazarr.middlewares: "forwardauth@file"
      traefik.http.services.bazarr.loadbalancer.server.port: "6767"

  # LazyLibrarian: the book + AUDIOBOOK manager behind the DMZ Libreseerr request
  # UI. It replaced Chaptarr (decommissioned 2026-11-03): Chaptarr/Readarr
  # monitored a whole author's catalogue (e.g. GRRM = 2,973 books) and was slow
  # enough to time out Libreseerr's 30 s calls, whereas LazyLibrarian adds one
  # requested book at a time. Libreseerr already ships a LazyLibrarian backend
  # (/app/lazylibrarian.py). Lives in this stack (not its own) so it shares the
  # single /mnt/media:/data/media mount -- imports hardlink instead of copy,
  # exactly like sonarr/radarr -- and the `proxy` net. First service here on the
  # compose-baseline anchor (docs/reference/compose-baseline.md); the rest of
  # this stack is hardened in a later sweep. API lives under /api (verified:
  # LazyLibrarianClient GETs {base}/api?cmd=...), so a higher-priority /api router
  # bypasses ForwardAuth for the DMZ Libreseerr, mirroring sonarr-api / radarr-api.
  lazylibrarian:
    <<: *common
    image: lscr.io/linuxserver/lazylibrarian:fc698c6c-ls388@sha256:c3f85478fd1e04da83adcdbfc1f7c3b409340db05e6ddb7bceb0731691248d7b
    # LazyLibrarian ships no semver tag; linuxserver pins the upstream git hash +
    # their build (fc698c6c-ls388, 2026-11-02). The @sha256 digest makes the
    # deploy reproducible and lets Renovate track it (baseline image-pin rule).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # s6-overlay (LinuxServer): chown /config and drop to abc. See the baseline
    # doc, "LinuxServer.io images (s6-overlay)".
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    pids_limit: 512
    mem_limit: 1g
    environment:
      <<: *env
      # Audiobookshelf rescan target for the post-import hook (abs-notify.py).
      # ABS reads the audiobook NFS read-only from the DMZ host with no cross-host
      # inotify, so a new import is invisible until a scan is requested. ABS_URL +
      # library id are non-secret; the token comes from the host env_file below.
      ABS_URL: "https://audiobookshelf.kmkdp.com"
      ABS_LIBRARY_ID: "da91339b-cfd5-43ca-8104-fde4271bf011"
    env_file:
      # Host-managed secret, op-read hand step (see docs/services/lazylibrarian.md):
      # one line, ABS_API_TOKEN=... . Mounted via env_file (read at compose time),
      # never committed. required: false so a missing file can never stop the whole
      # media stack (sabnzbd/sonarr/radarr) from starting; the hook just skips the
      # ABS scan and logs "ABS_API_TOKEN ... not all set" until the file exists.
      - path: /etc/kdk/abs-notify.env
        required: false
    volumes:
      - /opt/kdk-lab/media/lazylibrarian:/config
      # Single media mount so imports hardlink. Book libraries live under
      # /data/media/books/{ebook,audiobook}; downloads at /data/media/staging --
      # same mount as sabnzbd/sonarr/radarr. Never split this.
      - /mnt/media:/data/media
      # Post-import hook (LazyLibrarian "Custom" notifier -> CUSTOM_SCRIPT).
      # Read-only: LazyLibrarian only executes it. Writes the audiobook OPF to the
      # /data/media volume and POSTs the ABS scan.
      - ./lazylibrarian/hooks:/hooks:ro
    healthcheck:
      # LinuxServer image bundles curl; the web UI answers 200 at root.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5299/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.http.routers.lazylibrarian.rule: "Host(`lazylibrarian.kmkdp.com`)"
      traefik.http.routers.lazylibrarian.middlewares: "forwardauth@file"
      # /api bypass (no ForwardAuth) so API-key clients (DMZ Libreseerr) reach the
      # API without an Authelia redirect -- mirrors sonarr-api/radarr-api.
      traefik.http.routers.lazylibrarian-api.rule: "Host(`lazylibrarian.kmkdp.com`) && PathPrefix(`/api`)"
      traefik.http.routers.lazylibrarian-api.priority: "100"
      traefik.http.routers.lazylibrarian-api.service: "lazylibrarian"
      traefik.http.services.lazylibrarian.loadbalancer.server.port: "5299"
      # s6 writes /run at startup and the app has no env to relocate it; read_only
      # genuinely breaks the image (baseline doc, LinuxServer note).
      kdk.baseline.skip: "read_only"

  # Audiobookshelf moved to its own DMZ stack (stacks/audiobookshelf, internet-
  # facing via the Cloudflare tunnel + Authelia OIDC). It reads /mnt/media/books/
  # audiobook read-only from dmz-01; podcasts live on dmz-01 local disk (the DMZ
  # media NFS is read-only). LazyLibrarian lays out /mnt/media/books/audiobook.

  # Wizarr MOVED to its own DMZ stack (stacks/wizarr on kdk-dkr-dmz-01) so it can
  # be internet-facing via the Cloudflare tunnel with path-scoped public exposure
  # (invitee paths open, admin behind Authelia). Data was rsync'd to
  # /mnt/appdata/wizarr on dmz-01. LDAP + invite behaviour now in
  # docs/services/wizarr.md. See stacks/wizarr/compose.yaml.

  tdarr:
    <<: *common
    # v3 (2026-10-25): hard switch to the Rust engine, which this server had
    # already been running since the 2.8x soft rollout. No schema migration;
    # auth stays off (default-on applies to new installs only). Server and
    # node tags MUST move together. Rollback = pin both back to 2.86.01 and,
    # if needed, restore /opt/kdk-lab/media/tdarr/pre-v3-backup-2026-10-25.
    image: ghcr.io/haveagitgat/tdarr:3.04.00@sha256:0ea9217f69f40e49977dbcbc0319224e625c90d808d39bf075483fe45e9612f1
    environment:
      <<: *env
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "false"
      DEE_WRAPPER_TOKEN: ${DEE_WRAPPER_TOKEN:-}
      inContainer: "true"
    ports:
      # Node RPC for the external GPU node (RGB-Nebula 4090) on the VLAN 20
      # address, plus loopback for the host-network jobs (tdarr-backlog,
      # tdarr-remediate, tdarr-verify call http://localhost:8266). Not 0.0.0.0:
      # the storage NIC and docker bridges never needed it (hosts report H-02).
      - "127.0.0.1:8266:8266"
      - "10.1.20.20:8266:8266"
    volumes:
      - /opt/kdk-lab/media/tdarr/server:/app/server
      - /opt/kdk-lab/media/tdarr/configs:/app/configs
      - /opt/kdk-lab/media/tdarr/logs:/app/logs
      - /opt/kdk-lab/media/tdarr-temp:/temp
      - /mnt/media:/data/media
      - /mnt/media/staging:/data/staging
      - /mnt/media/quarantine:/data/quarantine
      - /mnt/dee-exchange:/data/dee-exchange
    labels:
      traefik.enable: "true"
      traefik.http.routers.tdarr.rule: "Host(`tdarr.kmkdp.com`)"
      traefik.http.routers.tdarr.middlewares: "forwardauth@file"
      traefik.http.services.tdarr.loadbalancer.server.port: "8265"

  tdarr-node:
    <<: *common
    image: ghcr.io/haveagitgat/tdarr_node:3.04.00@sha256:05bbccf0f20c8b79e21424b553149a85f5bac588a9392986feaa440517bf491f
    runtime: nvidia
    # Memory ceiling for the transcode node. Before any cap (pre-#192) a runaway
    # DEE/4K remux took the whole node down with a host-level OOM; #192 added a
    # 24g cgroup cap so a runaway hits the cgroup limit and the kernel kills the
    # offending ffmpeg (the job fails, flow holds the file), not the host.
    # memswap_limit == mem_limit disables swap for the cgroup (this host has 0
    # swap anyway), so a runaway is killed rather than thrashing. Node OOM is
    # alerted by the Prometheus rule ContainerOOMKilled.
    #
    # 2026-10-31 alert review: the 24g cap was set too tight. During the lossless
    # DV/TrueHD backlog drain (stacks/tdarr-backlog) the §7.4b DEE-dispatch remux
    # -- a two-input `-c copy -max_interleave_delta 0` mux, required to stop the
    # Neptune silent-audio bug -- buffers for a single large 4K title (ffmpeg
    # holds video packets until every mapped stream, incl. sparse `0:s?`
    # subtitles, yields one). cAdvisor recorded 8 OOM kills in 24 h, all
    # CONSTRAINT_MEMCG on a single `tdarr-ffmpeg`, each at anon-rss ~24.8 GB
    # (kernel log 19:44 / 20:50 / 22:04, hourly with the :55 feeder). Every kill
    # happened AT the 24 GiB cap, so the remux's true working set is UNOBSERVED
    # (it was never allowed to finish) -- 24.8 GB is only the floor.
    #
    # 36g (PR #268) did NOT hold: 6 more OOM kills on 11-02 (02:30Z-18:00Z),
    # every one CONSTRAINT_MEMCG on tdarr-ffmpeg at anon-rss ~36.9-37.5 GB, i.e.
    # AT the 36 GiB cap. The buffering was unbounded, so no cap would have held.
    # The structural fix is PR #324 (merged 11-02 18:57Z): the DEE remux runs in
    # two passes (0:V + new audio with -max_interleave_delta 0, then subs and
    # chapters with the default interleave), so sparse streams can no longer
    # force ffmpeg to buffer video. Since #324: 0 OOM kills; peak RSS 2.36 GiB
    # and peak working set 3.45 GiB over ~35 h of the backlog drain (cAdvisor,
    # read 2026-11-04). The last big RSS (23.4 GiB, 11-02 18:54-18:58Z) was the
    # old one-pass remux, minutes before the merge.
    #
    # 2026-11-04: cap 36g -> 16g. Host kdk-dkr-01 has 47 GiB and 0 swap, so 36g
    # left the rest of the host ~5 GB; 16g is ~4.5x the observed post-#324 peak
    # and still bounds a future runaway well below host OOM. ContainerOOMKilled
    # stays the backstop: a kill at 16g means a new unbounded-buffer bug, not a
    # cap to raise. memswap_limit == mem_limit keeps swap off for the cgroup.
    mem_limit: 16g
    memswap_limit: 16g
    pids_limit: 4096
    environment:
      <<: *env
      nodeName: kdk-tdarr-nvenc-01
      serverIP: tdarr
      serverPort: "8266"
      inContainer: "true"
      DEE_WRAPPER_TOKEN: ${DEE_WRAPPER_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /opt/kdk-lab/media/tdarr-temp:/temp
      - /mnt/media:/data/media
      - /mnt/media/staging:/data/staging
      - /mnt/media/quarantine:/data/quarantine
      - /mnt/dee-exchange:/data/dee-exchange
    depends_on: [tdarr]

networks:
  default: {}
  proxy:
    external: true
