# Media acquisition + transcode on kdk-dkr-01. arr auth is External (Authelia).
# Volume layout: sabnzbd/sonarr/radarr get ONE media mount, /mnt/media:/data/media
# (the tankz3/media NFS export), so downloads (/data/media/staging) and libraries
# (/data/media/{movies,tv}) live on the same mount and imports use instant
# hardlinks instead of full copies. SAB complete_dir=/data/media/staging;
# incomplete stays on local SSD. Never split staging + library into separate bind
# mounts -- that triggers EXDEV and Radarr/Sonarr fall back to slow copies.
name: media
x-common: &common
  restart: unless-stopped
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: America/Chicago
  networks: [default, proxy]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  prowlarr:
    <<: *common
    image: ghcr.io/linuxserver/prowlarr:2.7.0.5723-ls166@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    environment:
      <<: *env
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: Enabled
    volumes:
      - /opt/kdk-lab/media/prowlarr:/config
    labels:
      traefik.enable: "true"
      traefik.http.routers.prowlarr.rule: "Host(`prowlarr.kmkdp.com`)"
      traefik.http.routers.prowlarr.middlewares: "forwardauth@file"
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"

  sabnzbd:
    <<: *common
    image: ghcr.io/linuxserver/sabnzbd:5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    volumes:
      - /opt/kdk-lab/media/sabnzbd:/config
      # Incomplete stays on local SSD for fast assembly + par2 repair.
      - /opt/kdk-lab/media/sabnzbd-incomplete:/incomplete-downloads
      # Single media mount: completed downloads (complete_dir=/data/media/staging)
      # land on the SAME mount as the *arr libraries, so Radarr/Sonarr import by
      # instant hardlink instead of a full copy. Do NOT bind subdirs separately
      # (staging + library on different mounts => EXDEV => copy fallback).
      - /mnt/media:/data/media
    labels:
      traefik.enable: "true"
      traefik.http.routers.sabnzbd.rule: "Host(`sabnzbd.kmkdp.com`)"
      traefik.http.routers.sabnzbd.middlewares: "forwardauth@file"
      traefik.http.services.sabnzbd.loadbalancer.server.port: "8080"

  sonarr:
    <<: *common
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    environment:
      <<: *env
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: Enabled
    volumes:
      - /opt/kdk-lab/media/sonarr:/config
      # Single mount: downloads (/data/media/staging) + library (/data/media/tv)
      # share one mount so imports hardlink instead of copy. Root folder
      # /data/media/tv is unchanged.
      - /mnt/media:/data/media
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.rule: "Host(`sonarr.kmkdp.com`)"
      traefik.http.routers.sonarr.middlewares: "forwardauth@file"
      traefik.http.routers.sonarr-api.rule: "Host(`sonarr.kmkdp.com`) && PathPrefix(`/api`)"
      traefik.http.routers.sonarr-api.priority: "100"
      traefik.http.routers.sonarr-api.service: "sonarr"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"

  radarr:
    <<: *common
    image: ghcr.io/linuxserver/radarr:6.3.0.10514-ls314@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    environment:
      <<: *env
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: Enabled
    volumes:
      - /opt/kdk-lab/media/radarr:/config
      # Single mount: downloads (/data/media/staging) + library
      # (/data/media/movies) share one mount so imports hardlink instead of copy.
      # Root folder /data/media/movies is unchanged.
      - /mnt/media:/data/media
    labels:
      traefik.enable: "true"
      traefik.http.routers.radarr.rule: "Host(`radarr.kmkdp.com`)"
      traefik.http.routers.radarr.middlewares: "forwardauth@file"
      traefik.http.routers.radarr-api.rule: "Host(`radarr.kmkdp.com`) && PathPrefix(`/api`)"
      traefik.http.routers.radarr-api.priority: "100"
      traefik.http.routers.radarr-api.service: "radarr"
      traefik.http.services.radarr.loadbalancer.server.port: "7878"

  # Ebooks are managed by Chaptarr (the maintained Readarr replacement), defined
  # below; the book-sync stack reconciles /data/media/books to the tablet (direct
  # SSH, add + delete). Readarr (archived upstream) was removed 2026-09-16.

  bazarr:
    <<: *common
    image: ghcr.io/linuxserver/bazarr:development-v1.6.3-beta.22-ls31@sha256:1ee154277cb74285df43048712af15e1662970a955e5990d59c4dd6dc6e64934
    volumes:
      - /opt/kdk-lab/media/bazarr:/config
      - /mnt/media/staging:/data/staging
      - /mnt/media/tv:/data/media/tv
      - /mnt/media/movies:/data/media/movies
    labels:
      traefik.enable: "true"
      traefik.http.routers.bazarr.rule: "Host(`bazarr.kmkdp.com`)"
      traefik.http.routers.bazarr.middlewares: "forwardauth@file"
      traefik.http.services.bazarr.loadbalancer.server.port: "6767"

  chaptarr:
    <<: *common
    image: chaptarr/chaptarr:0.9.965@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
    environment:
      <<: *env
      CHAPTARR__AUTH__METHOD: External
    volumes:
      - /opt/kdk-lab/media/chaptarr:/config
      # Single media mount so imports hardlink (downloads /data/media/staging,
      # ebook root folder /data/media/books) -- same layout as sonarr/radarr.
      # /mnt/media/books feeds the book-sync stack (reconcile to the tablet).
      - /mnt/media:/data/media
    labels:
      traefik.enable: "true"
      traefik.http.routers.chaptarr.rule: "Host(`chaptarr.kmkdp.com`)"
      traefik.http.routers.chaptarr.middlewares: "forwardauth@file"
      # /api bypass (no ForwardAuth) so API-key clients (e.g. DMZ Libreseerr) can use the
      # API without an Authelia redirect — mirrors sonarr-api/radarr-api.
      traefik.http.routers.chaptarr-api.rule: "Host(`chaptarr.kmkdp.com`) && PathPrefix(`/api`)"
      traefik.http.routers.chaptarr-api.priority: "100"
      traefik.http.routers.chaptarr-api.service: "chaptarr"
      traefik.http.services.chaptarr.loadbalancer.server.port: "8789"

  # Audiobookshelf moved to its own DMZ stack (stacks/audiobookshelf, internet-
  # facing via the Cloudflare tunnel + Authelia OIDC). It reads /mnt/media/books/
  # audiobook read-only from dmz-01; podcasts live on dmz-01 local disk (the DMZ
  # media NFS is read-only). Chaptarr still lays out /mnt/media/books/audiobook.

  # Wizarr MOVED to its own DMZ stack (stacks/wizarr on kdk-dkr-dmz-01) so it can
  # be internet-facing via the Cloudflare tunnel with path-scoped public exposure
  # (invitee paths open, admin behind Authelia). Data was rsync'd to
  # /mnt/appdata/wizarr on dmz-01. LDAP + invite behaviour now in
  # docs/services/wizarr.md. See stacks/wizarr/compose.yaml.

  tdarr:
    <<: *common
    # v3 (2026-10-25): hard switch to the Rust engine, which this server had
    # already been running since the 2.8x soft rollout. No schema migration;
    # auth stays off (default-on applies to new installs only). Server and
    # node tags MUST move together. Rollback = pin both back to 2.86.01 and,
    # if needed, restore /opt/kdk-lab/media/tdarr/pre-v3-backup-2026-10-25.
    image: ghcr.io/haveagitgat/tdarr:3.04.00@sha256:0ea9217f69f40e49977dbcbc0319224e625c90d808d39bf075483fe45e9612f1
    environment:
      <<: *env
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "false"
      DEE_WRAPPER_TOKEN: ${DEE_WRAPPER_TOKEN:-}
      inContainer: "true"
    ports:
      # Node RPC for the external GPU node (RGB-Nebula 4090) on the VLAN 20
      # address, plus loopback for the host-network jobs (tdarr-backlog,
      # tdarr-remediate, tdarr-verify call http://localhost:8266). Not 0.0.0.0:
      # the storage NIC and docker bridges never needed it (hosts report H-02).
      - "127.0.0.1:8266:8266"
      - "10.1.20.20:8266:8266"
    volumes:
      - /opt/kdk-lab/media/tdarr/server:/app/server
      - /opt/kdk-lab/media/tdarr/configs:/app/configs
      - /opt/kdk-lab/media/tdarr/logs:/app/logs
      - /opt/kdk-lab/media/tdarr-temp:/temp
      - /mnt/media:/data/media
      - /mnt/media/staging:/data/staging
      - /mnt/media/quarantine:/data/quarantine
      - /mnt/dee-exchange:/data/dee-exchange
    labels:
      traefik.enable: "true"
      traefik.http.routers.tdarr.rule: "Host(`tdarr.kmkdp.com`)"
      traefik.http.routers.tdarr.middlewares: "forwardauth@file"
      traefik.http.services.tdarr.loadbalancer.server.port: "8265"

  tdarr-node:
    <<: *common
    image: ghcr.io/haveagitgat/tdarr_node:3.04.00@sha256:05bbccf0f20c8b79e21424b553149a85f5bac588a9392986feaa440517bf491f
    runtime: nvidia
    # Memory ceiling for the transcode node. 2026-10-28 07:57 a runaway encode
    # (software-decoded 4K / DEE `-max_interleave_delta 0` remux) grew to ~43 GB
    # RSS on this 47 GB host and the kernel OOM-killed it, taking the node down
    # instead of just the one job. Cap it so a runaway hits the cgroup limit and
    # the kernel kills the offending ffmpeg (the job fails, flow holds the file),
    # not the host. memswap_limit == mem_limit disables swap for the cgroup, so a
    # runaway is killed rather than thrashing. OOM of the node is alerted by the
    # Prometheus rule ContainerOOMKilled (stacks/monitoring/prometheus/rules/).
    #
    # 2026-10-31 alert review: the 24g cap was set too tight. During the lossless
    # DV/TrueHD backlog drain (stacks/tdarr-backlog) the §7.4b DEE-dispatch remux
    # -- a two-input `-c copy -max_interleave_delta 0` mux, required to stop the
    # Neptune silent-audio bug -- legitimately buffers ~24 GB for a single large
    # 4K title (ffmpeg holds video packets until every mapped stream, incl. sparse
    # `0:s?` subtitles, yields one). cAdvisor recorded 8 OOM kills in 24 h, all
    # CONSTRAINT_MEMCG on a single `tdarr-ffmpeg` at anon-rss ~24.7 GB (kernel log
    # 19:44 / 20:50 / 22:04, hourly with the :55 feeder) -- the cap was BELOW the
    # real working set, so those titles can never finish and the drain re-killed
    # them every cycle. Raised to 36g: a single remux completes with margin, the
    # host (48 GB total, ~6 GB used by everything else) keeps ~6 GB headroom, and
    # a true runaway (the 2026-10-28 43 GB case) is still caught before the host
    # dies. If two heavy remuxes ever coincide the cgroup still kills one (host
    # safe); drop the node to 1 transcode worker for the drain if that recurs.
    mem_limit: 36g
    memswap_limit: 36g
    pids_limit: 4096
    environment:
      <<: *env
      nodeName: kdk-tdarr-nvenc-01
      serverIP: tdarr
      serverPort: "8266"
      inContainer: "true"
      DEE_WRAPPER_TOKEN: ${DEE_WRAPPER_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /opt/kdk-lab/media/tdarr-temp:/temp
      - /mnt/media:/data/media
      - /mnt/media/staging:/data/staging
      - /mnt/media/quarantine:/data/quarantine
      - /mnt/dee-exchange:/data/dee-exchange
    depends_on: [tdarr]

networks:
  default: {}
  proxy:
    external: true
