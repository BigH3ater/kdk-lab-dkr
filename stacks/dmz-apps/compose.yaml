name: dmz-apps
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    container_name: seerr
    extra_hosts:
      - "sonarr.kmkdp.com:10.1.20.20"
      - "radarr.kmkdp.com:10.1.20.20"
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    volumes:
      - /mnt/appdata/jellyseerr:/app/config
    networks: [proxy-dmz]
    labels:
      traefik.enable: "true"
      traefik.http.routers.seerr.rule: "Host(`seerr.kmkdp.com`)"
      # LAN only: never on the Cloudflare tunnel entrypoint (docs/services/dmz-proxy.md).
      traefik.http.routers.seerr.entrypoints: "websecure"
      traefik.http.services.seerr.loadbalancer.server.port: "5055"

  # Libreseerr — Overseerr-style "request a book" UI that hands off to Chaptarr
  # (Readarr v1 API). Reaches Chaptarr via internal Traefik (extra_hosts). OIDC
  # (Authelia) is configured in the app UI post-deploy; SECRET_KEY keeps Flask
  # sessions stable across restarts.
  libreseerr:
    image: ghcr.io/zamnzim/libreseerr:v0.9.1@sha256:3fdf028cd0c17b14fa0f85b1c60dd6e6afec841c4e4b48a4a4a8115ac4a17db0
    container_name: libreseerr
    restart: unless-stopped
    env_file: [.env]                 # SECRET_KEY (op-injected)
    environment:
      PYTHONUNBUFFERED: "1"
      # gunicorn's default 30 s worker timeout killed /api/request mid-flight: adding a
      # new author to Chaptarr takes ~25 s (it pulls the whole catalog), then add_book
      # fetches the full /api/v1/book list (~9 MB, ~8 s). The killed worker returned an
      # HTML error page, and the UI showed "JSON.parse: unexpected character".
      GUNICORN_CMD_ARGS: "--timeout 180"
    extra_hosts:
      - "chaptarr.kmkdp.com:10.1.20.20"   # Chaptarr API via internal Traefik
    volumes:
      - /mnt/appdata/libreseerr:/app/data
      # LOCAL PATCH of upstream libreseerr v0.9.1 (see libreseerr/*.py headers).
      # Two upstream bugs in the LazyLibrarian client, hit once the book source
      # is switched to LazyLibrarian/Hardcover:
      #   1. add_book() always queued type=eBook, so audiobook requests marked
      #      the *ebook* Wanted. The client now picks AudioBook when upstream's
      #      get_client(server_type) builds it for the audiobook server (only
      #      lazylibrarian.py is overridden; app.py stays upstream).
      #   2. create_request()/add_book() take results[0], and findBook returns
      #      box sets / bundles first ("...7 Books Set"). search_books() now
      #      ranks results best-first so the single requested book wins.
      # Files are mounted read-only over the image's copies. The image is
      # DIGEST-PINNED, so a Renovate bump must re-check that upstream still has
      # these files at these paths and re-verify the patch (drop it entirely if
      # upstream fixes both issues). Diff + upstream issue text: see the PR.
      - ./libreseerr/lazylibrarian.py:/app/lazylibrarian.py:ro
    networks: [proxy-dmz]
    labels:
      traefik.enable: "true"
      traefik.http.routers.libreseerr.rule: "Host(`libreseerr.kmkdp.com`)"
      # LAN only: never on the Cloudflare tunnel entrypoint (docs/services/dmz-proxy.md).
      traefik.http.routers.libreseerr.entrypoints: "websecure"
      traefik.http.services.libreseerr.loadbalancer.server.port: "5000"

networks:
  proxy-dmz:
    external: true
