# Jellyfin on the DMZ node with the Arc A380 (QSV). Config migrated
# byte-for-byte from k3s; library paths identical so item ids stay attached.
# Public via the Cloudflare tunnel; own login + LDAP plugin.
#
# 12.x (2026-10-25): major-version jump from 10.11.11. 12.0 changed the plugin
# ABI and the database schema (no rollback without a restore), so the upgrade
# procedure is: pre-upgrade copy of /config (+ consistent sqlite backups) ->
# move every repository plugin out of data/plugins -> deploy -> let the
# migrations finish -> re-add the 12.x plugin builds -> full library scan.
# Every installed plugin had a 12.x build on 2026-10-25 except the Neptune
# suite (see stacks/jellyfin/plugins.yaml). Rollback: pin 10.11.11 and restore
# /opt/kdk-lab/jellyfin-pre12-2026-10-25 on kdk-dkr-dmz-01.
name: jellyfin
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.3ubu2604-ls56
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /opt/kdk-lab/jellyfin/config:/config
      - /mnt/media/tv:/data/media/tv:ro
      - /mnt/media/movies:/data/media/movies:ro
    # Transcode scratch on a RAM disk. Mounted AT Jellyfin's real transcode temp
    # path (this version defaults TranscodingTempPath to <cache>/transcodes =
    # /config/cache/transcodes -- verified from the FFmpeg.Transcode logs), so it
    # is used with no in-app config. Segments live in RAM: fast, zero SSD wear,
    # and auto-cleared on restart. 6G is safe on this 23G host (only an idle 12G
    # /tmp tmpfs besides). tmpfs default mode is 1777 -> writable by PUID 1000.
    # NOTE: /config/data/transcodes is a stale path from an older version and is
    # NOT used -- do not mount here instead.
    tmpfs:
      # mode=1777 (sticky, world-writable like /tmp) is REQUIRED: the tmpfs
      # otherwise inherits the pre-existing dir's 2755 root:root and Jellyfin
      # (PUID 1000) can't write -> transcodes fail.
      - /config/cache/transcodes:size=6g,mode=1777
    # identity_ldap: LDAPS to lldap.kmkdp.com:6360 (alias on that internal network;
    # lldap is no longer on proxy-dmz). Created by stacks/identity.
    networks: [proxy-dmz, identity_ldap]
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.kmkdp.com`)"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
networks:
  proxy-dmz:
    external: true
  identity_ldap:
    external: true
