# Jellyfin on the DMZ node with the Arc A380 (QSV). Same image line as k3s
# (12.0 breaks the plugin ABI -- do not bump without a plugin plan, ADR 0027).
# Config migrated byte-for-byte; library paths identical to k3s so item ids
# stay attached. Public via the Cloudflare tunnel; own login + LDAP plugin.
name: jellyfin
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls46
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /opt/kdk-lab/jellyfin/config:/config
      - /mnt/media/tv:/data/media/tv:ro
      - /mnt/media/movies:/data/media/movies:ro
    # Transcode scratch on a RAM disk. Mounted AT Jellyfin's real transcode temp
    # path (this version defaults TranscodingTempPath to <cache>/transcodes =
    # /config/cache/transcodes -- verified from the FFmpeg.Transcode logs), so it
    # is used with no in-app config. Segments live in RAM: fast, zero SSD wear,
    # and auto-cleared on restart. 6G is safe on this 23G host (only an idle 12G
    # /tmp tmpfs besides). tmpfs default mode is 1777 -> writable by PUID 1000.
    # NOTE: /config/data/transcodes is a stale path from an older version and is
    # NOT used -- do not mount here instead.
    tmpfs:
      # mode=1777 (sticky, world-writable like /tmp) is REQUIRED: the tmpfs
      # otherwise inherits the pre-existing dir's 2755 root:root and Jellyfin
      # (PUID 1000) can't write -> transcodes fail.
      - /config/cache/transcodes:size=6g,mode=1777
    networks: [proxy-dmz]
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.kmkdp.com`)"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
networks:
  proxy-dmz:
    external: true
