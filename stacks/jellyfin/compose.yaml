# Jellyfin on the DMZ node with the Arc A380 (QSV). Config migrated
# byte-for-byte from k3s; library paths identical so item ids stay attached.
# Public via the Cloudflare tunnel; own login + LDAP plugin.
#
# 12.x (2026-10-25): major-version jump from 10.11.11. 12.0 changed the plugin
# ABI and the database schema (no rollback without a restore), so the upgrade
# procedure is: pre-upgrade copy of /config (+ consistent sqlite backups) ->
# move every repository plugin out of data/plugins -> deploy -> let the
# migrations finish -> re-add the 12.x plugin builds -> full library scan.
# Every installed plugin had a 12.x build on 2026-10-25 except the Neptune
# suite (see stacks/jellyfin/plugins.yaml). Rollback: pin 10.11.11 and restore
# /opt/kdk-lab/jellyfin-pre12-2026-10-25 on kdk-dkr-dmz-01.
name: jellyfin

# Compose hardening baseline (docs/reference/compose-baseline.md; posture
# 10.Homelab/Security/jellyfin-posture-2026-10.md M2, hardening plan batch 6).
# The service merges it with `<<: *hardened` and overrides only what it needs.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  jellyfin:
    <<: *hardened
    image: ghcr.io/linuxserver/jellyfin:12.4ubu2604-ls58@sha256:b7eabe1f098f4e850bfd63d6721369117195410a471db1a41748ab768b81a639
    container_name: jellyfin
    # s6-overlay (LinuxServer): the root supervisor chowns /config, adds abc to the
    # /dev/dri render group and drops to abc (uid 1000) for jellyfin/ffmpeg. See the
    # baseline doc, "LinuxServer.io images (s6-overlay)".
    #   CHOWN, FOWNER, DAC_OVERRIDE: init chown/chmod of /config and /run files
    #   SETUID, SETGID: s6-setuidgid / setgroups when dropping to abc
    #   KILL: the root supervisor signals the abc-owned jellyfin process on stop
    #         (hardening plan per-stack table)
    # /dev/dri needs no capability: access is the device cgroup + render group.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    # Sized from the running container 2026-11-04 (up since 10-30): docker stats
    # 2.7 GiB, cgroup anon ~0.9 GiB, pids.peak 142. The 6 GiB transcode tmpfs below
    # is charged to THIS cgroup (shmem), so the limit = working set + full tmpfs +
    # headroom; page cache is reclaimed under the limit. Host has 23 GiB.
    mem_limit: 10g
    pids_limit: 2048
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /opt/kdk-lab/jellyfin/config:/config
      # Images/metadata (8+ GB and growing) on the rw appdata NFS instead of the
      # 59 GB root disk (moved 2026-10-28). Mounted AT Jellyfin's metadata path so
      # no dashboard setting changes. The SQLite DB (data/data), cache and plugins
      # stay local under /config -- never put the DB on NFS. Regenerable, so
      # backup-dmz excludes it.
      - /mnt/appdata/jellyfin/metadata:/config/data/metadata
      - /mnt/media/tv:/data/media/tv:ro
      - /mnt/media/movies:/data/media/movies:ro
    # Transcode scratch on a RAM disk. Mounted AT Jellyfin's real transcode temp
    # path (this version defaults TranscodingTempPath to <cache>/transcodes =
    # /config/cache/transcodes -- verified from the FFmpeg.Transcode logs), so it
    # is used with no in-app config. Segments live in RAM: fast, zero SSD wear,
    # and auto-cleared on restart. 6G is safe on this 23G host (only an idle 12G
    # /tmp tmpfs besides). tmpfs default mode is 1777 -> writable by PUID 1000.
    # NOTE: /config/data/transcodes is a stale path from an older version and is
    # NOT used -- do not mount here instead.
    tmpfs:
      # mode=1777 (sticky, world-writable like /tmp) is REQUIRED: the tmpfs
      # otherwise inherits the pre-existing dir's 2755 root:root and Jellyfin
      # (PUID 1000) can't write -> transcodes fail.
      - /config/cache/transcodes:size=6g,mode=1777
    # identity_ldap: LDAPS to lldap.kmkdp.com:6360 (alias on that internal network;
    # lldap is no longer on proxy-dmz). Created by stacks/identity.
    healthcheck:
      # Jellyfin answers "Healthy" on /health without auth; the LSIO image ships curl.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks: [proxy-dmz, identity_ldap]
    labels:
      kdk.baseline.exception: "devices: /dev/dri for Arc A380 QSV transcode"
      # s6 writes /run, /etc (render group) and /tmp at start; read_only breaks LSIO
      # images (baseline doc, LinuxServer note; posture M2).
      kdk.baseline.skip: "read_only"
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.kmkdp.com`)"
      # Public: LAN entrypoint + the cloudflared-only `tunnel` entrypoint.
      traefik.http.routers.jellyfin.entrypoints: "websecure,tunnel"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
networks:
  proxy-dmz:
    external: true
  identity_ldap:
    external: true
