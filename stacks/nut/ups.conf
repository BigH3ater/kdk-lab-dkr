# Mounted to /etc/nut/local/ups.conf; the image copies it over the generated
# ups.conf. This adds a LOW-BATTERY SAFETY MARGIN so the Proxmox and TrueNAS
# hosts have time to shut down cleanly before the UPS battery dies.
# Driver start-up patience. The card drops off the network for ~2 min whenever
# its switch reboots; with the image default (3 tries, 5 s apart) upsdrvctl
# gives up, the entrypoint exits and docker restart-loops the container until
# the card is back. 30 tries 10 s apart = 5 min of waiting instead.
maxretry = 30
retrydelay = 10
[eaton-5px]
    driver = netxml-ups
    port = http://10.1.3.63
    desc = "Eaton 5PX 1500 - Computer Room"
    pollinterval = 5
    # Ignore the card's own LB flag (charge.low=20% / runtime.low=180s ~3min)
    # and declare low-battery at a wider margin -- both hosts shut down in
    # parallel on LB, and multi-VM Proxmox shutdown can exceed 3 minutes.
    # (Matches the proven thresholds from the old k8s lab NUT config.)
    ignorelb
    override.battery.charge.low = 30
    override.battery.runtime.low = 360
