# NUT (Network UPS Tools) server for the Eaton 5PX 1500 UPS ("Computer Room").
# The UPS is network-attached via its Eaton/MGE "Mosaic" Network Management Card
# at 10.1.3.63; NUT reads it with the netxml-ups driver over plain HTTP. That
# card serves its monitoring XML anonymously (security="none"), so NO device
# credentials are needed for read-only monitoring (verified live 2026-09-15).
#
# upsd listens on 3493 for Home Assistant's NUT integration, which authenticates
# as the 'monuser' upsd user (password from op://kdk-cluster/kdk-ups-01-nut-upsd,
# rendered into .env by the Komodo pre_deploy op inject).
name: nut
services:
  upsd:
    image: instantlinux/nut-upsd@sha256:a4a68e3c56081e3187621ee2a4bf9bce2936eaf0b628c01f81881f25cee0e667
    restart: unless-stopped
    # The image's stock health check kills upsmon (PID 1) the moment upsd
    # reports the UPS data stale. Every reboot of the card's switch (firmware
    # updates, power events) then became a restart loop: the entrypoint's
    # driver start fails while the card is unreachable, docker restarts the
    # container every ~18 s, and upsmon on Proxmox/TrueNAS sees "connection
    # refused" (17 restarts during the 2026-10-18 firmware work). This check
    # tolerates STALE_GRACE seconds of stale data (a switch reboot is ~2 min),
    # keeps the container up and the clients connected, and only then falls
    # back to the stock behaviour (restart) for a driver that is truly wedged.
    # `$$` is compose escaping; the shell inside the container sees `$`.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          out=$$(upsc $$NAME@localhost:3493 2>&1); rc=$$?;
          if echo "$$out" | grep -q stale; then
          now=$$(date +%s); s=/dev/shm/nut/stale-since;
          [ -f $$s ] || echo $$now > $$s;
          [ $$((now - $$(cat $$s))) -ge $${STALE_GRACE:-180} ] && killall -TERM upsmon;
          exit 1;
          elif [ $$rc -ne 0 ]; then exit 1;
          else rm -f /dev/shm/nut/stale-since; exit 0; fi
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      DRIVER: netxml-ups
      PORT: http://10.1.3.63
      NAME: eaton-5px
      DESCRIPTION: "Eaton 5PX 1500 - Computer Room"
      API_USER: monuser
      API_PASSWORD: ${NUT_CLIENT_PASSWORD}
      # seconds of stale UPS data tolerated before the health check restarts upsmon
      STALE_GRACE: "180"
      # upsmon role. 2026-10-26: this ran as "secondary" for one evening after
      # the incident below; primary restored once the trigger was removed.
      SERVER: primary
    # Custom driver config (low-battery safety margin). The image copies
    # /etc/nut/local/ups.conf over its generated one, delivered as a compose
    # `config`. CORRECTION (verified in docker/compose create.go + reconcile.go):
    # compose does NOT hash the file CONTENT -- a `configs: file:` is a read-only
    # bind mount and the service config-hash captures only the file reference, so
    # an edit to ups.conf ALONE is a no-op `up -d` and does NOT recreate upsd.
    # Recreation is driven instead by the `kdk.config-sha` label below, which the
    # Komodo pre_deploy sets to sha256(ups.conf): a DELIBERATE ups.conf merge
    # changes the label and recreates upsd; an unrelated merge does not.
    #
    # >>> DANGER <<< recreating upsd can shut a client host down. On 2026-10-26 a
    # --force-recreate landed while the UPS ran its monthly battery self-test:
    # upsmon 2.8.1 on kdk-hyp-01 lost upsd for one poll while the status carried
    # CAL, hit NUT's "last known to be calibrating and not communicating, assuming
    # dead" rule -- NOT gated by DEADTIME in 2.8.1 or upstream master -- and shut
    # Proxmox down with kdk-dkr-01 and kdk-dns-01 on it, UPS on line at 100 %.
    # Rule: never restart upsd without a reason; the clients cannot tell a restart
    # from a dead UPS. So only merge a ups.conf change -- and the FIRST deploy after
    # this label is introduced, which recreates upsd once -- with a person watching
    # the UPS state and ready to disable the clients. See docs/services/nut.md.
    configs:
      - source: ups-conf
        target: /etc/nut/local/ups.conf
    ports:
      - "3493:3493"
    labels:
      # Recreate upsd ONLY on a deliberate ups.conf change (see the DANGER note
      # above). NUT_CONFIG_SHA = sha256(ups.conf) from the Komodo pre_deploy.
      kdk.config-sha: "${NUT_CONFIG_SHA:-unset}"
configs:
  ups-conf:
    file: ./ups.conf
