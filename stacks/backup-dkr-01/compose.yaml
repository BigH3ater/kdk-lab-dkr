# Nightly one-shot on kdk-dkr-01: stage this host's app state -> tankz3/backup
# (the NFS backup tree). Offsite to Proton is a SEPARATE stack (backup-offsite)
# that ships the whole tree once every host has staged.
#
# Two Komodo one-shot facts shape this:
#  * `.last-backup` marker on success -- rsync -a preserves source mtimes, so
#    file mtime can't signal "ran tonight"; a freshly-touched marker can.
#  * the `gate` service: Komodo's DeployStack returns when `up -d` returns, and
#    up -d does NOT wait for a terminal one-shot to finish. A trailing gate that
#    depends on rsync (service_completed_successfully) forces up -d to block
#    until rsync is done, so the procedure's NEXT stage only starts after this
#    host is fully staged. rsync always exits 0 (best-effort); backup-verify is
#    the single source of truth and pages Pushover if the marker is stale.
name: backup-dkr-01
services:
  # Jellystat's PostgreSQL (and wger's, below) are the app DBs on this host, so they are pg_dumped here
  # (house convention, mirrors backup-dmz) rather than rsynced raw -- a live cluster
  # dir is torn/unsafe to restore, so jellystat/postgres is excluded from the rsync
  # below. Reaches the DB over the external jellystat_default network. Best-effort
  # (exit 0); backup-verify checks the dump is present + gzip-valid for today.
  pgdump-jellystat:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: "no"
    env_file: [.env]
    environment:
      PGPASSWORD: "${JELLYSTAT_POSTGRES_PASSWORD}"
    command: >
      sh -c 'pg_dump -h jellystat-db -U jellystat jfstat
      | gzip > /dest/jellystat-$$(date +%F).sql.gz
      && ls -t /dest/jellystat-*.sql.gz | tail -n +16 | xargs -r rm; exit 0'
    volumes:
      - /mnt/backup/dkr/kdk-dkr-01/pgdump:/dest
    networks: [jellystat_default]

  # wger's PostgreSQL (stacks/wger): same pattern as jellystat. The live
  # /opt/kdk-lab/wger/postgres cluster dir is excluded from the rsync below; the dump
  # carries the workout logs, routines and users. Reaches `wger-db` over the stack's
  # internal backend network. Password = the wger stack's item (kdk-cluster/wger-postgres).
  # Baseline-clean from the start (the jellystat job above predates the baseline):
  # pg_dump only writes stdout, gzip writes the root-owned /dest it created.
  pgdump-wger:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      kdk.baseline.skip: "healthcheck"   # one-shot
    env_file: [.env]
    environment:
      PGPASSWORD: "${WGER_POSTGRES_PASSWORD}"
    # --exclude-schema: PowerSync's bucket storage (schema `powersync`) is derived
    # state rebuilt from the wger tables; upstream's restore drops it anyway.
    command: >
      sh -c 'pg_dump -h wger-db -U wger --exclude-schema=powersync wger
      | gzip > /dest/wger-$$(date +%F).sql.gz
      && ls -t /dest/wger-*.sql.gz | tail -n +16 | xargs -r rm; exit 0'
    volumes:
      - /mnt/backup/dkr/kdk-dkr-01/pgdump:/dest
    networks: [wger_backend]

  # NOTE: rsync's destination is /dest/kdk-dkr-01/ itself (the DMZ stage syncs into a
  # state/ subdir), so the delete pass used to remove the pgdump/ directory the
  # jellystat dump had just written: every scheduled run ended with 'pgdump jellystat
  # missing' while hand runs worked (2026-10-29/30). `--exclude 'pgdump/'` keeps it
  # (rsync never deletes excluded paths on the receiver without --delete-excluded).
  rsync:
    image: instrumentisto/rsync-ssh:alpine3.23-r3@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    restart: "no"
    depends_on:
      pgdump-jellystat: { condition: service_completed_successfully }
      pgdump-wger: { condition: service_completed_successfully }
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rsync -a --delete \
          --exclude 'tdarr-temp' --exclude 'sabnzbd-incomplete' \
          --exclude 'komodo/postgres' --exclude 'jellystat/postgres' \
          --exclude 'wger/postgres' --exclude 'wger/static' \
          --exclude 'proxy/letsencrypt' \
          --exclude 'stacks/' --exclude 'backup/' \
          --exclude 'pgdump/' \
          /src/ /dest/kdk-dkr-01/
        rc=$$?
        # 0 ok; 24 = "file vanished" (live SQLite/media) is benign.
        if [ $$rc -eq 0 ] || [ $$rc -eq 24 ]; then touch /dest/kdk-dkr-01/.last-backup; else echo "rsync failed rc=$$rc"; fi
        exit 0
    volumes:
      - /opt/kdk-lab:/src:ro
      - /mnt/backup/dkr:/dest
  gate:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    restart: "no"
    depends_on:
      rsync: { condition: service_completed_successfully }
    command: ["true"]

networks:
  # The jellystat stack's default network, joined so pgdump-jellystat can reach the
  # `jellystat-db` container by name (same approach as backup-dmz -> identity/immich).
  jellystat_default:
    external: true
  # The wger stack's internal DB network (pinned 10.208.200.0/24), for pgdump-wger.
  # External: the wger stack must be deployed before this one-shot runs, or `up`
  # fails with "network wger_backend not found" and the whole night's stage with it.
  wger_backend:
    external: true
