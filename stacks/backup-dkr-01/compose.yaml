# Nightly one-shot on kdk-dkr-01: stage this host's app state -> tankz3/backup
# (the NFS backup tree). Offsite to Proton is a SEPARATE stack (backup-offsite)
# that ships the whole tree once every host has staged.
#
# Two Komodo one-shot facts shape this:
#  * `.last-backup` marker on success -- rsync -a preserves source mtimes, so
#    file mtime can't signal "ran tonight"; a freshly-touched marker can.
#  * the `gate` service: Komodo's DeployStack returns when `up -d` returns, and
#    up -d does NOT wait for a terminal one-shot to finish. A trailing gate that
#    depends on rsync (service_completed_successfully) forces up -d to block
#    until rsync is done, so the procedure's NEXT stage only starts after this
#    host is fully staged. rsync always exits 0 (best-effort); backup-verify is
#    the single source of truth and pages Pushover if the marker is stale.
name: backup-dkr-01
services:
  # Jellystat's PostgreSQL is the one app DB on this host, so it is pg_dumped here
  # (house convention, mirrors backup-dmz) rather than rsynced raw -- a live cluster
  # dir is torn/unsafe to restore, so jellystat/postgres is excluded from the rsync
  # below. Reaches the DB over the external jellystat_default network. Best-effort
  # (exit 0); backup-verify checks the dump is present + gzip-valid for today.
  pgdump-jellystat:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: "no"
    env_file: [.env]
    environment:
      PGPASSWORD: "${JELLYSTAT_POSTGRES_PASSWORD}"
    command: >
      sh -c 'pg_dump -h jellystat-db -U jellystat jfstat
      | gzip > /dest/jellystat-$$(date +%F).sql.gz
      && ls -t /dest/jellystat-*.sql.gz | tail -n +15 | xargs -r rm; exit 0'
    volumes:
      - /mnt/backup/dkr/kdk-dkr-01/pgdump:/dest
    networks: [jellystat_default]

  rsync:
    image: instrumentisto/rsync-ssh:alpine3.23-r3@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    restart: "no"
    depends_on:
      pgdump-jellystat: { condition: service_completed_successfully }
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rsync -a --delete \
          --exclude 'tdarr-temp' --exclude 'sabnzbd-incomplete' \
          --exclude 'komodo/postgres' --exclude 'jellystat/postgres' \
          --exclude 'proxy/letsencrypt' \
          --exclude 'stacks/' --exclude 'backup/' \
          /src/ /dest/kdk-dkr-01/
        rc=$$?
        # 0 ok; 24 = "file vanished" (live SQLite/media) is benign.
        if [ $$rc -eq 0 ] || [ $$rc -eq 24 ]; then touch /dest/kdk-dkr-01/.last-backup; else echo "rsync failed rc=$$rc"; fi
        exit 0
    volumes:
      - /opt/kdk-lab:/src:ro
      - /mnt/backup/dkr:/dest
  gate:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: "no"
    depends_on:
      rsync: { condition: service_completed_successfully }
    command: ["true"]

networks:
  # The jellystat stack's default network, joined so pgdump-jellystat can reach the
  # `jellystat-db` container by name (same approach as backup-dmz -> identity/immich).
  jellystat_default:
    external: true
