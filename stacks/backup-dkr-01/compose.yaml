# Nightly one-shot on kdk-dkr-01: stage this host's app state -> tankz3/backup
# (the NFS backup tree). Offsite to Proton is a SEPARATE stack (backup-offsite)
# that ships the whole tree once every host has staged. A .last-backup marker is
# touched on success so backup-verify can prove this run actually ran (rsync -a
# preserves source mtimes, so file mtime alone can't signal freshness).
name: backup-dkr-01
services:
  rsync:
    image: instrumentisto/rsync-ssh:alpine
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rsync -a --delete \
          --exclude 'tdarr-temp' --exclude 'sabnzbd-incomplete' \
          --exclude 'komodo/postgres' --exclude 'proxy/letsencrypt' \
          --exclude 'stacks/' --exclude 'backup/' \
          /src/ /dest/kdk-dkr-01/
        rc=$?
        # 24 = "file vanished" (live SQLite/media) is benign, treat as success.
        [ $rc -eq 0 ] || [ $rc -eq 24 ] || exit $rc
        touch /dest/kdk-dkr-01/.last-backup
    volumes:
      - /opt/kdk-lab:/src:ro
      - /mnt/backup/dkr:/dest
