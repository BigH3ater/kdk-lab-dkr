# Scrypted -- kdk-dkr-03 (10.1.30.22), VLAN 30.
#
# GITOPS-OWNED (migrated 2026-09-20 from the files-on-host compose at
# /opt/kdk-lab/scrypted-homebridge/). Data dir stays on the board
# (/opt/kdk-lab/scrypted).
#
# Homebridge was removed 2026-10-28: it served zero accessories (all HomeKit is
# Scrypted's own bridge) and its UI setup was never claimed, so the first
# visitor could have created its admin account. The stack and directory keep
# the old name -- renaming a Komodo stack destroys and recreates it.
#
# Scrypted is alone on this board on purpose: it was OOMKilled repeatedly on a
# Pi 5 8 GiB during the k3s era and its limit was raised 2 GiB -> 4 GiB in
# response. A board with no neighbour makes that 4 GiB a ceiling rather than
# a competition.
name: scrypted-homebridge

services:
  scrypted:
    # >= 0.147.0 for GHSA-fgj8-7r76-h852 (unauthenticated admin RPC, CVSS 10,
    # affects <= 0.146.1). Upstream stopped publishing -jammy-* tags after
    # v0.123.58; the -full variant is now built on Ubuntu noble only.
    image: ghcr.io/koush/scrypted:v0.147.0-noble-full
    container_name: scrypted
    # host: HomeKit accessory advertisement plus camera/RTSP discovery.
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/kdk-lab/scrypted/volume:/server/volume
      - /etc/localtime:/etc/localtime:ro
