# Nightly one-shot on kdk-dkr-01: validate the whole backup pass and page
# Pushover on ANY failure. Final stage of the nightly procedure. The check
# logic lives in verify.sh (mounted) so Docker Compose interpolation never
# touches its shell $variables. See verify.sh for what it checks.
name: backup-verify
services:
  verify:
    image: alpine:3.20.10@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    entrypoint: ["/bin/sh", "/verify.sh"]
    volumes:
      - /mnt/backup/dkr:/dest:ro
      - /etc/kdk/pushover.env:/pushover.env:ro
      - ./verify.sh:/verify.sh:ro
