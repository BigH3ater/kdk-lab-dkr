# Komodo Core + FerretDB (official pattern). UI at komodo.kmkdp.com (Authelia SSO,
# then Komodo local login; self-registration closed).
name: komodo
services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    labels:
      komodo.skip:
    restart: unless-stopped
    volumes:
      - /opt/kdk-lab/komodo/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres
    networks: [default]
  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on: [postgres]
    volumes:
      - /opt/kdk-lab/komodo/ferretdb:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres
    networks: [default]
  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3
    # tini as PID 1 reaps the defunct `git` children Komodo forks for repo polling
    # (resource sync + stack update checks). Without it they accumulate as zombies
    # (2227 seen 2026-09-19) and inflate the host load number.
    init: true
    labels:
      komodo.skip:
      traefik.enable: "true"
      # UI (and everything not matched below) sits behind Authelia ForwardAuth;
      # Komodo's own local login stays as the second layer. Authelia needs the
      # matching access_control rule (stacks/identity/authelia/configuration.yml),
      # default_policy is deny.
      traefik.http.routers.komodo.rule: "Host(`komodo.kmkdp.com`)"
      # Komodo-specific ForwardAuth: the UI sends `Authorization: Bearer <jwt>`
      # on every API call, and Authelia's forward-auth rejects any Authorization
      # header whose scheme is not Basic (401) before it looks at the session
      # cookie. Forward only Accept + Cookie to Authelia; Traefik still adds the
      # X-Forwarded-* headers itself. Komodo validates the JWT afterwards.
      traefik.http.routers.komodo.middlewares: "komodo-auth"
      traefik.http.middlewares.komodo-auth.forwardauth.address: "https://sso.kmkdp.com/api/authz/forward-auth"
      traefik.http.middlewares.komodo-auth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.komodo-auth.forwardauth.authRequestHeaders: "Accept,Cookie"
      traefik.http.middlewares.komodo-auth.forwardauth.authResponseHeaders: "Remote-User,Remote-Groups,Remote-Email,Remote-Name"
      traefik.http.routers.komodo.service: "komodo"
      # API-key automation bypasses SSO, but only for the key-authenticated
      # endpoints (/read, /write, /execute) AND only when an X-Api-Key header is
      # present: a header-less request (browser) never matches. /auth (password
      # login), /user and /terminal stay behind SSO. Core still validates the
      # key+secret. In-repo automation does not need this (Komodo actions call
      # http://localhost:9120; hand scripts use container:komodo-core-1), but
      # operator sessions have called https://komodo.kmkdp.com with a key.
      traefik.http.routers.komodo-api.rule: "Host(`komodo.kmkdp.com`) && PathRegexp(`^/(read|write|execute)(/|$$)`) && HeaderRegexp(`X-Api-Key`, `.+`)"
      traefik.http.routers.komodo-api.priority: "200"
      traefik.http.routers.komodo-api.service: "komodo"
      # Git webhook listener: authenticated by HMAC (KOMODO_WEBHOOK_SECRET), not
      # by a session. Kept reachable without SSO as a RunSync recovery trigger
      # (see the gitops-sync SELF-EDIT note in komodo/resources.toml).
      traefik.http.routers.komodo-listener.rule: "Host(`komodo.kmkdp.com`) && PathPrefix(`/listener/`)"
      traefik.http.routers.komodo-listener.priority: "190"
      traefik.http.routers.komodo-listener.service: "komodo"
      traefik.http.services.komodo.loadbalancer.server.port: "9120"
    restart: unless-stopped
    depends_on: [ferretdb]
    environment:
      KOMODO_HOST: https://komodo.kmkdp.com
      KOMODO_TITLE: kdk-lab
      KOMODO_DATABASE_URI: mongodb://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@ferretdb:27017/komodo?authSource=admin
      KOMODO_PASSKEY: ${KOMODO_PASSKEY}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_ADMIN_PASSWORD}
      # Registration closed (2026-10): no self-signup; any user created some other
      # way starts disabled until an admin enables it.
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
    volumes:
      - /opt/kdk-lab/komodo/syncs:/syncs
      - /opt/kdk-lab/komodo/backups:/backups
    networks: [default, proxy]
networks:
  default: {}
  proxy:
    external: true
