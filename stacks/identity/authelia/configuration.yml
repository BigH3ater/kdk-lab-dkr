      - client_id: 'jellyfin'
        client_name: 'Jellyfin'
        # Batch 5b: K0lin/jellyfin-plugin-sso (SSO Authentication 5.1.1, Jellyfin 12).
        # The file holds a $pbkdf2-sha512$ digest; the plugin keeps the plaintext
        # (op://kdk-cluster/jellyfin-oidc/password). Runbook: docs/runbooks/jellyfin-sso.md.
        client_secret: '{{ secret "/secrets/authelia-app-secrets/jellyfin_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://jellyfin.kmkdp.com/sso/OID/redirect/authelia'   # provider name in the plugin = authelia
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'jellyfin_access'   # group jellyfin-users or lldap_admin
        consent_mode: 'auto'
        require_pushed_authorization_requests: false
        # The plugin's Duende OidcClient always sends an S256 challenge, so enforce it.
        require_pkce: true
