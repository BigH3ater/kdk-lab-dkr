        access_token_signed_response_key_id: ''
        access_token_encrypted_response_key_id: ''
        access_token_encrypted_response_alg: ''
        access_token_encrypted_response_enc: ''
        # The plugin reads groups from the UserInfo response (LoadProfile), as plain JSON.
        userinfo_signed_response_alg: 'none'
        userinfo_signed_response_key_id: ''
        userinfo_encrypted_response_key_id: ''
        userinfo_encrypted_response_alg: ''
        userinfo_encrypted_response_enc: ''
        introspection_signed_response_alg: 'none'
        introspection_signed_response_key_id: ''
        introspection_encrypted_response_key_id: ''
        introspection_encrypted_response_alg: ''
        introspection_encrypted_response_enc: ''
        introspection_endpoint_auth_method: 'client_secret_basic'
        introspection_endpoint_auth_signing_alg: 'RS256'
        request_object_signing_alg: ''
        request_object_encryption_alg: 'none'
        request_object_encryption_enc: ''
        # Duende OidcClient default TokenClientCredentialStyle = PostBody.
        token_endpoint_auth_method: 'client_secret_post'
        token_endpoint_auth_signing_alg: ''
        revocation_endpoint_auth_method: 'client_secret_basic'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_basic'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
# Named networks for access_control / OIDC policy rules (4.39: definitions.network).
# Not referenced by any rule yet -- defined for later network-scoped rules. Matches
# the first X-Forwarded-For address, so only meaningful with the batch-3 trusted-XFF
# lists on the DMZ Traefik. 192.168.3.0/24 = WireGuard break-glass (admin source).
definitions:
  network:
    internal:
      - '10.1.1.0/24'
      - '10.1.3.0/24'
      - '10.1.20.0/24'
      - '10.1.30.0/24'
      - '192.168.191.0/24'
      - '100.64.0.0/10'
      - '192.168.3.0/24'
access_control:
  default_policy: 'deny'
  rules:
    - policy: bypass
      domain:
        - 'sso.kmkdp.com'
    # L3: blackbox probes from kdk-mon-01 hit the apps' anonymous health endpoint
    # (Sonarr/Radarr/Prowlarr `GET /ping` -> {"status":"OK"}, [AllowAnonymous]).
    # `resources` matches path+query, so only the exact path /ping bypasses.
    # Must stay ABOVE the two_factor rule for these hosts (first match wins).
    - policy: bypass
      domain:
        - 'sonarr.kmkdp.com'
        - 'radarr.kmkdp.com'
        - 'prowlarr.kmkdp.com'
      resources:
        - '^/ping$'
    - policy: two_factor
      domain:
        - 'home.kmkdp.com'
      subject:
        - ['group:dashboard-users']
    # LLDAP admin UI (H1, ForwardAuth label on the lldap router). Directory
    # admins only; LLDAP's own login is the second gate.
    - policy: two_factor
      domain:
        - 'users.kmkdp.com'
      subject:
        - ['group:lldap_admin']
    - policy: two_factor
      domain:
        - 'sonarr.kmkdp.com'
        - 'radarr.kmkdp.com'
        - 'sabnzbd.kmkdp.com'
        - 'prowlarr.kmkdp.com'
        - 'bazarr.kmkdp.com'
        - 'tdarr.kmkdp.com'
        - 'chaptarr.kmkdp.com'
        - 'trailarr.kmkdp.com'   # was missing -> default deny (403) since trailarr landed
        - 'jellystat.kmkdp.com'  # PR #54
      subject:
        - ['group:internal-users']
    # Komodo UI (internal Traefik, forwardauth@file). Komodo is the deploy root
    # for every host. API-key calls to /read|/write|/execute and the HMAC webhook
    # /listener use separate Traefik routers that never reach Authelia.
    - policy: two_factor
      domain:
        - 'komodo.kmkdp.com'
      subject:
        - ['group:internal-users']
    # Alertmanager UI (file-provider route on the internal Traefik; it has no
    # login of its own and can silence alerts).
    - policy: two_factor
      domain:
        - 'alertmanager.kmkdp.com'
      subject:
        - ['group:internal-users']
    # Wizarr moved to the DMZ (Cloudflare tunnel). Only the admin Traefik router
    # carries ForwardAuth, so this rule gates the admin portal (/login, /api,
    # /admin, /setup, /settings, ...); the invitee paths (/j, /join, /wizard,
    # /invitation/process, /reset, /static, ...) are served by a higher-priority
    # public router with no auth and never reach Authelia. See stacks/wizarr.
    - policy: two_factor
      domain:
        - 'wizarr.kmkdp.com'
      subject:
        - ['group:internal-users']
...
