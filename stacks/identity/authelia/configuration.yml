---
# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
theme: 'light'
default_2fa_method: ''
server:
  address: 'tcp://0.0.0.0:9091/'
  asset_path: ''
  # The container runs as uid 8091 with a read-only rootfs, so Authelia must not
  # try to write /app/.healthcheck.env; compose defines its own healthcheck.
  disable_healthcheck: true
  headers:
    csp_template: ""
  buffers:
    read: 4096
    write: 4096
  timeouts:
    read: '6 seconds'
    write: '6 seconds'
    idle: '30 seconds'
  endpoints:
    enable_pprof: false
    enable_expvars: false
    authz:
      auth-request:
        implementation: 'AuthRequest'
      ext-authz:
        implementation: 'ExtAuthz'
      forward-auth:
        implementation: 'ForwardAuth'
    rate_limits:
      reset_password_start:
        enable: true
      reset_password_finish:
        enable: true
      second_factor_totp:
        enable: true
      second_factor_duo:
        enable: true
      session_elevation_start:
        enable: true
      session_elevation_finish:
        enable: true
      openid_connect_token:
        enable: true
      openid_connect_pushed_authorization_request:
        enable: true
log:
  level: 'info'
  format: 'json'
  file_path: ''
  keep_stdout: true
telemetry:
  metrics:
    enabled: false
identity_validation:
  elevated_session:
    code_lifespan: '5 minutes'
    elevation_lifespan: '10 minutes'
    characters: 8
    # L1: enrolling/removing a 2FA device needs the second factor, not just
    # password + mailbox (every user already has TOTP + WebAuthn).
    require_second_factor: true
    skip_second_factor: false
  reset_password:
    jwt_lifespan: '5 minutes'
    jwt_algorithm: 'HS256'
totp:
  disable: false
  issuer: 'Authelia'
  skew: 1
  secret_size: 32
  algorithm: 'SHA1'
  digits: 6
  period: 30
  allowed_algorithms:
    - 'SHA1'
  allowed_digits:
    - 6
  allowed_periods:
    - 30
webauthn:
  disable: false
  enable_passkey_login: true
  display_name: 'Authelia'
  attestation_conveyance_preference: 'indirect'
  timeout: '60 seconds'
  filtering:
    permitted_aaguids: []
    prohibited_aaguids: []
    prohibit_backup_eligibility: false
  selection_criteria:
    attachment: ''
    discoverability: 'preferred'
    user_verification: 'required'
  metadata:
    # L7: validate authenticators against the FIDO Alliance MDS3 blob. Needs egress
    # to mds3.fidoalliance.org at startup ('strict' = Authelia refuses to start
    # without a fresh copy). TOTP stays the fallback if a passkey is rejected.
    enabled: false   # L7 deferred by the reviewer: strict MDS3 validation needs an internet download at start and can reject the owner's existing zero-AAGUID passkey; revisit after a test enrolment
    cache_policy: 'strict'
    validate_trust_anchor: true
    validate_entry: true
    validate_entry_permit_zero_aaguid: false
    validate_status: true
    validate_status_permitted: []
    validate_status_prohibited: []
ntp:
  address: 'udp://time.cloudflare.com:123'
  version: 4
  max_desync: '3 seconds'
  disable_startup_check: false
  disable_failure: false
authentication_backend:
  password_reset:
    disable: false
    custom_url: ''
  password_change:
    disable: false
  refresh_interval: '5 minutes'
  ldap:
    implementation: 'lldap'
    address: 'ldaps://lldap.kmkdp.com:6360'
    timeout: '5 seconds'
    start_tls: false
    tls:
      server_name: 'lldap.kmkdp.com'
      skip_verify: false   # LE wildcard served by lldap (certs-dumper), verified against public roots
    pooling:
      enable: false
      count: 5
      retries: 2
      timeout: '10 seconds'
    base_dn: 'dc=kmkdp,dc=com'
    additional_users_dn: 'ou=people'
    users_filter: '(&({username_attribute}={input})(objectClass=person))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(member={dn})'
    group_search_mode: 'filter'
    permit_referrals: false
    permit_unauthenticated_bind: false
    # M3: dedicated bind account in lldap_password_manager (read + password
    # reset/change for non-admin users). Password: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
    # (op://kdk-cluster/lldap-authelia-bind/password). uid=admin is break-glass only.
    # Consequence: lldap_admin members cannot reset/change their password through
    # Authelia any more (a password manager cannot touch admins) -- use users.kmkdp.com.
    user: 'uid=authelia-bind,ou=people,dc=kmkdp,dc=com'
    attributes:
      distinguished_name: ''
      username: 'uid'
      display_name: 'displayName'
      family_name: ''
      given_name: ''
      middle_name: ''
      nickname: ''
      gender: ''
      birthdate: ''
      website: ''
      profile: ''
      picture: ''
      zoneinfo: ''
      locale: ''
      phone_number: ''
      phone_extension: ''
      street_address: ''
      locality: ''
      region: ''
      postal_code: ''
      country: ''
      mail:  'mail'
      member_of:  'memberOf'
      group_name:  ''
# M5: Authelia applies ONE password policy (docs: "Only one password policy can be
# applied at a time"). standard enforces; zxcvbn only shows a strength meter, so
# standard wins and zxcvbn is off. Applies to Authelia's reset/change flow only --
# passwords set in the lldap UI or by Wizarr bypass it.
password_policy:
  standard:
    enabled: true
    min_length: 14
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false
  zxcvbn:
    enabled: false
    min_score: 3
session:
  name: 'authelia_session'
  same_site: 'lax'
  inactivity: '5 minutes'
  expiration: '1 hour'
  remember_me: '1 month'
  cookies:
    - domain: 'kmkdp.com'
      authelia_url: 'https://sso.kmkdp.com'
  redis:
    host: 'redis'
    port: 6379
    database_index: 0
    maximum_active_connections: 8
    minimum_idle_connections: 0
# M5: ban the source IP as well as the username (4.39 `regulation.modes`). The IP is
# the first X-Forwarded-For entry, which is only trustworthy once the DMZ Traefik
# trusts XFF from cloudflared/internal Traefik alone (batch 3, M7) -- merge after it.
regulation:
  modes:
  - 'user'
  - 'ip'
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'
storage:
  postgres:
    address: 'tcp://authelia-postgres:5432'
    servers: []
    timeout: '5 seconds'
    database: 'authelia'
    schema: 'public'
    username: 'authelia'
notifier:
  # Startup check on: Authelia connects to the bridge at boot and fails loudly
  # if the relay is down (the old direct-to-Proton setup had it disabled).
  disable_startup_check: false
  smtp:
    # In-lab Proton Mail Bridge on kdk-dkr-01 (stacks/apps, account
    # op://kdk-ops/proton-backup-account, 2026-10-29). Plain SMTP with STARTTLS;
    # the bridge presents a self-signed certificate, hence skip_verify.
    # Path: DMZ -> VLAN 20 needs the UniFi rule 192.168.191.20 -> 10.1.20.20:25
    # and the DOCKER-USER exception for the authelia container (hosts/kdk-dkr-dmz-01).
    address: 'smtp://10.1.20.20:25'
    timeout: '5 seconds'
    username: 'kdk.lab@pm.me'
    sender: 'no-reply@kmkdp.com'
    identifier: 'kmkdp.com'
    subject: '[Authelia] {title}'
    startup_check_address: 'test@authelia.com'
    disable_html_emails: false
    disable_require_tls: false
    disable_starttls: false
    tls:
      server_name: ''
      skip_verify: true
      minimum_version: 'TLS1.2'
      maximum_version: 'TLS1.3'
identity_providers:
  oidc:
    lifespans:
      access_token: '1 hour'
      refresh_token: '1 hour and 30 minutes'
      id_token: '1 hour'
      authorize_code: '1 minute'
      device_code: '10 minutes'
    enforce_pkce: 'public_clients_only'
    enable_pkce_plain_challenge: false
    enable_client_debug_messages: false
    enable_jwt_access_token_stateless_introspection: false
    minimum_parameter_entropy: 8
    discovery_signed_response_alg: ''
    discovery_signed_response_key_id: ''
    require_pushed_authorization_requests: false
    authorization_policies:
      immich_access:
        default_policy: 'deny'
        rules:
        - policy: 'two_factor'
          subject:
            - ['group:immich-users']
      # HA H3: only household HA users; any other LLDAP account (e.g. Wizarr-invited
      # Jellyfin guests) is refused before Home Assistant ever sees it.
      ha_access:
        default_policy: 'deny'
        rules:
        - policy: 'two_factor'
          subject:
            - ['group:ha-users']
      # ABS-2: ABS auto-registers every OIDC user, so gate it here.
      audiobookshelf_access:
        default_policy: 'deny'
        rules:
        - policy: 'two_factor'
          subject:
            - ['group:audiobookshelf-users']
      # Libreseerr auto-creates OIDC users and hands every user the Chaptarr key
      # (request-apps audit H-L3): household only.
      libreseerr_access:
        default_policy: 'deny'
        rules:
        - policy: 'two_factor'
          subject:
            - ['group:internal-users']
      # Batch 5b (Jellyfin SSO plugin): household viewers (jellyfin-users, the same
      # group the LDAP plugin filters on) plus directory admins. Two subjects = OR.
      jellyfin_access:
        default_policy: 'deny'
        rules:
        - policy: 'two_factor'
          subject:
            - ['group:jellyfin-users']
            - ['group:lldap_admin']
    jwks:
      - algorithm: 'RS256'
        use: 'sig'
        key_id: 'main'
        key: {{ secret "/secrets/authelia-app-secrets/oidc_issuer_private_key" | mindent 10 "|" | msquote }}
    cors:
      allowed_origins_from_client_redirect_uris: false
    clients:
      - client_id: 'tailscale'
        client_name: 'Tailscale'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/tailscale_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://login.tailscale.com/a/oauth_response'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'two_factor'
        consent_mode: 'auto'
        require_pushed_authorization_requests: false
        require_pkce: false
        pkce_challenge_method: ''
        authorization_signed_response_alg: 'RS256'
        authorization_signed_response_key_id: ''
        authorization_encrypted_response_key_id: ''
        authorization_encrypted_response_alg: ''
        authorization_encrypted_response_enc: ''
        id_token_signed_response_alg: 'RS256'
        id_token_signed_response_key_id: ''
        id_token_encrypted_response_key_id: ''
        id_token_encrypted_response_alg: ''
        id_token_encrypted_response_enc: ''
        access_token_signed_response_alg: 'none'
        access_token_signed_response_key_id: ''
        access_token_encrypted_response_key_id: ''
        access_token_encrypted_response_alg: ''
        access_token_encrypted_response_enc: ''
        userinfo_signed_response_alg: 'none'
        userinfo_signed_response_key_id: ''
        userinfo_encrypted_response_key_id: ''
        userinfo_encrypted_response_alg: ''
        userinfo_encrypted_response_enc: ''
        introspection_signed_response_alg: 'none'
        introspection_signed_response_key_id: ''
        introspection_encrypted_response_key_id: ''
        introspection_encrypted_response_alg: ''
        introspection_encrypted_response_enc: ''
        introspection_endpoint_auth_method: 'client_secret_basic'
        introspection_endpoint_auth_signing_alg: 'RS256'
        request_object_signing_alg: ''
        request_object_encryption_alg: 'none'
        request_object_encryption_enc: ''
        token_endpoint_auth_method: 'client_secret_post'
        token_endpoint_auth_signing_alg: ''
        revocation_endpoint_auth_method: 'client_secret_basic'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_basic'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
      - client_id: 'libreseerr'
        client_name: 'Libreseerr'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/libreseerr_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://libreseerr.kmkdp.com/api/auth/oidc/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'libreseerr_access'
        consent_mode: 'auto'
        # PKCE stays OFF: Libreseerr's Authlib client only sends a code_challenge when
        # code_challenge_method is set in its client_kwargs, which is not confirmed
        # for v0.9.0. Enforcing it here without that would break every SSO login.
        require_pkce: false
      - client_id: 'tandoor'
        client_name: 'Tandoor'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/tandoor_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://recipes.kmkdp.com/accounts/oidc/authelia/login/callback/'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'two_factor'
        consent_mode: 'auto'
        # TAN-9: Tandoor (django-allauth) already sends S256 (OAUTH_PKCE_ENABLED in
        # stacks/tandoor/.env.tpl); now the IdP enforces it.
        require_pkce: true
        pkce_challenge_method: 'S256'
      - client_id: 'vikunja'
        client_name: 'Vikunja Tasks'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/vikunja_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://tasks.kmkdp.com/auth/openid/authelia'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'two_factor'
        consent_mode: 'auto'
        require_pkce: false
      - client_id: 'homeassistant'
        client_name: 'Home Assistant'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/homeassistant_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://homeassistant.kmkdp.com/auth/oidc/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'ha_access'   # group ha-users (HA H3)
        consent_mode: 'auto'
        # hass-oidc-auth is a spec-strict RP: PKCE S256 + client_secret_post
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'actual'
        client_name: 'Actual Budget'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/actual_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://budget.kmkdp.com/openid/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'two_factor'
        consent_mode: 'auto'
        require_pkce: false
      - client_id: 'audiobookshelf'
        client_name: 'Audiobookshelf'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/audiobookshelf_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://audiobookshelf.kmkdp.com/auth/openid/callback'         # web login
          - 'https://audiobookshelf.kmkdp.com/auth/openid/mobile-redirect'  # mobile OIDC (official app + Prologue/iOS); ABS sends this as redirect_uri and validates the app scheme (prologue://oauth) locally
          - 'audiobookshelf://oauth'                                        # legacy; not used by ABS 2.36 mobile flow, kept harmless
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'audiobookshelf_access'   # group audiobookshelf-users (ABS-2)
        consent_mode: 'auto'
        require_pushed_authorization_requests: false
        require_pkce: true
        pkce_challenge_method: 'S256'
        authorization_signed_response_alg: 'RS256'
        authorization_signed_response_key_id: ''
        authorization_encrypted_response_key_id: ''
        authorization_encrypted_response_alg: ''
        authorization_encrypted_response_enc: ''
        id_token_signed_response_alg: 'RS256'
        id_token_signed_response_key_id: ''
        id_token_encrypted_response_key_id: ''
        id_token_encrypted_response_alg: ''
        id_token_encrypted_response_enc: ''
        access_token_signed_response_alg: 'none'
        access_token_signed_response_key_id: ''
        access_token_encrypted_response_key_id: ''
        access_token_encrypted_response_alg: ''
        access_token_encrypted_response_enc: ''
        userinfo_signed_response_alg: 'none'
        userinfo_signed_response_key_id: ''
        userinfo_encrypted_response_key_id: ''
        userinfo_encrypted_response_alg: ''
        userinfo_encrypted_response_enc: ''
        introspection_signed_response_alg: 'none'
        introspection_signed_response_key_id: ''
        introspection_encrypted_response_key_id: ''
        introspection_encrypted_response_alg: ''
        introspection_encrypted_response_enc: ''
        introspection_endpoint_auth_method: 'client_secret_basic'
        introspection_endpoint_auth_signing_alg: 'RS256'
        request_object_signing_alg: ''
        request_object_encryption_alg: 'none'
        request_object_encryption_enc: ''
        token_endpoint_auth_method: 'client_secret_basic'
        token_endpoint_auth_signing_alg: ''
        revocation_endpoint_auth_method: 'client_secret_basic'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_basic'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'

      - client_id: 'cloudflare-access'
        client_name: 'Cloudflare Access'
        client_secret: '{{ secret "/secrets/authelia-app-secrets/cloudflare_access_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://kmkdp.cloudflareaccess.com/cdn-cgi/access/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'two_factor'
        consent_mode: 'auto'
        require_pushed_authorization_requests: false
        require_pkce: false
        pkce_challenge_method: ''
        authorization_signed_response_alg: 'RS256'
        authorization_signed_response_key_id: ''
        authorization_encrypted_response_key_id: ''
        authorization_encrypted_response_alg: ''
        authorization_encrypted_response_enc: ''
        id_token_signed_response_alg: 'RS256'
        id_token_signed_response_key_id: ''
        id_token_encrypted_response_key_id: ''
        id_token_encrypted_response_alg: ''
        id_token_encrypted_response_enc: ''
        access_token_signed_response_alg: 'none'
        access_token_signed_response_key_id: ''
        access_token_encrypted_response_key_id: ''
        access_token_encrypted_response_alg: ''
        access_token_encrypted_response_enc: ''
        userinfo_signed_response_alg: 'none'
        userinfo_signed_response_key_id: ''
        userinfo_encrypted_response_key_id: ''
        userinfo_encrypted_response_alg: ''
        userinfo_encrypted_response_enc: ''
        introspection_signed_response_alg: 'none'
        introspection_signed_response_key_id: ''
        introspection_encrypted_response_key_id: ''
        introspection_encrypted_response_alg: ''
        introspection_encrypted_response_enc: ''
        introspection_endpoint_auth_method: 'client_secret_basic'
        introspection_endpoint_auth_signing_alg: 'RS256'
        request_object_signing_alg: ''
        request_object_encryption_alg: 'none'
        request_object_encryption_enc: ''
        token_endpoint_auth_method: 'client_secret_post'
        token_endpoint_auth_signing_alg: ''
        revocation_endpoint_auth_method: 'client_secret_basic'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_basic'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
      - client_id: 'grafana'
        client_name: 'Grafana'
        # M4: the file holds a $pbkdf2-sha512$ digest (Grafana keeps the plaintext).
        client_secret: '{{ secret "/secrets/authelia-app-secrets/grafana_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://grafana.kmkdp.com/login/generic_oauth'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        authorization_policy: 'two_factor'
        consent_mode: 'auto'
        require_pushed_authorization_requests: false
        require_pkce: false
        pkce_challenge_method: ''
        authorization_signed_response_alg: 'RS256'
        authorization_signed_response_key_id: ''
        authorization_encrypted_response_key_id: ''
        authorization_encrypted_response_alg: ''
        authorization_encrypted_response_enc: ''
        id_token_signed_response_alg: 'RS256'
        id_token_signed_response_key_id: ''
        id_token_encrypted_response_key_id: ''
        id_token_encrypted_response_alg: ''
        id_token_encrypted_response_enc: ''
        access_token_signed_response_alg: 'none'
        access_token_signed_response_key_id: ''
        access_token_encrypted_response_key_id: ''
        access_token_encrypted_response_alg: ''
        access_token_encrypted_response_enc: ''
        userinfo_signed_response_alg: 'none'
        userinfo_signed_response_key_id: ''
        userinfo_encrypted_response_key_id: ''
        userinfo_encrypted_response_alg: ''
        userinfo_encrypted_response_enc: ''
        introspection_signed_response_alg: 'none'
        introspection_signed_response_key_id: ''
        introspection_encrypted_response_key_id: ''
        introspection_encrypted_response_alg: ''
        introspection_encrypted_response_enc: ''
        introspection_endpoint_auth_method: 'client_secret_basic'
        introspection_endpoint_auth_signing_alg: 'RS256'
        request_object_signing_alg: ''
        request_object_encryption_alg: 'none'
        request_object_encryption_enc: ''
        token_endpoint_auth_method: 'client_secret_basic'
        token_endpoint_auth_signing_alg: ''
        revocation_endpoint_auth_method: 'client_secret_basic'
        revocation_endpoint_auth_signing_alg: 'RS256'
        pushed_authorization_request_endpoint_auth_method: 'client_secret_basic'
        pushed_authorization_request_endpoint_auth_signing_alg: 'RS256'
      - client_id: 'immich'
        client_name: 'Immich'
        # M4: the file holds a $pbkdf2-sha512$ digest (Immich keeps the plaintext).
        # PKCE stays off on purpose (owner decision K10).
        client_secret: '{{ secret "/secrets/authelia-app-secrets/immich_client_secret" }}'
        public: false
        redirect_uris:
          - 'https://immich.kmkdp.com/auth/login'
          - 'https://immich.kmkdp.com/user-settings'
          - 'app.immich:///oauth-callback'
        scopes:
          - 'openid'
