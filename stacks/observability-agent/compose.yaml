# Per-host observability agent, deployed by Komodo to every compose host.
#   - cadvisor : per-container CPU/mem/restart metrics (host :9280)
#   - alloy    : ships local Docker container logs to Loki on kdk-dkr-01.
# Host metrics (node_exporter) are a separate stack on the two VMs only; the
# three Pis already run node_exporter as a package. Per-host env (LOKI_HOST,
# NODE_NAME) is set in komodo/resources.toml.
name: observability-agent
services:
  cadvisor:
    # ghcr, not gcr.io: gcr stops at v0.55.1. v0.55+ carries the containerd-
    # snapshotter fix (google/cadvisor#3709). Docker on every host uses the
    # containerd image store, and v0.52.1 failed every container with "failed to
    # identify the read-write layer ID", so only the root cgroup was exported.
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--store_container_labels=false"
      # ...except the compose labels, so series carry stack/service like Loki does
      # (container_label_com_docker_compose_project / _service).
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "9280:8080"     # 8080 is taken by 1P Connect on kdk-dkr-01; publish on 9280 everywhere
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd/:/var/lib/containerd:ro   # snapshotter layers live here
      - /dev/disk/:/dev/disk:ro
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    environment:
      LOKI_HOST: "${LOKI_HOST:-10.1.20.20}"
      NODE_NAME: "${NODE_NAME:-unknown}"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *log

  # Container-state alerting: pages Pushover on a container crash (die with a
  # non-graceful exit) or unhealthy health status. Uses the Docker API, so it
  # works despite the containerd-snapshotter driver that breaks cAdvisor names.
  docker-event-watch:
    image: docker:28.5.2-cli
    container_name: docker-event-watch
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    command: ["/watch.sh"]
    environment:
      NODE_NAME: "${NODE_NAME:-unknown}"
    volumes:
      - ./docker-event-watch.sh:/watch.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/kdk/pushover.env:/pushover.env:ro
    logging: *log
