# Per-host observability agent, deployed by Komodo to every compose host.
#   - cadvisor : per-container CPU/mem/restart metrics (host :9280)
#   - alloy    : ships local Docker container logs to Loki on kdk-log-01.
# Host metrics (node_exporter) are a separate stack on the two VMs only; the
# three Pis already run node_exporter as a package. Per-host env (LOKI_HOST,
# NODE_NAME) is set in komodo/resources.toml.
name: observability-agent
services:
  cadvisor:
    # ghcr, not gcr.io: gcr stops at v0.55.1. v0.55+ carries the containerd-
    # snapshotter fix (google/cadvisor#3709). Docker on every host uses the
    # containerd image store, and v0.52.1 failed every container with "failed to
    # identify the read-write layer ID", so only the root cgroup was exported.
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--store_container_labels=false"
      # ...except the compose labels, so series carry stack/service like Loki does
      # (container_label_com_docker_compose_project / _service).
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
    # Not privileged (security batch 7; hosts report H-04). cAdvisor reads
    # container stats from the read-only /sys (cgroup v2) and /var/lib/docker +
    # /var/lib/containerd mounts below; privileged mode is only needed for
    # per-process metrics (--pid=host), which this stack does not collect.
    privileged: false
    cap_drop: [ALL]
    cap_add:
      - SYS_PTRACE   # read /proc/<pid>/... of other uids (container network stats)
      - SYSLOG       # read /dev/kmsg for OOM events: the host sets kernel.dmesg_restrict=1
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    devices:
      - /dev/kmsg    # OOM kill events
    ports:
      # Host VLAN address only (BIND_IP per host in komodo/resources.toml); mon-01
      # scrapes it. 8080 is taken by 1P Connect on kdk-dkr-01; publish on 9280 everywhere.
      - "${BIND_IP:?set BIND_IP per host in komodo/resources.toml}:9280:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd/:/var/lib/containerd:ro   # snapshotter layers live here
      - /dev/disk/:/dev/disk:ro
    labels:
      # /var/run (ro) also exposes docker.sock and containerd.sock to cAdvisor,
      # which reads container metadata from them (not via the socket proxy).
      kdk.baseline.exception: "devices: /dev/kmsg for OOM events"
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: alloy
    # Recreate on config change: compose does not hash single-file bind mounts;
    # the Komodo pre_deploy writes AGENT_CONFIG_SHA (alloy/config.alloy +
    # docker-event-watch.sh) into .env, so an edit to either changes this label.
    labels:
      kdk.config-sha: "${AGENT_CONFIG_SHA:-unset}"
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      # Pin the storage path to the alloy-data volume below. Without this flag
      # Alloy uses its cwd-relative default (data-alloy/), which lived in the
      # container FS and was lost on every recreate, so positions reset and
      # Alloy re-read every container log from the start (Loki then rejected the
      # replay: "entry too far behind"). Matches the syslog Alloy in stacks/loki.
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    environment:
      LOKI_HOST: "${LOKI_HOST:-10.1.20.21}"   # Loki on kdk-log-01
      NODE_NAME: "${NODE_NAME:-unknown}"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Persistent positions (loki.source.docker writes positions.yml under the
      # storage path). Survives `up -d --force-recreate`, so the agent resumes
      # tailing where it left off instead of replaying old lines into Loki.
      # Named volume (per host: observability-agent_alloy-data); no host dir to
      # pre-create. alloy runs as root here (no cap_drop/read_only), so it can
      # write the image's 473:473 /var/lib/alloy tree.
      - alloy-data:/var/lib/alloy/data
    # Docker API via the read-only socket proxy (config.alloy: tcp://socket-proxy:2375);
    # default = egress to Loki.
    networks: [default, sockproxy]
    depends_on: [socket-proxy]
    logging: *log

  # Container-state alerting: pages Pushover on a container crash (die with a
  # non-graceful exit) or unhealthy health status. Uses the Docker API, so it
  # works despite the containerd-snapshotter driver that breaks cAdvisor names.
  docker-event-watch:
    image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
    container_name: docker-event-watch
    # Recreate on config change: compose does not hash single-file bind mounts;
    # the Komodo pre_deploy writes AGENT_CONFIG_SHA (alloy/config.alloy +
    # docker-event-watch.sh) into .env, so an edit to either changes this label.
    labels:
      kdk.config-sha: "${AGENT_CONFIG_SHA:-unset}"
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    command: ["/watch.sh"]
    environment:
      NODE_NAME: "${NODE_NAME:-unknown}"
      # `docker events` / `docker inspect` through the read-only socket proxy.
      DOCKER_HOST: "tcp://socket-proxy:2375"
      # Deploy-noise guards (see docker-event-watch.sh header):
      #   a 137/143 die is paged only if no `start` for the same name arrives
      #   within DIE_GRACE seconds (a Komodo recreate cancels it); the startup
      #   "watch online" ping is log-only unless ONLINE_PAGE=1.
      EVENT_WATCH_DIE_GRACE: "${EVENT_WATCH_DIE_GRACE:-90}"
      EVENT_WATCH_ONLINE_PAGE: "${EVENT_WATCH_ONLINE_PAGE:-0}"
    # The script is a compose `config`, not a bind mount, so the file ships with
    # the compose project. CAUTION (verified 2026-10-27 on the identity stack):
    # non-swarm compose does NOT content-hash `configs:`; a script-only edit
    # still needs `RestartStack observability-agent-<host>`. A compose.yaml
    # change does recreate the container.
    configs:
      - source: event-watch
        target: /watch.sh
    volumes:
      - /etc/kdk/pushover.env:/pushover.env:ro
    # default = egress to Pushover (and apk at start); sockproxy = Docker API.
    networks: [default, sockproxy]
    depends_on: [socket-proxy]
    logging: *log

  # Read-only Docker API for alloy and docker-event-watch (security batch 7;
  # hosts report M-03). The only docker.sock mount in this stack. GET/HEAD only
  # (POST=0: no create/start/stop/exec), and only these endpoints:
  #   CONTAINERS  list/inspect/logs -- alloy discovery + log tailing, event-watch inspect
  #   NETWORKS    list -- alloy's discovery.docker (Prometheus docker SD) lists
  #               networks on every refresh and fails without it
  #   EVENTS      event stream -- docker-event-watch
  #   PING/VERSION  API negotiation
  # Everything else stays at the image default 0. Note CONTAINERS also allows
  # GET inspect, which shows container env: the proxy caps writes, not reads.
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: obs-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      # The internal network has no IPv6; bind 0.0.0.0:2375 instead of [::].
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sockproxy]
    read_only: true
    tmpfs: [/tmp, /run]   # the entrypoint renders /tmp/haproxy.cfg; HAProxy writes /run/haproxy.pid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]       # root owns docker.sock (0660 root:docker): no capability needed to open it
    pids_limit: 128
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      kdk.baseline.exception: "docker-sock: the one allowed socket consumer (socket proxy)"
    logging: *log

networks:
  default: {}
  # No gateway, no egress: only the proxy and its two consumers are on it.
  sockproxy:
    internal: true

volumes:
  # Alloy positions/WAL state (loki.source.docker positions.yml). Persisted so a
  # recreate does not replay every container's logs into Loki on kdk-log-01.
  alloy-data: {}

configs:
  event-watch:
    file: ./docker-event-watch.sh
