services:
  book-sync:
    build: .
    image: kdk/book-sync:latest
    container_name: book-sync
    restart: "no"                       # one-shot; run by the procedure
    env_file: [.env]                    # RM_PW (op-injected)
    environment:
      BOOKS_DIR: /books
      STATE_DIR: /state
      RM_BOOKS_DIR: /home/root/books/Library   # KOReader library dir on the tablet (files, not xochitl)
    entrypoint: ["/bin/sh","-c",". /pushover.env 2>/dev/null; exec python /app/book-sync.py"]
    volumes:
      - /mnt/media/books/ebook:/books:ro  # Chaptarr EBOOK root (audiobook root excluded)
      - /opt/kdk-lab/book-sync:/state
      - /etc/kdk/pushover.env:/pushover.env:ro
