# grocery-planner rules & scoring config.
#
# Everything the generator, the recipe scorer and the store split read lives
# here, so changing household rules is a config edit, not a code change. The
# runbook (docs/runbooks/grocery-planner.md) explains each block. No secrets.

tandoor:
  url: "https://recipes.kmkdp.com"
  # Household Space. Every write must land here. The job verifies the dashboard
  # account's ACTIVE space at startup (confirmed live 2026-11-01: the account is
  # a member of exactly one space, "Mack House" id 3, active=true) and fails
  # loudly otherwise.
  space: "Mack House"
  space_id: 3
  # Within a Space, Tandoor 2.x shares meal plans + shopping lists by HOUSEHOLD
  # (confirmed live 2026-11-01: UserSpace.household). The dashboard account is in
  # household "The Macks" (id 1). The job verifies this at startup and fails
  # loudly otherwise. jmack + rach must be in the SAME household to see the plans
  # -- that is a space-admin action (owner step; /api/household/ is admin-only).
  household: "The Macks"
  household_id: 1
  # Household user ids (read-only lookup 2026-11-01: jmack=3, rach=4, dashboard=5)
  # for meal-plan sharing. NOTE: this Tandoor 2.7 meal-plan API exposes NO
  # `shared` field, so per-entry sharing is an OWNER STEP (see the runbook); all
  # three users are in the Mack House space, which already scopes the data.
  share_with: { jmack: 3, rach: 4 }
  # Tandoor meal types the generator writes into. Names must match Tandoor
  # (confirmed live: /api/meal-type/ has name + order). The seed creates any
  # that are missing.
  # The weekly build (run.ensure_setup) creates any that are missing, e.g. Snack
  # (added 2026-11: the snack feeders used to be filed under Breakfast).
  meal_types:
    breakfast: "Breakfast"
    lunch: "Lunch"
    dinner: "Dinner"
    snack: "Snack"

# Plan cadence. The plan week runs Sunday -> Saturday; the fish/beef A-B parity
# keys off the Monday inside that span (week_start + 1 day) so each calendar
# week has a stable parity. Odd ISO week = "A", even = "B".
cadence:
  timezone: "America/Chicago"
  plan_start_weekday: 6        # 6 = Sunday (Python weekday(): Mon=0..Sun=6)

# Simplicity caps (owner defaults; all configurable). Applied as hard filters to
# recipe candidates and respected by the generator when it builds the pool.
#
# TIME, two numbers on purpose:
#  * working_time_max is the owner's ACTIVE-cooking rule (§5b). The generator
#    enforces it against Tandoor's real `working_time` field AFTER import.
#  * candidate_total_time_max / lunch_total_time_max are the hard caps applied
#    to a *candidate's* published schema.org totalTime, which bundles passive
#    marinade/brine/bake/chill time. A candidate over working_time_max but under
#    the total cap is kept and FLAGGED ("verify active time"), not rejected, so a
#    30-min-active recipe with a 30-min marinade is not thrown away. Tighten
#    candidate_total_time_max toward working_time_max to be stricter.
caps:
  working_time_max: 30         # minutes, active cooking (dinners + sides); generator enforces on Tandoor working_time
  lunch_working_time_max: 45   # lunch preps may take longer active time (generator)
  candidate_total_time_max: 60 # hard reject a candidate whose published TOTAL time exceeds this (bundles passive marinade/bake/rest)
  lunch_total_time_max: 90     # lunch-prep candidate total-time cap
  ingredient_max: 10           # non-pantry ingredients ("about 8", configurable)
  # Pantry staples (seasonings, condiments, common aromatics, cooking liquids and
  # fats) are NOT counted toward ingredient_max -- the cap gauges how many real
  # distinct COMPONENTS a dish has, per the brief ("salt, pepper and oil not
  # counted"). Substring match against the ingredient text, case-insensitive.
  # This list only affects the ingredient-count filter, not the shopping list
  # (that uses Tandoor's food_onhand).
  pantry_staples:
    # salt / pepper / fats / oils
    - salt
    - pepper
    - black pepper
    - olive oil
    - extra-virgin olive oil
    - extra virgin olive oil
    - avocado oil
    - sesame oil
    - canola oil
    - vegetable oil
    - cooking spray
    - butter
    # sweeteners / baking
    - sugar
    - brown sugar
    - honey
    - maple syrup
    - flour
    - cornstarch
    - baking powder
    - baking soda
    - breadcrumbs
    - panko
    - egg
    # liquids
    - water
    - broth
    - stock
    - wine
    - vinegar
    - rice vinegar
    - rice wine
    - mirin
    - milk
    # condiments / sauces
    - soy sauce
    - tamari
    - hoisin
    - oyster sauce
    - fish sauce
    - worcestershire
    - sriracha
    - chili garlic
    - chili crisp
    - gochujang
    - dijon
    - mustard
    - mayonnaise
    - tomato paste
    - tahini
    # aromatics / herbs / spices (bought in small amounts, flavorings not components)
    - garlic
    - ginger
    - green onion
    - scallion
    - shallot
    - parsley
    - cilantro
    - basil
    - mint
    - dill
    - thyme
    - rosemary
    - chives
    - bay leaf
    - lemon juice
    - lime juice
    - lemon zest
    - garlic powder
    - onion powder
    - oregano
    - cumin
    - paprika
    - cinnamon
    - coriander
    - red pepper flakes
    - sesame seed
    - sesame seeds

# Recipe-candidate scoring. Bayesian average so a 5.0 with 3 reviews does not
# beat a 4.7 with 3000:  score = (C*m + n*r) / (C + n).
scoring:
  prior_m: 4.0                 # m: the prior mean rating
  prior_weight_C: 50           # C: how many prior reviews the prior is worth
  # Verdict thresholds use the RAW rating + count (the Bayesian score only
  # ranks candidates within a slot). Calibrated for the REACHABLE corpus
  # (2026-10-31): Allrecipes is out of scope -- it blocks bots with HTTP 402 on
  # purpose, so do not attempt it -- and the reachable sites (Taste of Home plus
  # the big recipe blogs: RecipeTin Eats, Skinnytaste, Well Plated, Cooking
  # Classy, Downshiftology, Love & Lemons, Natasha's Kitchen, iFoodReal, Jessica
  # Gavin, Wholesome Yum, The Clean Eating Couple) report far fewer reviews than
  # Allrecipes would. Thresholds lowered to match; the Bayesian prior still gates
  # a 5.0/3 below a 4.7/3000.
  good:        { min_rating: 4.6, min_count: 40 }
  acceptable:  { min_rating: 4.3, min_count: 10 }
  # Per-site count scaling: some sites report far more reviews than others, so
  # a count can be divided by this weight before the Bayesian blend to keep one
  # site from dominating. 1.0 = no scaling. Tune after the first refresh.
  site_count_weight:
    Allrecipes: 1.0
    "Food Network": 1.0
    EatingWell: 1.0
    "Simply Recipes": 1.0
    "BBC Good Food": 1.0
    "Serious Eats": 1.0
    "Taste of Home": 1.0
    Delish: 1.0
    "NYT Cooking": 1.0

# Per-week dinner shape (owner, §5c(4) revision 3; volume cut 2026-11-11). The
# generator enforces these counts and fails closed (PlanError) if the selected
# pool can't satisfy them.
# Owner 2026-11-11: FIVE cooked dinners a week, Sunday..Thursday; Friday and
# Saturday are leftovers / eat out and are planned as nothing (`off_nights`).
# The 7-dinner mix lost one chicken and one ground-beef dinner:
#   non-roast week (parity B): Sunday fish + 1 chicken + 1 ground beef + 1 flex (chicken) + 1 steak = 5
#   roast week     (parity A): Sunday fish + 1 chicken + 1 flex (pork) + 1 steak + Wednesday roast = 5
# The roast REPLACES the ground-beef dinner (see `roast`); the flex dinner
# alternates pork chop / chicken breast by week (see `flex`). Ground beef is
# still eaten every week: a dinner on B weeks, the beef stir-fry lunch prep on
# A weeks (lunches.beef_stir_fry). The chicken dinners are the ones that can be
# cooked at 4 servings for the next day's lunch (`lunches.leftovers`).
proteins:
  dinners_per_week: 5          # must equal 7 - len(off_nights) and the mix below
  off_nights: [friday, saturday]   # leftovers / eat out: no dinner planned
  fish: 1
  poultry: 1
  ground_beef: 1               # non-roast count; a roast week replaces it (-> 0)
  steak: 1
  legume_only_mains: 0         # owner 2026-10-31: no legume-ONLY mains (no meat/fish);
                               # beans/lentils/chickpeas AS AN INGREDIENT are fine
                               # (chicken+white-bean chili, black beans in a bowl, a
                               # chickpea side, hummus snack). Enforced in scoring.py.
  fish_day: sunday             # fish is Sunday dinner
  fish_parity:   { A: salmon, B: tuna }   # odd ISO week = salmon, even = tuna (kept)
  chicken_food: "chicken breast"   # poultry recipes must use ONLY this food

# Ground-beef variety (replaces the old Greek/Asian A/B rule). The generator
# picks the week's distinct beef dishes with no repeat within the week and at
# most one Asian-style dish (e.g. beef & broccoli). `beef-style` keyword values:
# Flex dinner: one dinner that alternates pork chop / chicken breast by week, to
# stretch the Amana ground beef (5-dinner week, 2026-11-11: ground-beef dinners
# average 0.5/wk plus the fortnightly beef stir-fry lunch). parity
# A -> rotation[0], parity B -> rotation[1]. A chicken flex must be a chicken
# dish not already used that week. Pork chops are fresh/weekly from New Pi.
# With the freezer inventory (`freezer`, below) the flex takes the other kind
# when the freezer cannot cover this week's (e.g. pork chops run out). A
# ground-beef flex when beef stock is high is still a later idea.
flex:
  enabled: true
  rotation: [pork, chicken]

beef:
  no_repeat_within_week: true
  max_asian_per_week: 1
  styles: [comfort, tex-mex, asian, italian, greek]
  # Feta now rides on the weekend eggs ("Weekly staples") every week; if a
  # Greek-style beef dish happens to be picked, it carries feta too (Tandoor
  # merges the line). No separate feta parity.

# Slow-cooker roast dinner on a busy weeknight, every other week (owner, from an
# Amana eighth share = 8 roasts ~3.5 lb each, ~16 weeks of fortnightly roasts).
# On a roast week the roast REPLACES the ground-beef dinner (the generator; the
# old "replaces a chicken" wording was stale). Roasts are Amana freezer stock (food_onhand) so they never hit the
# weekly list; only the recipe's pantry bits (ranch/au jus packets, pepperoncini,
# butter) are ordered. The 3.5 lb roast feeds more than one dinner for two, so
# the leftovers are planned as Thursday lunch (no extra beef ordered).
roast:
  enabled: true
  parity: A                    # roast weeks = parity A (odd ISO week) = every other week
  night: wednesday             # roast_night -- owner decision 2026-10-31 (may change)
  leftovers: thursday_lunch    # where the leftovers go (documented; no extra shopping)

sides:
  per_dinner: 1                # a rotating veg side per dinner...
  # ...unless the main already holds a vegetable (owner 2026-11-10; W46 put green
  # beans next to a broccoli stir fry). Decided from the main's Tandoor
  # ingredient foods: a whole-word match (plural ok) against `vegetables`;
  # optional garnish lines are ignored. Tandoor has no vegetable flag (its food
  # categories are store aisles, and Produce also holds garlic, herbs, lemons),
  # so the list lives here. Aromatics (onion, garlic, celery), mushrooms,
  # tomatoes/sauce and starchy potatoes are left out on purpose: a dish with only
  # those still gets a side.
  skip_when_main_has_veg: true
  vegetables:
    - broccoli
    - broccolini
    - green bean
    - haricot vert
    - carrot
    - cauliflower
    - zucchini
    - squash
    - asparagus
    - spinach
    - kale
    - cabbage
    - brussels sprout
    - bell pepper
    - snap pea
    - snow pea
    - pea
    - bok choy
    - eggplant
    - cucumber
    - lettuce
    - romaine
    - mixed greens
    - okra
    - artichoke
  no_repeat_within_week: true
  # Interim rule while the approved side pool is short of 7: allow a side to
  # repeat up to this many times in a week (used only when the pool can't fill
  # 7 distinct). Drops back to no-repeat once enough sides are approved.
  max_repeats_per_week: 2

# Rice side (owner 2026-11-10): a main (dinner or lunch prep) served over rice
# gets the brown-rice microwave-packet recipe (recipes/fixed.yaml; the weekly
# build creates it if missing) at the dish's servings, 1 packet per 2 servings,
# so the packets land on the Target list. Needs rice when the recipe carries
# `keyword`; otherwise, with `detect`, when it lists a serving-rice food
# (`serving_foods`) or a step says "serve over/with ... rice". A recipe that
# lists raw rice cooks its own and gets no side; tag a recipe `opt_out_keyword`
# to stop a wrong detection. Planned with the note "[gp:<wk>] side".
rice:
  enabled: true
  recipe: "Brown Rice (microwave packet)"
  keyword: serve-with-rice
  opt_out_keyword: no-rice-side
  detect: true
  serving_foods: [cooked rice, steamed rice, hot rice]

lunches:
  # Owner 2026-11-11: TWO prep batches of 4 (was 3), plus leftovers.
  # Lunch demand: 2 people x 7 days = 14 servings, minus Sunday (the prep day;
  # lunch at home from what is around, as before) = 6 lunch days x 2 = 12.
  #   Sunday prep (cooked during Sunday dinner)  4 servings -> Mon + Tue
  #   Thursday prep (cooked during Thursday dinner) 4       -> Fri + Sat
  #   Wednesday + Thursday lunch: leftovers, 2 servings each
  #     non-roast week: two `lunch-friendly` dinners (Tue + Wed night) cooked at 4
  #     roast week:     one lunch-friendly dinner (Tue night) + the Wednesday
  #                     roast's Thursday leftover lunch (roast.leftovers)
  #   4 + 4 + 2 + 2 = 12 = the week's demand, never more. A day the leftovers
  #   can't cover (no lunch-friendly recipe left, burger week took the chicken)
  #   is added to the latest prep before it (+2 servings), logged as a gap.
  recipes_per_week: 2
  servings_each: 4
  people: 2                    # servings per lunch day
  prep_days: [sunday, thursday]   # batch 1 on Sunday, batch 2 mid-week
  prep_day: sunday             # the first prep day (kept for older readers)
  days: [monday, tuesday, wednesday, thursday, friday, saturday]   # lunch days to cover
  # Bulk dinner -> next day's lunch: a dinner whose recipe carries `keyword` is
  # planned at `servings` (instead of 2) and the next day's Lunch is a leftover
  # entry of it (posted WITHOUT addshopping: the doubled dinner already ordered
  # it). Only chicken-slot dinners (poultry + a chicken flex) are filled from
  # these, and a lunch-prep recipe that carries the keyword can be drawn as that
  # dinner. The weekly build tags `recipes` with the keyword in Tandoor if they
  # lack it (run.ensure_setup, idempotent); tag more by hand in Tandoor.
  leftovers:
    enabled: true
    keyword: lunch-friendly
    servings: 4
    recipes:                   # owner 2026-11-11: chicken stir fry, sheet pan, orzo
      - "Chicken and Broccoli Stir Fry Recipe"    # fall
      - "Healthy Chicken Stir Fry"                # winter
      - "Chicken and Green Bean Stir-fry"         # summer
      - "Fall Chicken Sheet Pan Dinner"           # fall (a lunch prep too)
      - "Sheet Pan Lemon Chicken"                 # spring
      - "Mediterranean Chicken and Orzo"          # fall + spring (a lunch prep too)
  # A ground-beef stir fry as one of the 2 batches every other week, to eat up
  # the Amana share's ground beef (the share holds more ground than the dinners
  # use). Parity A = the roast weeks, which have no ground-beef dinner, so every
  # week has one ground-beef meal. Never the week's beef dinner. It is the
  # Thursday batch (the Sunday batch is the lunch-prep pick).
  beef_stir_fry:
    enabled: true
    parity: A
    recipes: ["Ground Beef and Broccoli Stir Fry", "Mediterranean Ground Beef Stir Fry",
              "Low Carb Philly Cheesesteak Bowl"]       # owner 2026-11-01

breakfast:
  staples_recipe: "Weekly staples"   # planned every week as Breakfast

# Freezer-limited recipes (owner 2026-11-01): the Amana order holds 2 x 4 lb
# short ribs and 2 x 2 lb tri-tip, so these recipes appear only on scheduled
# weeks (ISO week % every_n_weeks == offset) and are excluded otherwise.
#   short ribs: roast weeks are odd, so offset 1 every 12 weeks -> 2 per 24 weeks.
#   tri-tip fajitas: every 6 weeks -> 4 steak nights per 24 weeks (2 per tri-tip).
scheduled:
  - {tag: short-ribs, kind: roast, every_n_weeks: 12, offset: 1}
  - {tag: tri-tip,    kind: steak, every_n_weeks: 6,  offset: 3}

# Burger night (owner 2026-11-01): the eighth share's 5 patty packs (4 x 1/3 lb).
# Every 5th ISO week one CHICKEN dinner becomes "Burger night" (fixed.yaml), so
# 24 weeks use about 5 packs and the ground-beef balance is unchanged.
burger_night:
  enabled: true
  every_n_weeks: 5
  recipe: "Burger night"

# Owner 2026-11-11: ONE snack entry a week ("Snacks to buy"). The "Snack prep"
# entry is off; set prep_enabled: true to plan it again (the recipe stays in
# Tandoor and recipes/fixed.yaml).
snacks:
  buy_recipe: "Snacks to buy"
  prep_recipe: "Snack prep"
  prep_enabled: false
  per_person_per_day: [2, 3]   # sized to ~35/week for two

# Season by date (owner: by date). Months are 1-12.
seasons:
  spring: [3, 4, 5]
  summer: [6, 7, 8]
  fall:   [9, 10, 11]
  winter: [12, 1, 2]

# Store routing. Supermarket categories are namespaced "<store>/<cadence>: <aisle>"
# (§7.6). The job splits a shopping-list entry by the store prefix of its
# food.supermarket_category. Ambiguous foods fall back to the freshness rule;
# per-food overrides live in recipes/foods.yaml.
stores:
  order: [NewPi, Target, Costco, Amana, OConnell, Penzeys]
  # Which stores each run touches.
  weekly_stores: [NewPi, Target]
  # Costco-routed foods (Nurri shakes, frozen-salmon fallback) are on no run's
  # list since the Costco bulk run was dropped (owner 2026-11-04): bought by hand.
  bulk_stores: [Costco]        # kept for the shoplist "bulk" cadence; no scheduled run
  # Freezer stock: bought in bulk ahead of time and kept frozen, so it is marked
  # on hand and never appears on a weekly list. Amana = the eighth beef share;
  # OConnell = O'Connell Organic Acres chicken breast + boneless pork chops
  # (owner 2026-11-01), delivered frozen by the farm van on the Iowa City route
  # (3rd Monday monthly) or FedEx. `grocery.run --freezer` sizes the orders.
  # Penzeys = spices (owner 2026-11-01): pantry stock, restocked online.
  stock_stores: [Amana, OConnell, Penzeys]
  # Default by shelf life when a food has no explicit override.
  default_fresh: NewPi         # ambiguous perishable -> New Pi
  default_shelf_stable: Target # ambiguous shelf-stable -> Target
  # Aisle order within each store (namespace suffix after "<store>/<cadence>: ").
  aisles:
    NewPi:   [Produce, "Meat & Seafood", "Dairy & Eggs", Bakery, Bulk, Other]
    Target:  ["Pantry & Grains", Canned, "Oils & Spices", Condiments, Dairy, Frozen, Snacks, Other]
    Costco:  ["Freezer", "Pantry Bulk", "Snacks Bulk", Other]
    Amana:   ["Freezer Beef", Other]
    OConnell: ["Freezer", Other]
    Penzeys: [Spices, Other]

# Thaw lead times (groceries page, Thaw tab): how long before a meal a
# freezer-stock food (Amana beef, O'Connell chicken/pork, Costco frozen salmon)
# must move from the freezer to the fridge. Key = a food-name substring (the
# LONGEST match wins, like foods.yaml), value = hours ("24h") or days ("2d");
# `default` covers every other freezer food. Counted back from the meal time
# (breakfast 08:00, lunch 12:00, dinner 18:00). Read by the dashboard mealplan
# sidecar (mounted read-only): redeploy the dashboard stack after an edit.
thaw:
  default: 24h
  ground beef: 24h
  chops: 24h
  chicken breast: 24h
  roast: 48h
  salmon: 12h

# Freezer inventory (owner design 2026-11-11). Counts live in ONE JSON file on
# kdk-dkr-01, /opt/kdk-lab/dashboard/pantry/freezer.json (mounted at /pantry in
# the dashboard sidecar, which edits it on the groceries Pantry tab, and in this
# job). The weekly build: (a) never picks a dinner/lunch the freezer is short
# for (owner 2026-11-11: "never pick a dinner whose protein count is short").
# The skipped recipes are logged as freezer_short_pick. When no recipe for a
# dinner slot fits, the slot is tried with another protein that has stock, in
# the `fallback` order below (steak -> ground beef -> poultry -> fish; the
# other slots walk the ladder back first), keeping the week's rules (no repeat,
# <= max_asian Asian-style beef, scheduled cuts only on their weeks), logged as
# freezer_fallback. Nothing fits -> that dinner is left unplanned (one more
# night off) and logged as freezer_short_slot with the cuts checked and their
# counts. A lunch prep with nothing in stock is left unplanned the same way.
# The build never fails over the freezer. A cut in freezer.json that no `map`
# key points at (e.g. an old tuna/salmon row, snack sticks) is ignored by the
# planner and logged once per build as freezer_unknown_cut. (b) fish parity
# yields to a fish in stock (only if a fish cut is ever mapped again); (c)
# prefers the cut with the most stock; (d) after writing the plan, decrements
# what it reserved (freezer_reserved event; the Thaw tab lists them). File
# missing/unreadable -> planned exactly as before (freezer_inventory_missing).
# `map`: Tandoor food-name substring -> cut id in freezer.json; the LONGEST key
# that is part of the food name wins. A freezer-aisle food with no key logs
# freezer_unmapped and counts as available. Units per cut are in the file:
# portion (steaks, fillets, patties), lb (ground beef, roasts, stew meat, fajita
# strips, brats), package (O'Connell packs until portions_per_package is set).
freezer:
  enabled: true
  map:
    filet mignon: filet-mignon
    ribeye: ribeye
    rib eye: ribeye
    new york strip: ny-strip
    strip steak: ny-strip
    sirloin tip steak: sirloin-tip-steak
    sirloin steak: sirloin-steak
    top sirloin: sirloin-steak
    sirloin tip roast: sirloin-tip-roast
    chuck roast: chuck-roast
    arm roast: arm-roast
    rump roast: rump-roast
    ground beef: ground-beef
    ground beef patt: burger-patties     # "ground beef patties" (Burger night)
    stew meat: stew-meat
    fajita strips: fajita-strips
    # Flank / skirt steak recipes (Grilled Chimichurri Flank Steak, Steak
    # Fajitas, Mongolian Beef) are cooked with the share's fajita strips
    # (2026-11-11; read-only check of the live Tandoor food names).
    flank steak: fajita-strips
    skirt steak: fajita-strips
    brat: brats
    cheddar brat: brats-cheddar
    # No fish (owner 2026-11-11): tuna and salmon are bought fresh from New Pi
    # as needed, so fish dinners are never limited by the freezer.
    chicken breast: chicken-breast
    pork chop: pork-chops
    bacon: bacon
  # Protein ladder for a dinner slot the freezer cannot cover (generator
  # FALLBACK_DEFAULT; listed here so the order is a config edit). Kinds:
  # steak, ground_beef, chicken (poultry), fish, pork (flex), roast.
  fallback:
    steak: [ground_beef, chicken, fish]
    ground_beef: [steak, chicken, fish]
    chicken: [ground_beef, steak, fish]
    fish: [chicken, ground_beef, steak]
    pork: [chicken, ground_beef, steak, fish]
    roast: [ground_beef, steak, chicken, fish]

# Days with no cooking at all (owner fills it: holidays, travel). ISO dates,
# e.g. "2026-11-26". On a skip day the build plans no dinner, no lunch prep and
# no leftovers: the week's mix is picked as usual and the dinner that lands on
# that day is dropped. Lunch days shrink with it (2 people x the lunch days
# left): no prep batch on a skipped prep day, no dinner cooked at 4 for a
# skipped lunch day, and a lunch day nothing covers goes to the prep before it
# (lunch_gap). Dates outside the planned week are ignored.
skip_days: []

# Standing orders: what an order adds to the freezer when it arrives (the
# "Order arrived" button on the Pantry tab's Freezer section adds these counts;
# "undo last change" restores the .bak). Amounts in each cut's unit. No prices.
standing_orders:
  oconnell:
    label: "O'Connell"
    cadence: "monthly, ships the 3rd"
    items:
      chicken-breast: 16      # packages, ~1.1 lb = 2 breasts each (portions_per_package: 2)
      pork-chops: 4           # packages, ~1 lb = 2 chops each (portions_per_package: 2)
      bacon: 5                # packages
      snack-sticks: 4         # beef + cheddar snack sticks (not a meal protein)
  amana:
    label: "Amana"
    cadence: "beef share, as ordered"
    # The two lists the owner pasted 2026-11-11 (large box + the smaller second
    # delivery), summed. Trim to the next order's list when it changes.
    items:
      ribeye: 6               # 12 oz x4 + 10 oz x2
      ny-strip: 6             # 10 oz
      filet-mignon: 2         # 8 oz
      sirloin-steak: 4        # 10 oz
      sirloin-tip-steak: 4    # 10 oz
      arm-roast: 8.75         # lb: 3.5 x2 + 1.75
      rump-roast: 10.5        # lb: 3.5 x2 + 1.75 x2
      sirloin-tip-roast: 7    # lb: 3.5 x2
      chuck-roast: 12.25      # lb: 3.5 x2 + 1.75 x3
      ground-beef: 30         # lb
      burger-patties: 20      # 5 packs of 4 x 1/3 lb
      brats: 1                # lb (5 ct)
      brats-cheddar: 1        # lb (5 ct)
      fajita-strips: 2        # lb
      stew-meat: 2            # lb

# Owner review gate. When on, the seed imports ONLY recipes the owner approved
# (approved: true on a candidate, or owner_pick: true), and the generator draws
# only from them. rejected_by_owner candidates are never chosen;
# pending_owner_approval candidates show in the review but are not used until
# approved. Off = fall back to the scored default pick.
require_owner_approval: true

# Ingredients the owner removed entirely (2026-11-01). The scorer rejects any
# candidate whose title or ingredients contain one of these, in every season.
exclude_ingredients:
  - radish
  - beet
  - arugula

# Foods the household never buys (owner 2026-11-11). A shopping line whose
# food name CONTAINS one of these (case-insensitive substring; a trailing "s" is
# optional, so "brussels sprouts" also hits "brussels sprout") never reaches a
# store list: grocery/shoplist.py drops it and counts it as `skipped_never_buy`
# on the `planned` log event; the groceries page hides it; the kitchen page
# shows it struck through with a "skip" mark. Only recipe lines: a food added by
# hand on the page (add box) is still listed. A recipe whose TITLE holds one is
# left out of the plan (e.g. Roasted Cabbage Steaks), and the side rule does not
# count it as the main's vegetable. `python -m grocery.cleanup --optional-review`
# lists these lines for removal from the recipes.
never_buy:
  - brussels sprouts
  - cabbage
  - red cabbage

# Approvals (Vikunja + HA). The job contract is docs/runbooks/approval-tasks.md.
# Foods that must NEVER reach a store list, even if a recipe pulls one in. Dog
# food is a JustFoodForDogs subscription; pets are budgeted in Actual, not
# ordered here. Matched as a case-insensitive substring of the food name by the
# list builder (grocery/shoplist.py) and the grocery page.
exclude:
  - dog food
  - pet food
  - dog treats

# Weekly cadence times (owner 2026-11). New Pi now DELIVERS on Saturday and needs
# 2-3 days lead time, so New Pi orders must go in by Wednesday night. The crons
# in komodo/resources.toml mirror these (kept off the gitops :00/:15/:30/:45
# slots). Plan week stays Sunday->Saturday, for the week AFTER the Saturday
# delivery.
schedule:
  build: { weekday: tuesday,  time: "18:03" }   # plan + two-store list + approval task
  poll:  { weekday: thursday, time: "07:05" }   # read the decision; page shows approved lists

approvals:
  vikunja_url: "https://tasks.kmkdp.com"
  weekly:
    # One combined task; <=3 mutually-exclusive buttons.
    choices: "all=Approve both; newpi=New Pi only; target=Target only"
    due_weekday: wednesday     # New Pi order must go in by Wednesday night
    due_hour: 20               # Wednesday 20:00 CT
    reminder_hour: 12          # Wednesday noon reminder (same day)
    # Target Drive Up has no lead time; it is still ordered Friday night for the
    # Saturday delivery, from the same approved list.
  # Poll in SEPARATE scheduled passes (Thursday 07:05, 12:05, 17:05), not a long
  # blocking wait: the build pass runs Tuesday 18:03 and exits; each poll pass
  # reads the decision and applies it (idempotent).
  poll_timeout_min: 10         # bounded in-run poll before handing off to the next pass
