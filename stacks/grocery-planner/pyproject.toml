[project]
name = "grocery-planner"
version = "0.1.0"
description = "kdk-lab weekly grocery planner one-shot (Tandoor meal plan + two-store shopping list)"
requires-python = "==3.12.*"
dependencies = [
    "requests==2.33.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
