  # seed marks these food_onhand so the weekly list skips them (bought on the
  # share reorder, not the weekly New Pi run). Longest-match routing means
  # "ground beef" and "beef" both land here, not Target.
  - {match: ground beef,        category: "Amana/bulk: Freezer Beef"}
  - {match: beef,               category: "Amana/bulk: Freezer Beef"}
  - {match: sirloin,            category: "Amana/bulk: Freezer Beef"}
  - {match: flank,              category: "Amana/bulk: Freezer Beef"}
  - {match: steak,              category: "Amana/bulk: Freezer Beef"}
