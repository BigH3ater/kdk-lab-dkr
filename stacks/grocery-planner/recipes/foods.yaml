# Food -> store routing for the seed. Each entry maps a food-name substring
# (case-insensitive) to a Tandoor supermarket-category, namespaced
# "<store>/<cadence>: <aisle>" (see config.yaml stores + docs/runbooks).
#
# The seed assigns a food's supermarket_category from the LONGEST matching rule
# (most specific wins, e.g. "tuna steak" beats "steak"; file order doesn't matter).
# A food matching nothing falls back to the freshness default
# (stores.default_fresh / default_shelf_stable) with aisle "Other" and is logged
# for the owner to place by hand (the assignment then sticks in Tandoor).
#
# Owner routing (§6): produce + all fresh proteins + fresh fish + chicken breast
# weekly -> New Pi; grains/canned/oils/spices/shelf-stable + Chobani -> Target;
# bulk frozen proteins + bulk pantry -> Costco (no run lists it since the bulk
# run was dropped 2026-11-04; bought by hand); beef eighth share ->
# Amana freezer stock (Phase 2 reorder).  Ambiguous fresh -> New Pi, ambiguous
# shelf-stable -> Target. Move a food's category once in Tandoor to override.
#
# New Pi product links (optional): a NewPi rule may carry `newpi_url` (and an
# optional `newpi_note` with the size/brand that disambiguates the pick), e.g.
#   - {match: spinach, category: "NewPi/weekly: Produce",
#      newpi_url: "https://market.newpi.coop/product/39574", newpi_note: "organic baby spinach, 5 oz"}
# The groceries page (home.kmkdp.com/meal/groceries) reads this same file
# (mounted read-only into the dashboard mealplan sidecar) and turns the matching
# New Pi line into a tap-to-order link via the SAME longest-match rule the seed
# uses to route the food -- so the link always comes from the rule that put the
# food at New Pi. A food with no newpi_url just shows a small "no link yet"
# marker. New Pi runs the Local Food Marketplace storefront (a JS app); product
# ids are global and share-safe (`/product/<id>` resolves after a one-time store
# pick). Find an id with scripts/newpi_lookup.py or by opening the product in the
# app and copying its URL. Add links only when you are sure of the product --
# a wrong link is worse than none, and this repo is public (no prices here).
#
# Buy units (optional): `buy:` turns the summed recipe amounts into ONE store
# amount on the groceries page. `unit` is what the store sells; every other key
# is how much of that recipe unit makes ONE of it, e.g.
#   buy: {unit: head, clove: 10, tsp: 10}   # 1 head = 10 cloves; 1 clove = 1 tsp minced (1 Tbsp = 3 cloves)
# Keys: tsp/tbsp/cup, oz/lb/g/kg, each, or a free unit name (clove, bag, block).
# Weight units round up to the next 1/4, everything else to the next whole; a
# recipe unit with no key stays listed as-is. See docs/runbooks/grocery-planner.md.
rules:
  # ---- New Pi: weekly perishables ----
  # Chicken breast and pork chops: O'Connell Organic Acres freezer stock (owner
  # 2026-11-01). 2 breasts / about 1.1 lb a pack; boneless chops 2 / about 1 lb a
  # pack. each_lb converts recipe counts ("3 chicken breasts") to pounds.
  - {match: chicken breast,     category: "OConnell/monthly: Freezer", pack_lb: 1.1, each_lb: 0.55}
  - {match: chicken,            category: "NewPi/weekly: Meat & Seafood"}
  # Pork chops: fresh/weekly at New Pi (the flex dinner's pork weeks).
  - {match: pork chop,          category: "OConnell/monthly: Freezer", pack_lb: 1.0, each_lb: 0.5}
  - {match: pork loin chop,     category: "OConnell/monthly: Freezer", pack_lb: 1.0, each_lb: 0.5}
  - {match: salmon,             category: "NewPi/weekly: Meat & Seafood"}
  # Tuna at New Pi is frozen, salmon is fresh -- both ordered weekly from New Pi
  # as needed (tuna is NOT a Costco bulk item, and neither is freezer stock:
  # owner 2026-11-11). The 1-2 day fresh-fish timing rule applies to salmon
  # only; tuna weeks have no timing constraint.
  - {match: tuna,               category: "NewPi/weekly: Meat & Seafood"}
  - {match: frozen tuna,        category: "NewPi/weekly: Meat & Seafood"}
  - {match: ahi,                category: "NewPi/weekly: Meat & Seafood"}
  # Fish sold as "steaks" must beat the beef `steak` rule below (longest match).
  - {match: tuna steak,         category: "NewPi/weekly: Meat & Seafood"}
  - {match: ahi tuna steak,     category: "NewPi/weekly: Meat & Seafood"}
  # "tuna (yellowfin tuna) steaks": "tuna steak" is not a substring of it, so
  # "steak" (Amana beef) won before this rule (2026-11-11).
  - {match: yellowfin tuna,     category: "NewPi/weekly: Meat & Seafood"}
  - {match: salmon steak,       category: "NewPi/weekly: Meat & Seafood"}
  - {match: swordfish steak,    category: "NewPi/weekly: Meat & Seafood"}
