  italian seasoning: []
  minced ginger: []
  cabbage: [of cabbage]
  corn kernels: [of corn, frozen or fresh corn kernels]

# Pantry staples: marked on hand (food_onhand), so Tandoor leaves them off the
# shopping list. Restock them from the manual list on the groceries page.
# Untick "on hand" on a food in Tandoor to put it back on the list.
pantry:
  [salt, salt and pepper, black pepper, black peppercorns, olive oil, vegetable oil,
   avocado oil, cooking oil, peanut oil, sesame oil, oil, soy sauce, oyster sauce,
   worcestershire sauce, dijon mustard, garlic powder, onion powder, paprika,
   smoked paprika, cumin, chili powder, dried oregano, oregano, dried basil,
   dried thyme, dried parsley, dried rosemary, dried marjoram, italian seasoning,
   cayenne pepper, red pepper flakes, ground cinnamon, coriander, sugar, brown sugar,
   honey, maple syrup, cornstarch, flour, all-purpose flour, balsamic vinegar,
   red wine vinegar, rice vinegar, apple cider vinegar, sesame seeds, water, ice,
   ketchup, mayonnaise, dry mustard powder, minced ginger, bay leaves]

# Lines that aren't something to buy (a "serve with" heading imported as a
# food). Marked ignore_shopping.
not_food: [nothing, optional, toppings as desired, leaves, diced,
           # sub-recipes listed as an ingredient (made from their own recipe)
           sauce vierge, best chicken marinade]
