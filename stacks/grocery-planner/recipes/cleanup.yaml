  sesame seeds: [toasted sesame seeds, white sesame seeds]
  chicken broth: [low sodium chicken broth, chicken stock]
  beef broth: [beef broth/stock, lower sodium beef broth]
  ginger: [fresh ginger, piece fresh ginger, inch ginger]
  green onions: [scallions, green onion]
