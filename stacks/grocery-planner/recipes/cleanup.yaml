  maple syrup: [pure maple syrup]
  brown sugar: [light brown sugar, packed light-brown sugar]
  sugar: [granulated sugar]
  cornstarch: [corn starch]
  red pepper flakes: [crushed red pepper flakes, red chili flakes]
  cayenne pepper: [cayenne, pinch cayenne pepper]
  paprika: [ground paprika]
  cumin: [ground cumin, each cumin]
  mushrooms: [white button mushrooms, baby bella mushrooms]
  rice vinegar: [rice wine vinegar]
  tzatziki: [tzatziki sauce]
  sour cream: [2% sour cream or greek yogurt, sour cream or greek yogurt]
  kidney beans: [can kidney beans]
  spinach: [baby spinach, box baby spinach, chopped fresh spinach]
  ground beef: [lean ground beef, beef mince]
