# Fall recipe candidates (real published recipes; ratings read from each
# page's schema.org data on checked_on). We do NOT store recipe text -- only the
# URL + public rating, so the seed imports via Tandoor recipe-from-source.
# Scoring/verdict are COMPUTED from config.yaml by grocery/candidates.py.
#
# Provenance (2026-10-31, revision 2): refreshed from the reachable corpus
# (Allrecipes is out of scope -- HTTP 402 bot block). Sources: Taste of Home +
# RecipeTin Eats, Skinnytaste, Well Plated, Cooking Classy, Downshiftology,
# Love & Lemons, Natasha's Kitchen, iFoodReal, Jessica Gavin, Wholesome Yum,
# The Clean Eating Couple, foodiecrush, The Lemon Bowl. Set `selected: true` to
# override the default (top-scoring good/acceptable) pick for a slot.
