# Spring recipe candidates (real published recipes; ratings read from each
# page's schema.org data on checked_on). We do NOT store recipe text -- only the
# URL + public rating, so the seed can import via Tandoor recipe-from-source.
#
# Scoring (Bayesian) and the good/acceptable/rejected verdict are COMPUTED from
# config.yaml by grocery/candidates.py -- not stored here -- so a config change
# or a `refresh` re-rates without editing this file.
#
# Provenance note (2026-10-31): the automated research pass could not reach
# several high-traffic sites (Allrecipes, EatingWell, Simply Recipes, Serious
# Eats, BBC Good Food, Delish) and Food Network / Taste of Home did not expose a
# star value to it, so many candidates here are lower-count blog recipes. The
# owner can add higher-count candidates by hand (Tandoor's own importer fetches
# server-side and is not blocked) and re-run `refresh`. Set `selected: true` on
# the candidate to import for a slot; otherwise the top-scoring good/acceptable
# candidate is the default.
