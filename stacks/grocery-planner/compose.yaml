# grocery-planner: weekly meal-plan + shopping-list builder on kdk-dkr-01.
#
# One-shot job (deploy=false; run by the grocery-weekly / grocery-weekly-poll
# procedures via destroy_before_deploy, like cloudflare-watch). It
# logs into Tandoor (recipes.kmkdp.com, session auth -- the dashboard mealplan
# sidecar's django-allauth pattern), generates next week's plan under the owner
# rules, builds the New Pi + Target shopping list from the plan minus on-hand
# items, and creates ONE combined Vikunja approval task (job contract:
# docs/runbooks/approval-tasks.md). Home Assistant pages the phone; the owner
# approves per store. The grocery page (home.kmkdp.com/meal/groceries, served by
# the dashboard sidecar) renders the lists and writes ticks back to Tandoor.
#
# Two Komodo stacks share this compose, distinguished by `environment`:
#   grocery-weekly       Tue 18:03  GROCERY_MODE=weekly             (plan + list + task)
#   grocery-weekly-poll  Thu 07:05/12:05/17:05  GROCERY_POLL=1 GROCERY_SUFFIX=-poll (read decision)
# Two one-shots can't share a container name on one host, so GROCERY_SUFFIX keeps
# them distinct. Komodo writes `environment` to .env and pre_deploy APPENDS the
# op-rendered secrets (.env.op), so .env carries both (never overwrite it).
# A one-shot exits in seconds, before Alloy's discovery.docker (running
# containers only) can scrape it, so the job also pushes its JSON lines to Loki
# itself (LOKI_URL): {job="grocery-planner", container="grocery-planner<suffix>"}.
#
# Image is built locally (kdk/grocery-planner) -> the stack sets auto_pull=false
# + run_build=true in komodo/resources.toml (a compose pull of a local kdk/* tag
# fails). The OWNER seeds Tandoor once, after reviewing the recipe candidates,
# with:  docker compose -f stacks/grocery-planner/compose.yaml run --rm \
#           grocery grocery.seed --apply
name: grocery-planner

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  restart: "no"            # one-shot; run periodically by the procedures
  pids_limit: 128
  mem_limit: 256m
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  grocery:
    <<: *hardened
    build:
      context: .
      provenance: false     # stable image id across cached builds (containerd store)
    image: kdk/grocery-planner:latest
    container_name: grocery-planner${GROCERY_SUFFIX:-}
    init: true              # python one-shot: tini forwards SIGTERM, reaps children
    user: "1000:1000"
    env_file: [.env]        # GROCERY_* (Komodo) + TANDOOR_USER/PASS, VIKUNJA_TOKEN, VIKUNJA_APPROVALS_PROJECT (op, appended)
    environment:
      TZ: America/Chicago
      TANDOOR_URL: "https://recipes.kmkdp.com"
      GROCERY_MODE: "${GROCERY_MODE:-weekly}"
      GROCERY_POLL: "${GROCERY_POLL:-}"
      GROCERY_SUFFIX: "${GROCERY_SUFFIX:-}"            # -> the Loki `container` label
      LOKI_URL: "${LOKI_URL:-http://10.1.20.21:3100}"   # direct push (kdk-log-01); empty disables
      NODE_NAME: "${NODE_NAME:-kdk-dkr-01}"             # host label on the Loki stream
    volumes:
      # Freezer inventory (owner design 2026-11-11), the dashboard's Pantry-tab
      # file. The build reads it to plan only what the freezer covers and, after
      # writing the plan, decrements what the week reserved (atomic tmp + rename,
      # .bak kept) -- so read-write, not read-only. The rootfs stays read_only.
      # Missing file = the build plans as before (freezer_inventory_missing).
      - /opt/kdk-lab/dashboard/pantry:/pantry
    labels:
      kdk.baseline.skip: "healthcheck"   # one-shot job, no long-running endpoint
