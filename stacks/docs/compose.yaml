# Quartz docs site. The builder runs ONCE per deploy (Komodo webhook redeploys
# on push to main), building ../../docs from the repo clone into a shared
# volume that nginx serves at docs.kmkdp.com.
#
# Branding: ./theme/ overlays the pinned Quartz clone with the Kodiak design
# system (Homelab/Brand.md) — quartz.config.ts sets the palette + fonts and
# custom.scss adds the bear mark and interaction states. The overlay is copied
# in AFTER npm ci and BEFORE the build. Keep quartz.config.ts in sync with the
# pinned v4.5.2 tag below if that tag is bumped.
name: docs
services:
  builder:
    image: node:26.13.0-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apt-get update -qq && apt-get install -y -qq git librsvg2-bin >/dev/null
        # Idempotent: after an unclean host reboot Docker restarts this same
        # container, /q still exists and `git clone` fails forever (14 restarts
        # on 2026-10-26). Start from a clean tree every run.
        rm -rf /q
        git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz /q
        cd /q && npm ci --no-audit --no-fund
        rm -rf content && cp -a /content content
        # Kodiak branding overlay (palette + fonts + bear mark / states).
        cp /theme/quartz.config.ts /q/quartz.config.ts
        cp /theme/custom.scss /q/quartz/styles/custom.scss
        cp /theme/variables.scss /q/quartz/styles/variables.scss
        # Kodiak favicon: rasterize the bear mark over Quartz's default icon.png.
        # Best-effort -- a rasterize failure falls back to the stock favicon and
        # must never break the site build.
        rsvg-convert -w 512 -h 512 /theme/icon.svg -o /q/quartz/static/icon.png || true
        npx quartz build -d content -o /site/new
        rm -rf /site/current.old
        [ -d /site/current ] && mv /site/current /site/current.old || true
        mv /site/new /site/current
        rm -rf /site/current.old
        # Stay resident so Komodo sees the stack up, but exit 0 on SIGTERM so the
        # 6-hourly publish-docs rebuild (DestroyStack) doesn't SIGKILL us with
        # code 137 -- which docker-event-watch was paging on as a false "container
        # down" (00:05/06:05/12:05/18:05).
        echo BUILD-DONE; trap 'exit 0' TERM INT; sleep infinity & wait
    volumes:
      - ../../docs:/content:ro
      - ./theme:/theme:ro
      - site:/site
  nginx:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.docs.rule: "Host(`docs.kmkdp.com`)"
      traefik.http.services.docs.loadbalancer.server.port: "80"
      # Recreate nginx on an nginx.conf change. It is a single-file bind mount:
      # nginx reads it only at start and git swaps the file's inode on pull, so a
      # normal `up -d` keeps the old config (it only self-heals on the 6-hourly
      # publish-docs destroy+deploy). DOCS_NGINX_SHA = sha256(nginx.conf) from the
      # Komodo pre_deploy changes with content and forces the recreate on deploy.
      kdk.config-sha: "${DOCS_NGINX_SHA:-unset}"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - site:/site:ro
    networks: [default, proxy]
volumes:
  site: {}
networks:
  default: {}
  proxy:
    external: true
