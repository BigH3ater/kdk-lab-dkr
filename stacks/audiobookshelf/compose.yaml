# Audiobookshelf on the DMZ node -- internet-facing via the Cloudflare tunnel,
# SSO via Authelia OIDC (client_id `audiobookshelf`). NOT behind forwardauth:
# OIDC (and ABS's own auth) is the gate, and forwardauth would break the mobile
# apps. Reads the audiobook library read-only from the media NFS (dmz-01 mounts
# /mnt/media ro). Podcasts live on the rw appdata NFS (/mnt/appdata/audiobookshelf/
# podcasts, tankz3) because ABS must WRITE them (RSS auto-download), the DMZ media
# mount is read-only, and the 59 GB root disk was filling up (7.5 GB of episodes,
# moved 2026-10-28). config + metadata (the SQLite DB) stay on local disk. Official upstream
# image (runs as root, listens on :80). dns-reconcile points
# audiobookshelf.kmkdp.com at the DMZ Traefik (192.168.191.20) from the Host label.
name: audiobookshelf
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      TZ: America/Chicago
      # ABS is HARD-BUILT for the /audiobookshelf base path: index.js defaults
      # ROUTER_BASE_PATH to '/audiobookshelf' and the client assets are baked with
      # that prefix (base href + all /_nuxt, /api, icon URLs) with NO runtime
      # rewrite. Serving at true root breaks the client (assets 404). So we keep the
      # native /audiobookshelf base path. The server's request-prefix middleware
      # still lets the bare domain (/) resolve, and OIDC works: the callback is
      # built from the (empty) "Subfolder for Redirect URLs" field = /auth/openid/
      # callback (root), which Authelia has registered and the middleware prefixes.
      ROUTER_BASE_PATH: "/audiobookshelf"
    volumes:
      - /opt/kdk-lab/audiobookshelf/config:/config
      - /opt/kdk-lab/audiobookshelf/metadata:/metadata
      - /mnt/media/books/audiobook:/audiobooks:ro   # Chaptarr-managed, read-only
      - /mnt/appdata/audiobookshelf/podcasts:/podcasts   # rw NFS (media NFS is ro); ABS writes here
    networks: [proxy-dmz]
    labels:
      traefik.enable: "true"
      traefik.http.routers.audiobookshelf.rule: "Host(`audiobookshelf.kmkdp.com`)"
      # LAN only: never on the Cloudflare tunnel entrypoint (docs/services/dmz-proxy.md).
      traefik.http.routers.audiobookshelf.entrypoints: "websecure"
      traefik.http.services.audiobookshelf.loadbalancer.server.port: "80"
networks:
  proxy-dmz:
    external: true
