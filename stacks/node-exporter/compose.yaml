# Host metrics for the two new VMs (kdk-dkr-01, kdk-dkr-dmz-01). The three Pis
# already run node_exporter as a system package, so this stack is NOT deployed
# there. Prometheus on kdk-mon-01 scrapes :9100 on every host uniformly.
name: node-exporter
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      # Host VLAN address only, not every interface (hosts report C-02/H-02):
      # BIND_IP per host in komodo/resources.toml. Prometheus on mon-01 scrapes
      # 10.1.20.20:9100 / 192.168.191.20:9100.
      - "--web.listen-address=${BIND_IP:?set BIND_IP per host in komodo/resources.toml}:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    network_mode: host          # binds host ${BIND_IP}:9100
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
