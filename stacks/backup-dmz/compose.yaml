# Nightly one-shots on kdk-dkr-dmz-01: pg dumps + app state -> tankz3/backup.
# Offsite is centralized in the backup-offsite stack on kdk-dkr-01 (this host's
# tree lands on the shared NFS mount, so offsite ships it from there).
# The `gate` service forces Komodo's DeployStack to block until the rsync (and
# its pg_dump deps) finish -- up -d does not wait for terminal one-shots. All
# workers exit 0 (best-effort); backup-verify checks the dumps + marker and is
# the single Pushover alert source.
name: backup-dmz
services:
  pgdump-authelia:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: "no"
    environment:
      PGPASSWORD: "${AUTHELIA_POSTGRES_PASSWORD}"
    command: >
      sh -c 'pg_dump -h authelia-postgres -U authelia authelia
      | gzip > /dest/authelia-$$(date +%F).sql.gz
      && ls -t /dest/authelia-*.sql.gz | tail -n +15 | xargs -r rm; exit 0'
    volumes:
      - /mnt/backup/dkr/kdk-dkr-dmz-01/pgdump:/dest
    networks: [identity_default]

  pgdump-immich:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: "no"
    environment:
      PGPASSWORD: "${IMMICH_DB_PASSWORD}"
    command: >
      sh -c 'pg_dump -h immich-postgres -U immich immich
      | gzip > /dest/immich-$$(date +%F).sql.gz
      && ls -t /dest/immich-*.sql.gz | tail -n +15 | xargs -r rm; exit 0'
    volumes:
      - /mnt/backup/dkr/kdk-dkr-dmz-01/pgdump:/dest
    networks: [immich_internal]

  rsync:
    image: instrumentisto/rsync-ssh:alpine3.23-r3@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    restart: "no"
    depends_on:
      pgdump-authelia: { condition: service_completed_successfully }
      pgdump-immich: { condition: service_completed_successfully }
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rsync -a --delete \
          --exclude 'immich/postgres' --exclude 'identity/postgres' \
          --exclude 'dmz-proxy/letsencrypt' --exclude 'stacks/' \
          --exclude 'jellyfin/config/data/metadata' \
          --exclude 'jellyfin/config/cache' \
          --exclude 'audiobookshelf/podcasts' \
          --exclude 'jellyfin/config/data/transcodes' \
          /src/ /dest/kdk-dkr-dmz-01/state/
        rc=$$?
        if [ $$rc -eq 0 ] || [ $$rc -eq 24 ]; then touch /dest/kdk-dkr-dmz-01/.last-backup; else echo "rsync failed rc=$$rc"; fi
        exit 0
    volumes:
      - /opt/kdk-lab:/src:ro
      - /mnt/backup/dkr:/dest

  gate:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: "no"
    depends_on:
      rsync: { condition: service_completed_successfully }
    command: ["true"]

networks:
  identity_default:
    external: true
  immich_internal:
    external: true
