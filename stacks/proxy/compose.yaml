# Internal Traefik on kdk-dkr-01. Wildcard *.kmkdp.com via Cloudflare DNS-01.
# Other stacks join the external "proxy" network and declare traefik labels.
name: proxy
services:
  traefik:
    image: traefik:v3.7.16
    container_name: traefik
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - "--providers.docker=true"
      # Docker API via the read-only socket proxy below (security batch 7), not
      # the socket itself: a Traefik compromise no longer means host root.
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=cf"
      - "--entrypoints.websecure.http.tls.domains[0].main=kmkdp.com"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.kmkdp.com"
      - "--certificatesresolvers.cf.acme.dnschallenge=true"
      - "--certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cf.acme.email=admin@kmkdp.com"
      - "--certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # JSON access log to stdout -> Alloy -> Loki ({container="traefik"} | json),
      # read by the Grafana "Traffic Access Logs" dashboard. Headers are dropped
      # except the ones the dashboard uses.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
    environment:
      CF_DNS_API_TOKEN: "${CLOUDFLARE_DNS_API_TOKEN}"
    ports:
      # VLAN 20 address only (hosts report C-02): not the storage NIC, not docker0.
      # LAN, tailnet (routed to 10.1.20.20) and DMZ->443 all arrive on this address.
      - "10.1.20.20:80:80"
      - "10.1.20.20:443:443"
    volumes:
      - /opt/kdk-lab/proxy/letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro
    networks: [proxy, sockproxy]
    depends_on: [socket-proxy]
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Read-only Docker API for Traefik's docker provider (security batch 7; hosts
  # report M-03). The only docker.sock mount in this stack. Traefik v3.7's docker
  # provider calls /version, /events, /containers/json and /containers/{id}/json
  # -- CONTAINERS + EVENTS + VERSION (+ PING for negotiation); no NETWORKS.
  # GET/HEAD only (POST=0). Everything else stays at the image default 0.
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: traefik-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      # The internal network has no IPv6; bind 0.0.0.0:2375 instead of [::].
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sockproxy]
    read_only: true
    tmpfs: [/tmp, /run]   # the entrypoint renders /tmp/haproxy.cfg; HAProxy writes /run/haproxy.pid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]       # root owns docker.sock (0660 root:docker): no capability needed to open it
    pids_limit: 128
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      kdk.baseline.exception: "docker-sock: the one allowed socket consumer (socket proxy)"
    logging: *log

networks:
  proxy:
    name: proxy
  # No gateway, no egress: only Traefik and the socket proxy.
  sockproxy:
    internal: true
