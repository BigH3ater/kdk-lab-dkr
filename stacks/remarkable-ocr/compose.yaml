services:
  remarkable-ocr:
    build: .
    image: kdk/remarkable-ocr:latest
    container_name: remarkable-ocr
    restart: "no"                       # one-shot; run by the gitops procedure
    env_file: [.env]
    environment:
      QUEUE_DIR: /queue
      VAULT_DIR: /vault
    # source Pushover creds (failed pages / crashes page priority-1), then run
    entrypoint: ["/bin/sh","-c",". /pushover.env 2>/dev/null; exec python /app/pipeline.py run"]
    volumes:
      - /opt/kdk-lab/remarkable-ocr:/queue
      - /opt/kdk-lab/obsidian/vault:/vault
      - ../../remarkable/diagram:/app/diagram:ro   # kodiak_diagram + topology_svg (repo clone)
      - /etc/kdk/pushover.env:/pushover.env:ro
