[project]
name = "kosync-helper"
version = "0.2.0"
description = "kdk-lab reading-sync: KOReader kosync front for BookBridge with PDF page sync to Audiobookshelf"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pypdf==6.21.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 60   # a hung test dumps every thread and fails, not the 5-min CI timeout
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
