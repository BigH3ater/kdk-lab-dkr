# Small internal apps on kdk-dkr-01.
name: apps
services:
  ntp:
    image: cturra/ntp:latest@sha256:7224d4e7c7833aabbcb7dd70c46c8a8dcccda365314c6db047b9b10403ace3bc
    container_name: ntp
    restart: unless-stopped
    ports: ["10.1.20.20:123:123/udp"]   # ntp.kmkdp.com -> 10.1.20.20; VLAN address only
    environment:
      NTP_SERVERS: "time.cloudflare.com,0.pool.ntp.org,1.pool.ntp.org"

  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:v0.9.5@sha256:8c5d65ef00b54cd8c2e78ccc70722ce322cf8ca5069b669e07c1e4edcd1836c7
    container_name: adguardhome-sync
    restart: unless-stopped
    command: run
    environment:
      ORIGIN_URL: "http://10.1.1.120"
      ORIGIN_USERNAME: "${ADGUARD_USERNAME}"
      ORIGIN_PASSWORD: "${ADGUARD_PASSWORD}"
      REPLICA1_URL: "http://10.1.1.121"
      REPLICA1_USERNAME: "${ADGUARD_USERNAME}"
      REPLICA1_PASSWORD: "${ADGUARD_PASSWORD}"
      REPLICA2_URL: "http://10.1.1.122"
      REPLICA2_USERNAME: "${ADGUARD_USERNAME}"
      REPLICA2_PASSWORD: "${ADGUARD_PASSWORD}"
      CRON: "*/15 * * * *"
      RUN_ON_START: "true"

  rmfakecloud:
    image: ddvk/rmfakecloud:0.0.32@sha256:630a5c9e0b412a12e236c2a39034cf62fe1cde29a186d53a3459195ce8aaaf1f
    container_name: rmfakecloud
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: "${RMFAKECLOUD_JWT_SECRET}"
      STORAGE_URL: "https://remarkable.kmkdp.com"
    volumes:
      - /opt/kdk-lab/apps/rmfakecloud:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.rmfake.rule: "Host(`remarkable.kmkdp.com`)"
      traefik.http.services.rmfake.loadbalancer.server.port: "3000"
    networks: [default, proxy]

  proton-bridge:
    image: shenxn/protonmail-bridge:3.19.0-1@sha256:3717b4441130675dc9131196de9f9c5287d2ea21b138d83b0486429e1737638a
    container_name: proton-bridge
    restart: unless-stopped
    ports: ["10.1.20.20:25:25/tcp"]
    # The entrypoint never forwards SIGTERM to the bridge, so every stop is a
    # SIGKILL after the grace period and the pid lock in the volume survives.
    # In the next container that pid belongs to socat or cat, the bridge sees
    # "another instance is already running" and exits 1 while socat keeps the
    # container "Up" with nothing behind port 25 (2026-10-29 13:38Z/13:44Z).
    # Clear the stale lock before handing over to the image's entrypoint.
    entrypoint: ["bash", "-c", "unlink /root/.cache/protonmail/bridge-v3/bridge-v3.lock 2>/dev/null; exec bash /protonmail/entrypoint.sh \"$@\"", "--"]
    volumes:
      - /opt/kdk-lab/apps/proton-bridge:/root
    # Proton Bridge self-updates into updates/ inside the volume and the
    # launcher runs the newest copy at the next start; the image lacks the
    # libraries those builds need (2026-10-29: 3.26.0 wanted libfido2.so.1 ->
    # "Failed to launch", SMTP down from 04:27Z until the dir was moved aside).
    # A tmpfs over updates/ makes every start use the image's own binary.
    tmpfs:
      - /root/.local/share/protonmail/bridge-v3/updates

  roborock:
    image: ghcr.io/python-roborock/local_roborock_server:1.2.1@sha256:0f3d0dd05f14315273df5622d43008b2665c24b2fed79277822d4c9184eab158
    container_name: roborock
    restart: unless-stopped
    # The vacuum (VLAN 30) and HA reach these routed, at api-slave.kmkdp.com ->
    # 10.1.20.20 (the *.kmkdp.com wildcard): the VLAN address is all they need.
    ports:
      - "10.1.20.20:555:555"
      - "10.1.20.20:8881:8881"
    volumes:
      - /opt/kdk-lab/apps/roborock:/data
      - /opt/kdk-lab/apps/roborock/config.toml:/app/config.toml:ro
      # tls.crt/tls.key (config.toml [tls] mode="provided") are kept current by
      # the certs-dumper sidecar below. The server reads them only at start, so a
      # renewed cert lands on the next restart (roborock-cert-refresh procedure,
      # komodo/resources.toml, 1st + 15th). Was hand-copied 2026-08-30 (exp 11-28).
      - /opt/kdk-lab/apps/roborock/tls:/tls:ro

  # Keeps /opt/kdk-lab/apps/roborock/tls/{tls.crt,tls.key} equal to the dedicated
  # api-slave.kmkdp.com cert that the internal Traefik's `cfroborock` resolver
  # obtains + renews via Cloudflare DNS-01 (stacks/proxy). It binds ONLY the
  # cfroborock store dir (/opt/kdk-lab/proxy/letsencrypt-roborock, read-only), so
  # this container never has access to the main /letsencrypt acme.json that holds
  # the *.kmkdp.com wildcard private key. Same image/tag/hardening
  # as identity's lldap certs-dumper. No docker socket: the roborock server does
  # not reload cert files, so the roborock-cert-refresh procedure restarts the
  # roborock service on the 1st + 15th (renewal is 30 days before expiry, so the
  # served cert is never more than ~15 days behind). See docs/services/apps.md.
  certs-dumper:
    image: ldez/traefik-certs-dumper:v2.11.4@sha256:a34b27edf8e5e96a215035a6bfba00d769d2638f8444a5dd6dc27299d75f43c5
    container_name: roborock-certs-dumper
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Runs as root but changes nothing's ownership: it reads the cfroborock
    # acme.json (root 0600) and writes root-owned 0644/0600 files into /tls (also
    # root), so no capability is needed -- drop them all.
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/w]                       # dump staging + the refresh script; rootfs stays read-only
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    entrypoint: ["/bin/sh", "-c"]
    # traefik-certs-dumper writes <dest>/<domain>/{certificate.crt,privatekey.key}
    # under --domain-subdir, but the roborock server wants /tls/tls.crt + tls.key,
    # so each pass copies into place. A one-shot `file` dump + copy on a poll loop
    # (not --watch): a 60-day cert needs no sub-second reaction, and the loop keeps
    # the copy logic plain shell instead of a single-exec --post-hook. $$ escapes
    # one $ past Komodo/compose interpolation (same as identity's dumper).
    command:
      - |
        SRC=/acme/acme.json
        C=/w/dump/api-slave.kmkdp.com/certificate.crt
        K=/w/dump/api-slave.kmkdp.com/privatekey.key
        mkdir -p /w/dump
        # Never clobber the valid hand-copied cert before Traefik has issued the
        # dedicated one: wait for the resolver to create + populate its store.
        while [ ! -s "$$SRC" ]; do echo "waiting for $$SRC (cfroborock not issued yet)"; sleep 15; done
        while true; do
          /usr/bin/traefik-certs-dumper file --version v2 --source "$$SRC" --dest /w/dump --domain-subdir || true
          if [ -s "$$C" ] && [ -s "$$K" ]; then
            cp "$$C" /tls/tls.crt
            cp "$$K" /tls/tls.key
            chmod 0644 /tls/tls.crt
            chmod 0600 /tls/tls.key
          fi
          sleep 3600
        done
    volumes:
      - /opt/kdk-lab/proxy/letsencrypt-roborock:/acme:ro   # ONLY the cfroborock store (no wildcard key); cross-stack host bind
      - /opt/kdk-lab/apps/roborock/tls:/tls       # writes tls.crt/tls.key the roborock server reads
    networks: [default]

networks:
  default: {}
  proxy:
    external: true
