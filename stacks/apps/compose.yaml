# Small internal apps on kdk-dkr-01.
name: apps
services:
  ntp:
    image: cturra/ntp:latest@sha256:7224d4e7c7833aabbcb7dd70c46c8a8dcccda365314c6db047b9b10403ace3bc
    container_name: ntp
    restart: unless-stopped
    ports: ["10.1.20.20:123:123/udp"]   # ntp.kmkdp.com -> 10.1.20.20; VLAN address only
    environment:
      NTP_SERVERS: "time.cloudflare.com,0.pool.ntp.org,1.pool.ntp.org"

  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:v0.9.6@sha256:157e509baeef66cd400dae96c955a1e97312670e0285a92ebe2c3465b3e22e67
    container_name: adguardhome-sync
    restart: unless-stopped
    command: run
    environment:
      ORIGIN_URL: "http://10.1.1.120"
      ORIGIN_USERNAME: "${ADGUARD_USERNAME}"
      ORIGIN_PASSWORD: "${ADGUARD_PASSWORD}"
      REPLICA1_URL: "http://10.1.1.121"
      REPLICA1_USERNAME: "${ADGUARD_USERNAME}"
      REPLICA1_PASSWORD: "${ADGUARD_PASSWORD}"
      REPLICA2_URL: "http://10.1.1.122"
      REPLICA2_USERNAME: "${ADGUARD_USERNAME}"
      REPLICA2_PASSWORD: "${ADGUARD_PASSWORD}"
      CRON: "*/15 * * * *"
      RUN_ON_START: "true"


  proton-bridge:
    image: shenxn/protonmail-bridge:3.19.0-1@sha256:3717b4441130675dc9131196de9f9c5287d2ea21b138d83b0486429e1737638a
    container_name: proton-bridge
    restart: unless-stopped
    ports: ["10.1.20.20:25:25/tcp"]
    # The entrypoint never forwards SIGTERM to the bridge, so every stop is a
    # SIGKILL after the grace period and the pid lock in the volume survives.
    # In the next container that pid belongs to socat or cat, the bridge sees
    # "another instance is already running" and exits 1 while socat keeps the
    # container "Up" with nothing behind port 25 (2026-10-29 13:38Z/13:44Z).
    # Clear the stale lock before handing over to the image's entrypoint.
    entrypoint: ["bash", "-c", "unlink /root/.cache/protonmail/bridge-v3/bridge-v3.lock 2>/dev/null; exec bash /protonmail/entrypoint.sh \"$@\"", "--"]
    volumes:
      - /opt/kdk-lab/apps/proton-bridge:/root
    # Proton Bridge self-updates into updates/ inside the volume and the
    # launcher runs the newest copy at the next start; the image lacks the
    # libraries those builds need (2026-10-29: 3.26.0 wanted libfido2.so.1 ->
    # "Failed to launch", SMTP down from 04:27Z until the dir was moved aside).
    # A tmpfs over updates/ makes every start use the image's own binary.
    tmpfs:
      - /root/.local/share/protonmail/bridge-v3/updates

  roborock:
    image: ghcr.io/python-roborock/local_roborock_server:1.2.1@sha256:0f3d0dd05f14315273df5622d43008b2665c24b2fed79277822d4c9184eab158
    container_name: roborock
    restart: unless-stopped
    # The vacuum (VLAN 30) and HA reach these routed, at api-slave.kmkdp.com ->
    # 10.1.20.20 (the *.kmkdp.com wildcard): the VLAN address is all they need.
    ports:
      - "10.1.20.20:555:555"
      - "10.1.20.20:8881:8881"
    volumes:
      - /opt/kdk-lab/apps/roborock:/data
      - /opt/kdk-lab/apps/roborock/config.toml:/app/config.toml:ro
      # tls.crt/tls.key (config.toml [tls] mode="provided") are issued + renewed
      # by the separate `roborock-cert` stack's lego one-shot (see
      # docs/services/apps.md). The server reads them only at start, so a renewed
      # cert lands on the next restart (roborock-cert-refresh procedure,
      # komodo/resources.toml, 1st + 15th). Was hand-copied 2026-08-30 (exp 11-28).
      - /opt/kdk-lab/apps/roborock/tls:/tls:ro

networks:
  default: {}
  proxy:
    external: true
