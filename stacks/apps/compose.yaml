# Small internal apps on kdk-dkr-01.
name: apps
services:
  ntp:
    image: cturra/ntp:latest@sha256:7224d4e7c7833aabbcb7dd70c46c8a8dcccda365314c6db047b9b10403ace3bc
    container_name: ntp
    restart: unless-stopped
    ports: ["10.1.20.20:123:123/udp"]   # ntp.kmkdp.com -> 10.1.20.20; VLAN address only
    environment:
      NTP_SERVERS: "time.cloudflare.com,0.pool.ntp.org,1.pool.ntp.org"

  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:v0.9.5@sha256:8c5d65ef00b54cd8c2e78ccc70722ce322cf8ca5069b669e07c1e4edcd1836c7
    container_name: adguardhome-sync
    restart: unless-stopped
    command: run
    environment:
      ORIGIN_URL: "http://10.1.1.120"
      ORIGIN_USERNAME: "${ADGUARD_USERNAME}"
      ORIGIN_PASSWORD: "${ADGUARD_PASSWORD}"
      REPLICA1_URL: "http://10.1.1.121"
      REPLICA1_USERNAME: "${ADGUARD_USERNAME}"
      REPLICA1_PASSWORD: "${ADGUARD_PASSWORD}"
      REPLICA2_URL: "http://10.1.1.122"
      REPLICA2_USERNAME: "${ADGUARD_USERNAME}"
      REPLICA2_PASSWORD: "${ADGUARD_PASSWORD}"
      CRON: "*/15 * * * *"
      RUN_ON_START: "true"

  rmfakecloud:
    image: ddvk/rmfakecloud:0.0.32@sha256:630a5c9e0b412a12e236c2a39034cf62fe1cde29a186d53a3459195ce8aaaf1f
    container_name: rmfakecloud
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: "${RMFAKECLOUD_JWT_SECRET}"
      STORAGE_URL: "https://remarkable.kmkdp.com"
    volumes:
      - /opt/kdk-lab/apps/rmfakecloud:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.rmfake.rule: "Host(`remarkable.kmkdp.com`)"
      traefik.http.services.rmfake.loadbalancer.server.port: "3000"
    networks: [default, proxy]

  proton-bridge:
    image: shenxn/protonmail-bridge:3.9.1-1@sha256:da19bf102b87fe6fe026b882f61ed3e5c11cc7e86d75b9fd3e2b8fe8b4247b43
    container_name: proton-bridge
    restart: unless-stopped
    ports: ["10.1.20.20:25:25/tcp"]
    volumes:
      - /opt/kdk-lab/apps/proton-bridge:/root

  roborock:
    image: ghcr.io/python-roborock/local_roborock_server:1.2.1@sha256:0f3d0dd05f14315273df5622d43008b2665c24b2fed79277822d4c9184eab158
    container_name: roborock
    restart: unless-stopped
    # The vacuum (VLAN 30) and HA reach these routed, at api-slave.kmkdp.com ->
    # 10.1.20.20 (the *.kmkdp.com wildcard): the VLAN address is all they need.
    ports:
      - "10.1.20.20:555:555"
      - "10.1.20.20:8881:8881"
    volumes:
      - /opt/kdk-lab/apps/roborock:/data
      - /opt/kdk-lab/apps/roborock/config.toml:/app/config.toml:ro
      - /opt/kdk-lab/apps/roborock/tls:/tls:ro
networks:
  default: {}
  proxy:
    external: true
