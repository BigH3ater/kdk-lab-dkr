# Hourly storage/NFS health validator (storage-health procedure). One instance
# per NFS client host: kdk-dkr-01 (media backup dee-exchange) and kdk-dkr-04
# (media backup), each as its own [[stack]] in komodo/resources.toml with
# NFS_MOUNTS set to exactly the mounts that host has.
# Pages Pushover when the NAS storage IP is unreachable, NFS 2049 is refused, or
# any NFS mount hangs (the hung-hard-mount signature behind the 2026-09-16
# outage). Logic in verify.sh (mounted, so Compose interpolation never touches
# its shell $variables). host-net to ping/connect the NAS over the storage NIC.
#
# The host /mnt is bind-mounted with slave propagation so the NFS submounts
# (media/backup/dee-exchange) appear inside the container; a `timeout stat`
# on each detects a hung mount without ever hanging container startup (the parent
# /mnt is a local dir, so the bind itself never blocks).
name: storage-health
services:
  verify:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    restart: "no"
    network_mode: host
    entrypoint: ["/bin/sh", "/verify.sh"]
    environment:
      # Per host in komodo/resources.toml (stack `environment`). The defaults are
      # kdk-dkr-01's set; kdk-dkr-04 overrides NFS_MOUNTS to "media backup".
      NAS_IP: "${NAS_IP:-172.16.30.2}"
      NFS_MOUNTS: "${NFS_MOUNTS:-media backup dee-exchange}"   # dkr-01 default; /mnt/loki released 2026-10-29 (Loki on kdk-log-01)
    volumes:
      - /etc/kdk:/kdk
      - ./verify.sh:/verify.sh:ro
      - type: bind
        source: /mnt
        target: /hostmnt
        read_only: true
        bind:
          propagation: rslave
