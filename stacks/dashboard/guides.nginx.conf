# Guides static site (home.kmkdp.com/guides, served behind Traefik StripPrefix /guides).
# Mounted read-only at /etc/nginx/conf.d/default.conf. This replaces the stock default.conf
# so the family sees guide edits without a hard refresh. Keeps the nginx:alpine defaults
# (root + index) and the stripped-prefix behaviour (nginx sees /, /index.html, /style.css).
#
# The image's 10-listen-on-ipv6 entrypoint only edits default.conf when it matches the
# stock checksum, so it leaves this custom file untouched (both listen lines are kept here).
#
# Cache policy:
#   default (/, *.html) -> no-cache: the browser must revalidate every load, so a redeploy
#                          shows up immediately (HTML is tiny).
#   *.css / *.js        -> cached 5 min, then must revalidate (ETag/Last-Modified handle it).
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Inherited by "/" and *.html (locations below set no add_header of their own).
    add_header Cache-Control "no-cache" always;

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "max-age=300, must-revalidate" always;
    }

    # The workout guide file is workout.html, not index.html, so a request to the
    # bare directory /guides/workout/ (nginx sees /workout/ after StripPrefix)
    # would 403 (no index + autoindex off). Serve the guide there too, so the
    # directory URL works like the explicit .../workout.html (used by the HA
    # Workout dashboard iframe and any bookmark).
    location = /workout/ {
        try_files /workout/workout.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
