# Homepage services -- Mack family dashboard (functional board; nav in sidebar).
- This Week:
  - Meal Plan:
      icon: mdi-silverware-fork-knife
      href: https://recipes.kmkdp.com/mealplan
      description: This week's dinners -- tap a meal to open the recipe and rate it
      widget:
        type: iframe
        name: Meal Plan
        src: https://home.kmkdp.com/meal/
        height: 235
        referrerPolicy: same-origin
  - Weather:
      icon: mdi-weather-partly-cloudy
      description: Tiffin, IA — 7-day forecast
      widget:
        type: iframe
        name: Weather
        src: https://home.kmkdp.com/meal/weather
        height: 150
- Tasks:
  - Up Next:
      icon: mdi-check-circle-outline
      description: Family chores due soon — tap to mark done
      widget:
        type: iframe
        name: Tasks
        src: https://home.kmkdp.com/meal/tasks
        height: 175
- Household Calendar:
  - This Week's Events:
      icon: mdi-calendar-week
      widget:
        type: calendar
        view: agenda
        maxEvents: 10
        showTime: true
        timezone: America/Chicago
        previousDays: 0
        integrations:
        - type: ical
          url: '{{HOMEPAGE_VAR_ICS_URL}}'
          name: Family
          color: amber
          params:
            showName: true
  - Calendar:
      icon: mdi-calendar-month
      widget:
        type: calendar
        view: monthly
        maxEvents: 12
        showTime: true
        timezone: America/Chicago
        integrations:
        - type: ical
          url: '{{HOMEPAGE_VAR_ICS_URL}}'
          name: Family
          color: amber
          params:
            showName: true
