# Homepage services -- Mack family dashboard.
#
# Two parts, top to bottom:
#   1. The functional board (This Week / Tasks / Household Calendar) -- iframes and
#      the calendar widget, the day-to-day surface.
#   2. A full service directory (Media ... Docs & notes) -- one tile per lab service
#      with a siteMonitor up/down dot. Every *.kmkdp.com Traefik router host and the
#      management appliances live here so nothing is "hidden" behind the sidebar.
#
# All hosts resolve on lab DNS and answer from kdk-dkr-01 (LAN/Tailscale only; a 302
# to sso.kmkdp.com is Authelia doing its job). Tiles open in a new tab (settings
# target: _blank); siteMonitor pings the LAN-reachable URL. Icons are dashboard-icons
# slugs (homarr-labs/dashboard-icons) with mdi- fallbacks where no brand icon exists.

- This Week:
  - Meal Plan:
      icon: mdi-silverware-fork-knife
      href: https://recipes.kmkdp.com/mealplan
      description: This week's dinners -- tap a meal to open the recipe and rate it
      widget:
        type: iframe
        name: Meal Plan
        src: https://home.kmkdp.com/meal/
        height: 235
        referrerPolicy: same-origin
  - Weather:
      icon: mdi-weather-partly-cloudy
      description: Tiffin, IA — 7-day forecast
      widget:
        type: iframe
        name: Weather
        src: https://home.kmkdp.com/meal/weather
        height: 150
- Tasks:
  - Up Next:
      icon: mdi-check-circle-outline
      description: Family chores due soon — tap to mark done
      widget:
        type: iframe
        name: Tasks
        src: https://home.kmkdp.com/meal/tasks
        height: 175
- Household Calendar:
  - This Week's Events:
      icon: mdi-calendar-week
      widget:
        type: calendar
        view: agenda
        maxEvents: 10
        showTime: true
        timezone: America/Chicago
        previousDays: 0
        integrations:
        - type: ical
          url: '{{HOMEPAGE_VAR_ICS_URL}}'
          name: Family
          color: amber
          params:
            showName: true
  - Calendar:
      icon: mdi-calendar-month
      widget:
        type: calendar
        view: monthly
        maxEvents: 12
        showTime: true
        timezone: America/Chicago
        integrations:
        - type: ical
          url: '{{HOMEPAGE_VAR_ICS_URL}}'
          name: Family
          color: amber
          params:
            showName: true

# ---------------------------------------------------------------------------
# Service directory -- one tile per lab surface, grouped. siteMonitor only
# (no stat widgets: those need per-service API keys the owner must mint first;
# see the PR body / .env.tpl for the wishlist).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Workout -- treadmill telemetry from Home Assistant (home-assistant stack on
# kdk-dkr-02). READ-ONLY: these tiles only DISPLAY HA entity states; there is
# no control that commands the treadmill.
#
# The homeassistant widget fetches HA's REST API server-side with a long-lived
# access token (HOMEPAGE_VAR_HA_TOKEN, op-injected -- never in the request URL).
# HA is reached by its public hostname, not 10.1.30.21:8123 directly: the
# planned firewall rule allows :8123 only from 10.1.30.21, so the homepage
# container on kdk-dkr-01 (VLAN 20) cannot hit the host port, but the Traefik
# route for homeassistant.kmkdp.com carries no forwardauth, so the Bearer token
# alone authenticates (same "public host + token" shape as the Jellyfin tile).
#
# DEPENDENCY -- MERGE THIS PR AFTER SLICE 2: the live sensor.treadmill_* states
# exist NOW (treadmill-bridge, slice 1) and the Treadmill tile works today. The
# current-walker and per-person entities come from the slice-2 HA package
# (stacks/home-assistant/config/packages/treadmill.yaml, branch
# feat/treadmill-ha-package). Until that lands those custom states render as
# "unknown". The tm_daily_*/tm_weekly_* utility_meter entity_ids below are the
# PLANNED names -- reconcile them with slice-2's treadmill.yaml before merge.
- Workout:
  - Treadmill:
      icon: mdi-run
      href: https://homeassistant.kmkdp.com/
      siteMonitor: https://homeassistant.kmkdp.com/
      description: Live belt telemetry (read-only)
      widget:
        type: homeassistant
        url: https://homeassistant.kmkdp.com
        key: '{{HOMEPAGE_VAR_HA_TOKEN}}'
        # Up to 4 custom states per widget. speed/incline/distance are live now
        # (slice 1); the walker is slice 2. Default value is
        # "{state} {attributes.unit_of_measurement}" -- fine for the unit-bearing
        # sensors; input_select has no unit so its value is set to "{state}".
        custom:
          - state: sensor.treadmill_speed
            label: Speed
          - state: sensor.treadmill_incline
            label: Incline
          - state: sensor.treadmill_distance
            label: Distance
          - state: input_select.tm_current_walker
            label: Walker
            value: "{state}"
  - Jacob:
      icon: mdi-account
      href: https://homeassistant.kmkdp.com/
      description: Jacob -- distance & last workout (needs slice 2)
      widget:
        type: homeassistant
        url: https://homeassistant.kmkdp.com
        key: '{{HOMEPAGE_VAR_HA_TOKEN}}'
        custom:
          - state: sensor.tm_distance_daily_jacob
            label: Today
          - state: sensor.tm_distance_weekly_jacob
            label: This week
          - state: input_number.tm_total_distance_jacob
            label: Total
          - state: input_datetime.tm_last_workout_jacob
            label: Last
            value: "{state}"
  - Rachel:
      icon: mdi-account
      href: https://homeassistant.kmkdp.com/
      description: Rachel -- distance & last workout (needs slice 2)
      widget:
        type: homeassistant
        url: https://homeassistant.kmkdp.com
        key: '{{HOMEPAGE_VAR_HA_TOKEN}}'
        custom:
          - state: sensor.tm_distance_daily_rachel
            label: Today
          - state: sensor.tm_distance_weekly_rachel
            label: This week
          - state: input_number.tm_total_distance_rachel
            label: Total
          - state: input_datetime.tm_last_workout_rachel
            label: Last
            value: "{state}"
  - Guest:
      icon: mdi-account-question
      href: https://homeassistant.kmkdp.com/
      description: Guest -- distance (needs slice 2)
      widget:
        type: homeassistant
        url: https://homeassistant.kmkdp.com
        key: '{{HOMEPAGE_VAR_HA_TOKEN}}'
        # Guest has no last-workout datetime in slice 2 (brief), so 3 states.
        custom:
          - state: sensor.tm_distance_daily_guest
            label: Today
          - state: sensor.tm_distance_weekly_guest
            label: This week
          - state: input_number.tm_total_distance_guest
            label: Total

- Media:
  - Jellyfin:
      icon: jellyfin
      href: https://jellyfin.kmkdp.com/
      siteMonitor: https://jellyfin.kmkdp.com/
      description: Movies & TV (own login)
      widget:
        type: jellyfin
        # Jellyfin >= 10.12 / 12.x: v1 endpoints use the /emby/ prefix + ?api_key=
        # query auth, which Jellyfin 12.3.0 answers 404/401. version 2 uses the
        # non-/emby paths (Items/Counts, Sessions) with header auth (Authorization:
        # MediaBrowser Token=...), so no secret is placed in the request URL/logs.
        version: 2
        url: https://jellyfin.kmkdp.com
        key: '{{HOMEPAGE_VAR_JELLYFIN_KEY}}'
        enableBlocks: true
        enableNowPlaying: true
