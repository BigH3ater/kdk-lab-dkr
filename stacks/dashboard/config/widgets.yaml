# Homepage info widgets (the top bar). Kept minimal for a family board.
- greeting:
    text_size: xl
    text: Welcome to the Mack House

- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: long
      hourCycle: h12
      timeZone: America/Chicago

- openmeteo:
    label: Tiffin
    latitude: 41.706         # Tiffin, IA
    longitude: -91.663
    timezone: America/Chicago
    units: imperial
    cache: 15
