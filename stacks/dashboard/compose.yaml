# Mack family home dashboard on kdk-dkr-01 (LAN + Tailscale ONLY -- no public tunnel).
# Homepage (gethomepage.dev) is the launcher/status board; a small nginx serves the
# family "how-to" guides at home.kmkdp.com/guides/...; Vikunja is the checkable-tasks
# app (own auth) at tasks.kmkdp.com; the mealplan sidecar (P2) renders the Tandoor
# weekly plan front-and-center with a star-rating write-back.
#
# Auth = NONE. LAN/Tailscale is the gate (same posture as the internal calibre server);
# tiles open services that carry their own login. Do NOT expose this on the DMZ/tunnel.
#
# Networks: default (auto /24 from kdk-dkr-01's 10.208.0.0/16 pool -- pools are set
# host-wide since the 2026-09-19 IPAM fix, so auto is safe; no pin needed) + proxy
# (external, the internal Traefik ingress). recipes/*.kmkdp.com resolve to the DMZ and
# are reachable (internal->DMZ:443 is open).
name: dashboard

services:
  # ---- Homepage: the dashboard itself (home.kmkdp.com) ---------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    restart: unless-stopped
    env_file: [.env]                 # HOMEPAGE_VAR_* (op-injected) + HOMEPAGE_ALLOWED_HOSTS
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.kmkdp.com
      TZ: America/Chicago
    volumes:
      - ./config:/app/config
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`home.kmkdp.com`)"
      traefik.http.routers.dashboard.priority: "1"
      # Authelia SSO (two_factor; access rule for home.kmkdp.com already exists,
      # group dashboard-users = jmack + rach). Remote-User flows to the sidecar.
      traefik.http.routers.dashboard.middlewares: "forwardauth@file"
      traefik.http.services.dashboard.loadbalancer.server.port: "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Guides: static family how-to pages (home.kmkdp.com/guides/...) ------
  guides:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: dashboard-guides
    restart: unless-stopped
    volumes:
      - ./guides:/usr/share/nginx/html:ro
      # Cache policy so family guide edits show up without a hard refresh
      # (no-cache on HTML, short must-revalidate on css/js). Single-file bind
      # mount: nginx reads this only at start and git swaps the file's inode on
      # pull, so a conf edit needs a container recreate to apply. The
      # kdk.config-sha label below (DASHBOARD_GUIDES_SHA = sha256(this file) from
      # the Komodo pre_deploy) changes with the content and forces that recreate.
      - ./guides.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      # More specific than the Homepage router -> wins for /guides/*. StripPrefix so
      # nginx sees /index.html etc. Guide pages use relative links + <base href="/guides/">
      # so assets/links resolve back under /guides/ after the strip -- even if the browser
      # lands on /guides without the trailing slash (StripPrefix does not add one).
      traefik.http.routers.guides.rule: "Host(`home.kmkdp.com`) && PathPrefix(`/guides`)"
      traefik.http.routers.guides.priority: "10"
      traefik.http.routers.guides.middlewares: "forwardauth@file,guides-strip"
      traefik.http.middlewares.guides-strip.stripprefix.prefixes: "/guides"
      traefik.http.services.guides.loadbalancer.server.port: "80"
      # Recreate nginx on a guides.nginx.conf change (single-file bind mount; see
      # the volumes note). DASHBOARD_GUIDES_SHA = sha256(guides.nginx.conf) from
      # the Komodo pre_deploy.
      kdk.config-sha: "${DASHBOARD_GUIDES_SHA:-unset}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Vikunja: checkable household tasks (tasks.kmkdp.com), own auth ------
  # Single unified image (frontend+api), SQLite backend (file-based -> no db sidecar),
  # LAN-only. Recurring household items lifted from the iOS Reminders screenshots live
  # here. JWT secret is op-injected so sessions survive restarts.
  vikunja:
    image: vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
    container_name: vikunja
    restart: unless-stopped
    env_file: [.env]                # VIKUNJA_SERVICE_JWTSECRET (op-injected)
    environment:
      VIKUNJA_SERVICE_PUBLICURL: "https://tasks.kmkdp.com/"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_TIMEZONE: America/Chicago
      # Registration off: login is Authelia OIDC only (see vikunja-config.yml.tpl)
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
    volumes:
      # Single-file bind mount of the op-rendered config. Vikunja reads it only
      # at start, and pre_deploy rewrites the file (new inode) every deploy, so a
      # config change needs a recreate to apply. The kdk.config-sha label below
      # (DASHBOARD_VIKUNJA_SHA = sha256(vikunja-config.yml) from the Komodo
      # pre_deploy, computed AFTER op inject) changes with content and forces it.
      - ./vikunja-config.yml:/etc/vikunja/config.yml:ro
      - /opt/kdk-lab/dashboard/vikunja/db:/db
      - /opt/kdk-lab/dashboard/vikunja/files:/app/vikunja/files
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.vikunja.rule: "Host(`tasks.kmkdp.com`)"
      traefik.http.services.vikunja.loadbalancer.server.port: "3456"
      # Recreate vikunja on a vikunja-config.yml change (single-file bind mount;
      # see the volumes note). DASHBOARD_VIKUNJA_SHA from the Komodo pre_deploy.
      kdk.config-sha: "${DASHBOARD_VIKUNJA_SHA:-unset}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- mealplan sidecar (P2): Tandoor weekly plan + star-rating write-back -
  # Reached by the family browser at home.kmkdp.com/meal/ (iframe, front-and-center)
  # and by Homepage's customapi over the default net at http://mealplan:8080. Logs in
  # to Tandoor with the dedicated dashboard account (session auth; REST tokens are off)
  # and reads /api/meal-plan/. Ratings POST back as CookLog entries (see mealplan/app.py).
  mealplan:
    # provenance off: with the containerd image store, BuildKit's provenance
    # attestation gives every (even fully cached) build a new image ID, so each
    # gitops-sync deploy recreated these containers. Off = stable ID, no restart.
    build:
      context: ./mealplan
      provenance: false
    image: kdk/dashboard-mealplan:latest
    # python is PID 1 otherwise and ignores SIGTERM, so every redeploy waited out
    # the 10 s grace and was SIGKILLed (137 -> false "container down" page).
    init: true
    container_name: dashboard-mealplan
    restart: unless-stopped
    env_file: [.env]                # TANDOOR_USER/TANDOOR_PASS (op-injected)
    environment:
      TANDOOR_URL: "https://recipes.kmkdp.com"
      TANDOOR_SPACE: "Mack House"
      TZ: America/Chicago
    volumes:
      # Read-only view of the grocery-planner's store-routing table so the New Pi
      # groceries tab can link each item to its market.newpi.coop product (the
      # `newpi_url` on a NewPi rule). Same single source of truth the weekly run
      # uses -- no second copy. `../../` is the Komodo repo clone root (same
      # pattern as docs/docs-to-vault), so the path resolves inside the clone.
      # Single-file bind mount: read once at startup, so a foods.yaml edit shows
      # up on the next dashboard redeploy (the container is recreated then).
      - ../../stacks/grocery-planner/recipes/foods.yaml:/app/foods.yaml:ro
      # Pantry + Thaw tabs: the `pantry:` list (cleanup.yaml) and the planner
      # config (`stores:` stock/bulk stores, `thaw:` lead times). Same read-only,
      # read-at-start single-file pattern as foods.yaml. No secrets in either.
      - ../../stacks/grocery-planner/recipes/cleanup.yaml:/app/cleanup.yaml:ro
      - ../../stacks/grocery-planner/config.yaml:/app/planner-config.yaml:ro
      # Thaw-tab ticks (thaw.json, a few lines; pruned each plan week).
      - mealplan-data:/data
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mealplan.rule: "Host(`home.kmkdp.com`) && PathPrefix(`/meal`)"
      traefik.http.routers.mealplan.priority: "10"
      traefik.http.routers.mealplan.middlewares: "forwardauth@file,mealplan-strip"
      traefik.http.middlewares.mealplan-strip.stripprefix.prefixes: "/meal"
      traefik.http.services.mealplan.loadbalancer.server.port: "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mealplan-data: {}           # Thaw-tab tick state (dashboard-mealplan /data)

networks:
  default: {}
  proxy:
    external: true
