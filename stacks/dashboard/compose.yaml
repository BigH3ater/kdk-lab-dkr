# Mack family home dashboard on kdk-dkr-01 (LAN + Tailscale ONLY -- no public tunnel).
# The mealplan sidecar is the dashboard: home.kmkdp.com/ redirects to its household
# page (/meal/home), it also serves the kitchen board (kitchen.kmkdp.com) and the lab
# admin page (admin.kmkdp.com). A small nginx serves the family "how-to" guides at
# home.kmkdp.com/guides/...; Vikunja is the checkable-tasks app (own auth) at
# tasks.kmkdp.com. Homepage (gethomepage.dev) was retired 2026-11-10.
#
# Auth = Authelia ForwardAuth (two_factor, group dashboard-users) on every
# home.kmkdp.com router; kitchen.kmkdp.com uses a signed device cookie instead and
# admin.kmkdp.com is user:jmack. Do NOT expose this on the DMZ/tunnel.
#
# Networks: default (auto /24 from kdk-dkr-01's 10.208.0.0/16 pool -- pools are set
# host-wide since the 2026-09-19 IPAM fix, so auto is safe; no pin needed) + proxy
# (external, the internal Traefik ingress). recipes/*.kmkdp.com resolve to the DMZ and
# are reachable (internal->DMZ:443 is open).
name: dashboard

# Compose hardening baseline (docs/reference/compose-baseline.md), hardened
# 2026-11-11. Each service adds only what it needs on top.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  pids_limit: 128
  mem_limit: 256m
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ---- Guides: static family how-to pages (home.kmkdp.com/guides/...) ------
  guides:
    <<: *hardened
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: dashboard-guides
    # master runs as root and drops workers to `nginx` (same set as wger-nginx).
    cap_add:
      - CHOWN     # chown of the client/proxy temp dirs under /var/cache/nginx at start
      - SETUID    # drop worker processes to the nginx user
      - SETGID    # same, group
    # Writes: temp dirs (/var/cache/nginx) and the pid file (/run). Nothing else.
    tmpfs: [/tmp, /var/cache/nginx, /run]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./guides:/usr/share/nginx/html:ro
      # Cache policy so family guide edits show up without a hard refresh
      # (no-cache on HTML, short must-revalidate on css/js). Single-file bind
      # mount: nginx reads this only at start and git swaps the file's inode on
      # pull, so a conf edit needs a container recreate to apply. The
      # kdk.config-sha label below (DASHBOARD_GUIDES_SHA = sha256(this file) from
      # the Komodo pre_deploy) changes with the content and forces that recreate.
      - ./guides.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      # More specific than the root redirect router -> wins for /guides/*. StripPrefix so
      # nginx sees /index.html etc. Guide pages use relative links + <base href="/guides/">
      # so assets/links resolve back under /guides/ after the strip -- even if the browser
      # lands on /guides without the trailing slash (StripPrefix does not add one).
      traefik.http.routers.guides.rule: "Host(`home.kmkdp.com`) && PathPrefix(`/guides`)"
      traefik.http.routers.guides.priority: "10"
      traefik.http.routers.guides.middlewares: "forwardauth@file,guides-strip"
      traefik.http.middlewares.guides-strip.stripprefix.prefixes: "/guides"
      traefik.http.services.guides.loadbalancer.server.port: "80"
      # Recreate nginx on a guides.nginx.conf change (single-file bind mount; see
      # the volumes note). DASHBOARD_GUIDES_SHA = sha256(guides.nginx.conf) from
      # the Komodo pre_deploy.
      kdk.config-sha: "${DASHBOARD_GUIDES_SHA:-unset}"

  # ---- Vikunja: checkable household tasks (tasks.kmkdp.com), own auth ------
  # Single unified image (frontend+api), SQLite backend (file-based -> no db sidecar),
  # LAN-only. Recurring household items lifted from the iOS Reminders screenshots live
  # here. JWT secret is op-injected so sessions survive restarts.
  vikunja:
    <<: *hardened
    image: vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
    container_name: vikunja
    # The image (FROM scratch) runs as 1000; pinned so a base change cannot make
    # it root. The two bind dirs are chowned 1000 by the Komodo pre_deploy.
    user: "1000:1000"
    # Writes: /db (SQLite), /app/vikunja/files (attachments), /tmp (uploads in
    # flight). Config is read-only.
    mem_limit: 512m
    pids_limit: 256           # Go runtime threads count as pids
    healthcheck:
      # Scratch image: no shell, wget or curl. The binary's own `healthcheck`
      # subcommand loads the config and pings the SQLite DB (same check as the
      # HTTP /health route).
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    env_file: [.env]                # VIKUNJA_SERVICE_JWTSECRET (op-injected)
    environment:
      VIKUNJA_SERVICE_PUBLICURL: "https://tasks.kmkdp.com/"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_TIMEZONE: America/Chicago
      # Registration off: login is Authelia OIDC only (see vikunja-config.yml.tpl)
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
    volumes:
      # Single-file bind mount of the op-rendered config. Vikunja reads it only
      # at start, and pre_deploy rewrites the file (new inode) every deploy, so a
      # config change needs a recreate to apply. The kdk.config-sha label below
      # (DASHBOARD_VIKUNJA_SHA = sha256(vikunja-config.yml) from the Komodo
      # pre_deploy, computed AFTER op inject) changes with content and forces it.
      - ./vikunja-config.yml:/etc/vikunja/config.yml:ro
      - /opt/kdk-lab/dashboard/vikunja/db:/db
      - /opt/kdk-lab/dashboard/vikunja/files:/app/vikunja/files
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.vikunja.rule: "Host(`tasks.kmkdp.com`)"
      traefik.http.services.vikunja.loadbalancer.server.port: "3456"
      # Recreate vikunja on a vikunja-config.yml change (single-file bind mount;
      # see the volumes note). DASHBOARD_VIKUNJA_SHA from the Komodo pre_deploy.
      kdk.config-sha: "${DASHBOARD_VIKUNJA_SHA:-unset}"

  # ---- mealplan sidecar (P2): Tandoor weekly plan + star-rating write-back -
  # Reached by the family browser at home.kmkdp.com/meal/ (home.kmkdp.com/ redirects
  # to /meal/home, the household page). Logs in to Tandoor with the dedicated dashboard account (session auth; REST tokens are off)
  # and reads /api/meal-plan/. Ratings POST back as CookLog entries (see mealplan/app.py).
  mealplan:
    <<: *hardened
    # provenance off: with the containerd image store, BuildKit's provenance
    # attestation gives every (even fully cached) build a new image ID, so each
    # gitops-sync deploy recreated these containers. Off = stable ID, no restart.
    build:
      context: ./mealplan
      provenance: false
    image: kdk/dashboard-mealplan:latest
    # python is PID 1 otherwise and ignores SIGTERM, so every redeploy waited out
    # the 10 s grace and was SIGKILLed (137 -> false "container down" page).
    init: true
    container_name: dashboard-mealplan
    # Non-root (Dockerfile USER too): uid 1000 = the grocery-planner job that
    # shares /pantry. The Komodo pre_deploy chowns /pantry, /state and the
    # mealplan-data volume to 1000 (files written while it ran as root).
    user: "1000:1000"
    # Writes (all volumes, nothing on the rootfs): /data/thaw.json (Thaw ticks),
    # /state/devices.json + /state/manual-forced.json (kitchen pairing, add box),
    # /pantry/freezer.json + .bak (Pantry tab). /tmp: waitress request buffers.
    mem_limit: 384m           # in-memory groceries/recipe/feed caches
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file: [.env]                # TANDOOR_USER/TANDOOR_PASS, KITCHEN_DEVICE_KEY (op-injected); KOMODO_API_KEY/SECRET once minted
    environment:
      TANDOOR_URL: "https://recipes.kmkdp.com"
      TANDOOR_SPACE: "Mack House"
      TZ: America/Chicago
      # admin.kmkdp.com sources (read-only). mon-01 :9090/:9093 need the
      # dashboard-mealplan allow_ctr lines in hosts/kdk-dkr-01/kdk-docker-user.conf;
      # Loki :3100 is already open to every container (allow_dst for Alloy).
      ADMIN_USERS: "jmack"
      PROM_URL: "http://10.1.20.30:9090"
      ALERTMANAGER_URL: "http://10.1.20.30:9093"
      LOKI_URL: "http://10.1.20.21:3100"
    volumes:
      # Read-only view of the grocery-planner's store-routing table so the New Pi
      # groceries tab can link each item to its market.newpi.coop product (the
      # `newpi_url` on a NewPi rule). Same single source of truth the weekly run
      # uses -- no second copy. `../../` is the Komodo repo clone root (same
      # pattern as docs/docs-to-vault), so the path resolves inside the clone.
      # Single-file bind mount: read once at startup, so a foods.yaml edit shows
      # up on the next dashboard redeploy (the container is recreated then).
      - ../../stacks/grocery-planner/recipes/foods.yaml:/app/foods.yaml:ro
      # Pantry + Thaw tabs: the `pantry:` list (cleanup.yaml) and the planner
      # config (`stores:` stock/bulk stores, `thaw:` lead times). Same read-only,
      # read-at-start single-file pattern as foods.yaml. No secrets in either.
      - ../../stacks/grocery-planner/recipes/cleanup.yaml:/app/cleanup.yaml:ro
      - ../../stacks/grocery-planner/config.yaml:/app/planner-config.yaml:ro
      # Thaw-tab ticks (thaw.json, a few lines; pruned each plan week).
      - mealplan-data:/data
      # kitchen.kmkdp.com device registry (devices.json: id, name, issued,
      # last_seen, revoked + hashed one-time pair codes; written atomically).
      # Losing it only means re-pairing the kitchen screen. Also manual-forced.json:
      # the grocery add box's "Manual list instead" entry ids (pruned on read).
      - /opt/kdk-lab/dashboard/kitchen-state:/state
      # Freezer inventory (freezer.json + .bak; the Pantry tab's Freezer section
      # edits it, atomic tmp + rename). A DIRECTORY mount (a rename cannot land
      # on a single-file bind mount). Shared read-write with the grocery-planner
      # job, which plans from it and decrements what a week reserves. The dir is
      # uid 1000 (dashboard pre_deploy install -d + chown); the seed is a hand step.
      - /opt/kdk-lab/dashboard/pantry:/pantry
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.mealplan.rule: "Host(`home.kmkdp.com`) && PathPrefix(`/meal`)"
      traefik.http.routers.mealplan.priority: "10"
      traefik.http.routers.mealplan.middlewares: "forwardauth@file,mealplan-strip"
      traefik.http.middlewares.mealplan-strip.stripprefix.prefixes: "/meal"
      traefik.http.services.mealplan.loadbalancer.server.port: "8080"
      # home.kmkdp.com catch-all (replaces the retired Homepage router): every
      # path that the /meal and /guides routers (priority 10) do not take, "/"
      # included, gets a 302 to the household page. Same forwardauth as the rest
      # of the host. The target is under /meal, so the redirect never loops;
      # temporary (302), so browsers do not cache it. Own router name and
      # priority 2 (Homepage's was "dashboard", priority 1): if the old homepage
      # container is still running after the deploy (compose leaves orphans), its
      # labels neither clash with this router nor win over it.
      traefik.http.routers.home-root.rule: "Host(`home.kmkdp.com`)"
      traefik.http.routers.home-root.priority: "2"
      traefik.http.routers.home-root.service: "mealplan"
      traefik.http.routers.home-root.middlewares: "forwardauth@file,home-to-household"
      traefik.http.middlewares.home-to-household.redirectregex.regex: "^https?://[^/]+/.*"
      traefik.http.middlewares.home-to-household.redirectregex.replacement: "https://home.kmkdp.com/meal/home"
      # kitchen.kmkdp.com: the paired kitchen screen. Internal Traefik only (LAN +
      # Tailscale; never the tunnel or the DMZ). NO forwardauth on purpose: the
      # sidecar wants its signed device cookie (pairing issued from
      # home.kmkdp.com/meal/kitchen/devices) and serves only the kitchen views.
      # The middleware deletes client-sent Remote-* headers (an empty value
      # removes the header) and marks the request with X-Kdk-Kitchen: 1; the
      # sidecar ignores Remote-* on this host as well.
      traefik.http.routers.kitchen.rule: "Host(`kitchen.kmkdp.com`)"
      traefik.http.routers.kitchen.service: "mealplan"
      traefik.http.routers.kitchen.middlewares: "kitchen-headers"
      traefik.http.middlewares.kitchen-headers.headers.customrequestheaders.Remote-User: ""
      traefik.http.middlewares.kitchen-headers.headers.customrequestheaders.Remote-Name: ""
      traefik.http.middlewares.kitchen-headers.headers.customrequestheaders.Remote-Email: ""
      traefik.http.middlewares.kitchen-headers.headers.customrequestheaders.Remote-Groups: ""
      traefik.http.middlewares.kitchen-headers.headers.customrequestheaders.X-Kdk-Kitchen: "1"
      # admin.kmkdp.com: the lab admin page (status strip, alerts, sign-ins,
      # syslog search, charts, service tiles). Internal Traefik only, WITH
      # forwardauth: the Authelia rule for this host is two_factor + user:jmack,
      # and the sidecar checks Remote-User against ADMIN_USERS again (403
      # otherwise). It serves only GET / and /static/* there (404 for the rest).
      traefik.http.routers.dashboard-admin.rule: "Host(`admin.kmkdp.com`)"
      traefik.http.routers.dashboard-admin.service: "mealplan"
      traefik.http.routers.dashboard-admin.middlewares: "forwardauth@file"

volumes:
  mealplan-data: {}           # Thaw-tab tick state (dashboard-mealplan /data)

networks:
  default: {}
  proxy:
    external: true
