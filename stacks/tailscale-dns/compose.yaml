# Tailnet DNS forwarder on kdk-dkr-01. Published on the subnet router's tailnet
# IP (100.66.29.117:53) so tailnet clients resolve via the mesh — reliable even
# on IPv6-only cellular, unlike a subnet-routed IPv4 nameserver. Forwards to the
# lab AdGuard VIPs (10.1.1.53/.54), which keep doing the ad-blocking and
# *.kmkdp.com split-horizon. Set the tailnet nameserver to 100.66.29.117.
# Depends on the tailscale-subnet-router stack (owns tailscale0 / that IP).
name: tailscale-dns
services:
  coredns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    container_name: tailscale-dns
    # Host network + `bind 100.66.29.117` in the Corefile instead of a Docker
    # port mapping on that IP: at host boot Docker starts containers before the
    # subnet router has brought tailscale0 up, the mapping fails with "cannot
    # assign requested address" and Docker does NOT retry a failed start, so the
    # forwarder stayed dead after the 2026-10-26 reboot (remote DNS gone). With
    # host networking CoreDNS itself fails to bind, exits non-zero, and
    # `restart: always` keeps retrying with backoff until tailscale0 exists.
    restart: always
    network_mode: host
    command: ["-conf", "/Corefile"]
    # Recreate CoreDNS on a Corefile change. The Corefile is a single-file bind
    # mount with no `reload` plugin, so CoreDNS reads it only at start and git
    # swaps the file's inode on pull -- a normal `up -d` keeps the old forwarder
    # config. TAILSCALE_DNS_COREFILE_SHA = sha256(Corefile) from the Komodo
    # pre_deploy changes with content and forces the recreate. ATTENDED change:
    # a recreate is a brief tailnet-DNS blip (clients re-resolve), so merge it
    # with eyes on, like the other tailscale-* stacks.
    labels:
      kdk.config-sha: "${TAILSCALE_DNS_COREFILE_SHA:-unset}"
    volumes:
      - ./Corefile:/Corefile:ro
