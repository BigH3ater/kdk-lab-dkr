# scale-bridge on kdk-dkr-02 (10.1.30.21): listens for the household Body Pod 2
# scale over Bluetooth LE, decodes a weigh-in (weight + ten raw impedance values),
# works out whose it is from a weight band, and writes it to that person's wger
# (https://wger.kmkdp.com, /api/ is not behind Authelia; token auth per person).
# No inbound port, no Traefik router, no UI. docs/services/scale-bridge.md.
#
# DRY RUN by default (SCALE_BRIDGE_DRY_RUN below): decode, attribute and log a
# `would_write` line, post nothing. The owner flips it after the first live
# weigh-in (runbook docs/runbooks/scale-bridge.md).
#
# Bluetooth: the host's bluetoothd owns hci0; bleak talks to it over the D-Bus
# system bus, bind-mounted read-only (the same /run/dbus mount Home Assistant
# uses). BlueZ's policy (/usr/share/dbus-1/system.d/bluetooth.conf) lets any uid
# send to org.bluez, but dbus-daemon only accepts a connection from a uid that
# resolves on the HOST: a uid with no host passwd entry (65532) gets
# ConnectionResetError [Errno 104] at startup (first deploy, 2026-11-14). So the
# container runs as nobody:nogroup (65534, present on Debian), non-root with no
# capabilities: no privileged, no NET_ADMIN, no /dev, no host network. The scale takes one
# central at a time: phones with the Hume app open take it first.
#
# Secrets + health data: two host-managed env files (dkr-02 has no op CLI), both
# root:root 600, created by the runbook hand steps BEFORE the first deploy (a
# missing env_file fails the deploy):
#   /opt/kdk-lab/scale-bridge/scale-bridge.env  SCALE_BRIDGE_PEOPLE (weight bands,
#       one JSON line), optional SCALE_ADDRESS, SCALE_BRIDGE_ESPHOME_PROXIES
#   /opt/kdk-lab/scale-bridge/secrets.env       WGER_API_KEY_JMACK / _RACH (from
#       the 1Password items wger-api-jmack / wger-api-rach), relay noise keys
# Examples with made-up values: scale-bridge.env.example, secrets.env.example.
#
# Raw captures (health data): one JSONL file per weigh-in session in
# /opt/kdk-lab/scale-bridge/captures (-> /captures, rw), every notification byte
# for byte, for replaying to the vendor app in paired tests. The directory must
# be created BEFORE the deploy owned by 65534:root, mode 0750 (runbook step 1).
# If it is missing, Docker creates it root:root 0755 on deploy (short-syntax
# bind), the deploy succeeds, the bridge cannot write there: it logs one
# `capture_unavailable` ERROR and runs on without capturing. Files are 0640,
# pruned after SCALE_BRIDGE_CAPTURE_KEEP_DAYS, never logged, never in git.
#
# Body-composition engine (0.2.0): Lefu's 8-electrode library runs in the SAME
# image as a child program, once per weigh-in with a profile (README "Engine").
# Needs LEFU_SECRET_8 in secrets.env; without it the engine switches itself off
# (one `engine_config` warning) and everything else works as before. Dry-run
# phase: results go ONLY to /captures/<capture>.engine.json, never to wger.
# No extra mount, capability or network: the engine needs none at run time.
#
# Image is built locally (kdk/scale-bridge) -> the stack sets auto_pull=false +
# run_build=true in komodo/resources.toml. The build downloads the engine inputs
# from repo1.maven.org and raw.githubusercontent.com (sha256-pinned, engine/*.lock).
name: scale-bridge

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]              # noexec by default; the engine keeps only data there
  restart: unless-stopped
  pids_limit: 128
  mem_limit: 256m            # bridge + one engine run: ~80 MiB peak measured (amd64 test, 0.2.0)
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  scale-bridge:
    <<: *hardened
    # Local build (Komodo run_build, auto_pull off). Bump the tag with the code.
    # provenance off: stable image ID, so a cached rebuild does not recreate it.
    build:
      context: .
      provenance: false
    image: kdk/scale-bridge:0.2.0
    container_name: scale-bridge
    user: "65534:65534"        # host nobody:nogroup; dbus-daemon resets unknown uids
    init: true                 # python is PID 1 otherwise: SIGTERM, zombie reaping
    env_file:
      - /opt/kdk-lab/scale-bridge/scale-bridge.env
      - /opt/kdk-lab/scale-bridge/secrets.env
    environment:
      TZ: America/Chicago
      SCALE_BRIDGE_DRY_RUN: "true"          # owner sets "false" after the first live weigh-in
      WGER_URL: "https://wger.kmkdp.com"
      SCALE_NAME: "Body Pod 2"
      # Placeholder profile written to FFF1 to trigger the impedance measurement.
      # NOT anyone's data and NOT the engine's input: the engine uses each person's
      # own profile from SCALE_BRIDGE_PEOPLE (host file).
      SCALE_PROFILE_SEX: "1"
      SCALE_PROFILE_ACTIVITY: "1"
      SCALE_PROFILE_HEIGHT_CM: "170"
      SCALE_PROFILE_AGE: "30"
      # Raw capture per session (empty = off); files older than KEEP_DAYS are
      # deleted at startup and daily (0 = keep forever).
      SCALE_BRIDGE_CAPTURE_DIR: "/captures"
      SCALE_BRIDGE_CAPTURE_KEEP_DAYS: "60"
      # After the impedance/DF frames, wait this long for the end-of-measurement
      # marker (it carries the heart rate, ~5 s after the lock, handle held).
      SCALE_END_MARKER_WAIT_S: "20"
      # Heart rate to wger ("Heart rate (scale)", bpm): off, because byte 1 of the
      # end marker = heart rate is confirmed on ONE capture so far.
      SCALE_BRIDGE_WRITE_HEART_RATE: "false"
      # Body-composition engine: "on" | "off" (off = the rollback switch).
      # Self-disables when LEFU_SECRET_8 is missing. Results to /captures only.
      SCALE_BRIDGE_ENGINE: "on"
      SCALE_BRIDGE_ENGINE_TIMEOUT_S: "60"
      # Engine inputs, the prototype's known-good configuration. DO NOT CHANGE
      # unless testing: variant 8_4; frame position per library slot LeftArm,
      # RightArm, LeftLeg, RightLeg, Trunk = 1,0,4,3,2; DF x=0 = the 20 kHz input.
      LEFU_VARIANT: "8_4"
      LEFU_LIMB_ORDER: "10432"
      LEFU_DF_X0: "20k"
    volumes:
      # D-Bus system bus -> host bluetoothd. Directory, not the socket file, so a
      # dbus restart (new socket inode) does not leave a stale bind.
      - /run/dbus:/run/dbus:ro
      # Raw weigh-in captures (health data), 65534:root 0750 on the host.
      - /opt/kdk-lab/scale-bridge/captures:/captures:rw
    healthcheck:
      # The main loop touches /tmp/scale-bridge.alive at least every 30 s.
      test: ["CMD", "python", "-I", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/scale-bridge.alive') < 300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Default bridge network: egress to wger.kmkdp.com (and, in relay mode, the
    # proxies' TCP 6053) only. Nothing connects in.
