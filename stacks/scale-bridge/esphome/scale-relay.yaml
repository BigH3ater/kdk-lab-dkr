# Bluetooth relay for the scale bridge: Waveshare ESP32-S3-ETH with PoE module.
# Wired Ethernet only (W5500 over SPI), no Wi-Fi. Pin map from the ESPHome ethernet docs.
esphome:
  name: scale-relay
  friendly_name: Scale relay

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret scale_relay_api_key

ota:
  - platform: esphome
    password: !secret scale_relay_ota_password

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

esp32_ble_tracker:

bluetooth_proxy:
  active: true
