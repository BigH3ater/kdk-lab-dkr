# Nightly one-shot on kdk-dkr-01: ship the whole backup tree (all hosts, staged
# by backup-dkr-01 / backup-dmz / backup-collect) to Proton Drive, encrypted.
# Runs AFTER the staging stages in the nightly procedure. The rclone command +
# exclude set live in offsite.sh (mounted) so Docker Compose interpolation never
# touches its shell $variables. See offsite.sh for the exclude rationale.
name: backup-offsite
services:
  offsite:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    restart: "no"
    entrypoint: ["/bin/sh", "/offsite.sh"]
    volumes:
      - /mnt/backup/dkr:/data
      - /opt/kdk-lab/backup/rclone:/config
      - ./offsite.sh:/offsite.sh:ro
  # CRITICAL: forces DeployStack to block until the Proton sync finishes, so the
  # verify stage runs AFTER .offsite-status is written (offsite.sh always exits
  # 0). Without this, verify runs while rclone is still uploading and false-fails.
  gate:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    restart: "no"
    depends_on:
      offsite: { condition: service_completed_successfully }
    command: ["true"]
