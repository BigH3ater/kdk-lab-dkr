# Nightly one-shot on kdk-dkr-04: ship application state to Proton Drive,
# encrypted. Runs AFTER the staging stages (backup-dkr-01 / backup-dmz /
# backup-collect) in the nightly procedure. Two services, in order:
#   pack    -- writes one tar.zst per host into /data/offsite/ (pack.sh), so the
#              upload is a handful of large objects, not thousands of small files
#              (the Proton API choked on small-file volume and no pass ever
#              finished). Runs first.
#   offsite -- rclone syncs ONLY /data/offsite/ + pve-templates/ + */pgdump/ to
#              the crypt remote (offsite.sh). The rclone command + filters live
#              in offsite.sh (mounted) so Compose interpolation never touches its
#              shell $variables; same for the pack logic in pack.sh.
name: backup-offsite
services:
  # Build the per-host archives. apk-adds tar + zstd at runtime (same pattern as
  # backup-verify's curl), so it is not read_only and has no healthcheck -- both
  # recorded in scripts/compose-baseline-known-gaps.txt. No /config mount: pack
  # must never see the Proton creds. Best-effort; always exits 0.
  pack:
    image: alpine:3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4
    restart: "no"
    entrypoint: ["/bin/sh", "/pack.sh"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - /mnt/backup/dkr:/data
      - ./pack.sh:/pack.sh:ro
  offsite:
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    restart: "no"
    entrypoint: ["/bin/sh", "/offsite.sh"]
    # Pack the archives before the rclone passes read /data/offsite/.
    depends_on:
      pack: { condition: service_completed_successfully }
    volumes:
      - /mnt/backup/dkr:/data
      - /opt/kdk-lab/backup/rclone:/config
      - ./offsite.sh:/offsite.sh:ro
  # CRITICAL: forces DeployStack to block until the Proton sync finishes, so the
  # verify stage runs AFTER .offsite-status is written (offsite.sh always exits
  # 0). Without this, verify runs while rclone is still uploading and false-fails.
  gate:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    restart: "no"
    depends_on:
      offsite: { condition: service_completed_successfully }
    command: ["true"]
