# Nightly one-shot on kdk-dkr-01: collect app state from the three hosts that
# are NOT on the storage NFS net (kdk-dkr-02/03, kdk-mon-01) by pulling their
# /opt/kdk-lab over SSH into the shared backup tree. backup-offsite then ships
# the whole tree to Proton. Best-effort per host: a failed pull leaves the
# host's .last-backup marker stale, which backup-verify turns into a Pushover
# alert -- one host failing never blocks the rest or the offsite/verify stages.
#
# The SSH key is rendered from 1Password by the pre_deploy command (op read ->
# ./id_kdk, 0600) and mounted read-only. Remote reads use `sudo rsync` because
# app data is root-owned (kdkadmin has passwordless sudo on every host).
name: backup-collect
services:
  collect:
    image: instrumentisto/rsync-ssh:alpine
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for spec in kdk-dkr-02:10.1.30.21 kdk-dkr-03:10.1.30.22 kdk-mon-01:10.1.20.30; do
          name="${spec%%:*}"; ip="${spec##*:}"
          echo "== collecting $name ($ip) =="
          if rsync -a --delete --timeout=300 \
               -e "ssh -i /key -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no -o BatchMode=yes" \
               --rsync-path="sudo rsync" \
               --exclude 'stacks/' \
               "kdkadmin@$ip:/opt/kdk-lab/" "/dest/$name/"; then
            touch "/dest/$name/.last-backup"
            echo "   $name OK"
          else
            echo "   $name FAILED (rc=$?) -- marker left stale for backup-verify"
          fi
        done
        exit 0
    volumes:
      - /mnt/backup/dkr:/dest
      - ./id_kdk:/key:ro
