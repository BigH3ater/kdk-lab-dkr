# Nightly one-shot on kdk-dkr-01: collect app state from the three hosts that
# are NOT on the storage NFS net (kdk-dkr-02/03, kdk-mon-01) by pulling their
# /opt/kdk-lab over SSH into the shared backup tree. backup-offsite then ships
# the whole tree to Proton. The pull logic lives in collect.sh (mounted) so
# Docker Compose interpolation never touches its shell $variables.
#
# The SSH key is rendered from 1Password by the pre_deploy command (op read ->
# ./id_kdk, 0600) and mounted read-only.
name: backup-collect
services:
  collect:
    image: instrumentisto/rsync-ssh:alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/collect.sh"]
    volumes:
      - /mnt/backup/dkr:/dest
      - ./id_kdk:/key:ro
      - ./collect.sh:/collect.sh:ro
