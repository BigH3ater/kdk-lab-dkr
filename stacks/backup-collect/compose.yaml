# Nightly one-shot on kdk-dkr-01: collect app state from the three hosts that
# are NOT on the storage NFS net (kdk-dkr-02/03, kdk-mon-01) by pulling their
# /opt/kdk-lab over SSH into the shared backup tree. backup-offsite then ships
# the whole tree to Proton. The pull logic lives in collect.sh (mounted) so
# Docker Compose interpolation never touches its shell $variables.
#
# The SSH key is rendered from 1Password by the pre_deploy command (op read ->
# ./id_kdk, 0600) and mounted read-only.
name: backup-collect
services:
  collect:
    image: instrumentisto/rsync-ssh:alpine3.23-r3@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    restart: "no"
    entrypoint: ["/bin/sh", "/collect.sh"]
    volumes:
      - /mnt/backup/dkr:/dest
      - ./id_kdk:/key:ro
      - ./collect.sh:/collect.sh:ro
  # Forces DeployStack to block until the pulls finish (up -d doesn't wait for a
  # terminal one-shot); collect.sh always exits 0, so this always runs.
  gate:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: "no"
    depends_on:
      collect: { condition: service_completed_successfully }
    command: ["true"]
