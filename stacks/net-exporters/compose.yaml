# Network exporters on kdk-dkr-01, scraped by Prometheus on kdk-mon-01
# (stacks/monitoring/prometheus/prometheus.yml jobs unpoller/adguard/snmp).
# They restore the k3s-era UniFi / AdGuard / SNMP dashboards (Grafana folder
# "Network"). They live here, not on mon-01, to keep the alerting Pi lean.
#
#   unpoller          :9130  UniFi controller (kdk-gw-01) clients/devices/sites,
#                            read-only API key
#   adguard-exporter  :9618  AdGuard Home query/block stats on dns-01/02/03
#   snmp-exporter     :9116  IF-MIB interface counters from the gateway (SNMPv3)
#
# Secrets come from the op-injected .env (see .env.tpl, pre_deploy in
# komodo/resources.toml). The default network comes from dkr-01's IPAM pool.
name: net-exporters

x-log: &log
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  unpoller:
    image: ghcr.io/unpoller/unpoller:v5.9.1@sha256:3bbe07a7acf9328356e1b33c54a346c1b45aa593ee63548435903de5ffac0937
    container_name: unpoller
    restart: unless-stopped
    init: true
    env_file: [.env]               # UP_UNIFI_CONTROLLER_0_API_KEY
    environment:
      UP_POLLER_QUIET: "true"
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      UP_PROMETHEUS_REPORT_ERRORS: "false"
      UP_UNIFI_DYNAMIC: "false"
      # kdk-gw-01 (UDM): the controller is on 443, not 8443.
      UP_UNIFI_CONTROLLER_0_URL: "https://10.1.3.1"
      UP_UNIFI_CONTROLLER_0_SITE_0: "all"
      UP_UNIFI_CONTROLLER_0_VERIFY_SSL: "false"
      UP_UNIFI_CONTROLLER_0_SAVE_SITES: "true"
      UP_UNIFI_CONTROLLER_0_SAVE_DPI: "true"
      UP_UNIFI_CONTROLLER_0_SAVE_IDS: "true"
      # The unpoller_rogueap_rssi panel needs this; it's off by default.
      UP_UNIFI_CONTROLLER_0_SAVE_ROGUE: "true"
      UP_UNIFI_CONTROLLER_0_HASH_PII: "false"
    ports:
      - "10.1.20.20:9130:9130"   # VLAN 20 only; Prometheus on mon-01 scrapes it
    logging: *log

  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.1@sha256:42a9581bae4a91e6d4985415d1fe89ab9b1f50fbe2945a1c122d212d6354b747
    container_name: adguard-exporter
    restart: unless-stopped
    init: true
    env_file: [.env]               # ADGUARD_USERNAMES / ADGUARD_PASSWORDS (one per server)
    environment:
      ADGUARD_SERVERS: "http://10.1.1.120,http://10.1.1.121,http://10.1.1.122"
      INTERVAL: "30s"
      SERVER_ADDR: ":9618"
    ports:
      - "10.1.20.20:9618:9618"   # VLAN 20 only
    logging: *log

  snmp-exporter:
    image: prom/snmp-exporter:v0.31.0@sha256:e5f1aba929145cea2a3bad89c29959efaec0dc26fb87e3761414616a1a392c1c
    container_name: snmp-exporter
    restart: unless-stopped
    init: true
    env_file: [.env]               # SNMP_V3_PASSWORD, expanded into snmp.yml's auths
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
      - "--config.expand-environment-variables"
    volumes:
      # Directory mount, not a single file, so git's new inode is seen on deploy.
      - ./snmp:/etc/snmp_exporter:ro
    ports:
      - "10.1.20.20:9116:9116"   # VLAN 20 only
    logging: *log
