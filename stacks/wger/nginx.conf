# wger's bundled nginx: serves /static/ and /media/ from the shared volumes, proxies
# the app to gunicorn (web:8000) and /ps/ to PowerSync. Adapted from
# wger-project/docker config/nginx.conf at commit bd7851e2 (2026-10-24). Lab changes:
#   * Remote-User / Remote-Email / Remote-Name are forwarded to wger ONLY when the
#     request came from the Traefik side (the shared `proxy` network, inside the
#     kdk-dkr-01 docker pool 10.208.0.0/16) and never from this stack's own backend
#     net (10.208.200.0/24). Traefik strips client-sent copies on every wger router
#     and sets them from Authelia on the forward-auth router (compose.yaml labels).
#   * a local /nginx-health for the compose healthcheck (the image has no `service`).
#   * no JSON access log format (Traefik's access log already goes to Loki).
# Single-file bind mount, read at start: the kdk.config-sha label on the nginx
# service (WGER_NGINX_SHA from the Komodo pre_deploy) recreates nginx on a change.

upstream wger {
    server web:8000;
}

upstream powersync {
    server powersync:8080;
}

# Where did this request come from? 1 = Traefik (proxy network), 0 = anything else.
# Longest prefix wins in geo, so the backend /24 overrides the host pool /16.
geo $kdk_from_traefik {
    default          0;
    10.208.0.0/16    1;
    10.208.200.0/24  0;
}

map $kdk_from_traefik $kdk_remote_user  { 1 $http_remote_user;  default ""; }
map $kdk_from_traefik $kdk_remote_email { 1 $http_remote_email; default ""; }
map $kdk_from_traefik $kdk_remote_name  { 1 $http_remote_name;  default ""; }

map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    # Increase max body size to allow for image uploads (videos are off, see compose)
    client_max_body_size 100M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://wger;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # Header auth (AUTH_PROXY_HEADER=HTTP_REMOTE_USER). An empty value drops the
        # header, so a request that did not come through Traefik carries none.
        proxy_set_header Remote-User  $kdk_remote_user;
        proxy_set_header Remote-Email $kdk_remote_email;
        proxy_set_header Remote-Name  $kdk_remote_name;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # PowerSync (app offline mode). Auth is the app's JWT, not Authelia.
    location /ps/ {
        proxy_pass http://powersync/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header Remote-User  "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name  "";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Sync streams are long-lived and must not be buffered or cut off.
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    location /static/ {
        root /wger;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;

        location ~ "\.[0-9a-f]{12}\.[^./]+$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }
    }

    location /media/ {
        alias /wger/media/;
    }
}
