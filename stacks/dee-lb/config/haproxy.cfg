# HAProxy in front of the two single-slot DeeZy wrappers (kdk-dee-01/-02).
# The Tdarr flow (step dee1 "3b. DEE dispatch") POSTs /encode to ONE name
# (dee-lb.kmkdp.com:8484); HAProxy spreads jobs across the two DEE slots.
#
# Each wrapper is SINGLE-SLOT (returns 503 "encoder busy" on a 2nd concurrent
# job), so maxconn 1 per server guarantees one encode per backend; leastconn
# routes the next job to the free wrapper. When BOTH are busy the request waits
# in the queue (timeout queue) instead of failing -- this matches the flow's
# "wait up to 1 h for the DEE slot" behaviour rather than falling back to native
# E-AC-3 (which would lose Atmos). Encodes run up to ~2 h (TrueHD Atmos 7.1),
# so server/client timeouts are deliberately huge. /healthz stays 200 while a
# wrapper is mid-encode, so the health check does not flap during a job.

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client  10800s   # 3 h: a POST /encode holds the connection open
    timeout server  10800s   # 3 h: longest observed Atmos encode ~1h48m
    timeout queue   7200s    # 2 h: wait for a free DEE slot before giving up
    retries 0                # do NOT silently resend a long encode

frontend dee_in
    bind *:8484
    default_backend dee_pool

backend dee_pool
    balance leastconn
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    # One encode per wrapper (single-slot). check on /healthz every 15s.
    server dee01 10.1.1.130:8484 maxconn 1 check inter 15s fall 3 rise 2
    server dee02 10.1.1.131:8484 maxconn 1 check inter 15s fall 3 rise 2

# HAProxy stats (per-backend up/down for monitoring) on :8405.
frontend stats
    bind *:8405
    mode http
    stats enable
    stats uri /
    stats refresh 10s
