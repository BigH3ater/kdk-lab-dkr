# Out-of-cluster Alertmanager on kdk-mon-01.
#
# TWO transports, per the alerting standard (docs/reference/alerting-standards.md):
#   - Pushover (SaaS): every PAGE-worthy alert (critical + warning), firing and
#     resolved. Cluster-independent by design, so an outage of the rest of the
#     estate never silences paging.
#   - Email, through the in-lab Proton SMTP bridge on kdk-dkr-01 (10.1.20.20:25),
#     in two roles: (a) severity=critical is ALSO e-mailed (receiver email-ops) --
#     a second, durable record of what matters most, NOT a replacement for
#     Pushover; (b) severity=info is e-mailed ONLY (receiver email-info), batched
#     into a ~6 h digest -- app-notification/provenance alerts that never page
#     (owner decision 2026-10-30).
#
# SECRETS (never committed; hand-rendered on kdk-mon-01, see compose.yaml):
#   - Pushover user_key + app token: 1Password kdk-cluster/pushover-kdk-lab,
#     written 0600 as pushover-user-key / pushover-app-token (owned by the
#     container's nobody:65534 so the receiver can read them).
#   - Proton bridge SMTP password: 1Password kdk-cluster/proton-bridge-smtp
#     (field `password`), written 0600 as proton-bridge-smtp-password (same
#     owner). The SMTP username is the Proton account address, NOT a secret --
#     it is committed inline below (smtp_auth_username), matching the identical
#     value in stacks/identity/authelia/configuration.yml.
#
# The bridge speaks plain SMTP with STARTTLS and presents a self-signed cert,
# so insecure_skip_verify is required (same as Authelia's notifier, apps.md).
# The bridge runs on kdk-dkr-01, so this e-mail leg shares a failure domain
# with that host; Pushover does not. That is the accepted trade: mail is the
# bonus channel for criticals, Pushover is the one that must always work.

global:
  smtp_smarthost: '10.1.20.20:25'
  smtp_from: 'no-reply@kmkdp.com'
  smtp_auth_username: 'kdk.lab@pm.me'
  smtp_auth_password_file: /etc/alertmanager/proton-bridge-smtp-password
  smtp_require_tls: true

route:
  receiver: pushover
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # CRITICAL (any source, Loki or Prometheus): high-priority Pushover AND an
    # e-mail to the owner. The `email-ops` receiver carries BOTH notifiers, so a
    # critical is never e-mail-only and never Pushover-only -- it is the single
    # home for criticals, matched first so nothing below can steal it.
    - matchers: ['severity="critical"']
      receiver: email-ops
      group_by: ["alertname", "host"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    # INFO + notify=phone: security-adjacent info alerts (2FA change, Wizarr /
    # Libreseerr admin writes, Jellyfin login from the internet) the owner wants
    # to feel promptly. A QUIET Pushover (priority -1, like the old info path),
    # then `continue: true` so it ALSO falls through to the e-mail digest below.
    # Short group_wait/group_interval so each event reaches the phone in seconds,
    # not on the 6 h digest cadence. Matched before the generic info route.
    - matchers: ['severity="info"', 'notify="phone"']
      receiver: pushover-quiet
      continue: true
      group_by: ["alertname"]
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 24h
    # INFO (any source): app-notification / provenance alerts -- the owner's
    # decision (2026-10-30) is that these go to Alertmanager and out by E-MAIL,
    # not Pushover. Matched before the source="loki" route below so every info
    # rule lands here. Grouped hard into a ~6 h digest with a 24 h repeat because
    # two info rules are high-volume (2026-10-31: KomodoManualDeploy ~35 non-
    # gitops DeployStack/day, RequestAppsContainerChange ~32 seerr image events/
    # day) and must never flood the mailbox one message at a time. The phone
    # route above sets continue:true, so a notify=phone alert reaches here too.
    - matchers: ['severity="info"']
      receiver: email-info
      group_by: ["alertname"]
      group_wait: 5m
      group_interval: 6h
      repeat_interval: 24h
    # Loki ruler alerts (stacks/loki/rules/, sent from kdk-log-01 to
    # 10.1.20.30:9093) that are NOT critical and NOT info (i.e. warning).
    # Grouped per host so one silent host is one page. Pushover.
    - matchers: ['source="loki"']
      receiver: pushover
      group_by: ["alertname", "host"]
      repeat_interval: 4h

receivers:
  - name: pushover
    pushover_configs:
      - user_key_file: /etc/alertmanager/pushover-user-key
        token_file: /etc/alertmanager/pushover-app-token
        send_resolved: true
        priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
        message: >-
          {{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}
        url_title: 'Open Alertmanager'
        html: false

  # QUIET Pushover (priority -1), same credentials as `pushover`, for the
  # security-adjacent `severity=info, notify=phone` alerts. send_resolved off
  # (info is point-in-time). The route sets continue:true so these ALSO go to
  # the e-mail digest; this receiver is only the prompt phone ping.
  - name: pushover-quiet
    pushover_configs:
      - user_key_file: /etc/alertmanager/pushover-user-key
        token_file: /etc/alertmanager/pushover-app-token
        send_resolved: false
        priority: '-1'
        title: '[INFO] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
        message: >-
          {{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
          {{ end }}
        url_title: 'Open Alertmanager'
        html: false

  # INFO receiver: e-mail ONLY (no Pushover), through the same Proton bridge
  # smarthost as email-ops. This is where app-notification / provenance alerts
  # land per the owner's 2026-10-30 decision. send_resolved is off (an info
  # event is a point-in-time note, not an outage that "resolves") and the route
  # groups into a ~6 h digest, so a busy info rule arrives as one mail, not many.
  - name: email-info
    email_configs:
      - to: 'admin@kmkdp.com'
        send_resolved: false
        require_tls: true
        tls_config:
          # Proton bridge presents a self-signed cert on STARTTLS (apps.md).
          insecure_skip_verify: true
        headers:
          Subject: '[INFO] {{ .CommonLabels.alertname }} ({{ .Alerts | len }}) — kdk-lab'
        html: ''
        text: >-
          {{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
          {{ if .Annotations.description }}
          {{ .Annotations.description }}{{ end }}
          {{ if .Annotations.runbook }}runbook: {{ .Annotations.runbook }}{{ end }}
          labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
          Open Alertmanager: https://alertmanager.kmkdp.com

  # CRITICAL receiver: Pushover (so every alert still reaches Pushover) PLUS an
  # e-mail to the owner's mailbox. admin@kmkdp.com is the lab's administrative
  # inbox (the ACME/LLDAP/roborock-cert contact used across the repo); change it
  # here if a dedicated ops mailbox is created.
  - name: email-ops
    pushover_configs:
      - user_key_file: /etc/alertmanager/pushover-user-key
        token_file: /etc/alertmanager/pushover-app-token
        send_resolved: true
        priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
        message: >-
          {{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}
        url_title: 'Open Alertmanager'
        html: false
    email_configs:
      - to: 'admin@kmkdp.com'
        send_resolved: true
        require_tls: true
        tls_config:
          # Proton bridge presents a self-signed cert on STARTTLS (apps.md).
          insecure_skip_verify: true
        headers:
          Subject: '[CRITICAL] {{ .CommonLabels.alertname }} ({{ .Alerts | len }}) — kdk-lab'
        html: ''
        text: >-
          {{ range .Alerts }}{{ .Status | toUpper }}: {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
          {{ if .Annotations.description }}
          {{ .Annotations.description }}{{ end }}
          {{ if .Annotations.runbook }}runbook: {{ .Annotations.runbook }}{{ end }}
          labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
          Open Alertmanager: https://alertmanager.kmkdp.com

# One incident, one page. On 2026-10-30 a stale compose unit removed the
# published :9093 and THREE alerting-pipeline alerts described the same fault at
# once (Alertmanager unreachable + the Loki ruler could not notify / had no AM).
# When AlertmanagerDown is firing, the ruler-side consequences are guaranteed and
# redundant, so suppress them -- but NOT LokiRulerConfigReloadFailed, which is an
# unrelated bad-rule fault that must still surface during an AM outage.
inhibit_rules:
  - source_matchers: ['alertname="AlertmanagerDown"']
    target_matchers: ['alertname=~"LokiRulerCannotNotify|LokiRulerNoAlertmanager"']
  # A correlated monitoring blackout (MonitoringBlackout, service.yml) explains
  # every individual reachability alert firing at once -- the 2026-10-27 shape
  # (~18 targets down across 4 hosts/subnets = 15+ pages). While it fires,
  # suppress the per-target reachability alerts so a blackout pages ONCE; the
  # detail stays in the Alertmanager UI. No `equal`: a blackout is global, so
  # every one of these is part of the same incident.
  - source_matchers: ['alertname="MonitoringBlackout"']
    target_matchers: ['alertname=~"InstanceDown|EndpointDown|SmartHomeEndpointDown|CadvisorDown|NetExporterDown"']
