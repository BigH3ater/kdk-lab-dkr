# Service + host alerts for the migrated Komodo/compose estate.
groups:
  - name: hosts
    rules:
      - alert: InstanceDown
        expr: up{job="node-external"} == 0
        for: 5m
        labels: {severity: critical, source: external-monitor, scope: service}
        annotations:
          summary: "service: node_exporter down ({{ $labels.instance }})"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: "node_exporter on {{ $labels.instance }} has been unscrapable for 5m."

      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 5m
        labels: {severity: warning, source: external-monitor, scope: service}
        annotations:
          summary: "service: cAdvisor down ({{ $labels.instance }})"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: "Container metrics for {{ $labels.instance }} are unavailable for 5m."

      - alert: NetExporterDown
        expr: up{job=~"unpoller|adguard|snmp"} == 0
        for: 10m
        labels: {severity: warning, source: external-monitor, scope: service}
        annotations:
          summary: "service: {{ $labels.job }} exporter down on kdk-dkr-01"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: "The Network dashboards (UniFi / AdGuard / SNMP) are blind: {{ $labels.job }} has been unscrapable for 10m. Check the net-exporters stack."

      - alert: HostDiskSpaceLow
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
          / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 30m
        labels: {severity: warning, source: external-monitor, scope: service}
        annotations:
          summary: "service: root filesystem below 10% free ({{ $labels.instance }})"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: "Less than 10% free on / for 30m on {{ $labels.instance }}."

      # kdk-nas-01 (10.1.3.5) is excluded: its RAM is ZFS ARC, which is
      # reclaimable and reported as "used" — 90%+ is normal, not pressure.
      - alert: HostMemoryHigh
        expr: >-
          (1 - node_memory_MemAvailable_bytes{instance!="10.1.3.5:9100"}
           / node_memory_MemTotal_bytes{instance!="10.1.3.5:9100"}) > 0.90
        for: 15m
        labels: {severity: warning, source: external-monitor, scope: service}
        annotations:
          summary: "service: memory above 90% ({{ $labels.instance }})"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: "Available memory below 10% for 15m on {{ $labels.instance }}."

  # Per-container crash/unhealthy alerting is handled by the Docker-events
  # watcher in stacks/observability-agent (Docker API -> Pushover), because
  # cAdvisor cannot resolve container names under the containerd-snapshotter
  # storage driver on these hosts.

  - name: containers
    rules:
      # A container was OOM-killed by the kernel cgroup limit. cAdvisor v0.60.6
      # (reads /dev/kmsg) exports container_oom_events_total with the compose
      # stack/service labels; the prometheus.yml metric_relabel renames them to
      # stack/service and adds host. Motivated by media/tdarr-node, which got a
      # mem_limit after a runaway encode OOM-killed it on kdk-dkr-01 (47 GB host,
      # ~43 GB RSS) on 2026-10-28: with the limit the job dies, not the host, and
      # this makes that kill visible instead of a silent node restart.
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name!=""}[15m]) > 0
        for: 0m
        labels: {severity: warning, source: external-monitor}
        annotations:
          summary: "{{ $labels.service }} OOM-killed on {{ $labels.host }}"
          description: >-
            The kernel OOM killer fired for container {{ $labels.name }}
            (stack {{ $labels.stack }}) on {{ $labels.host }}. A single job hit
            the container mem_limit and was killed; the host stayed up. Check the
            container's memory ceiling and the workload that ballooned (for
            tdarr-node: a software-decoded 4K source or a DEE remux).

  - name: endpoints
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox-service"} == 0
        for: 5m
        labels: {severity: critical, source: external-monitor, scope: service}
        annotations:
          summary: "service: endpoint DOWN ({{ $labels.instance }})"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: >-
            The HTTPS probe of {{ $labels.instance }} from kdk-mon-01 has failed
            for 5m (a ForwardAuth 302 counts as up, so this is a real outage).

      # Every blackbox-* job that yields probe_ssl_earliest_cert_expiry, not just
      # blackbox-service: api-slave.kmkdp.com:555 (the Roborock local server, real
      # LE cert) is probed by job="blackbox-http-app", so job="blackbox-service"
      # never fired for it (2026-10-29). blackbox-dns has no TLS and emits no such
      # series, so the wider matcher adds no false positives.
      - alert: TLSCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"blackbox-.*"} - time()) < 14 * 86400
        for: 1h
        labels: {severity: warning, source: external-monitor, scope: service}
        annotations:
          summary: "service: TLS cert expires in under 14 days ({{ $labels.instance }})"
          runbook: docs/runbooks/pushover-alerts.md#service-and-host-alerts
          description: "ACME renewal for {{ $labels.instance }} may be failing — check the Traefik cf resolver (most names) or the roborock-cert lego one-shot (api-slave.kmkdp.com)."
