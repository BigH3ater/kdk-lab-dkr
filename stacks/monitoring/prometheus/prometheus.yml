# Scrape config for the out-of-cluster monitor on kdk-mon-01.
#
# Everything here is reachable WITHOUT the k3s cluster (now retired) and covers
# the migrated Komodo/compose estate: BMC thermals, host metrics, container
# metrics (cAdvisor), and HTTP reachability of the *.kmkdp.com services.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    source: external-monitor
    host: kdk-mon-01

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- BMC thermals, fans, power (Redfish via idrac-exporter) ---------------
  - job_name: idrac
    metrics_path: /metrics
    scrape_interval: 120s
    scrape_timeout: 60s
    static_configs:
      - targets: ["10.1.3.86"]
        labels: {instance_name: kdk-hyp-01, model: R720}
      - targets: ["10.1.3.25"]
        labels: {instance_name: kdk-nas-01, model: R730xd}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: idrac-exporter:9348

  # --- host metrics (node_exporter) -----------------------------------------
  # The two VMs run node_exporter via the observability-agent's node-exporter
  # stack; the three Pis run it as a package. Non-cluster infra keeps its
  # exporters too.
  - job_name: node-external
    static_configs:
      - targets:
          - "10.1.20.20:9100"   # kdk-dkr-01  (VM)
          - "192.168.191.20:9100" # kdk-dkr-dmz-01 (VM)
          - "10.1.20.30:9100"   # kdk-mon-01  (this host)
          - "10.1.30.21:9100"   # kdk-dkr-02  (Pi, HA)
          - "10.1.30.22:9100"   # kdk-dkr-03  (Pi, HomeKit)
          - "10.1.1.100:9100"   # kdk-hyp-01  (Proxmox)
          - "10.1.3.5:9100"     # kdk-nas-01  (TrueNAS)
          - "10.1.1.102:9100"   # kdk-pbs-01
          - "10.1.1.120:9100"   # kdk-dns-01
          - "10.1.1.121:9100"   # kdk-dns-02
          - "10.1.1.122:9100"   # kdk-dns-03

  # --- container metrics (cAdvisor on every compose host, :9280) ------------
  - job_name: cadvisor
    # host = the hostname, matching Loki's host label, so a dashboard can go from
    # a container's metrics to its logs.
    static_configs:
      - {targets: ["10.1.20.20:9280"], labels: {host: kdk-dkr-01}}
      - {targets: ["192.168.191.20:9280"], labels: {host: kdk-dkr-dmz-01}}
      - {targets: ["10.1.20.30:9280"], labels: {host: kdk-mon-01}}
      - {targets: ["10.1.30.21:9280"], labels: {host: kdk-dkr-02}}
      - {targets: ["10.1.30.22:9280"], labels: {host: kdk-dkr-03}}
    metric_relabel_configs:
      # Keep only what the Containers dashboards use: per-container series
      # x ~60 cAdvisor families would roughly double this Pi's TSDB for nothing.
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|memory_(working_set_bytes|usage_bytes|rss|cache)|spec_memory_limit_bytes|oom_events_total|network_(receive|transmit)_(bytes|packets_dropped)_total|fs_(reads|writes)_bytes_total|last_seen|start_time_seconds)|machine_(cpu_cores|memory_bytes)"
        action: keep
      # Short stack/service labels instead of cAdvisor's long whitelisted-label names.
      - source_labels: [container_label_com_docker_compose_project]
        target_label: stack
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_com_docker_compose_(project|service)
        action: labeldrop

  # --- is it alive at all (ICMP) --------------------------------------------
  - job_name: blackbox-icmp
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets:
          - "10.1.1.100"        # Proxmox host
          - "10.1.3.5"          # TrueNAS host
          - "10.1.3.86"         # kdk-hyp-01 BMC
          - "10.1.3.25"         # kdk-nas-01 BMC
          - "10.1.1.1"          # gateway
          - "10.1.1.53"         # AdGuard VIP
          - "10.1.20.20"        # kdk-dkr-01
          - "192.168.191.20"    # kdk-dkr-dmz-01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- DNS answers, not just ping -------------------------------------------
  - job_name: blackbox-dns
    metrics_path: /probe
    params: {module: [dns_kmkdp]}
    static_configs:
      - targets: ["10.1.1.53", "10.1.1.120", "10.1.1.121", "10.1.1.122"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- smart-home app endpoints (compose on the Pis) ------------------------
  - job_name: blackbox-http-app
    metrics_path: /probe
    params: {module: [http_app]}
    static_configs:
      - targets:
          - "http://10.1.30.21:8123"    # Home Assistant  (kdk-dkr-02)
          - "http://10.1.30.22:11080"   # Scrypted        (kdk-dkr-03)
          - "http://10.1.30.22:8581"    # Homebridge UI   (kdk-dkr-03)
          # Node-RED owns ALL Roborock automation — a dead editor endpoint means
          # no schedules/cleans fire. Not port-published; probe via the Pi Traefik.
          - "https://nodered.kmkdp.com"
          # Local Roborock server (kdk-dkr-01 apps stack) — the vacuum's only
          # cloud; real LE cert for api-slave.kmkdp.com.
          - "https://api-slave.kmkdp.com:555/healthz"
          # Vikunja — source of truth for household + vacuum-maintenance chores.
          - "https://tasks.kmkdp.com"
        labels: {tier: smart-home}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- migrated *.kmkdp.com services (HTTPS via Traefik) --------------------
  # http_app accepts 2xx/3xx/401/403, so a ForwardAuth 302 to sso counts as
  # UP. Also yields probe_ssl_earliest_cert_expiry for cert-expiry alerting.
  - job_name: blackbox-service
    metrics_path: /probe
    params: {module: [http_app]}
    static_configs:
      - targets:
          - "https://komodo.kmkdp.com"
          - "https://docs.kmkdp.com"
          - "https://sso.kmkdp.com"
          - "https://users.kmkdp.com"
          - "https://seerr.kmkdp.com"
          - "https://jellyfin.kmkdp.com"
          - "https://immich.kmkdp.com"
          # *arr apps: probe the anonymous /ping (Authelia bypass rule for exactly
          # ^/ping$) so the probe reaches the app instead of logging an Authelia
          # denial every 15 s. Bazarr/SABnzbd/Tdarr have no confirmed anonymous
          # health path yet and still probe / (ForwardAuth 302 = UP).
          - "https://sonarr.kmkdp.com/ping"
          - "https://radarr.kmkdp.com/ping"
          - "https://prowlarr.kmkdp.com/ping"
          - "https://bazarr.kmkdp.com"
          - "https://sabnzbd.kmkdp.com"
          - "https://tdarr.kmkdp.com"
          - "https://remarkable.kmkdp.com"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- network exporters on kdk-dkr-01 (stacks/net-exporters) --------------
  - job_name: unpoller
    scrape_interval: 60s          # unpoller polls the controller once per scrape
    scrape_timeout: 30s
    static_configs:
      - targets: ["10.1.20.20:9130"]

  - job_name: adguard
    static_configs:
      - targets: ["10.1.20.20:9618"]

  # SNMPv3 IF-MIB walk of the UniFi gateway through snmp-exporter (auth/module
  # live in stacks/net-exporters/snmp/snmp.yml).
  - job_name: snmp
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      module: [if_mib, system_info]
      auth: [unifi_v3]
    static_configs:
      - targets: ["10.1.3.1"]
        labels: {target: kdk-gw-01}  # the SNMP dashboard's $target variable
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.1.20.20:9116

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
