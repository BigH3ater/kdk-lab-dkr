# promtool unit tests for the rules reviewed on 2026-10-31.
# Run from the repo root:
#   docker run --rm -v "$PWD/stacks/monitoring/prometheus:/p:ro" \
#     prom/prometheus:v3.15.1 promtool test rules /p/tests/*_test.yml
# These files live OUTSIDE rules/ on purpose: Prometheus globs rules/*.yml and
# would try to load a test file as a rule group.
rule_files:
  - ../rules/service.yml

evaluation_interval: 1m

tests:
  # The OOM signal at the centre of the 2026-10-31 review: a single increase of
  # container_oom_events_total fires ContainerOOMKilled with the container's
  # host/service/stack labels (added by the cAdvisor metric_relabel).
  - interval: 1m
    input_series:
      - series: 'container_oom_events_total{name="media-tdarr-node-1",service="tdarr-node",stack="media",host="kdk-dkr-01"}'
        values: '0+0x15 1+0x5'
    alert_rule_test:
      - eval_time: 18m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              source: external-monitor
              scope: containers
              name: media-tdarr-node-1
              service: tdarr-node
              stack: media
              host: kdk-dkr-01
            exp_annotations:
              summary: "tdarr-node OOM-killed on kdk-dkr-01"
              runbook: "docs/runbooks/pushover-alerts.md#containers"
              description: "The kernel OOM killer fired for container media-tdarr-node-1 (stack media) on kdk-dkr-01. A single job hit the container mem_limit and was killed; the host stayed up. Check the container's memory ceiling and the workload that ballooned (for tdarr-node: a software-decoded 4K source or a DEE remux)."

  # No OOM in the window -> ContainerOOMKilled does not fire (flat counter).
  - interval: 1m
    input_series:
      - series: 'container_oom_events_total{name="media-tdarr-node-1",service="tdarr-node",stack="media",host="kdk-dkr-01"}'
        values: '8+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: ContainerOOMKilled
        exp_alerts: []

  # InstanceDown holds its 5m `for:` before firing.
  - interval: 1m
    input_series:
      - series: 'up{job="node-external",instance="10.1.20.20:9100"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: InstanceDown
        exp_alerts: []
      - eval_time: 6m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              source: external-monitor
              scope: service
              job: node-external
              instance: "10.1.20.20:9100"
            exp_annotations:
              summary: "service: node_exporter down (10.1.20.20:9100)"
              runbook: "docs/runbooks/pushover-alerts.md#service-and-host-alerts"
              description: "node_exporter on 10.1.20.20:9100 has been unscrapable for 5m."

  # MonitoringBlackout fires on the 2026-10-27 shape: ~18 targets down at once
  # across jobs/hosts/subnets (7 scrape targets up==0 + 11 blackbox probes
  # probe_success==0), well over the N=10 threshold, held past for:2m.
  - interval: 1m
    input_series:
      # up==0: InstanceDown x3 (node-external), CadvisorDown x1, NetExporter x3
      - { series: 'up{job="node-external",instance="10.1.1.100:9100"}',  values: '0+0x5' }
      - { series: 'up{job="node-external",instance="10.1.1.120:9100"}',  values: '0+0x5' }
      - { series: 'up{job="node-external",instance="10.1.20.20:9100"}',  values: '0+0x5' }
      - { series: 'up{job="cadvisor",instance="10.1.20.20:9280"}',       values: '0+0x5' }
      - { series: 'up{job="snmp",instance="snmp"}',                      values: '0+0x5' }
      - { series: 'up{job="adguard",instance="adguard"}',                values: '0+0x5' }
      - { series: 'up{job="unpoller",instance="unpoller"}',              values: '0+0x5' }
      # probe_success==0: EndpointDown x9 (blackbox-service) + SmartHome x2
      - { series: 'probe_success{job="blackbox-service",instance="https://bazarr.kmkdp.com"}',    values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://docs.kmkdp.com"}',      values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://komodo.kmkdp.com"}',    values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://prowlarr.kmkdp.com"}',  values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://radarr.kmkdp.com"}',    values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://sabnzbd.kmkdp.com"}',   values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://sonarr.kmkdp.com"}',    values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://tdarr.kmkdp.com"}',     values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-service",instance="https://remarkable.kmkdp.com"}',values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-http-app",instance="https://api-slave.kmkdp.com:555/healthz"}', values: '0+0x5' }
      - { series: 'probe_success{job="blackbox-http-app",instance="https://tasks.kmkdp.com"}',    values: '0+0x5' }
    alert_rule_test:
      - eval_time: 3m
        alertname: MonitoringBlackout
        exp_alerts:
          - exp_labels:
              severity: critical
              source: external-monitor
              scope: availability
            exp_annotations:
              summary: "monitoring blackout: 10+ targets unreachable from kdk-mon-01"
              runbook: "docs/runbooks/pushover-alerts.md#monitoring-blackout"
              description: "At least 10 scrape targets and/or blackbox probes are down at once -- a correlated reachability loss, not a single service. The individual InstanceDown/EndpointDown/SmartHomeEndpointDown/CadvisorDown/ NetExporterDown alerts are inhibited; open the Alertmanager UI to see which targets. Check the kdk-mon-01 uplink/DNS and the path to the affected hosts/subnets before assuming each service failed."

  # A single host reboot (2 scrape targets down) is below N=10: MonitoringBlackout
  # stays quiet and the individual alerts page with their detail.
  - interval: 1m
    input_series:
      - { series: 'up{job="node-external",instance="10.1.30.21:9100"}', values: '0+0x5' }
      - { series: 'up{job="cadvisor",instance="10.1.30.21:9280"}',      values: '0+0x5' }
      - { series: 'up{job="node-external",instance="10.1.20.20:9100"}', values: '1+0x5' }
    alert_rule_test:
      - eval_time: 3m
        alertname: MonitoringBlackout
        exp_alerts: []
