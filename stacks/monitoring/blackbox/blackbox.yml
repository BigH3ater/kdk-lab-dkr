modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  # Resolves a name this homelab actually owns, against the resolver being
  # probed. A generic query to 8.8.8.8 would pass while internal resolution
  # was broken -- which is the failure worth catching.
  dns_kmkdp:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: scrypted.kmkdp.com
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp: ["scrypted.kmkdp.com.*\\s+A\\s+10\\.1\\.30\\.\\d+"]

  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      fail_if_ssl: false

  # Smart-home app endpoints (Home Assistant, Scrypted, Homebridge). These
  # legitimately answer with a login redirect (Scrypted -> 302) or an auth
  # challenge, so a strict 2xx check would report a HEALTHY endpoint as down.
  # Success here means "the app responded with a real HTTP status". TLS
  # verification is skipped because Scrypted's own :10443 uses a self-signed
  # cert (the HTTP :11080 endpoint is what is probed, but keep this tolerant).
  http_app:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 401, 403]
      fail_if_ssl: false
      tls_config:
        insecure_skip_verify: true
  tcp_connect:
    prober: tcp
    timeout: 5s
