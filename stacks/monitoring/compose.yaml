# Out-of-cluster monitoring -- kdk-mon-01 (10.1.20.30), VLAN 20.
#
# WHY THIS EXISTS OUTSIDE k3s
# ---------------------------------------------------------------------
# kube-prometheus-stack and idrac-exporter both run IN the cluster, on VMs
# hosted by the two machines they monitor. So the moment either server is
# down -- exactly when thermals and reachability matter most -- the
# monitoring is down with it, and nothing records why.
#
# Measured 2026-08-24: with the cluster down, idrac-exporter collected
# nothing, ntp.kmkdp.com went NXDOMAIN, and the only way to read a fan speed
# was ipmitool by hand.
#
# This stack shares no failure domain with what it watches: a Pi on its own
# power and its own network path, monitoring the servers over their BMCs.
# It is deliberately NOT a replacement for the in-cluster stack -- that one
# has the history, the dashboards and the alert routing. This one answers
# "what is happening while that is down".
#
# WHY NOT kdk-dkr-02, WHICH HAS MORE HEADROOM
# ---------------------------------------------------------------------
# Because compose/scrypted-homebridge/docker-compose.yml says Scrypted is
# alone on that board on purpose: it was OOMKilled repeatedly on a Pi 5 and
# its 4 GiB limit is meant to be a ceiling rather than a competition.
# kdk-mon-01 (Pi 5, 8 GiB) is dedicated to this stack.
---
services:
  # Redfish, not IPMI. It reads the BMC over HTTPS, so it needs no agent on
  # the host and keeps working while the host is powered OFF -- which is the
  # entire point of monitoring a server's thermals from outside it.
  idrac-exporter:
    # 2.6.2, not a v-prefixed tag: this project has never used that scheme.
    # An invented `v0.9.0` failed the pull, and because compose pulls
    # atomically it took the other three images down with it -- the same
    # failure mode as the homebridge date-tag on 2026-08-24.
    image: ghcr.io/mrlhansen/idrac_exporter:2.6.2
    container_name: idrac-exporter
    restart: unless-stopped
    environment:
      # Credentials come from the environment, not a mounted config file:
      # a rendered config would be a second copy of the iDRAC password on
      # disk. See sample-config.yml upstream for the full CONFIG_* set.
      CONFIG_ADDRESS: "0.0.0.0"
      CONFIG_PORT: "9348"
      CONFIG_DEFAULT_USERNAME: "${IDRAC_USERNAME}"
      CONFIG_DEFAULT_PASSWORD: "${IDRAC_PASSWORD}"
      CONFIG_METRICS_SENSORS: "true"   # fan RPM + temperatures -- the ask
      CONFIG_METRICS_POWER: "true"
      # Only those two groups. system/storage/memory are collected by the
      # in-cluster idrac-exporter already, and every extra group is another
      # Redfish walk on a BMC that idrac-fan-control shares over IPMI
      # (2026-09-02: the R730xd dropped the controller's reads 1-2x/hour
      # under the combined load). Both knobs below are read from the
      # environment by 2.6.2 (internal/config/env.go: getEnvUint
      # CONFIG_TIMEOUT / CONFIG_CONCURRENCY); defaults are 10 and 10.
      CONFIG_TIMEOUT: "30"             # per-request seconds; the BMC is slow, not down
      CONFIG_CONCURRENCY: "2"          # parallel Redfish requests per scrape
    expose: ["9348"]

  # Availability probing only. Blackbox cannot read a sensor -- it answers
  # "did this endpoint respond, and how fast". Paired with idrac-exporter it
  # covers both halves: is the box alive, and is it cooking.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose: ["9115"]

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus-ext
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 30d on a 440 GB disk. This is the record that outlives an outage,
      # so it is sized to cover one comfortably rather than to be small.
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/scrape_configs:/etc/prometheus/scrape_configs:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # The one thing this stack could not do before 2026-08-30: turn a failed
  # probe into a notification. It records but never alerted, which is why the
  # Home Assistant outage that day went unnoticed. Routes to the SAME private
  # ntfy the in-cluster Alertmanager uses (ntfy.kmkdp.com / kdk-alerts), reached
  # over the public/split-horizon hostname since the in-cluster
  # ntfy.ntfy.svc.cluster.local name is not resolvable from this board.
  #
  # LIMITATION, stated plainly and UNRESOLVED: that hostname traverses cluster
  # Traefik + the ntfy pod, so a FULL cluster outage silences this path -- and
  # as of ADR 0012 the e-mail leg below submits through the in-cluster relay,
  # so a full cluster outage silences that too. Both transports on this board
  # now share the cluster's failure domain. That is the accepted cost of one
  # bridge instead of two; the counter-argument, and why a second bridge was
  # NOT the right way to buy independence, is in ADR 0012. A genuinely
  # cluster-independent transport remains open on the Fix Hit List.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager-ext
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Pushover credentials (user_key + app token) from 1Password item
      # kdk-cluster/pushover-kdk-lab, written 0600 owned by nobody:65534.
      - ./alertmanager/pushover-user-key:/etc/alertmanager/pushover-user-key:ro
      - ./alertmanager/pushover-app-token:/etc/alertmanager/pushover-app-token:ro
      # Proton Bridge SMTP password (smtp_auth_password_file), same
      # compose_secret_files op-inject path. This board no longer runs a
      # bridge of its own: it submits through the IN-CLUSTER relay over
      # smtp-relay.kmkdp.com:25, so this is the same credential the cluster
      # uses (ADR 0012). The username is the account address and lives
      # inline in alertmanager.yml; only the password is a secret file.
      - ./alertmanager/proton-bridge-smtp-password:/etc/alertmanager/proton-bridge-smtp-password:ro
      - alertmanager-data:/alertmanager
    expose: ["9093"]

  # Fan control for the two PowerEdge BMCs. Reads temperatures over IPMI,
  # applies a curve with hysteresis, and sets fan speed with Dell's OEM
  # `raw 0x30 0x30`. Fails safe: ANY error hands the fans back to the BMC.
  #
  # IPMI, NOT REDFISH, and the numbers are in services/idrac-fan-control/ipmi.py:
  # a full Redfish walk of these BMCs takes 15-31s and the live exporter logged
  # 3365 timeouts + 71 503s in 24h, while an IPMI sensor read takes 82-1412ms.
  # The write is IPMI-only anyway -- Redfish exposes no fan-control verb on
  # iDRAC7/8 -- so reading over Redfish would mean two protocols for one loop.
  #
  # RUNS IN DRY RUN UNTIL THE OPERATOR ADDS `--apply` to the `command:` below,
  # which is spelled out in full for exactly that reason: this service decides,
  # logs and exports metrics but
  # writes nothing, so the curve can be watched on Grafana for as long as it
  # takes to trust it. Enabling it is a reviewed, one-line change made by hand
  # per Homelab/Runbooks/iDRAC Fan Control Enablement.md -- NOT a default.
  #
  # It needs an ADMINISTRATOR-privilege IPMI account, which the shared
  # kdk-lab-idrac-user is NOT (measured 2026-08-30: capped at USER on the LAN
  # channel of both BMCs, `-L OPERATOR` and `-L ADMINISTRATOR` both refused
  # 0x81). Until kdk-lab-idrac-fanctl-admin exists this container starts, reads
  # nothing, and reports idrac_fan_control_up 0 -- visible, not silent.
  # Community fan controllers (tigerblue77), one per BMC, replacing the retired
  # custom idrac-fan-control image. MONITORING_ONLY_MODE=true: they read temps
  # and log decisions but write NOTHING. Enabling active control = set
  # MONITORING_ONLY_MODE=false (a reviewed one-line change), which hands the
  # fans off BMC auto to the curve.
  fanctl-hyp:
    image: tigerblue77/dell_idrac_fan_controller:v1.108
    container_name: fanctl-hyp
    restart: unless-stopped
    environment:
      IDRAC_HOST: "10.1.3.86"
      IDRAC_USERNAME: "${IDRAC_FANCTL_USERNAME}"
      IDRAC_PASSWORD: "${IDRAC_FANCTL_PASSWORD}"
      FAN_SPEED: "20"
      CPU_TEMPERATURE_THRESHOLD: "80"
      HIGH_FAN_SPEED: "50"
      CPU_TEMPERATURE_THRESHOLD_TO_START_LINE_INTERPOLATION: "62"
      CHECK_INTERVAL: "60"
      MAXIMUM_IPMI_UNREACHABLE_DURATION: "300s"
      DISABLE_THIRD_PARTY_PCIE_CARD_DELL_DEFAULT_COOLING_RESPONSE: "true"
      MONITORING_ONLY_MODE: "false"

  fanctl-nas:
    image: tigerblue77/dell_idrac_fan_controller:v1.108
    container_name: fanctl-nas
    restart: unless-stopped
    environment:
      IDRAC_HOST: "10.1.3.25"
      IDRAC_USERNAME: "${IDRAC_FANCTL_USERNAME}"
      IDRAC_PASSWORD: "${IDRAC_FANCTL_PASSWORD}"
      FAN_SPEED: "20"
      CPU_TEMPERATURE_THRESHOLD: "78"
      HIGH_FAN_SPEED: "45"
      CPU_TEMPERATURE_THRESHOLD_TO_START_LINE_INTERPOLATION: "60"
      CHECK_INTERVAL: "60"
      MAXIMUM_IPMI_UNREACHABLE_DURATION: "300s"
      DISABLE_THIRD_PARTY_PCIE_CARD_DELL_DEFAULT_COOLING_RESPONSE: "false"
      MONITORING_ONLY_MODE: "false"


  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana-ext
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      # No Authelia here on purpose. ForwardAuth lives in the cluster's
      # ingress path; depending on it would put the auth tier between you
      # and the dashboard you opened *because* the cluster is down.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
