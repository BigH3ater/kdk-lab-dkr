# reMarkable <-> Readwise pipeline, migrated from the decommissioned dockge host
# (/opt/stacks/readwise-to-remarkable). Talks to the LIVE rmfakecloud (apps stack)
# over the shared apps_default network:
#   [1] readwise-to-remarkable  RETIRED (below) -> replaced by the readwise-koreader
#       stack (Readwise articles -> EPUB files in KOReader, so they're highlighted in
#       KOReader and ingested to Obsidian via .sdr). It filtered the SAME 'remarkable'
#       tag and pushed to the NATIVE reader, so leaving it live double-delivered every
#       tagged article into both readers. Disabled here so a redeploy can't re-enable it.
#   [2] highlights (rm-highlights)   device text highlights -> Readwise (still active;
#       likely superseded by KOReader .sdr highlights — retire once that path is validated)
# The former leg [3] (Chaptarr ebook library -> device) is RETIRED in favour of the
# book-sync stack (which now delivers ebooks as files to KOReader).
#
# Prebuilt images (ghcr.io/bigh3ater/*, pinned by digest -- these are PRIVATE
# packages; the host needs GHCR pull access or the packages made public). The
# Readwise token is rendered from 1Password (.env.tpl -> op inject) into a shared
# file that the token-consuming legs ([1],[2]) read at /secrets/readwise-token.
# rmapi device auth lives in the shared ./config (.rmapi) and must be registered
# ONCE against the live rmfakecloud -- see the runbook. Leg [3] needs no token.
name: readwise-to-remarkable
services:
  # Render the Readwise token from the injected .env into a shared file, the
  # same interface the prebuilt images expect (/secrets/readwise-token). Runs
  # once per deploy; the legs wait for it to finish.
  secrets:
    image: alpine:3.20
    restart: "no"
    environment:
      READWISE_TOKEN: ${READWISE_TOKEN:?set READWISE_TOKEN in .env (op inject from .env.tpl)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'umask 077; printf "%s" "$$READWISE_TOKEN" > /secrets/readwise-token; chmod 644 /secrets/readwise-token; echo "readwise token rendered"'
    volumes:
      - rw-secrets:/secrets

  # leg [1] (readwise-to-remarkable: Readwise articles -> NATIVE reader via rmfakecloud)
  # RETIRED 2026-09-18 -> replaced by the readwise-koreader stack (articles -> EPUB files
  # in KOReader). Left disabled (not just stopped) so a redeploy can't re-enable it and
  # double-deliver the same 'remarkable'-tagged articles into both readers. Re-enable ONLY
  # if you abandon the KOReader-reading model. Image was:
  #   ghcr.io/bigh3ater/kdk-lab-readwise-to-remarkable@sha256:7242867eb9c9c9a8d41e4528b441d3d50f633d5b4a949d56d7ce258e2b6a183c

  highlights:                        # leg [2]  device text highlights -> Readwise
    image: ghcr.io/bigh3ater/kdk-lab-rm-highlights@sha256:5cc75f4b0d97fb83ffedde8b31207329847c7d0eb9f3840c55886a636f281f37
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      RMAPI_HOST: http://rmfakecloud:3000
      RMAPI_CONFIG: /config/.rmapi
      INTERVAL_SECONDS: "3600"
      TZ: America/Chicago
      HOME: /tmp
    volumes:
      - /opt/kdk-lab/readwise-to-remarkable/config:/config
      - rw-secrets:/secrets:ro
    networks: [default, apps]

  # leg [3] (ebooks) RETIRED -> replaced by the book-sync stack (direct-SSH
  # reconcile of /mnt/media/books to the tablet, with delete). See stacks/book-sync.

volumes:
  rw-secrets: {}

networks:
  default: {}
  apps:
    external: true
    name: apps_default   # reach the live rmfakecloud (container_name: rmfakecloud)
