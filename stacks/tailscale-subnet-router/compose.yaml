# Tailscale subnet router on kdk-dkr-01. Advertises the lab subnets to the tailnet
# so remote members reach lab services -- Jellyfin/Seerr on the DMZ, Komodo,
# Home Assistant, etc. -- and get remote ad-blocking DNS (see tailscale-dns),
# without exposing anything publicly. Activates the member->subnet grants in the
# tailnet ACL; routes auto-approve via the ACL autoApprovers for tag:subnet-router.
# 10.1.3.0/24 (VLAN 1 management: TrueNAS 10.1.3.5, iDRACs .86/.25, UPS card .63)
# added 2026-10-26 -- every new route also needs an autoApprovers entry AND a
# member grant in the ACL (console; API writes are guarded).
#
# Auth: TS_AUTHKEY is a reusable, pre-authorized tag:subnet-router auth key
# (op://kdk-cluster/tailscale-subnet-router/authkey, see .env.tpl). Node state
# persists in the volume, so the key is only used at first registration.
#
# Forwarding (2026-10-26, moved to the host 2026-10 by security batch 7): the
# host is Debian 13 / Docker 29, whose FORWARD chain (policy DROP) lives in
# nftables, while the tailscale image's `iptables` is iptables-legacy --
# tailscaled's ts-forward ACCEPT and the MASQUERADE land in a table Docker's
# chain never consults, so every packet a tailnet client sent to a subnet
# behind the router arrived on tailscale0 and was dropped. The fix is
# `-i tailscale0 -j ACCEPT` / `-o tailscale0 -j ACCEPT` at the top of
# DOCKER-USER. A host unit now owns that chain: kdk-docker-user.service +
# .timer (hosts/_common/, policy hosts/kdk-dkr-01/kdk-docker-user.conf with
# TAILSCALE=1; runbook docs/runbooks/host-firewall.md). It replaced the
# `docker-forward` sidecar that used to re-assert the two rules from this stack.
# If remote access to VLAN 1/30/DMZ dies: `sudo iptables -S DOCKER-USER` on
# dkr-01 must start with those two rules; `systemctl status kdk-docker-user`.
name: tailscale-subnet-router
services:
  tailscale:
    # Pin to a digest at first deploy (docker inspect after pull).
    image: tailscale/tailscale:v1.104.2
    container_name: tailscale-subnet-router
    hostname: kdk-subnet-router
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set in .env via op inject}
      TS_ROUTES: "10.1.1.0/24,10.1.3.0/24,10.1.20.0/24,10.1.30.0/24,192.168.191.0/24"
      # --snat-subnet-routes=false (2026-10-26): lab hosts see the client's real
      # tailnet address (100.x) instead of this host's 10.1.20.20, so Jellyfin,
      # Traefik logs and firewall rules can tell remote clients apart. REQUIRES
      # the return route on the gateway: UniFi static route 100.64.0.0/10 via
      # 10.1.20.20 (VLAN 20). Without it every subnet-routed reply is lost and
      # remote access breaks -- re-add masquerading (drop the flag) to recover.
      TS_EXTRA_ARGS: "--advertise-tags=tag:subnet-router --hostname=kdk-subnet-router --accept-dns=false --snat-subnet-routes=false"
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TZ: America/Chicago
    volumes:
      - /opt/kdk-lab/tailscale-subnet-router:/var/lib/tailscale
