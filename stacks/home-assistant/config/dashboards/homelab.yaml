# Homelab hardware dashboard — sections layout. YAML-mode, shipped from git.
# Sensors come from packages/homelab.yaml (REST → Prometheus on 10.1.20.30:9090).
# Entity naming is sensor.kdk_<host>_{cpu,memory,uptime} — it's "_memory",
# NOT "_mem" (the 2026-09-21 "Entity not found" tiles were this drift).
title: Homelab
views:
- title: Homelab
  path: homelab
  icon: mdi:server
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.kdk_hyp_01_power
    name: R720 Power
  - type: entity
    entity: sensor.kdk_nas_01_power
    name: R730xd Power
  - type: entity
    entity: sensor.computer_room_eaton_5px_load
    name: UPS Load
  sections:

  - type: grid
    cards:
    - type: heading
      heading: kdk-hyp-01 — Proxmox (R720)
      icon: mdi:server
    - type: tile
      entity: sensor.kdk_hyp_01_cpu_temp
      name: CPU Temp
    - type: tile
      entity: sensor.kdk_hyp_01_inlet_temp
      name: Inlet
    - type: tile
      entity: sensor.kdk_hyp_01_power
      name: Power
    - type: tile
      entity: sensor.kdk_hyp_01_fan_speed_avg
      name: Fan Avg
    - type: tile
      entity: sensor.kdk_hyp_01_fan_speed_max
      name: Fan Max
    - type: tile
      entity: sensor.kdk_hyp_01_cpu
      name: CPU Use
    - type: tile
      entity: sensor.kdk_hyp_01_memory
      name: Memory
    - type: tile
      entity: sensor.kdk_hyp_01_uptime
      name: Uptime

  - type: grid
    cards:
    - type: heading
      heading: kdk-nas-01 — TrueNAS (R730xd)
      icon: mdi:nas
    - type: tile
      entity: sensor.kdk_nas_01_cpu_temp
      name: CPU Temp
    - type: tile
      entity: sensor.kdk_nas_01_inlet_temp
      name: Inlet
    - type: tile
      entity: sensor.kdk_nas_01_power
      name: Power
    - type: tile
      entity: sensor.kdk_nas_01_fan_speed_avg
      name: Fan Avg
    - type: tile
      entity: sensor.kdk_nas_01_fan_speed_max
      name: Fan Max
    - type: tile
      entity: sensor.kdk_nas_01_cpu
      name: CPU Use
    - type: tile
      entity: sensor.kdk_nas_01_memory
      name: Memory
    - type: tile
      entity: sensor.kdk_nas_01_uptime
      name: Uptime

  - type: grid
    cards:
    - type: heading
      heading: UPS — Eaton 5PX (Computer Room)
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.computer_room_eaton_5px_battery_charge
      name: Battery
    - type: tile
      entity: sensor.computer_room_eaton_5px_load
      name: Load
    - type: tile
      entity: sensor.computer_room_eaton_5px_status
      name: Status
    - type: tile
      entity: sensor.computer_room_eaton_5px_input_voltage
      name: Input Voltage
    - type: tile
      entity: sensor.computer_room_eaton_5px_output_voltage
      name: Output Voltage

  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Hosts — CPU / Memory / Uptime
      icon: mdi:server-network
    - type: markdown
      content: >-
        {% set hosts = [
          ('kdk-hyp-01','kdk_hyp_01'), ('kdk-nas-01','kdk_nas_01'),
          ('kdk-dkr-01','kdk_dkr_01'), ('kdk-dkr-02','kdk_dkr_02'),
          ('kdk-dkr-03','kdk_dkr_03'), ('kdk-dkr-dmz-01','kdk_dkr_dmz_01'),
          ('kdk-mon-01','kdk_mon_01'), ('kdk-pbs-01','kdk_pbs_01'),
          ('kdk-dns-01','kdk_dns_01'), ('kdk-dns-02','kdk_dns_02'),
          ('kdk-dns-03','kdk_dns_03'),
        ] %}
        | Host | CPU | Memory | Uptime |
        |---|---|---|---|
        {% for name, slug in hosts -%}
        {% set cpu = states('sensor.' ~ slug ~ '_cpu') -%}
        {% set mem = states('sensor.' ~ slug ~ '_memory') -%}
        {% set up  = states('sensor.' ~ slug ~ '_uptime') -%}
        | {{ name }} | {{ '⚠️ **' ~ cpu ~ '%**' if cpu not in ['unknown','unavailable'] and cpu | float(0) > 85 else (cpu ~ '%' if cpu not in ['unknown','unavailable'] else '—') }} | {{ '⚠️ **' ~ mem ~ '%**' if mem not in ['unknown','unavailable'] and mem | float(0) > 85 else (mem ~ '%' if mem not in ['unknown','unavailable'] else '—') }} | {{ up ~ ' d' if up not in ['unknown','unavailable'] else '—' }} |
        {% endfor %}
