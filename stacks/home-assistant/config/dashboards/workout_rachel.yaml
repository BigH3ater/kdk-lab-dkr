- title: Plan
  path: plan
  icon: mdi:clipboard-text
  type: masonry
  cards:
  - type: markdown
    title: Week
    content: |-
      **Mon** · Desk breaks + Strength A + Evening mobility

      **Tue** · Desk breaks + Cardio + Evening mobility

      **Wed** · Desk breaks + Evening mobility

      **Thu** · Desk breaks + Strength B + Evening mobility

      **Fri** · Desk breaks + Cardio + Evening mobility

      **Sat** · Desk breaks + Evening mobility

      **Sun** · Desk breaks + Evening mobility
  - type: markdown
    title: Desk breaks · daily
    content: |-
      **Glute Squeeze + Calf Raise** · 15 reps · 2–3× a day
      - Stand tall; squeeze your glutes for 3 seconds.
      - Then 15 slow calf raises, pausing 1 second at the top.

      **Seated Nerve Glide** · 10–12 reps / leg · 2–3× a day
      - Sit tall at the edge of a chair with one leg straight out.
      - Point the toes away as you look up; pull the toes back as you look down.
      - Keep it smooth and slow; never push into pain or tingling.

      **Tall-Kneeling Hip Flexor Stretch** · 30 s / side · 2–3× a day
      - Kneel on both knees on a cushion.
      - Tuck the pelvis under and squeeze the glute on the side you stretch.
      - Do not lunge forward; the stretch comes from the tuck alone.
  - type: markdown
    title: Strength A · Mon
    content: |-
      **High Box Squat** · 3 × 8 · RPE 6–7 · rest 60–90 s
      - Box, bench or chair high enough that your hips sit slightly above your knees.
      - Sit down fully, then drive through the heels to stand.

      **Standing Pallof Press** · 3 × 10 / side · rest 40–60 s
      - Stand side-on to the band anchor, handle at chest height.
      - Press straight out, hold 2 seconds, bring it back to the chest.
      - Do not let the torso twist toward the anchor.

      **Wall or Incline Push-Up** · 3 × 10–12 · rest 60 s
      - Hands on a wall or a high counter.
      - Keep the body in one straight line: no sagging hips, no arched lower back.
      - Lower the chest toward the surface and push back up.
  - type: markdown
    title: Cardio · Tue/Fri
    content: |-
      **Water Walking** · 20–30 min · moderate (talk test)
      - Chest-deep water: walk forward, backward and sideways.
      - Long, deliberate strides.
      - Moderate pace: you can still hold a conversation.

      **Recumbent Bike** · 20–25 min · moderate (talk test)
      - Back fully supported against the seat.
      - Smooth, continuous pedalling.
      - Moderate pace: you can still hold a conversation.

      _Either one counts: log the one you did._
  - type: markdown
    title: Strength B · Thu
    content: |-
      **Elevated Romanian Deadlift** · 3 × 8 · rest 90 s
      - Stand tall with dumbbells, a soft bend in the knees (never locked).
      - Hinge at the hips and lower the weights only to just below the kneecaps.
      - Keep the spine neutral; squeeze the glutes to stand back up.

      **Seated Band Row** · 3 × 12 · rest 60 s
      - Sit tall on the floor or a stool, legs out, band around the feet.
      - Pull the elbows back, squeezing the shoulder blades together.
      - Do not let the lower back arch.

      **Glute Bridge** · 3 × 12 · hold 2 s at the top · rest 60 s
      - Lie on your back, knees bent, feet flat.
      - Squeeze the glutes to lift the hips into a line from shoulders to knees.
      - Do not over-arch the lower back at the top.
  - type: markdown
    title: Evening mobility · daily
    content: |-
      **Supported Wall Slide** · 2 × 8 · hold 5 s
      - Back against a smooth wall (a gym ball behind the lower back is optional).
      - Slide down into a partial squat, no lower than 90 degrees.
      - Hold 5 seconds while breathing, then slide back up.

      **Hands-and-Knees Pelvic Tilt** · 15–20 reps
      - On hands and knees with a neutral spine.
      - Gently tuck the tailbone under with the lower abs, then return to a flat back.
      - Do not let the lower back sag.

      **Supported Side-Lying Rest** · 3–5 min
      - Lie on your side with a thick pillow between the knees and ankles.
      - Keep the hips level.
      - Breathe slowly and deeply.
