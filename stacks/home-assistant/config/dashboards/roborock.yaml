      - template: vacuum_clean_zone
      - template: vacuum_goto

  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:robot-vacuum
    - type: tile
      entity: vacuum.mr_slave_2
      name: Mr. Slave
      features:
      - type: vacuum-commands
        commands:
        - start_pause
        - stop
        - return_home
        - locate
    - type: tile
      entity: select.mr_slave_cleaning_mode
      name: Cleaning Mode
      features:
      - type: select-options
    - type: tile
      entity: select.mr_slave_mop_intensity_2
      name: Mop Intensity
    - type: tile
      entity: select.mr_slave_dock_empty_mode_2
      name: Auto-Empty

  - type: grid
    cards:
    - type: heading
      heading: Schedule
      icon: mdi:calendar-clock
    - type: tile
      entity: input_datetime.rr_next_run
      name: Next Scheduled Run
      icon: mdi:calendar-arrow-right
    - type: tile
      entity: sensor.mr_slave_last_clean_end_2
      name: Last Clean Finished
    - type: tile
      entity: input_datetime.rr_last_mop_run
      name: Last Mop Run
      icon: mdi:bucket-outline
    - type: markdown
      content: >-
        Automatic daily clean: **weekdays 8:30 AM**, **weekends 10:00 AM**.
        Mop pass runs after vacuuming on **Monday & Friday**.

  - type: grid
    cards:
    - type: heading
      heading: Routines
      icon: mdi:play-circle
    - type: button
      name: Daily Clean
      icon: mdi:broom
      show_state: false
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.rr_daily_clean
    - type: button
      name: Mop All Floors
      icon: mdi:bucket
      show_state: false
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.rr_mop_all_floors
    - type: button
      name: Return to Dock / Cancel
      icon: mdi:stop-circle-outline
      show_state: false
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.rr_return_dock

  - type: grid
    cards:
    - type: heading
      heading: Rooms Cleaned
      icon: mdi:check-decagram
    - type: markdown
      content: >-
        {% set rooms = [
          ('Master Bedroom Closet','rr_last_clean_master_bedroom_closet'),
          ('Master Bedroom','rr_last_clean_master_bedroom'),
          ('Bedroom 1','rr_last_clean_bedroom_1'),
          ('Master Bathroom','rr_last_clean_master_bathroom'),
          ('Bathroom 1','rr_last_clean_bathroom_1'),
          ('Garage Entrance','rr_last_clean_garage_entrance'),
          ('Half Bath','rr_last_clean_half_bath'),
          ('Laundry Room','rr_last_clean_laundry_room'),
          ("Rachel's Office",'rr_last_clean_rachels_office'),
          ('Hallway','rr_last_clean_hallway'),
          ('Front Door Entry','rr_last_clean_front_door_entry'),
          ('Living Room','rr_last_clean_living_room'),
          ('Kitchen','rr_last_clean_kitchen'),
        ] %}
        {% for name, ent in rooms -%}
        {% set dt = as_datetime(states('input_datetime.' ~ ent), default=none) -%}
        {% if dt is none or dt.year < 2020 -%}
        - {{ name }} — *never*
        {% else -%}
        - {{ name }} — **{{ relative_time(dt.replace(tzinfo=now().tzinfo)) }} ago**{{ ' ✓' if (now() - dt.replace(tzinfo=now().tzinfo)).days < 1 else '' }}
        {% endif -%}
        {% endfor %}

