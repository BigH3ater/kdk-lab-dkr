      - template: vacuum_clean_zone
      - template: vacuum_goto

  - type: grid
    cards:
    - type: heading
      heading: Run Progress
      icon: mdi:progress-check
    - type: markdown
      content: >-
        {% set s = states('sensor.rr_run_progress') %}
        {% if s in ['unknown','unavailable'] -%}
        *No run tracked since the last restart.*
        {% else -%}
        **{{ s }}**
        {% if state_attr('sensor.rr_run_progress','near') -%}

        Vacuum near: {{ state_attr('sensor.rr_run_progress','near') }} *(vacuum's own room label)*
        {% endif -%}
        {% endif %}
    - type: tile
      entity: sensor.mr_slave_cleaning_progress_2
      name: Cleaning Progress
      visibility:
      - condition: state
        entity: vacuum.mr_slave_2
        state_not: docked
    - type: tile
      entity: sensor.mr_slave_cleaning_time_2
      name: Run Time
      visibility:
      - condition: state
        entity: vacuum.mr_slave_2
        state_not: docked
    - type: tile
      entity: vacuum.mr_slave_2
      name: Mr. Slave
      features:
      - type: vacuum-commands
        commands:
        - start_pause
        - stop
        - return_home
        - locate

  - type: grid
    cards:
    - type: heading
      heading: Schedule
      icon: mdi:calendar-clock
    - type: tile
      entity: input_datetime.rr_next_run
      name: Next Clean
      icon: mdi:calendar-arrow-right
    - type: tile
      entity: input_datetime.rr_next_mop
      name: Next Mop
      icon: mdi:bucket-outline
    - type: tile
      entity: sensor.mr_slave_last_clean_end_2
      name: Last Clean Finished
    - type: tile
      entity: input_datetime.rr_last_mop_run
      name: Last Mop Run
    - type: markdown
      content: >-
        Daily clean: **weekdays 8:30**, **weekends 10:00**. Mop follows the
        vacuum pass on **Monday & Friday**. Stopping the vacuum by hand (app
        or its buttons) cancels the rest of the run.

  - type: grid
    cards:
    - type: heading
      heading: Modes & Routines
      icon: mdi:tune
    - type: tile
      entity: select.mr_slave_cleaning_mode
      name: Cleaning Mode
      features:
      - type: select-options
    - type: tile
      entity: select.mr_slave_mop_intensity_2
      name: Mop Intensity
    - type: tile
      entity: select.mr_slave_dock_empty_mode_2
      name: Auto-Empty
    - type: button
      name: Daily Clean
      icon: mdi:broom
      show_state: false
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.rr_daily_clean
    - type: button
      name: Mop All Floors
      icon: mdi:bucket
      show_state: false
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.rr_mop_all_floors
    - type: button
      name: Return to Dock / Cancel
      icon: mdi:stop-circle-outline
      show_state: false
      tap_action:
        action: call-service
        service: input_button.press
        target:
          entity_id: input_button.rr_return_dock

  - type: grid
    cards:
    - type: heading
      heading: Rooms Cleaned
      icon: mdi:check-decagram
    - type: markdown
      content: >-
        {% set rooms = [
          ('Master Bedroom Closet','rr_last_clean_master_bedroom_closet'),
          ('Master Bedroom','rr_last_clean_master_bedroom'),
          ('Bedroom 1','rr_last_clean_bedroom_1'),
          ('Master Bathroom','rr_last_clean_master_bathroom'),
          ('Bathroom 1','rr_last_clean_bathroom_1'),
          ('Garage Entrance','rr_last_clean_garage_entrance'),
          ('Half Bath','rr_last_clean_half_bath'),
          ('Laundry Room','rr_last_clean_laundry_room'),
          ("Rachel's Office",'rr_last_clean_rachels_office'),
          ('Hallway','rr_last_clean_hallway'),
          ('Front Door Entry','rr_last_clean_front_door_entry'),
          ('Living Room','rr_last_clean_living_room'),
          ('Kitchen','rr_last_clean_kitchen'),
        ] %}
        {% for name, ent in rooms -%}
        {% set dt = as_datetime(states('input_datetime.' ~ ent), default=none) -%}
        {% if dt is none or dt.year < 2020 -%}
        - {{ name }} — *no completed clean tracked yet*
        {% else -%}
        - {{ name }} — **{{ relative_time(dt.replace(tzinfo=now().tzinfo)) }} ago**{{ ' ✓' if (now() - dt.replace(tzinfo=now().tzinfo)).days < 1 else '' }}
        {% endif -%}
        {% endfor %}

        Stamps land only when a stage **completes** — a cancelled run leaves
        its rooms unstamped.

  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Maintenance — managed in Tasks
      icon: mdi:wrench-clock
    - type: markdown
      content: >-
        {% set items = state_attr('sensor.rr_vikunja_chores','open') or [] %}
        {% if states('sensor.rr_vikunja_chores') in ['unknown','unavailable'] -%}
        *Chore list unavailable — check tasks.kmkdp.com*
        {% elif items | count == 0 -%}
        **All caught up ✓**
        {% else -%}
        {% for t in items -%}
        - {{ '⚠️ ' if as_datetime(t.due) < now() else '' }}**{{ t.t }}** — due {{ as_timestamp(t.due) | timestamp_custom('%a %b %-d') }}
        {% endfor -%}
        {% endif %}

        Mark chores done at [tasks.kmkdp.com](https://tasks.kmkdp.com/projects/6) —
        water refills auto-complete when the dock tank comes back full.
    - type: tile
      entity: binary_sensor.mr_slave_water_shortage_2
      name: Clean Water Empty?
    - type: tile
      entity: binary_sensor.mr_slave_dock_clean_water_box
      name: Clean Water Tank
    - type: tile
      entity: binary_sensor.mr_slave_dock_dirty_water_box
      name: Dirty Water Tank
    - type: tile
      entity: sensor.mr_slave_main_brush_time_left_2
      name: Main Brush Left
    - type: tile
      entity: sensor.mr_slave_side_brush_time_left_2
      name: Side Brush Left
    - type: tile
      entity: sensor.mr_slave_filter_time_left_2
      name: Filter Left
    - type: tile
      entity: sensor.mr_slave_sensor_time_left_2
      name: Sensor Clean Left
