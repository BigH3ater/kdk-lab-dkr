# Homelab telemetry — REST sensors from Prometheus (kdk-mon-01).
# availability_template marks a sensor unavailable when the query is empty;
# value_template returns a number or none (never the string 'unavailable',
# which would crash a numeric state_class sensor). timeout 30 rides out brief
# Prometheus slowness. Temps have NO device_class (stay °C under imperial).
rest:
  - resource: http://10.1.20.30:9090/api/v1/query
    scan_interval: 60
    timeout: 30
    params:
      query: 'avg(idrac_sensors_fan_speed{instance_name="kdk-hyp-01"})'
    sensor:
      - name: "kdk-hyp-01 Fan Speed (avg)"
        unique_id: hl_kdk_hyp_01_fan_avg
        value_template: "{{ (value_json.data.result[0].value[1] | float | round(0)) if value_json.data.result else none }}"
        unit_of_measurement: "rpm"
        state_class: measurement
  - resource: http://10.1.20.30:9090/api/v1/query
    scan_interval: 60
    timeout: 30
    params:
      query: 'max(idrac_sensors_fan_speed{instance_name="kdk-hyp-01"})'
    sensor:
      - name: "kdk-hyp-01 Fan Speed (max)"
        unique_id: hl_kdk_hyp_01_fan_max
        value_template: "{{ (value_json.data.result[0].value[1] | float | round(0)) if value_json.data.result else none }}"
        unit_of_measurement: "rpm"
        state_class: measurement
  - resource: http://10.1.20.30:9090/api/v1/query
    scan_interval: 60
    timeout: 30
    params:
      query: 'max(idrac_sensors_temperature{instance_name="kdk-hyp-01",name=~"CPU.*"})'
    sensor:
      - name: "kdk-hyp-01 CPU Temp"
        unique_id: hl_kdk_hyp_01_cpu_temp
        value_template: "{{ (value_json.data.result[0].value[1] | float | round(0)) if value_json.data.result else none }}"
        unit_of_measurement: "°C"
        state_class: measurement
  - resource: http://10.1.20.30:9090/api/v1/query
    scan_interval: 60
    timeout: 30
    params:
      query: 'idrac_sensors_temperature{instance_name="kdk-hyp-01",name=~".*Inlet.*"}'
    sensor:
      - name: "kdk-hyp-01 Inlet Temp"
        unique_id: hl_kdk_hyp_01_inlet_temp
        value_template: "{{ (value_json.data.result[0].value[1] | float | round(0)) if value_json.data.result else none }}"
        unit_of_measurement: "°C"
        state_class: measurement
  - resource: http://10.1.20.30:9090/api/v1/query
    scan_interval: 60
    timeout: 30
    params:
      query: 'idrac_power_control_consumed_watts{instance_name="kdk-hyp-01"}'
    sensor:
