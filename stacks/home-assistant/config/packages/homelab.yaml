    params:
      query: '(time() - node_boot_time_seconds{instance="10.1.1.102:9100"})/86400'
    sensor:
      - name: "kdk-pbs-01 Uptime"
        unique_id: hl_kdk_pbs_01_uptime
        value_template: "{{ (value_json.data.result[0].value[1] | float | round(1)) if value_json.data.result else none }}"
        unit_of_measurement: "d"
        state_class: measurement
