# RACHEL's helpers: her own plan (catalog "plans".rach), every entity id ends in _rachel
# (input_number.ex_<id>_reps_rachel, ...), then the earlier copy of the shared list, kept
# until the Today page reads her plan (docs/runbooks/workout-tracking-update.md).
