# Roborock (Mr. Slave) — helper entities for per-room cleaning, routines, and
# run tracking. Logic lives in Node-RED; these are the HomeKit-visible controls
# and the state it drives. Shipped from git (stacks/home-assistant/config/packages/).
#
# Maintenance chores moved to Vikunja (tasks.kmkdp.com project 6 "Robot Vacuum",
# 2026-09-21): the old rr_maint_* input_booleans + their Node-RED timers are gone.
# Node-RED auto-completes the Vikunja "Fill water" task on dock-sensor evidence and
# presses the consumable-reset buttons when a chore is completed in Vikunja.

input_button:
  # --- per-room clean (segment ids in comments) ---
  rr_clean_master_bedroom_closet: { name: "Clean Master Bedroom Closet", icon: mdi:robot-vacuum }   # seg 1
  rr_clean_master_bedroom:        { name: "Clean Master Bedroom", icon: mdi:robot-vacuum }           # seg 2
  rr_clean_bedroom_1:             { name: "Clean Bedroom 1", icon: mdi:robot-vacuum }                 # seg 3
  rr_clean_master_bathroom:       { name: "Clean Master Bathroom", icon: mdi:robot-vacuum }           # seg 4
  rr_clean_bathroom_1:            { name: "Clean Bathroom 1", icon: mdi:robot-vacuum }                # seg 5
  rr_clean_garage_entrance:       { name: "Clean Garage Entrance", icon: mdi:robot-vacuum }           # seg 6
  rr_clean_half_bath:             { name: "Clean Half Bath", icon: mdi:robot-vacuum }                 # seg 7
  rr_clean_laundry_room:          { name: "Clean Laundry Room", icon: mdi:robot-vacuum }              # seg 8
  rr_clean_rachels_office:        { name: "Clean Rachel's Office", icon: mdi:robot-vacuum }           # seg 9
  rr_clean_hallway:               { name: "Clean Hallway", icon: mdi:robot-vacuum }                   # seg 10
  rr_clean_front_door_entry:      { name: "Clean Front Door Entry", icon: mdi:robot-vacuum }          # seg 11
  rr_clean_living_room:           { name: "Clean Living Room", icon: mdi:robot-vacuum }               # seg 12
  rr_clean_kitchen:               { name: "Clean Kitchen", icon: mdi:robot-vacuum }                   # seg 13
  # --- routines ---
  rr_daily_clean:    { name: "Roborock Daily Clean", icon: mdi:broom }
  rr_mop_all_floors: { name: "Roborock Mop All Floors", icon: mdi:bucket }
  rr_return_dock:    { name: "Roborock Return to Dock", icon: mdi:home-import-outline }
  # --- maintenance ---
  rr_tanks_swapped:  { name: "Roborock Water Tanks Swapped", icon: mdi:cup-water }

input_datetime:
  rr_last_mop_run: { name: "Roborock Last Mop Run", has_date: true, has_time: true }
  rr_next_run:     { name: "Roborock Next Scheduled Run", has_date: true, has_time: true }
  rr_next_mop:     { name: "Roborock Next Mop Run", has_date: true, has_time: true }
  # weekly clean/dirty tank swap (spare pair rotates in; anti-mold) — set by
  # input_button.rr_tanks_swapped or the "Swapped" action on the reminder
  rr_last_tank_swap: { name: "Roborock Last Water Tank Swap", has_date: true, has_time: true }
  # per-room last-cleaned stamps — set by Node-RED when it dispatches/completes a
  # room (it is the sole dispatcher; the vacuum's own current-room sensor uses the
  # stale internal room names and is not trustworthy)
  rr_last_clean_master_bedroom_closet: { name: "Last Clean Master Bedroom Closet", has_date: true, has_time: true }
  rr_last_clean_master_bedroom:        { name: "Last Clean Master Bedroom", has_date: true, has_time: true }
  rr_last_clean_bedroom_1:             { name: "Last Clean Bedroom 1", has_date: true, has_time: true }
  rr_last_clean_master_bathroom:       { name: "Last Clean Master Bathroom", has_date: true, has_time: true }
  rr_last_clean_bathroom_1:            { name: "Last Clean Bathroom 1", has_date: true, has_time: true }
  rr_last_clean_garage_entrance:       { name: "Last Clean Garage Entrance", has_date: true, has_time: true }
  rr_last_clean_half_bath:             { name: "Last Clean Half Bath", has_date: true, has_time: true }
  rr_last_clean_laundry_room:          { name: "Last Clean Laundry Room", has_date: true, has_time: true }
  rr_last_clean_rachels_office:        { name: "Last Clean Rachel's Office", has_date: true, has_time: true }
  rr_last_clean_hallway:               { name: "Last Clean Hallway", has_date: true, has_time: true }
  rr_last_clean_front_door_entry:      { name: "Last Clean Front Door Entry", has_date: true, has_time: true }
  rr_last_clean_living_room:           { name: "Last Clean Living Room", has_date: true, has_time: true }
  rr_last_clean_kitchen:               { name: "Last Clean Kitchen", has_date: true, has_time: true }

# Daily-run progress, written by the Node-RED run tracker (input_text restores
# across HA restarts, unlike the old REST-set sensor.rr_run_progress).
input_text:
  rr_run_phase: { name: "Roborock Run Phase", max: 255, icon: mdi:progress-check }
  rr_run_near:  { name: "Roborock Run Near", max: 100, icon: mdi:map-marker }

# One sink for every Roborock phone alert (Node-RED run failures + the alert
# automations). tag replaces an earlier alert of the same kind; message
# "clear_notification" with the same tag removes it from both phones.
script:
  rr_notify:
    alias: Roborock notify
    mode: queued
    fields:
      title: { description: Alert title }
      message: { description: "Alert body, or clear_notification" }
      tag: { description: Alert kind (replace/clear key) }
      urgent: { description: true = time-sensitive (breaks Focus) }
      actions: { description: "Optional iOS action buttons: [{action: ID, title: Text}]" }
    sequence:
      - variables:
          payload:
            title: "{{ title | default('Mr. Slave') }}"
            message: "{{ message }}"
            data:
              tag: "{{ tag | default('rr_generic') }}"
              group: roborock
              url: /roborock-vac/0
              actions: "{{ actions | default([]) }}"
              push:
                interruption-level: "{{ 'time-sensitive' if urgent | default(false) | bool else 'active' }}"
      - action: notify.mobile_app_iphone
        continue_on_error: true
        data: "{{ payload }}"
      - action: notify.mobile_app_rachels_phone
        continue_on_error: true
        data: "{{ payload }}"

# Open maintenance chores from Vikunja (project 6 "Robot Vacuum"). Token is
# host-managed at /config/.vikunja_token (0600, not in git — same lane as
# secrets.yaml). /tasks/all 400s on scoped tokens; the per-project route works.
command_line:
  - sensor:
      name: rr_vikunja_chores
      unique_id: rr_vikunja_chores
      command: >-
        curl -sk -m 20 -H "Authorization: Bearer $(cat /config/.vikunja_token)"
        "https://tasks.kmkdp.com/api/v1/projects/6/tasks?per_page=50"
        | python3 -c "import json,sys; ts=json.load(sys.stdin); o=[{'t':t['title'],'due':t['due_date']} for t in ts if not t['done']]; o.sort(key=lambda x:x['due']); print(json.dumps({'open':o,'count':len(o)}))"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - open
      scan_interval: 900

# Days since the last weekly water-tank swap (dashboard). Unavailable until the
# first swap is recorded.
template:
  - sensor:
      - name: rr_tank_swap_age
        unique_id: rr_tank_swap_age
        unit_of_measurement: d
        icon: mdi:cup-water
        availability: "{{ state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0) > 946684800 }}"
        state: "{{ ((now().timestamp() - state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0)) / 86400) | round(1) }}"

# Off-charger alert. 2026-10-12: the vacuum went charger_disconnected on the
# dock, idled on battery, and powered itself off exactly 12 h later; two daily
# runs then failed against an unavailable entity with no phone alert. Fire while
# it's still recoverable (30 min off the charger), and again if it has already
# gone dark. Clears from both phones once it's charging again.
automation:
  - id: rr_off_charger_alert
    alias: "Roborock: off the charger alert"
    mode: queued
    triggers:
      - trigger: template
        id: off_charger
        value_template: >-
          {{ states('sensor.mr_slave_status_2') in
             ['charger_disconnected', 'idle', 'paused', 'error', 'charging_problem'] }}
        for: "00:30:00"
      - trigger: state
        id: offline
        entity_id: vacuum.mr_slave_2
        to: unavailable
        for: "00:15:00"
      - trigger: state
        id: charging
        entity_id: sensor.mr_slave_status_2
        to: charging
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'off_charger' }}"
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave is off the charger"
                  message: >-
                    {{ states('sensor.mr_slave_status_2') | replace('_', ' ') }} for 30 min,
                    battery {{ states('sensor.mr_slave_battery_2') }}%. It powers itself
                    off after ~12 h off the dock — seat it on the charger.
                  tag: rr_off_charger
                  urgent: true
          - conditions: "{{ trigger.id == 'offline' }}"
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave is offline"
                  message: >-
                    Unreachable for 15 min — likely off the charger and powered down.
                    Put it on the dock (press power if it doesn't wake); scheduled
                    cleans will fail until it reconnects.
                  tag: rr_off_charger
                  urgent: true
          - conditions: "{{ trigger.id == 'charging' }}"
            sequence:
              - action: script.rr_notify
                data:
                  message: clear_notification
                  tag: rr_off_charger

  # Weekly water-tank swap (2026-10-18): a spare clean + dirty tank pair rotates
  # in every week so the used pair can be rinsed and dried (mold). 18:00 daily
  # nag once 7 days have passed since the last recorded swap; the iOS "Swapped"
  # button (or input_button.rr_tanks_swapped) records it and clears the alert.
  - id: rr_tank_swap_reminder
    alias: "Roborock: weekly water-tank swap reminder"
    mode: single
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: template
        value_template: >-
          {{ now().timestamp() - (state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0))
             > 6.5 * 86400 }}
    actions:
      - action: script.rr_notify
        data:
          title: "Swap Mr. Slave's water tanks"
          message: >-
            {% set ts = state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0) %}
            {{ 'No swap recorded yet.' if ts < 946684800 else
               'Last swap ' ~ ((now().timestamp() - ts) / 86400) | round(0) | int ~ ' days ago.' }}
            Put the spare clean (filled) and dirty tanks in the dock, then rinse the
            used pair and let them air-dry with the lids off. Tap Swapped when done.
          tag: rr_tank_swap
          actions:
            - action: RR_TANKS_SWAPPED
              title: "Swapped ✓"

  - id: rr_tank_swap_done
    alias: "Roborock: record water-tank swap"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.rr_tanks_swapped
        # Not "unknown": a never-pressed button is unknown, so excluding it
        # swallowed the first press (2026-10-18). Reload/restart is covered by
        # "unavailable" and the from_state check below.
        not_from: unavailable
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: RR_TANKS_SWAPPED
    conditions:
      - "{{ trigger.platform != 'state' or trigger.from_state is not none }}"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.rr_last_tank_swap
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: script.rr_notify
        data:
          message: clear_notification
          tag: rr_tank_swap

  # Both dock tanks report a problem while they're out; both clearing within
  # ~30 min of each other looks like a swap (or an empty + refill). Ask rather
  # than assume, unless a swap was already logged in the last day.
  - id: rr_tank_swap_detect
    alias: "Roborock: tanks back in the dock — confirm swap"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.mr_slave_dock_clean_water_box
          - binary_sensor.mr_slave_dock_dirty_water_box
        from: "on"
        to: "off"
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id:
          - binary_sensor.mr_slave_dock_clean_water_box
          - binary_sensor.mr_slave_dock_dirty_water_box
        state: "off"
      - condition: template
        value_template: >-
          {{ now() - states.binary_sensor.mr_slave_dock_clean_water_box.last_changed < timedelta(minutes=35)
             and now() - states.binary_sensor.mr_slave_dock_dirty_water_box.last_changed < timedelta(minutes=35) }}
      - condition: template
        value_template: >-
          {{ now().timestamp() - (state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0)) > 86400 }}
    actions:
      - action: script.rr_notify
        data:
          title: "Water tanks back in the dock"
          message: Was this the weekly swap? Tap Swapped to log it and reset the 7-day reminder.
          tag: rr_tank_swap
          actions:
            - action: RR_TANKS_SWAPPED
              title: "Swapped ✓"

  # Clean-water tank empty. The dock reports it as dock_error water_empty (seen
  # 2026-10-09 and 10-18); the robot's own water_shortage flag is a second
  # source. 10 min debounce so pulling the tank for a swap doesn't page. A
  # time-sensitive repeat at 07:45 if it's still empty before the daily run
  # (weekdays 08:30, weekends 12:00), since mop days need the water. Clears from
  # both phones once the dock is happy again.
  - id: rr_water_empty_alert
    alias: "Roborock: clean water tank empty"
    mode: queued
    triggers:
      - trigger: state
        id: empty
        entity_id: sensor.mr_slave_dock_dock_error
        to: water_empty
        for: "00:10:00"
      - trigger: state
        id: empty
        entity_id: binary_sensor.mr_slave_water_shortage_2
        to: "on"
        for: "00:10:00"
      - trigger: time
        id: morning
        at: "07:45:00"
      # A restart or automation reload resets the 10-min `for:` timers above, so a
      # tank that is ALREADY empty never "becomes" empty (missed 2026-10-18).
      - trigger: homeassistant
        id: recheck
        event: start
      - trigger: event
        id: recheck
        event_type: automation_reloaded
      - trigger: state
        id: refilled
        entity_id: sensor.mr_slave_dock_dock_error
        from: water_empty
        for: "00:01:00"
      - trigger: state
        id: refilled
        entity_id: binary_sensor.mr_slave_water_shortage_2
        from: "on"
        for: "00:01:00"
    variables:
      empty: >-
        {{ is_state('sensor.mr_slave_dock_dock_error', 'water_empty')
           or is_state('binary_sensor.mr_slave_water_shortage_2', 'on') }}
    actions:
      - if: "{{ trigger.id == 'recheck' }}"
        then:
          - delay: "00:10:00"
      - variables:
          empty: >-
            {{ is_state('sensor.mr_slave_dock_dock_error', 'water_empty')
               or is_state('binary_sensor.mr_slave_water_shortage_2', 'on') }}
      - choose:
          - conditions: "{{ trigger.id in ['empty', 'morning', 'recheck'] and empty }}"
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave needs clean water"
                  message: >-
                    The clean-water tank is empty. Fill it (or drop in the spare)
                    before the next run{{ ' — mopping is skipped without it' if now().weekday() in [0, 4] else '' }}.
                  tag: rr_water_empty
                  urgent: "{{ trigger.id == 'morning' }}"
          - conditions: "{{ trigger.id == 'refilled' and not empty }}"
            sequence:
              - action: script.rr_notify
                data:
                  message: clear_notification
                  tag: rr_water_empty

# HomeKit bridge exposes the vacuum, per-room clean buttons, and routines to
# Apple Home (include list lives in .storage/core.config_entries on the host).
