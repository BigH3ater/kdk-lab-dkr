        attributes:
          at: "{{ state_attr('input_datetime.rr_last_clean_garage_entrance', 'timestamp') | float(0) | timestamp_custom('%a %b %-d %H:%M') }}"
      # Robot error in words for the dashboard and rr_stuck_alert. State = the
      # error in plain words ("no error" when clear); attribute advice =
      # {kind, title, fix} with kind none | stuck | jam | charging | dock | water |
      # sensor | other; attribute code = the raw vacuum_error_2 enum value.
      # One template per value: attributes must not read this.state (it lags).
      - name: rr_vacuum_error
        unique_id: rr_vacuum_error
        icon: mdi:robot-vacuum-alert
        availability: "{{ states('sensor.mr_slave_vacuum_error_2') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set e = states('sensor.mr_slave_vacuum_error_2') %}
          {{ {'none': 'no error',
              'lidar_blocked': 'the laser (LiDAR) turret is blocked',
              'bumper_stuck': 'the front bumper is stuck',
              'wheels_suspended': 'a wheel is hanging off an edge',
              'cliff_sensor_error': 'a cliff sensor is dirty or over an edge',
              'robot_trapped': 'it is trapped and cannot find a way out',
              'robot_tilted': 'it is tilted',
              'vertical_bumper_pressed': 'the LiDAR top bumper is pressed',
              'nogo_zone_detected': 'it ended up inside a no-go zone',
              'invisible_wall_detected': 'it ended up inside an invisible wall',
              'cannot_cross_carpet': 'it cannot cross a carpet',
              'robot_on_carpet': 'it is on carpet with the mop attached',
              'light_touch': 'an obstacle sensor is pressed',
              'main_brush_jammed': 'the main brush is jammed',
              'side_brush_jammed': 'the side brush is jammed',
              'wheels_jammed': 'a wheel is jammed',
              'side_brush_error': 'the side brush has a fault',
              'vibrarise_jammed': 'the mop lift (VibraRise) is jammed',
              'mopping_roller_1': 'the mop roller has a fault',
              'mopping_roller_error_2': 'the mop roller has a fault',
              'filter_blocked': 'the filter is blocked',
              'fan_error': 'the suction fan has a fault',
              'no_dustbin': 'the dustbin is missing',
              'strainer_error': 'the filter is missing, wet or blocked',
              'low_battery': 'the battery is too low to carry on',
              'charging_error': 'it is not charging on the dock',
              'battery_error': 'the battery has a fault',
              'dock': 'the dock has no power',
              'dock_locator_error': 'it cannot find the dock',
              'return_to_dock_fail': 'it could not get back to the dock',
              'temperature_protection': 'it is too hot or too cold to run or charge',
              'clean_carousel_exception': 'the dock wash tray is blocked (error 52)',
              'clean_carousel_water_full': 'the dock wash tray is full of water',
              'check_clean_carouse': 'the dock wash tray needs checking',
              'clear_brush_exception': 'the dock wash-tray brush is stuck',
              'clear_brush_exception_2': 'the dock wash-tray brush is stuck',
              'sink_strainer_hoare': 'the dock wash-tray strainer is clogged',
              'filter_screen_exception': 'the dock filter screen is blocked',
              'collect_dust_error_3': 'the dock could not empty the dustbin',
              'collect_dust_error_4': 'the dock could not empty the dustbin',
              'water_carriage_drop': 'the mop mount came off',
              'clear_water_box_hoare': 'the clean-water tank is out or empty',
              'dirty_water_box_hoare': 'the dirty-water tank is out or full',
              'clear_water_box_exception': 'the clean-water tank is not seated or empty',
              'up_water_exception': 'the dock cannot pump clean water',
              'drain_water_exception': 'the dock cannot drain dirty water',
              'compass_error': 'a strong magnetic field confuses it',
              'wall_sensor_dirty': 'the wall sensor is dirty',
              'optical_flow_sensor_dirt': 'the floor (optical flow) sensor is dirty',
              'visual_sensor': 'the obstacle camera is dirty or blocked',
              'internal_error': 'it reported an internal error (power it off and on)',
              'audio_error': 'the speaker has a fault'}.get(e, e | replace('_', ' ')) }}
        attributes:
          code: "{{ states('sensor.mr_slave_vacuum_error_2') }}"
          advice: >-
            {% set e = states('sensor.mr_slave_vacuum_error_2') %}
            {% set kinds = {
              'stuck': ['lidar_blocked', 'bumper_stuck', 'wheels_suspended', 'cliff_sensor_error',
                        'robot_trapped', 'robot_tilted', 'vertical_bumper_pressed', 'nogo_zone_detected',
                        'invisible_wall_detected', 'cannot_cross_carpet', 'robot_on_carpet', 'light_touch'],
              'jam': ['main_brush_jammed', 'side_brush_jammed', 'wheels_jammed', 'side_brush_error',
                      'vibrarise_jammed', 'mopping_roller_1', 'mopping_roller_error_2', 'filter_blocked',
                      'fan_error', 'no_dustbin', 'strainer_error'],
              'charging': ['low_battery', 'charging_error', 'battery_error', 'dock', 'dock_locator_error',
                           'return_to_dock_fail', 'temperature_protection'],
              'dock': ['clean_carousel_exception', 'clean_carousel_water_full', 'check_clean_carouse',
                       'clear_brush_exception', 'clear_brush_exception_2', 'sink_strainer_hoare',
                       'filter_screen_exception', 'collect_dust_error_3', 'collect_dust_error_4',
                       'water_carriage_drop'],
              'water': ['clear_water_box_hoare', 'dirty_water_box_hoare', 'clear_water_box_exception',
                        'up_water_exception', 'drain_water_exception'],
              'sensor': ['compass_error', 'wall_sensor_dirty', 'optical_flow_sensor_dirt', 'visual_sensor'],
            } %}
            {% set ns = namespace(k='other') %}
            {% for k, codes in kinds.items() if e in codes %}{% set ns.k = k %}{% endfor %}
            {% set k = 'none' if e == 'none' else ns.k %}
            {% set titles = {'none': 'Mr. Slave is OK', 'stuck': 'Mr. Slave is stuck',
              'jam': 'Mr. Slave has a jam', 'charging': "Mr. Slave can't charge",
              'dock': "Mr. Slave's dock wash tray needs a clean",
              'water': "Mr. Slave's dock has a water problem",
              'sensor': 'Mr. Slave needs a sensor wiped'} %}
            {% set fixes = {'none': '',
              'stuck': 'Move it to open, flat floor, then press the power button (or put it on the dock) to carry on.',
              'jam': 'Lift it, clear the brush, wheel or filter, then press the power button to carry on.',
              'charging': 'Wipe the charging contacts on the robot and the dock, check the dock is plugged in, and seat it on the dock.',
              'dock': 'Pull the wash tray out of the dock, clear and rinse it and its strainer, check the dirty tank is seated and not full, then reseat the tray.',
              'water': 'Check both dock tanks: clean one full and seated, dirty one empty and seated.',
              'sensor': 'Wipe the sensors with a dry cloth.'} %}
            {{ {'kind': k, 'title': titles.get(k, 'Mr. Slave has an error'),
                'fix': fixes.get(k, 'Check the Roborock app for details.')} }}

  # Job state from the robot itself (2026-11-04 mop run). The robot's own
  # routines (app "Mopping" button, HomeKit) leave select.mr_slave_cleaning_mode
  # at vac_and_mop and input_text.rr_run_phase untouched, so these do not use
  # either as proof of a mop run.
  # - rr_job_active: a job is open. cleaning_2 drops OFF for ~40-70 s at every
  #   wash/empty dock visit (status charging, then segment_cleaning before
  #   cleaning_2 is back), so the robot's cleaning and dock-visit statuses
  #   count too and delay_off bridges the gap.
  # - rr_recharge_pause: low-battery pause mid-job (pauses at <= 20 %, keeps
  #   progress, resumes by itself at 80 %): charging with cleaning_2 still on
  #   and progress > 0. delay_on 1 min: a wash visit passes through charging
  #   with cleaning_2 on for 10-20 s.
  # - rr_mopping_now: job open AND (the dock is washing the mop, or it washed
  #   during this job, or the robot is cleaning with mop settings and pads +
  #   water box attached). Pads are always on this robot, so they only count
  #   together with the mop settings; washes are the hard proof.
  - binary_sensor:
      - name: rr_job_active
        unique_id: rr_job_active
        icon: mdi:robot-vacuum
        delay_off: "00:02:00"
        state: >-
          {{ is_state('binary_sensor.mr_slave_cleaning_2', 'on')
             or states('sensor.mr_slave_status_2') in
                ['cleaning', 'segment_cleaning', 'zoned_cleaning', 'spot_cleaning',
                 'going_to_wash_the_mop', 'washing_the_mop', 'emptying_the_bin', 'returning_home'] }}
      - name: rr_recharge_pause
        unique_id: rr_recharge_pause
        icon: mdi:battery-charging-medium
        delay_on: "00:01:00"
        state: >-
          {{ states('sensor.mr_slave_status_2') in ['charging', 'charging_complete']
             and is_state('binary_sensor.mr_slave_cleaning_2', 'on')
             and states('sensor.mr_slave_cleaning_progress_2') | float(0) > 0 }}
      - name: rr_mopping_now
        unique_id: rr_mopping_now
        icon: mdi:water
        state: >-
          {% set st = states('sensor.mr_slave_status_2') %}
          {% set washing = st in ['going_to_wash_the_mop', 'washing_the_mop']
                           or is_state('switch.mr_slave_dock_mop_washing', 'on') %}
          {% set mop_set = states('select.mr_slave_cleaning_mode') in ['vac_and_mop', 'mop']
                           and states('select.mr_slave_mop_intensity_2') not in ['off', 'unknown', 'unavailable']
                           and is_state('binary_sensor.mr_slave_mop_attached_2', 'on')
                           and is_state('binary_sensor.mr_slave_water_box_attached_2', 'on') %}
          {{ is_state('binary_sensor.rr_job_active', 'on')
             and (washing or states('sensor.rr_job_washes') | int(0) > 0
                  or (mop_set and is_state('binary_sensor.mr_slave_cleaning_2', 'on'))) }}

  # Mop washes in the current job: +1 each time the status turns
  # washing_the_mop; back to 0 when cleaning starts after >= 20 min off (a new
  # job; the wash/empty visits are ~1 min, gaps between routine steps up to
  # ~8 min, f_mopchk uses the same 20-min quiet window). Not reset on
  # sensor.mr_slave_last_clean_begin_2: that updates when a job ENDS.
  - triggers:
      - trigger: state
        id: wash
        entity_id: sensor.mr_slave_status_2
        to: washing_the_mop
        not_from: [unknown, unavailable]
      - trigger: state
        id: start
        entity_id: binary_sensor.mr_slave_cleaning_2
        from: "off"
        to: "on"
    sensor:
      - name: rr_job_washes
        unique_id: rr_job_washes
        icon: mdi:water-sync
        state: >-
          {% set n = this.state | int(0) %}
          {% if trigger.id == 'wash' %}{{ n + 1 }}
          {% elif (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 1200 %}0
          {% else %}{{ n }}{% endif %}
        attributes:
          job_start: >-
            {% if trigger.id == 'start'
                  and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 1200 %}{{ now().isoformat() }}
            {% else %}{{ this.attributes.get('job_start', '') }}{% endif %}
          last_wash: >-
            {{ now().isoformat() if trigger.id == 'wash' else this.attributes.get('last_wash', '') }}

# Off-charger alert. 2026-10-12: the vacuum went charger_disconnected on the
# dock, idled on battery, and powered itself off exactly 12 h later; two daily
# runs then failed against an unavailable entity with no phone alert. Fire while
# it's still recoverable (30 min off the charger), and again if it has already
# gone dark. Once it's charging again, clears from both phones if it paged.
automation:
  - id: rr_off_charger_alert
    alias: "Roborock: off the charger alert"
    mode: queued
    triggers:
      - trigger: template
        id: off_charger
        # Not while the robot reports an error: rr_stuck_alert already paged
        # with the cause (2026-11-04: robot_trapped at 09:33 would also have
        # paged "off the charger" at 10:03, and charging_error at 12:36 again).
        value_template: >-
          {{ states('sensor.mr_slave_status_2') in
             ['charger_disconnected', 'idle', 'paused', 'error', 'charging_problem']
             and states('sensor.mr_slave_vacuum_error_2') in ['none', 'unknown', 'unavailable'] }}
        for: "00:30:00"
      - trigger: state
        id: offline
        entity_id: vacuum.mr_slave_2
        to: unavailable
        for: "00:15:00"
      - trigger: state
        id: charging
        entity_id: sensor.mr_slave_status_2
        to: [charging, charging_complete]
    # Docking only runs the automation when an off-charger alert is out. The
    # charging trigger fires on every dock visit (5 times in the 2026-11-04 mop
    # run: each wash, empty and the recharge pause); gating it here keeps those
    # out of last_triggered and the dashboard logbook. The recharge pause is
    # status charging, never in the off_charger list.
    conditions:
      - "{{ trigger.id != 'charging' or is_state('input_boolean.rr_off_charger_alerted', 'on') }}"
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'off_charger' }}"
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave is off the charger"
                  message: >-
                    {{ states('sensor.mr_slave_status_2') | replace('_', ' ') }} for 30 min,
                    battery {{ states('sensor.mr_slave_battery_2') }}%. It powers itself
                    off after ~12 h off the dock — seat it on the charger.
                  tag: rr_off_charger
                  urgent: true
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.rr_off_charger_alerted }
          - conditions: "{{ trigger.id == 'offline' }}"
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave is offline"
                  message: >-
                    Unreachable for 15 min — likely off the charger and powered down.
                    Put it on the dock (press power if it doesn't wake); scheduled
                    cleans will fail until it reconnects.
                  tag: rr_off_charger
                  urgent: true
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.rr_off_charger_alerted }
          - conditions: "{{ trigger.id == 'charging' }}"
            sequence:
              - action: script.rr_notify
                data:
                  message: clear_notification
                  tag: rr_off_charger
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.rr_off_charger_alerted }

  # Weekly water-tank swap (2026-10-18): a spare clean + dirty tank pair rotates
  # in every week so the used pair can be rinsed and dried (mold). 18:00 daily
  # nag once 7 days have passed since the last recorded swap; the iOS "Swapped"
  # button (or input_button.rr_tanks_swapped) records it and clears the alert.
  - id: rr_tank_swap_reminder
    alias: "Roborock: weekly water-tank swap reminder"
    mode: single
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: template
        value_template: >-
          {{ now().timestamp() - (state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0))
             > 6.5 * 86400 }}
    actions:
      - action: script.rr_notify
        data:
          title: "Swap Mr. Slave's water tanks"
          message: >-
            {% set ts = state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0) %}
            {{ 'No swap recorded yet.' if ts < 946684800 else
               'Last swap ' ~ ((now().timestamp() - ts) / 86400) | round(0) | int ~ ' days ago.' }}
            Put the spare clean (filled) and dirty tanks in the dock, then rinse the
            used pair and let them air-dry with the lids off. Tap Swapped when done.
          tag: rr_tank_swap
          actions:
            - action: RR_TANKS_SWAPPED
              title: "Swapped ✓"

  - id: rr_tank_swap_done
    alias: "Roborock: record water-tank swap"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.rr_tanks_swapped
        # Not "unknown": a never-pressed button is unknown, so excluding it
        # swallowed the first press (2026-10-18). Reload/restart is covered by
        # "unavailable" and the from_state check below.
        not_from: unavailable
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: RR_TANKS_SWAPPED
    conditions:
      - "{{ trigger.platform != 'state' or trigger.from_state is not none }}"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.rr_last_tank_swap
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: script.rr_notify
        data:
          message: clear_notification
          tag: rr_tank_swap

  # Both dock tanks report a problem while they're out; both clearing within
  # ~30 min of each other looks like a swap (or an empty + refill). Ask rather
  # than assume, unless a swap was already logged in the last day.
  - id: rr_tank_swap_detect
    alias: "Roborock: tanks back in the dock — confirm swap"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.mr_slave_dock_clean_water_box
          - binary_sensor.mr_slave_dock_dirty_water_box
        from: "on"
        to: "off"
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id:
          - binary_sensor.mr_slave_dock_clean_water_box
          - binary_sensor.mr_slave_dock_dirty_water_box
        state: "off"
      - condition: template
        value_template: >-
          {{ now() - states.binary_sensor.mr_slave_dock_clean_water_box.last_changed < timedelta(minutes=35)
             and now() - states.binary_sensor.mr_slave_dock_dirty_water_box.last_changed < timedelta(minutes=35) }}
      - condition: template
        value_template: >-
          {{ now().timestamp() - (state_attr('input_datetime.rr_last_tank_swap', 'timestamp') | float(0)) > 86400 }}
    actions:
      - action: script.rr_notify
        data:
          title: "Water tanks back in the dock"
          message: Was this the weekly swap? Tap Swapped to log it and reset the 7-day reminder.
          tag: rr_tank_swap
          actions:
            - action: RR_TANKS_SWAPPED
              title: "Swapped ✓"

  # Clean-water tank empty. Sources, in order of trust:
  #   - dock_dock_error = water_empty (seen 2026-10-09 and 10-18);
  #   - binary_sensor.mr_slave_dock_clean_water_box (problem class: ON = tank
  #     out or empty), live;
  #   - binary_sensor.mr_slave_water_shortage_2, the robot's own flag. It only
  #     re-evaluates when the dock pumps water, so after a refill it stays on
  #     until the next mop wash (on since 2026-11-03 12:06 although the tank was
  #     refilled 2026-11-04 08:16). It counts only while the clean tank has not
  #     been reseated since the flag rose.
  # 10 min debounce so a quick tank swap doesn't page. A time-sensitive repeat
  # at 07:45 on a mop day (input_datetime.rr_next_mop is today: Wednesday, or a
  # Thursday/Friday catch-up; Node-RED f_nx uses the rrMopDue rule) if it's
  # still empty before 08:30. Vacuum-only days don't need water, so no morning
  # nag on those. Clears from both phones once the tank is back.
  - id: rr_water_empty_alert
    alias: "Roborock: clean water tank empty"
    mode: queued
    triggers:
      - trigger: state
        id: empty
        entity_id: sensor.mr_slave_dock_dock_error
        to: water_empty
        for: "00:10:00"
      - trigger: state
        id: empty
        entity_id:
          - binary_sensor.mr_slave_dock_clean_water_box
          - binary_sensor.mr_slave_water_shortage_2
        from: "off"
        to: "on"
        for: "00:10:00"
      - trigger: time
        id: morning
        at: "07:45:00"
      # A restart or automation reload resets the 10-min `for:` timers above, so a
      # tank that is ALREADY empty never "becomes" empty (missed 2026-10-18).
      - trigger: homeassistant
        id: recheck
        event: start
      - trigger: event
        id: recheck
        event_type: automation_reloaded
      - trigger: state
        id: refilled
        entity_id: sensor.mr_slave_dock_dock_error
        from: water_empty
        for: "00:01:00"
      - trigger: state
        id: refilled
        entity_id:
          - binary_sensor.mr_slave_dock_clean_water_box
          - binary_sensor.mr_slave_water_shortage_2
        from: "on"
        to: "off"
        for: "00:01:00"
    actions:
      - if: "{{ trigger.id == 'recheck' }}"
        then:
          - delay: "00:10:00"
      - variables:
          empty: >-
            {% set box = states.binary_sensor.mr_slave_dock_clean_water_box %}
            {% set flag = states.binary_sensor.mr_slave_water_shortage_2 %}
            {{ is_state('sensor.mr_slave_dock_dock_error', 'water_empty')
               or is_state('binary_sensor.mr_slave_dock_clean_water_box', 'on')
               or (flag is not none and flag.state == 'on'
                   and (box is none or box.last_changed < flag.last_changed)) }}
          mop_today: "{{ states('input_datetime.rr_next_mop')[:10] == now().strftime('%Y-%m-%d') }}"
      - choose:
          - conditions: >-
              {{ empty and (trigger.id in ['empty', 'recheck']
                            or (trigger.id == 'morning' and mop_today)) }}
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave needs clean water"
                  message: >-
                    The clean-water tank is out or empty. Fill it (or drop in the spare)
                    before the next mop pass{{ ' this morning — it is skipped without water' if mop_today else '' }}.
                  tag: rr_water_empty
                  urgent: "{{ trigger.id == 'morning' }}"
          - conditions: "{{ trigger.id == 'refilled' and not empty }}"
            sequence:
              - action: script.rr_notify
                data:
                  message: clear_notification
                  tag: rr_water_empty

  # Job still open at 21:55. Do-not-disturb (22:00-08:00) stops the robot from
  # resuming after a recharge, so a mop routine or sweep that is recharging (or
  # will need to) won't finish tonight. 2026-10-19 the Monday mop day ended at
  # 18:26; this only fires on an unusually long day. No auto-clear: tag
  # replaces it the next time, and a clear on every job end would be noise.
  - id: rr_dnd_unfinished_alert
    alias: "Roborock: job unfinished before do-not-disturb"
    mode: single
    triggers:
      - trigger: time
        at: "21:55:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.mr_slave_cleaning_2
        state: "on"
      - condition: state
        entity_id: switch.mr_slave_do_not_disturb_2
        state: "on"
    actions:
      - action: script.rr_notify
        data:
          title: "Mr. Slave won't finish tonight"
          message: >-
            {% set phase = states('input_text.rr_run_phase') %}
            {% set st = states('sensor.mr_slave_status_2') | replace('_', ' ') %}
            {{ phase if phase not in ['unknown', 'unavailable', ''] else 'A cleaning job' }}
            is still open ({{ st }}, battery {{ states('sensor.mr_slave_battery_2') }}%,
            {{ states('sensor.mr_slave_cleaning_progress_2') }}% done). Do-not-disturb
            starts at 22:00, so it won't resume after a recharge until the next run.
          tag: rr_dnd_unfinished

  # Robot error, titled by kind (sensor.rr_vacuum_error advice): stuck/trapped,
  # jam, charging, dock wash tray, dock water, dirty sensor. Every error used to
  # be "Mr. Slave is stuck" (2026-11-04 charging_error paged as stuck).
  # 2026-10-25 12:52 it was robot_trapped for 14 min mid-sweep with no phone
  # alert. 1 min debounce so a self-clearing blip doesn't page (the 1-3 s
  # clean_carousel_exception blips of 2026-11-03 never page; see the follow-up
  # in docs/services/home-assistant.md). Not from unavailable: a reconnect with
  # the same error still set would page again. Time-sensitive unless it is only
  # a dirty sensor. One tag, so a new error replaces the old alert; clears from
  # both phones when the error goes back to none.
  - id: rr_stuck_alert
    alias: "Roborock: stuck or error alert"
    mode: queued
    triggers:
      - trigger: state
        id: error
        entity_id: sensor.mr_slave_vacuum_error_2
        not_from: [unknown, unavailable]
        not_to: [none, unknown, unavailable]
        for: "00:01:00"
      - trigger: state
        id: cleared
        entity_id: sensor.mr_slave_vacuum_error_2
        to: none
        not_from: [unknown, unavailable]
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'error' }}"
            sequence:
              - variables:
                  advice: "{{ state_attr('sensor.rr_vacuum_error', 'advice') or {} }}"
                  words: >-
                    {% set w = states('sensor.rr_vacuum_error') %}
                    {{ w if w not in ['unknown', 'unavailable'] else
                       states('sensor.mr_slave_vacuum_error_2') | replace('_', ' ') }}
              - action: script.rr_notify
                data:
                  title: "{{ advice.title | default('Mr. Slave has an error') }}"
                  message: >-
                    {% set near = states('input_text.rr_run_near') %}
                    {{ words[:1] | upper }}{{ words[1:] }}{{ (' (near ' ~ near ~ ')') if near not in ['', 'unknown', 'unavailable']
                    and is_state('binary_sensor.mr_slave_cleaning_2', 'on') else '' }},
                    battery {{ states('sensor.mr_slave_battery_2') }}%.
                    {{ advice.fix | default('Check the Roborock app for details.') }}
                  tag: rr_stuck
                  urgent: "{{ advice.kind | default('other') != 'sensor' }}"
          - conditions: "{{ trigger.id == 'cleared' }}"
            sequence:
              - action: script.rr_notify
                data:
                  message: clear_notification
                  tag: rr_stuck

  # Dock problem other than an empty clean tank (that one is rr_water_empty_alert):
  # dirty tank full, wash tray full or blocked, dust bag/duct, latch. 2026-11-03
  # cleaning_tank_full_or_blocked sat for 38 min mid-mop with no phone alert.
  # 10 min debounce; clears when the dock is back to ok.
  - id: rr_dock_error_alert
    alias: "Roborock: dock error alert"
    mode: queued
    triggers:
      - trigger: state
        id: error
        entity_id: sensor.mr_slave_dock_dock_error
        not_from: [unknown, unavailable]
        not_to: [ok, water_empty, unknown, unavailable]
        for: "00:10:00"
      - trigger: state
        id: cleared
        entity_id: sensor.mr_slave_dock_dock_error
        to: ok
        not_from: [unknown, unavailable, water_empty]
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'error' }}"
            sequence:
              - action: script.rr_notify
                data:
                  title: "Mr. Slave's dock needs attention"
                  message: >-
                    {% set e = trigger.to_state.state %}
                    {{ {'no_dustbin_or_filter': 'The dustbin or its filter is missing.',
                        'auto_empty_dock_fan_error': 'The auto-empty fan has a fault.',
                        'duct_blockage': 'The auto-empty duct is blocked. Clear the duct and the robot dustbin port.',
                        'auto_empty_dock_voltage_error': 'The auto-empty unit has a power fault.',
                        'waste_water_tank_full': 'The dirty-water tank is full. Empty and reseat it.',
                        'maintenance_brush_jammed': 'The wash-tray brush is jammed. Pull the tray and clear it.',
                        'dirty_tank_latch_open': 'The dirty-water tank latch is open. Reseat the tank.',
                        'no_dustbin': 'The dust bag is missing or full. Replace the bag.',
                        'cleaning_tank_full_or_blocked': 'The wash tray is full or its drain is blocked. Pull the tray, rinse it and its strainer, check the dirty tank.'
                       }.get(e, 'Dock error: ' ~ e | replace('_', ' ') ~ '.') }}
                    The run can't carry on until it is cleared.
                  tag: rr_dock_error
                  urgent: true
          - conditions: "{{ trigger.id == 'cleared' }}"
            sequence:
              - action: script.rr_notify
                data:
                  message: clear_notification
                  tag: rr_dock_error

# HomeKit bridge exposes the vacuum, per-room clean buttons, and routines to
# Apple Home (include list lives in .storage/core.config_entries on the host).
