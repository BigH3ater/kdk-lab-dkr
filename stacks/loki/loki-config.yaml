# Monolithic (single-binary) Loki for kdk-lab on kdk-log-01 (VM 320). Storage
# is the VM disk at /opt/kdk-lab/loki/data, bind-mounted here as /loki
# (backed up by the PBS vzdump of VM 320). Single writer, local filesystem.
# 3.5.5 -> 3.7.9 (2026-10): no key in this file changed; the 3.6/3.7 upgrade
# notes only touch S3 (AWS SDK v2), Promtail removal and the Helm charts.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h            # 30 days
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000

# Rules come from git (stacks/loki/rules/ mounted read-only at /loki/rules/fake,
# `fake` = the single-tenant id). `ruler.storage` is marked deprecated in 3.7 in
# favour of top-level `ruler_storage`, but it is still the documented local
# backend and is honoured; switch when the local example in the docs moves.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  enable_api: true
  # Alertmanager on kdk-mon-01, published on its VLAN-20 address (monitoring
  # stack). Routed to Pushover by the source="loki" route in alertmanager.yml.
  alertmanager_url: http://10.1.20.30:9093
  enable_alertmanager_v2: true
  external_url: https://grafana.kmkdp.com

analytics:
  reporting_enabled: false
