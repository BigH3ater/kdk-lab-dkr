# Loki logging stack on kdk-log-01 (10.1.20.21, VM 320). Moved off kdk-dkr-01
# 2026-10 (security plan B1 / posture finding C-02): Loki has no auth, so it
# now lives on a dedicated VM whose nft policy (hosts/kdk-log-01/nftables.conf)
# admits :3100/:514 only from the lab's log senders, and every port below is
# bound to the VLAN-20 address instead of 0.0.0.0. Data is on the VM disk at
# /opt/kdk-lab/loki/data (PBS vzdump of VM 320), not NFS.
# Alloy here is the syslog receiver (:514 tcp+udp); per-host container-log
# shipping is the separate observability-agent stack.
#
# Recreate-on-change: compose does not hash bind-mounted file contents, so the
# Komodo pre_deploy writes RULES_SHA / LOKI_CONFIG_SHA / ALLOY_CONFIG_SHA into
# .env and the labels below change with them -- a rules- or config-only edit
# therefore recreates the container (komodo/resources.toml, stack `loki`).
name: loki
services:
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "10.1.20.21:3100:3100"   # agents (all hosts) + Grafana on kdk-mon-01; nft allowlist in front
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /opt/kdk-lab/loki/data:/loki
      # Ruler rules from git. Single-tenant Loki (auth_enabled: false) uses the
      # tenant id `fake`, and the local ruler reads <directory>/<tenant>/*.
      # Every non-hidden file in rules/ is parsed: keep only rule YAML there.
      - ./rules:/loki/rules/fake:ro
    labels:
      kdk.rules-sha: "${RULES_SHA:-unset}"
      kdk.config-sha: "${LOKI_CONFIG_SHA:-unset}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true            # writes only under /loki (the bind mount)
    tmpfs: [/tmp]
    pids_limit: 512
    mem_limit: 4g
    # The 3.5.8+ image is distroless (no shell, no wget); the binary has its
    # own probe: `loki -health` GETs /ready and exits 0/1.
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health", "-health.url=http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  syslog:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: loki-syslog
    restart: unless-stopped
    # The image defaults to root but ships an `alloy` user (473) that owns
    # /var/lib/alloy (mode 770). Root with cap_drop ALL has no DAC_OVERRIDE and
    # could not write there, so run as 473: no caps needed at all.
    user: "473:473"
    command:
      - "run"
      - "--server.http.listen-addr=127.0.0.1:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/syslog.alloy"
    ports:
      # Alloy listens on 1514 inside the container, so the non-root user needs
      # no NET_BIND_SERVICE (and nothing relies on Docker's
      # ip_unprivileged_port_start=0 default).
      - "10.1.20.21:514:1514/tcp"   # syslog.kmkdp.com -> 10.1.20.21:514 (rsyslog forwarders)
      - "10.1.20.21:514:1514/udp"   # UDP senders (network gear)
    volumes:
      - ./alloy/syslog.alloy:/etc/alloy/syslog.alloy:ro
      - alloy-data:/var/lib/alloy/data   # WAL/positions; rootfs is read-only
    labels:
      kdk.config-sha: "${ALLOY_CONFIG_SHA:-unset}"
    depends_on:
      loki:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 256
    mem_limit: 512m
    # Ubuntu-based image without curl/wget: probe /-/ready with bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *log

volumes:
  alloy-data:
