# Identity: Authelia + LLDAP on kdk-dkr-dmz-01 (source: vault 10.Homelab/
# Security/authelia-posture-2026-10.md section 6). Authelia logs JSON
# (`level`, `msg`, `remote_ip`, `method`, `path`), so `| json` gives msg and
# remote_ip as labels. LogQL label regexes are fully anchored: `msg=~"X.*"`
# means "starts with X".
#
# Runbook: docs/runbooks/security-alerts.md#identity
groups:
  - name: identity
    interval: 1m
    rules:
      # Failed first factor / TOTP / WebAuthn against an EXISTING user (Authelia
      # prefixes them "Unsuccessful"). Authelia 4.39 logs `by user ''` whenever the
      # submitted username does not exist (it logs the resolved name, which is
      # empty), so the empty-user lines are wrong-username attempts, not
      # credential-less posts. They are counted by AutheliaUnknownUserBurst below,
      # which can see the submitted username and so can exclude the edge probe.
      - alert: AutheliaFailedLoginBurst
        expr: |
          sum by (remote_ip) (count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |= "Unsuccessful" | json | msg=~"Unsuccessful .*"
            | msg!~"Unsuccessful .*by user ''.*" [15m])) > 10
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
        annotations:
          summary: "Authelia: more than 10 failed authentications in 15m from {{ $labels.remote_ip }}"
          description: "Authelia on kdk-dkr-dmz-01 logged more than 10 failed 1FA/2FA attempts with a username in 15m from {{ $labels.remote_ip }}. Check authentication_logs in authelia-postgres; a public IP = block it at the WAF."
          runbook: docs/runbooks/security-alerts.md#identity

      # Wrong-username spray. For a username that does not exist Authelia logs
      # `Error occurred getting details for user with username input '<name>' ...`
      # next to the `Unsuccessful 1FA ... by user ''` line, and returns BEFORE its
      # regulation ban check, so these attempts are never banned and never show up
      # in AutheliaFailedLoginBurst. The lab's edge probe (scripts/edge-probe.sh)
      # always submits the nonexistent name `edge-probe-nonexistent` (30 lines per
      # run), so it is excluded by name, not by the house WAN IP: the repo is public
      # and that IP is dynamic. Submitting that one name cannot guess anything, so
      # the exclusion hides no real attack.
      - alert: AutheliaUnknownUserBurst
        expr: |
          sum by (remote_ip) (count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |= "Error occurred getting details for user" | json
            | msg=~"Error occurred getting details for user with username input .*"
            | msg!~".*username input 'edge-probe-nonexistent'.*" [15m])) > 10
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
        annotations:
          summary: "Authelia: more than 10 logins with unknown usernames in 15m from {{ $labels.remote_ip }} (username spray)"
          description: "Authelia on kdk-dkr-dmz-01 logged more than 10 first-factor attempts for usernames that do not exist in 15m from {{ $labels.remote_ip }} (edge probe excluded). Regulation never bans these; a public IP = block it at the WAF."
          runbook: docs/runbooks/security-alerts.md#identity

      # Authelia 4.39 writes NO log line when regulation creates a ban (the
      # regulator only logs storage errors; checked in v4.39.28 source,
      # internal/regulation/regulator.go, and in the 2026-11-07 ban of the house
      # WAN, which left nothing at info level). The only log trace is a LATER
      # first-factor attempt for an existing username from a banned user or IP:
      # `Unsuccessful 1FA authentication attempt by user '<u>' and they are banned
      # until <time>` (internal/handlers/response.go). Attempts for unknown
      # usernames return before the ban check and never log it. So this alerts on
      # "someone kept trying while banned", not on the ban itself; the ban rows
      # live in the banned_ip / banned_user tables (no exporter today).
      - alert: AutheliaRegulationBan
        expr: |
          sum by (remote_ip) (count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |= "and they are banned until" | json
            | msg=~"Unsuccessful .* authentication attempt by user '.*' and they are banned until .*" [5m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
          # Message text from the Authelia source, not yet seen in this lab's
          # logs (2026-11-08): promote (drop this label) once it fires on a real
          # ban, or replace it with a banned_ip/banned_user table metric, by
          # 2026-12-08 (alerting-standards §3).
          kdk_inferred: "true"
        annotations:
          summary: "Authelia: login attempt from {{ $labels.remote_ip }} rejected by a regulation ban"
          description: "Authelia on kdk-dkr-dmz-01 rejected a first-factor attempt for an existing user because the user or {{ $labels.remote_ip }} is banned by regulation. Check authelia storage bans ip list / user list; a locked-out family member is revoked with authelia storage bans user revoke (or bans ip revoke)."
          runbook: docs/runbooks/security-alerts.md#identity

      - alert: AutheliaOidcClientAuthFailure
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |= "Authorization Request failed" | json | msg=~"Authorization Request failed.*" [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
        annotations:
          summary: "Authelia: an OIDC authorization request failed (bad client, redirect URI or secret)"
          description: "Authelia on kdk-dkr-dmz-01 logged Authorization Request failed. The line's client_id names the client; a wrong or rotated client secret is the usual cause, an unknown client is a probe."
          runbook: docs/runbooks/security-alerts.md#identity

      # An authenticated user denied by policy (not the anonymous 401s).
      - alert: AutheliaForbiddenNamedUser
        expr: |
          sum by (msg) (count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |= "is forbidden to user" | json | msg=~".* is forbidden to user '.*'" | msg!~".*<anonymous>.*" [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
        annotations:
          summary: "Authelia denied a signed-in user by policy: {{ $labels.msg }}"
          description: "Authelia on kdk-dkr-dmz-01 denied a signed-in user by access policy ({{ $labels.msg }}). Expected after a group change; otherwise check access_control in stacks/identity/authelia/configuration.yml."
          runbook: docs/runbooks/security-alerts.md#identity

      # The forward-auth endpoint called with bad headers from a public address.
      # ip() instead of a prefix regex: label regexes are anchored, and a CIDR
      # match also covers 172.16/12 (Docker bridges, storage net).
      - alert: AutheliaForwardAuthBadHeadersPublic
        expr: |
          sum by (remote_ip) (count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |= "Error getting Target URL and Request Method" | json
            | msg="Error getting Target URL and Request Method"
            | remote_ip != ip("10.0.0.0/8") | remote_ip != ip("172.16.0.0/12")
            | remote_ip != ip("192.168.0.0/16") | remote_ip != ip("100.64.0.0/10")
            | remote_ip != ip("127.0.0.0/8") [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
        annotations:
          summary: "Authelia forward-auth endpoint called with bad headers from public IP {{ $labels.remote_ip }} (direct probe of /api/authz)"
          description: "Authelia on kdk-dkr-dmz-01 logged a forward-auth call with bad headers from public IP {{ $labels.remote_ip }}: someone hit /api/authz directly. Check that no tunnel public hostname routes it."
          runbook: docs/runbooks/security-alerts.md#identity

      # Inferred wording (not yet observed in this lab's logs): confirm once with
      # a test TOTP/WebAuthn enrolment and tighten the regex to the real message.
      - alert: AutheliaSecondFactorChanged
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="authelia"}
            |~ "(?i)(totp|webauthn|passkey)" | json
            | msg=~"(?i).*(totp|webauthn|passkey).*(regist|added|deleted|removed).*" [15m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: identity
          # Inferred log text since 2026-10-28: promote (drop this label) or
          # delete the rule by 2026-11-27 (alerting-standards §3).
          kdk_inferred: "true"
          # Security-adjacent: a 2FA factor change should also ping the phone
          # (quiet Pushover) promptly, not wait for the info e-mail digest.
          notify: phone
        annotations:
          summary: "Authelia: a 2FA device (TOTP/WebAuthn) was registered or removed"
          description: "Authelia on kdk-dkr-dmz-01 logged a TOTP/WebAuthn/passkey registration or removal (inferred log text). Expected right after an enrolment; otherwise check webauthn_credentials in authelia-postgres and remove the device."
          runbook: docs/runbooks/security-alerts.md#identity

      # Inferred wording: lldap logs bind attempts ("Login attempt for ...");
      # failures are only visible with LLDAP_VERBOSE=true. Confirm the failure
      # text with one wrong-password bind and tighten the regex.
      - alert: LldapBindFailures
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="lldap"}
            |~ "(?i)(invalid credentials|bind (failed|error)|login attempt for .*(fail|invalid|wrong))" [10m])) > 5
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: identity
          # Inferred log text since 2026-10-28: promote (drop this label) or
          # delete the rule by 2026-11-27 (alerting-standards §3).
          kdk_inferred: "true"
        annotations:
          summary: "lldap: more than 5 failed LDAP binds in 10m (password spraying via a service that binds as the user)"
          description: "lldap on kdk-dkr-dmz-01 logged more than 5 failed binds in 10m (inferred log text). Find which service binds as the user (Jellyfin LDAP, Wizarr, Grafana); a burst means password spraying through its login page."
          runbook: docs/runbooks/security-alerts.md#identity
