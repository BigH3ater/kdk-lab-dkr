# Wizarr on kdk-dkr-dmz-01 (source: vault 10.Homelab/Security/
# wizarr-posture-2026-10.md section 7). Two Traefik routers: wizarr-public
# (allowlisted invitee paths, no auth; entrypoints websecure,tunnel) and
# wizarr-admin (everything else behind Authelia; websecure only). Traefik logs
# RouterName as "<entrypoint>-<router>@docker", so the rules match the router
# suffix. RequestPath has no query string (Traefik drops it); label regexes are anchored.
#
# Runbook: docs/runbooks/security-alerts.md#wizarr
groups:
  - name: wizarr
    interval: 1m
    rules:
      # D1: invite-code guessing burst on /j or /join, per client. Wizarr has no
      # rate limit of its own. `client` is Cf-Connecting-Ip on the tunnel (set by
      # Cloudflare, not forgeable) and ClientHost on the LAN.
      # Synthetic test: 31 x GET https://wizarr.kmkdp.com/j/x from the LAN.
      - alert: WizarrInviteGuessBurst
        expr: |
          sum by (client) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "wizarr.kmkdp.com" | json | RequestHost="wizarr.kmkdp.com"
            | RouterName=~".*wizarr-public@docker" | RequestPath=~"/(j/|join).*"
            | label_format client="{{ if .request_Cf_Connecting_Ip }}{{ .request_Cf_Connecting_Ip }}{{ else }}{{ .ClientHost }}{{ end }}" [5m])) > 30
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr: {{ $labels.client }} hit /j or /join more than 30 times in 5m (invite-code guessing)"
          description: "The DMZ Traefik logged more than 30 requests to /j or /join on wizarr-public in 5m from {{ $labels.client }} (invite-code guessing). Block the IP at the WAF and check Wizarr Invitations for an unknown used code."
          runbook: docs/runbooks/security-alerts.md#wizarr

      # D2: a tunnel request for wizarr.kmkdp.com was served by any router other
      # than wizarr-public. Only `tunnel-wizarr-public@docker` should ever answer
      # on the tunnel; a tunnel path no router claims is a 404 with an empty
      # RouterName (excluded here, EdgeWizarrAdminPathHit covers admin paths).
      # So any other router (wizarr-admin gaining ",tunnel", a new router, a
      # catch-all) answering a tunnel client with a non-404 is a routing
      # regression that exposes something past the invitee allowlist. The old
      # form required entryPointName="tunnel" AND RouterName wizarr-admin, which
      # never co-occur because wizarr-admin is websecure-only (dead rule).
      - alert: WizarrAdminRouterNon302
        expr: |
          sum by (RouterName) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "wizarr.kmkdp.com" | json | entryPointName="tunnel" | RequestHost="wizarr.kmkdp.com"
            | RouterName!~".*wizarr-public@docker" | DownstreamStatus!="404" [10m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr: a tunnel request was served by router {{ $labels.RouterName }}, not wizarr-public"
          description: "The DMZ Traefik answered a tunnel request for wizarr.kmkdp.com through router {{ $labels.RouterName }} (non-404), so something other than the invitee allowlist is reachable from the internet. Check stacks/wizarr/compose.yaml router entrypoints and ForwardAuth; remove the public hostname until fixed."
          runbook: docs/runbooks/security-alerts.md#wizarr

      # D3: posture finding F1 tripwire. The invite flow touched an EXISTING
      # lldap account (attribute update or password set).
      - alert: WizarrLdapExistingUserTouched
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="wizarr"}
            |~ "already exists, updating attributes|Updated LDAP user password" [5m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr: an invite modified an existing lldap account (posture finding F1)"
          description: "The wizarr container on kdk-dkr-dmz-01 logged an attribute update or password set on an existing lldap account during an invite (posture finding F1). Check that account's groups in lldap, reset its password and delete the invite code."
          runbook: docs/runbooks/security-alerts.md#wizarr

      - alert: WizarrLdapUserCreated
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="wizarr"} |= "Created LDAP user with password" [15m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr created an lldap user (expected only right after you sent an invite)"
          description: "The wizarr container on kdk-dkr-dmz-01 logged Created LDAP user with password. Expected right after you sent an invite; otherwise check Wizarr Invitations and lldap users."
          runbook: docs/runbooks/security-alerts.md#wizarr

      # D4: admin logins (proxy SSO since 2026-10-29: Wizarr's own password path is
      # dead, so "AUTH FAIL" never appears) and admin/settings/API-key mutations.
      # An admin session = an entry page (/, /login, /admin) on the admin router
      # that Wizarr itself answered. OriginStatus!="0" is the ForwardAuth gate:
      # when Authelia turns an anonymous client away (302 to sso / 401) Traefik
      # never calls Wizarr and logs OriginStatus 0, which the old rule counted as a
      # "login" (curl GET /login -> 302, 2026-11-08 01:22Z). Real sessions in 7d
      # entered on / and /admin, never /login, hence the wider path set.
      - alert: WizarrAdminLogin
        expr: |
          sum by (client) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "wizarr.kmkdp.com" | json | RequestHost="wizarr.kmkdp.com"
            | RouterName=~".*wizarr-admin@docker" | RequestPath=~"^/(login|admin)?(\\?.*)?$"
            | DownstreamStatus=~"2..|3.." | OriginStatus!="0"
            | label_format client="{{ if .request_Cf_Connecting_Ip }}{{ .request_Cf_Connecting_Ip }}{{ else }}{{ .ClientHost }}{{ end }}" [10m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr: admin login from {{ $labels.client }} (Authelia passed; Wizarr itself does no login)"
          description: "The DMZ Traefik logged Wizarr answering /, /login or /admin on the admin router for {{ $labels.client }}, which is an admin session Authelia let through. Expected when you open Wizarr; otherwise check who reached the admin UI."
          runbook: docs/runbooks/security-alerts.md#wizarr

      # D5: an invite was accepted (the only write a stranger can do). Info, by client,
      # so an accepted invite is visible next to the LDAP-created-user line.
      - alert: WizarrInviteAccepted
        expr: |
          sum by (client) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "wizarr.kmkdp.com" | json | RequestHost="wizarr.kmkdp.com"
            | RequestMethod="POST" | RequestPath=~"^/invitation/process.*" | DownstreamStatus=~"2..|3.."
            | label_format client="{{ if .request_Cf_Connecting_Ip }}{{ .request_Cf_Connecting_Ip }}{{ else }}{{ .ClientHost }}{{ end }}" [10m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr: invite accepted from {{ $labels.client }}"
          description: "The DMZ Traefik logged a successful POST to /invitation/process on wizarr from {{ $labels.client }}. Expected right after you sent an invite; otherwise check Wizarr Invitations for a code you did not issue."
          runbook: docs/runbooks/security-alerts.md#wizarr

      # D6: admin paths requested over the tunnel. The admin router is websecure-only,
      # so these are 404 at Traefik (or 403 at the Cloudflare edge before that); any hit
      # is someone probing the public hostname for the admin portal.
      # The lab's own edge probe (UA kdk-edge-probe/1, scripts/edge-probe.sh) requests
      # /admin and /api/users to canary the edge block; it is excluded here and
      # surfaced by EdgeWizarrAdminPathProbe below, the same split as
      # EdgeJellyfinAdminPathHit/Probe in edge.yml. A scanner that forges the probe
      # UA lands in the Probe rule, so it is still seen.
      - alert: EdgeWizarrAdminPathHit
        expr: |
          sum by (client) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            | json | entryPointName="tunnel" | RequestHost="wizarr.kmkdp.com"
            | RequestPath=~"^/(admin|api|login|logout|settings|setup|webauthn|activity|health)(/.*)?$"
            | request_User_Agent!~"kdk-edge-probe.*"
            | label_format client="{{ if .request_Cf_Connecting_Ip }}{{ .request_Cf_Connecting_Ip }}{{ else }}{{ .ClientHost }}{{ end }}" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: wizarr
        annotations:
          summary: "Wizarr: admin path requested over the tunnel from {{ $labels.client }}"
          description: "The DMZ Traefik logged a Wizarr admin path request on wizarr.kmkdp.com through the tunnel from {{ $labels.client }}, where the admin router is not routed. Confirm it was you; otherwise someone is probing for the admin portal."
          runbook: docs/runbooks/security-alerts.md#wizarr

      # The edge probe's own /admin and /api/users rows reached the origin: the
      # Cloudflare block rule for Wizarr admin paths is missing or wrong.
      - alert: EdgeWizarrAdminPathProbe
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            | json | entryPointName="tunnel" | RequestHost="wizarr.kmkdp.com"
            | RequestPath=~"^/(admin|api|login|logout|settings|setup|webauthn|activity|health)(/.*)?$"
            | request_User_Agent=~"kdk-edge-probe.*" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: wizarr
        annotations:
          summary: "The lab's edge probe reached a Wizarr admin path through the tunnel: the Cloudflare block rule is missing that path"
          description: "The lab's kdk-edge-probe request to a Wizarr admin path on wizarr.kmkdp.com reached the DMZ Traefik through the tunnel, so the Cloudflare edge block for Wizarr admin paths is missing that path. Fix the WAF rule expression."
          runbook: docs/runbooks/security-alerts.md#wizarr

      - alert: WizarrAdminMutation
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "wizarr.kmkdp.com" | json | RequestHost="wizarr.kmkdp.com"
            | RequestMethod=~"POST|PUT|DELETE" | RequestPath=~"/(settings|admin/accounts|api-keys|api/).*"
            | DownstreamStatus=~"2..|3.." [10m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: wizarr
          # Security-adjacent admin mutation: also ping the phone (quiet
          # Pushover) promptly, not only the info e-mail digest.
          notify: phone
        annotations:
          summary: "Wizarr admin/settings mutation (expected only while you are working in Wizarr)"
          description: "The DMZ Traefik logged a successful POST/PUT/DELETE to Wizarr settings, accounts, API keys or API. Expected only while you work in Wizarr; otherwise check who holds an admin session."
          runbook: docs/runbooks/security-alerts.md#wizarr
