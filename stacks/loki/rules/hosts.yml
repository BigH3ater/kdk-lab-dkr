# Host-level detection (source: vault 10.Homelab/Security/
# docker-hosts-posture-2026-10.md finding M-10). sshd and sudo come from the
# syslog stream (rsyslog forwarders -> loki-syslog on kdk-log-01): labels
# job="syslog", host=<syslog hostname>, app=<program>. Debian 13 logs the
# session lines as `sshd-session`, older images as `sshd`, hence app=~"sshd.*".
#
# Admin source set (matches the kdk-log-01 nft admin_v4 set + dkr-01 for
# Komodo/backup-collect automation): 10.1.30.188 (workstation), 10.1.20.20
# (kdk-dkr-01), 100.64.0.0/10 (tailnet, routed without masquerade),
# 192.168.3.0/24 (mgmt LAN). Posture finding L-05 also saw 192.168.2.3; it is
# deliberately NOT allowed here until the owner identifies it.
#
# Runbook: docs/runbooks/security-alerts.md#hosts
groups:
  - name: hosts
    interval: 1m
    rules:
      - alert: HostSshLoginFromUnexpectedSource
        expr: |
          sum by (host, user, src) (count_over_time({job="syslog", app=~"sshd.*"} |= "Accepted "
            | regexp `Accepted (?P<method>\S+) for (?P<user>\S+) from (?P<src>\S+) port`
            | src != ip("10.1.30.188") | src != ip("10.1.20.20")
            | src != ip("100.64.0.0/10") | src != ip("192.168.3.0/24") [10m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: hosts
        annotations:
          summary: "SSH login as {{ $labels.user }} on {{ $labels.host }} from {{ $labels.src }} (not an admin source)"
          runbook: docs/runbooks/security-alerts.md#hosts

      # sudo refusals: wrong password, not in sudoers, command not allowed.
      - alert: HostSudoFailure
        expr: |
          sum by (host) (count_over_time({job="syslog", app="sudo"}
            |~ "(?i)(NOT in sudoers|incorrect password attempt|authentication failure|command not allowed)" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "sudo refused a request on {{ $labels.host }}"
          runbook: docs/runbooks/security-alerts.md#hosts

      # sudo run by anyone other than kdkadmin (the only account with keys) or
      # root. Only the command lines (`<user> : PWD=... ; USER=... ; COMMAND=...`)
      # are parsed; the pam_unix session lines are skipped by the line filter.
      - alert: HostSudoByUnexpectedUser
        expr: |
          sum by (host, sudo_user) (count_over_time({job="syslog", app="sudo"} |= " ; COMMAND="
            | regexp `^\s*(?P<sudo_user>\S+) : `
            | sudo_user!~"kdkadmin|root" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "sudo used by {{ $labels.sudo_user }} on {{ $labels.host }} (only kdkadmin is expected)"
          runbook: docs/runbooks/security-alerts.md#hosts

      # An image pulled or a container created on the DMZ host from an image no
      # DMZ stack uses. docker-event-watch logs `event ... action=create ...
      # image=<ref>` and `event type=image action=pull image=<ref>`.
      # Allowlist = the image repositories of every stack on kdk-dkr-dmz-01
      # (komodo/resources.toml). Adding a stack/image on dmz-01 means adding its
      # repository here in the same PR.
      - alert: HostUnknownImageOnDmz
        expr: |
          sum by (image) (count_over_time({host="kdk-dkr-dmz-01", container="docker-event-watch"}
            |~ "action=(pull|create) " | regexp `image=(?P<image>\S+)`
            | image!~"(docker\\.io/)?(library/)?(traefik|cloudflare/cloudflared|lldap/lldap|ldez/traefik-certs-dumper|postgres|redis|busybox|python|alpine|docker|valkey/valkey|instrumentisto/rsync-ssh|grafana/alloy|prom/node-exporter|aquasec/trivy|tecnativa/docker-socket-proxy)([:@].*)?|(ghcr\\.io/(authelia/authelia|seerr-team/seerr|zamnzim/libreseerr|tandoorrecipes/recipes|immich-app/immich-server|immich-app/immich-machine-learning|immich-app/postgres|advplyr/audiobookshelf|wizarrrr/wizarr|google/cadvisor)|lscr\\.io/linuxserver/jellyfin)([:@].*)?" [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "Unknown image {{ $labels.image }} pulled or run on kdk-dkr-dmz-01"
          runbook: docs/runbooks/security-alerts.md#hosts
