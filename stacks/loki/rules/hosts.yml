# Host-level detection (source: vault 10.Homelab/Security/
# docker-hosts-posture-2026-10.md finding M-10). sshd and sudo come from the
# syslog stream (rsyslog forwarders -> loki-syslog on kdk-log-01): labels
# job="syslog", host=<syslog hostname>, app=<program>. Debian 13 logs the
# session lines as `sshd-session`, older images as `sshd`, hence app=~"sshd.*".
#
# Admin source set (matches the kdk-log-01 nft admin_v4 set + dkr-01 for
# Komodo/backup-collect automation): 10.1.30.0/24 (users VLAN, admin workstations), 10.1.20.20
# (kdk-dkr-01), 100.64.0.0/10 (tailnet, routed without masquerade),
# 192.168.2.0/24 (UniFi "WireGuard VPN Server" network, break-glass VPN; the
# 192.168.2.3 of posture finding L-05 was the owner's peer on it; until
# 2026-10-29 this rule wrongly said 192.168.3.0/24).
#
# Runbook: docs/runbooks/security-alerts.md#hosts
groups:
  - name: hosts
    interval: 1m
    rules:
      - alert: HostSshLoginFromUnexpectedSource
        expr: |
          sum by (host, user, src) (count_over_time({job="syslog", app=~"sshd.*"} |= "Accepted "
            | regexp `Accepted (?P<method>\S+) for (?P<user>\S+) from (?P<src>\S+) port`
            | src != ip("10.1.30.0/24") | src != ip("10.1.20.20")
            | src != ip("100.64.0.0/10") | src != ip("192.168.2.0/24") [10m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: hosts
        annotations:
          summary: "SSH login as {{ $labels.user }} on {{ $labels.host }} from {{ $labels.src }} (not an admin source)"
          description: "sshd on {{ $labels.host }} accepted a login for {{ $labels.user }} from {{ $labels.src }}, which is outside the admin source set. Run journalctl -u ssh --since -1h on the host; if unknown, rotate the kdkadmin SSH key and check authorized_keys on every host."
          runbook: docs/runbooks/security-alerts.md#hosts

      # sudo refusals: wrong password, not in sudoers, command not allowed.
      - alert: HostSudoFailure
        expr: |
          sum by (host) (count_over_time({job="syslog", app="sudo"}
            |~ "(?i)(NOT in sudoers|incorrect password attempt|authentication failure|command not allowed)" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "sudo refused a request on {{ $labels.host }}"
          description: "sudo on {{ $labels.host }} logged a wrong password, a not-in-sudoers or a command-not-allowed refusal in 10m. Check who ran it with journalctl _COMM=sudo on the host."
          runbook: docs/runbooks/security-alerts.md#hosts

      # sudo run by anyone other than kdkadmin (the only account with keys) or
      # root. Only the command lines (`<user> : PWD=... ; USER=... ; COMMAND=...`)
      # are parsed; the pam_unix session lines are skipped by the line filter.
      - alert: HostSudoByUnexpectedUser
        expr: |
          sum by (host, sudo_user) (count_over_time({job="syslog", app="sudo"} |= " ; COMMAND="
            | regexp `^\s*(?P<sudo_user>\S+) : `
            | sudo_user!~"kdkadmin|root" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "sudo used by {{ $labels.sudo_user }} on {{ $labels.host }} (only kdkadmin is expected)"
          description: "sudo on {{ $labels.host }} ran a command for {{ $labels.sudo_user }}; only kdkadmin and root are expected. Check journalctl _COMM=sudo and lock the account if it is not yours."
          runbook: docs/runbooks/security-alerts.md#hosts

      # An image pulled or a container created on the DMZ host from an image no
      # DMZ stack uses. docker-event-watch logs `event ... action=create ...
      # image=<ref>` and `event type=image action=pull image=<ref>`.
      # Allowlist = the image repositories of every stack on kdk-dkr-dmz-01
      # (komodo/resources.toml), matched against the real `image=` refs the event
      # log carries (verified over 7d). Several stacks pin the ghcr.io form, so
      # the allowlist carries both registries where they differ:
      # docker-socket-proxy and linuxserver/jellyfin are pulled as ghcr.io/...
      # (not the docker.io / lscr.io forms), and curlimages/curl is the net-probe
      # one-shot. Each is an explicit repo path; no wildcard on a registry.
      # Adding a stack/image on dmz-01 means adding its repository here in the
      # same PR.
      - alert: HostUnknownImageOnDmz
        expr: |
          sum by (image) (count_over_time({host="kdk-dkr-dmz-01", container="docker-event-watch"}
            |~ "action=(pull|create) " | regexp `image=(?P<image>\S+)`
            | image!~"(docker\\.io/)?(library/)?(traefik|cloudflare/cloudflared|lldap/lldap|ldez/traefik-certs-dumper|postgres|redis|busybox|python|alpine|docker|valkey/valkey|instrumentisto/rsync-ssh|grafana/alloy|prom/node-exporter|aquasec/trivy|tecnativa/docker-socket-proxy|curlimages/curl)([:@].*)?|(ghcr\\.io/(authelia/authelia|seerr-team/seerr|zamnzim/libreseerr|tandoorrecipes/recipes|immich-app/immich-server|immich-app/immich-machine-learning|immich-app/postgres|advplyr/audiobookshelf|wizarrrr/wizarr|google/cadvisor|tecnativa/docker-socket-proxy|linuxserver/jellyfin)|lscr\\.io/linuxserver/jellyfin)([:@].*)?" [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "Unknown image {{ $labels.image }} pulled or run on kdk-dkr-dmz-01"
          description: "docker-event-watch on kdk-dkr-dmz-01 logged a pull or create of {{ $labels.image }}, which no DMZ stack uses. Check docker ps -a and docker images; a legitimate new stack needs its repository added to the hosts.yml allowlist."
          runbook: docs/runbooks/security-alerts.md#hosts

      # A kernel lockup or stall on any host. kdk-dkr-01 logged
      # `rcu: INFO: rcu_preempt self-detected stall on CPU` (08:39:51Z) and five
      # `watchdog: BUG: soft lockup - CPU#n stuck for 22-52s!` lines (to
      # 08:40:24Z) on 2026-11-08, then rebooted at 08:40:33Z; nothing paged (vault
      # 10.Homelab/Followups/alert-review-2026-11-08.md). Kernel lines reach Loki
      # through the syslog stream as job="syslog", app="kernel" (there is no
      # journal job). app="kernel" keeps out a human grepping for these words (a
      # sudo command line matched over 7d). `blocked for more than N seconds` is
      # the hung_task message itself; `hung_task` alone only matches its hint
      # line. Over the 7d to 2026-11-08 this matched exactly those six dkr-01
      # lines. for: 0m = fire on the first line; the Loki warning route repeats
      # every 4h per host while lines keep coming. Pairs with HostRebooted
      # (Prometheus, service.yml).
      - alert: KernelSoftLockup
        expr: |
          sum by (host) (count_over_time({job="syslog", app="kernel"}
            |~ "soft lockup|rcu_(preempt|sched) (self-)?detected stall|hung_task|blocked for more than [0-9]+ seconds|Hard LOCKUP" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: hosts
        annotations:
          summary: "kernel soft lockup / stall on {{ $labels.host }}"
          description: "The kernel on {{ $labels.host }} logged a soft/hard lockup, an RCU stall or a hung task in the last 10m. A reboot often follows (HostRebooted). Read the stack with journalctl -k -b -1 on the host (-b 0 if it did not reboot); on kdk-dkr-01 on 2026-11-08 it was in the NFS read path."
          runbook: docs/runbooks/security-alerts.md#hosts
