# Daily Actual Budget bank-sync job (stacks/actual-bank-sync, actual-bank-sync
# procedure, 05:32 America/Chicago on kdk-dkr-01). The one-shot pushes ONE JSON
# line per run straight to Loki (job="actual-bank-sync"): counts only, never any
# financial data. Fields: status, accounts_total/ok/failed, new_transactions,
# matched_transactions, updated_accounts, rules_categorised, reauth_required,
# error_code, duration_ms.
#
# status values: ok | partial | simplefin_token_invalid | token_expired |
# decrypt_failure | network_failure | config_error | error.
#
# Alloy does not reliably scrape short-lived one-shot containers, so the job
# pushes to Loki itself (like advisory-watch). The 36 h "no success" rule is the
# safety net: it catches a disabled procedure, an expired session token, or a
# rotated E2E key the owner forgot to update -- the exact failure that let both
# accounts sit un-synced since 2026-09-20.
#
# Test the LogQL in Grafana Explore (see docs/runbooks/add-loki-alert-rule.md).
# Runbook: docs/runbooks/actual-bank-sync.md
groups:
  - name: actual-bank-sync
    interval: 1m
    rules:
      # SimpleFIN credential is dead/revoked -- nothing can sync until the owner
      # re-links SimpleFIN in Actual. Its own alert with the exact remedy.
      - alert: ActualBankSyncSimpleFINInvalid
        expr: |
          sum (count_over_time({job="actual-bank-sync"}
            | json | status="simplefin_token_invalid" [2h])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: actual-bank-sync
        annotations:
          summary: "Actual bank sync: SimpleFIN access token invalid -- re-link SimpleFIN in Actual (new setup token)"
          description: >-
            The SimpleFIN credential on the Actual server has expired or been
            revoked, so no account can sync. In Actual, open the account, press
            the bank icon, and re-link SimpleFIN with a fresh setup token.
          runbook: docs/runbooks/actual-bank-sync.md

      # Any other non-ok outcome: expired session token, wrong/rotated E2E key,
      # server unreachable, bad config, or one or more accounts failing.
      - alert: ActualBankSyncFailed
        expr: |
          sum by (status, error_code) (count_over_time({job="actual-bank-sync"}
            | json | status=~"token_expired|decrypt_failure|network_failure|config_error|partial|error" [2h])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: actual-bank-sync
        annotations:
          summary: "Actual bank sync failed: {{ $labels.status }} ({{ $labels.error_code }})"
          description: >-
            The daily Actual bank sync reported status={{ $labels.status }}.
            token_expired -> renew the dedicated browser session and update the
            session_token secret; decrypt_failure -> update e2e_password if the
            budget key was rotated; partial -> one or more accounts did not sync.
            See the runbook.
          runbook: docs/runbooks/actual-bank-sync.md

      # Safety net: no SUCCESSFUL run in 36 h (two missed daily windows). Catches
      # a disabled procedure or a job that never reaches "ok". Fires on first
      # deploy until the first successful run -- start it once by hand after merge
      # (Komodo -> Procedures -> actual-bank-sync -> Run).
      - alert: ActualBankSyncNoSuccess
        expr: |
          absent_over_time({job="actual-bank-sync"} | json | status="ok" [36h])
        for: 1h
        labels:
          severity: warning
          source: loki
          scope: actual-bank-sync
        annotations:
          summary: "Actual bank sync has not reported a successful run in 36 h"
          description: >-
            No status="ok" line from the actual-bank-sync job in 36 h. The
            procedure may be disabled, the session token expired, or the E2E key
            rotated without updating the secret. See the runbook.
          runbook: docs/runbooks/actual-bank-sync.md
