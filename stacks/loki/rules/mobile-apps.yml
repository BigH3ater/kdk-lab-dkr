# Mobile-app backends on kdk-dkr-dmz-01: Audiobookshelf, Immich, Tandoor.
# Source: vault 10.Homelab/Security/mobile-apps-posture-2026-10.md section 7.
# Immich is not on the tunnel (router is websecure-only), so its "FromInternet" rule is a
# tripwire for the day the router gains `tunnel`. The Tandoor and ABS routers carry
# `websecure,tunnel` since the 2026-11-08 publish prep; each is public only once the owner
# adds its tunnel public hostname (recipes.kmkdp.com, audiobookshelf.kmkdp.com; see
# docs/services/tandoor.md and docs/services/audiobookshelf.md#publishing).
# ABS admin-path edge canaries live in edge.yml (EdgeAbsAdminPath*).
# "From the internet" = entryPointName="tunnel" (fallback
# ClientAddr=~"10\\.211\\.2\\.2:.*"). RequestPath has no query string (Traefik drops it).
#
# Runbook: docs/runbooks/security-alerts.md#mobile-apps
groups:
  - name: mobile-apps
    interval: 1m
    rules:
      # ABS log text Confirmed 2026-11-08 on 2.37.2 (vault
      # audiobookshelf-public-readiness-2026-11-08 §2.6), e.g.
      #   ERROR: [LocalAuth] Failed login attempt for username "x" from ip 10.1.30.188 (User not found)
      # ABS has no lockout; its own limiter allows 40 POST /login per 10 min per IP.
      # The edge probe's ABS /login burst (scripts/edge-probe.sh without
      # --no-ratelimit) trips this on purpose: up to 36 failed logins for
      # "edge-probe-nonexistent" once the hostname is public.
      - alert: AbsLoginFailures
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="audiobookshelf"}
            |= "[LocalAuth] Failed login attempt" [10m])) > 5
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Audiobookshelf: more than 5 failed logins in 10m"
          description: "The audiobookshelf container on kdk-dkr-dmz-01 logged more than 5 [LocalAuth] Failed login attempt lines in 10m. ABS has no lockout; each line names the username and client IP: block a public IP at the WAF."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      # Confirmed: `INFO: [ApiKeyController] Created API key "kdk-cluster"`
      # (2026-11-02, the owner). `[User] openid: Auto-registering user` is the
      # 2.37.2 code's line for a first OIDC login (auto-register is on; read from
      # /app/server in the running container, not yet seen in the log). A user
      # created in Settings -> Users logs nothing at info level, so that path is
      # not covered by this rule.
      - alert: AbsNewUserOrApiKey
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="audiobookshelf"}
            |~ `\[ApiKeyController\] Created API key|\[User\] openid: Auto-registering user` [1h])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Audiobookshelf: an API key was created or a new OIDC user auto-registered"
          description: "The audiobookshelf container on kdk-dkr-dmz-01 logged Created API key or openid Auto-registering user. Check ABS Settings Users and API keys that it is expected; give a new API key an expiry."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      # Successful ABS login through the tunnel, by client (Cf-Connecting-Ip on the
      # tunnel). Local login = POST /login 200 (a failure is 401). OIDC = the
      # /auth/openid/callback answer: 302 for the web flow (seen on websecure),
      # 200 JSON for the app flow. A broken OIDC callback can also answer 302, so
      # this may over-fire on a failed SSO attempt; it is info. GET /login is the
      # client page (200/301), not a login. Same shape as JellyfinLoginFromInternet.
      - alert: AbsLoginFromInternet
        expr: |
          sum by (client) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "audiobookshelf.kmkdp.com" | json | entryPointName="tunnel" | RequestHost="audiobookshelf.kmkdp.com"
            | (RequestMethod="POST" and RequestPath=~"(/audiobookshelf)?/login(\\?.*)?" and DownstreamStatus="200")
              or (RequestPath=~"(/audiobookshelf)?/auth/openid/callback(\\?.*)?" and DownstreamStatus=~"200|302")
            | label_format client="{{ if .request_Cf_Connecting_Ip }}{{ .request_Cf_Connecting_Ip }}{{ else }}{{ .ClientHost }}{{ end }}" [5m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: mobile-apps
          # Security-adjacent: an internet login also pings the phone (quiet
          # Pushover) promptly, like JellyfinLoginFromInternet.
          notify: phone
        annotations:
          summary: "Audiobookshelf: login through the tunnel from {{ $labels.client }}"
          description: "The DMZ Traefik logged a successful Audiobookshelf login (POST /login 200 or the OIDC callback) for audiobookshelf.kmkdp.com through the tunnel from {{ $labels.client }}. Expected for remote family use; act only if the IP is unexpected (the audiobookshelf container log names the local-login user)."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      # Bulk download: per-item download, single-file download and the bulk
      # library download (2.36+). Streaming (/public/session/<id>/track/<n>) is
      # not counted. Any entrypoint: a stolen token is used from wherever it leaked.
      - alert: AbsMassDownload
        expr: |
          sum by (ClientHost) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "audiobookshelf.kmkdp.com" | json | RequestHost="audiobookshelf.kmkdp.com"
            | RequestPath=~"(/audiobookshelf)?/api/(items/[^/]+/(download|file/.*)|libraries/[^/]+/download).*" [15m])) > 10
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Audiobookshelf: {{ $labels.ClientHost }} made more than 10 download requests in 15m (bulk export or a stolen token)"
          description: "The DMZ Traefik logged more than 10 Audiobookshelf item, file or library download requests in 15m from {{ $labels.ClientHost }}. Check ABS Settings Sessions for the user and device; regenerate the token or API key if it is not a household device."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      - alert: ImmichLoginFailures
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "immich.kmkdp.com" | json | RequestHost="immich.kmkdp.com"
            | RequestPath=~"/api/auth/login(\\?.*)?" | DownstreamStatus="401" [10m])) > 5
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Immich: more than 5 failed logins in 10m"
          description: "The DMZ Traefik logged more than 5 401s on /api/auth/login for immich.kmkdp.com in 10m. Find the client in the traefik lines; block a public IP at the WAF."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      - alert: ImmichAdminApiFromInternet
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "immich.kmkdp.com" | json | entryPointName="tunnel" | RequestHost="immich.kmkdp.com"
            | RequestPath=~"/api/(admin|system-config|api-keys|libraries).*" [15m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Immich admin API reached through the tunnel"
          description: "The DMZ Traefik logged an Immich admin/system-config/api-keys/libraries API request on immich.kmkdp.com through the tunnel, which should never be routed. Remove the public hostname until the WAF path block is fixed."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      - alert: ImmichMassDownload
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "immich.kmkdp.com" | json | RequestHost="immich.kmkdp.com"
            | RequestPath=~"/api/(download|assets/.*/original).*" [15m])) > 500
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Immich: more than 500 original/download requests in 15m (bulk export or a stolen session)"
          description: "The DMZ Traefik logged more than 500 Immich download/original requests in 15m (bulk export or a stolen session). Check Immich Administration Users sessions and revoke unknown ones."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      - alert: TandoorLoginFailures
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "recipes.kmkdp.com" | json | RequestHost="recipes.kmkdp.com"
            | RequestPath=~"/_allauth/browser/v1/auth/login(\\?.*)?" | RequestMethod="POST"
            | DownstreamStatus=~"40[01]|429" [10m])) > 5
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Tandoor: more than 5 failed or rate-limited logins in 10m"
          description: "The DMZ Traefik logged more than 5 400/401/429s on the Tandoor allauth login POST for recipes.kmkdp.com in 10m (429 = allauth's per-IP limiter, 3 login POSTs/min). Tandoor has no lockout beyond that; find the client (ClientHost) and block it at the WAF."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      - alert: TandoorAdminFromInternet
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "recipes.kmkdp.com" | json | entryPointName="tunnel" | RequestHost="recipes.kmkdp.com"
            | RequestPath=~"/admin.*" [15m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Tandoor /admin reached through the tunnel"
          description: "The DMZ Traefik logged a request to /admin on recipes.kmkdp.com through the tunnel, which should never be routed. Remove the public hostname until the WAF path block is fixed."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      # Tandoor publish prep (vault tandoor-public-readiness-2026-11-08, section 6).
      # Spaces, invite links, space memberships and invite signups made through the
      # web. Expected ~0 a month; host-side ORM/shell writes never show here.
      - alert: TandoorSpaceOrUserCreated
        expr: |
          sum by (RequestPath, ClientHost) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "recipes.kmkdp.com" | json | RequestHost="recipes.kmkdp.com"
            | RequestMethod="POST" | DownstreamStatus=~"2.."
            | RequestPath=~"/api/(space|invite-link|user-space)/.*|/_allauth/browser/v1/auth/signup.*" [15m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: mobile-apps
          # Security-adjacent account/space change: also ping the phone (quiet
          # Pushover) promptly, not only the info e-mail digest.
          notify: phone
        annotations:
          summary: "Tandoor: a space, invite link, membership or signup was created"
          description: "The DMZ Traefik logged a successful POST to a Tandoor space/invite-link/user-space endpoint or the allauth signup for recipes.kmkdp.com. Expected only when the owner or a space admin invites someone; otherwise check Tandoor space settings, members and invite links (kdkadmin, LAN)."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      # Any successful password login through the tunnel (the Traefik log has no
      # username; OIDC logins go through Authelia, not this endpoint). Only kdkadmin,
      # dashboard (LAN-only) and invitee accounts have passwords.
      - alert: TandoorPasswordLoginFromInternet
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "recipes.kmkdp.com" | json | RequestHost="recipes.kmkdp.com" | entryPointName="tunnel"
            | RequestMethod="POST" | RequestPath=~"/_allauth/browser/v1/auth/login(\\?.*)?"
            | DownstreamStatus=~"2.." [15m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: mobile-apps
          notify: phone
        annotations:
          summary: "Tandoor: password login through the tunnel"
          description: "The DMZ Traefik logged a successful Tandoor password login (allauth) arriving on the tunnel entrypoint. Expected for an invitee household; if nobody expected it, check usersessions_usersession (user + real IP) and revoke the session."
          runbook: docs/runbooks/security-alerts.md#mobile-apps

      # Mediafiles abuse by a space member: Tandoor has no per-space storage cap
      # unless the space quota (max_file_storage_mb) is set.
      - alert: TandoorUploadBurst
        expr: |
          sum by (ClientHost) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "recipes.kmkdp.com" | json | RequestHost="recipes.kmkdp.com"
            | RequestMethod=~"POST|PUT" | RequestPath=~"/api/(user-file/|recipe/[0-9]+/image/).*" [10m])) > 50
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: mobile-apps
        annotations:
          summary: "Tandoor: more than 50 uploads from one client in 10m"
          description: "The DMZ Traefik logged more than 50 Tandoor file/image uploads from one ClientHost in 10m. Check which user/space (Tandoor space settings, file storage) and du -sh /opt/kdk-lab/tandoor/mediafiles; set the space's max_file_storage_mb."
          runbook: docs/runbooks/security-alerts.md#mobile-apps
