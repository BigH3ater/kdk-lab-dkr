# Komodo deploy provenance: a DeployStack/RestartStack that a HUMAN ran, rather
# than the gitops path (repo push -> gitops-sync procedure -> deploy-changed
# action). A manual deploy is how a host ends up running something the repo does
# not describe, so it is worth a quiet note after the fact (not an alarm).
#
# SIGNAL: Komodo Core (container komodo-core-1 on kdk-dkr-01) logs one line per
# /execute call:
#   `... EXECUTE REQUEST api="Execute" task_id="..." method="DeployStack" user_id="..." username="Action"`
# The deploy-changed action authenticates with its own API key and logs
# username="Action"; a person (kdkadmin via the Komodo UI/API) logs their own
# username. So "manual deploy" == a DeployStack/RestartStack line whose username
# is NOT "Action". Confirmed 2026-10-30: over 24 h, 256 DeployStack lines total,
# of which the only non-"Action" ones were kdkadmin's hand deploys.
#
# The log line carries ANSI colour codes between `method` and its value, so the
# filter matches the QUOTED VALUE (`"DeployStack"`), not `method="DeployStack"`,
# and likewise excludes the quoted `"Action"` username. The regexp stage pulls
# the method into a label for the summary (the quotes survive the ANSI codes).
#
# Scheduled procedures (nightly-backups) deploy the backup-* stacks via the
# procedure operator, which also logs as "Action" and so does not page here.
#
# Runbook: docs/runbooks/pushover-alerts.md#komodo-manual-deploy
groups:
  - name: komodo
    interval: 1m
    rules:
      - alert: KomodoManualDeploy
        expr: |
          sum by (method) (count_over_time({host="kdk-dkr-01", container="komodo-core-1"}
            |= "EXECUTE REQUEST" |~ `"(DeployStack|RestartStack)"` != `"Action"`
            | regexp `"(?P<method>DeployStack|RestartStack)"` [10m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: komodo
        annotations:
          summary: "Komodo {{ $labels.method }} run by hand on kdk-dkr-01 (outside the gitops path)"
          description: >-
            A person ran {{ $labels.method }} in the last 10m rather than letting
            a repo push reconcile the fleet. Expected while you deploy by hand;
            otherwise confirm the stack's files match the repo so the next
            gitops-sync does not revert it. See the operator in
            `docker logs komodo-core-1` (the username field).
          runbook: docs/runbooks/pushover-alerts.md#komodo-manual-deploy

      # deploy-changed could not read HEAD from api.github.com for an hour. Since
      # 2026-11-08 a failed lookup skips that tick's deploys (the old latest_hash
      # fallback re-pulled 32 stacks on all 7 hosts during a GitHub API incident),
      # so while this fires, merges are NOT reaching the fleet.
      #
      # SIGNAL: the action's console output goes to the Komodo Update log (DB),
      # not to the container log. Its only footprint there is Core's per-write
      # line, so on each failed tick the action writes the counter variable
      # DEPLOY_CHANGED_HEAD_FAILS (CreateVariable on the first failure,
      # UpdateVariableValue after) and Core logs
      #   `... WRITE REQUEST ... method="UpdateVariableValue" ... username="Action"`.
      # Recovery uses DeleteVariable, which is not counted. Nothing else writes
      # variables as "Action" (0 variable writes of any kind over 7 days,
      # 2026-11-08). gitops-sync ticks every 15 min, so >= 4 in 1h = the last
      # hour of ticks all failed. Same ANSI caveat as above: match quoted values.
      - alert: KomodoDeployChangedHeadLookupFailing
        expr: |
          sum(count_over_time({host="kdk-dkr-01", container="komodo-core-1"}
            |= "WRITE REQUEST" |~ `"(CreateVariable|UpdateVariableValue)"` |= `"Action"` [1h])) >= 4
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: komodo
        annotations:
          summary: "deploy-changed cannot reach the GitHub API: gitops deploys skipped for 1h"
          description: >-
            The deploy-changed action's HEAD lookup against api.github.com failed
            on {{ $value }} gitops-sync ticks in the last hour, so no stack has
            been redeployed from the repo in that time. Check githubstatus.com
            (API Requests) and egress/DNS from komodo-core-1 on kdk-dkr-01; the
            reason is in the action's Update log in the Komodo UI. The count of
            failed ticks in a row is the Komodo variable DEPLOY_CHANGED_HEAD_FAILS.
          runbook: docs/runbooks/pushover-alerts.md#deploy-changed-head-lookup-failing
