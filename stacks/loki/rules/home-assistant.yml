# Smart home on kdk-dkr-02 (HA, Node-RED, zigbee2mqtt, Mosquitto) and
# kdk-dkr-03 (Scrypted, Homebridge). Source: vault 10.Homelab/Security/
# home-assistant-posture-2026-10.md section 5 (finding M4).
#
# Some rules need a config change before they can ever fire (noted per rule):
# HA OIDC info logging, an HA "SECURITY" automation, Node-RED audit logging.
# Long-lived HA access tokens are NOT covered here: that is the Prometheus
# metric ha_llat_count (node_exporter textfile collector on kdk-dkr-02,
# `changes(ha_llat_count[1h]) > 0`), alerted on kdk-mon-01, not by Loki.
#
# Runbook: docs/runbooks/security-alerts.md#home-assistant
groups:
  - name: home-assistant
    interval: 1m
    rules:
      - alert: HaFailedLogins
        expr: |
          sum by (host) (count_over_time({host="kdk-dkr-02", container="homeassistant"}
            |= "Login attempt or request with invalid authentication" [10m])) > 3
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "Home Assistant: more than 3 invalid logins/tokens in 10m"
          description: "The homeassistant container on kdk-dkr-02 logged more than 3 invalid logins or tokens in 10m. The HA log line has the source IP; ip_bans.yaml in the HA config dir lists bans."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      # Needs http.login_attempts_threshold set in configuration.yaml.
      - alert: HaIpBanned
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="homeassistant"} |= "Banned IP" [5m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "Home Assistant banned an IP after failed logins"
          description: "The homeassistant container on kdk-dkr-02 logged Banned IP after failed logins. Check the IP in the line and ip_bans.yaml in the HA config dir."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      # Needs `logger: custom_components.auth_oidc: info`.
      - alert: HaOidcLoginUnexpectedUser
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="homeassistant"}
            |= "Logged in user through OIDC" !~ "jmack|rach" [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "Home Assistant: OIDC login by a user other than jmack/rach"
          description: "Home Assistant on kdk-dkr-02 logged an OIDC login for a user other than jmack/rach. Check Settings People, remove the user if unknown and check the Authelia group that grants HA."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      # Needs the package automation that writes user_added/user_updated/
      # user_removed events as `system_log.write` lines starting "SECURITY ".
      - alert: HaSecurityEvent
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="homeassistant"} |= "SECURITY " [5m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "Home Assistant user added/changed/removed (SECURITY log line)"
          description: "Home Assistant on kdk-dkr-02 logged a SECURITY line (user added, updated or removed). Check Settings People for the change."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      # Needs logging.console.audit: true in Node-RED settings.js.
      - alert: NodeRedFlowsDeployed
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="node-red"} |~ "flows.set|Starting flows" [5m])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: home-assistant
        annotations:
          summary: "Node-RED flows were deployed or restarted"
          description: "The node-red container on kdk-dkr-02 logged a flow deploy or restart. Expected when you deploy flows; otherwise check who reached the editor."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      # Meaningful once Node-RED has adminAuth.
      - alert: NodeRedAuthFailures
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="node-red"} |~ "auth.login.fail|permission denied" [10m])) > 3
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "Node-RED: more than 3 failed admin logins / permission denials in 10m"
          description: "The node-red container on kdk-dkr-02 logged more than 3 failed admin logins or permission denials in 10m: someone is at the editor. Check the source in docker logs node-red."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      - alert: ZigbeePermitJoinOrNewDevice
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="zigbee2mqtt"}
            |~ "(?i)permit.?join.*(true|enabled)|allowing new devices to join|Device '.*' joined" [5m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "zigbee2mqtt: permit-join opened or a new device joined"
          description: "zigbee2mqtt on kdk-dkr-02 logged permit-join enabled or a device joining. Expected while pairing; otherwise disable permit-join in z2m and check the device list."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      - alert: MosquittoAuthFailure
        expr: |
          sum(count_over_time({host="kdk-dkr-02", container="mosquitto"}
            |~ "(?i)not authori[sz]ed|bad user name or password" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
        annotations:
          summary: "Mosquitto rejected a client (not authorised / bad credentials)"
          description: "mosquitto on kdk-dkr-02 rejected a client as not authorised or with bad credentials. Usually a client with old credentials after a rotation; otherwise a LAN probe (docker logs mosquitto has the client id)."
          runbook: docs/runbooks/security-alerts.md#home-assistant

      # Scrypted/Homebridge own-account auth + admin actions. Strings are still
      # INFERRED: a 7d review (2026-10-30) found NO real Scrypted management-console
      # login/auth line — every match was the @scrypted/unifi-protect plugin failing
      # to log in to the cameras ("a Unifi Protect Plugin Login failed. Check
      # credentials.", "message: 'Login failed. Check credentials.'") and the per-camera
      # "[Room] Snapshot failed, falling back to prebuffer RPCResultError: login failed"
      # lines — camera credentials, not a Scrypted user login. Those are excluded here
      # (check-credentials / snapshot / prebuffer / unifi-protect / RPCResultError), so
      # the rule now matches only Scrypted's own login/credential failures and admin
      # actions (user created/added, plugin install / installNpm). Promote (confirm the
      # real login string) or delete by the inferred deadline ~2026-11-27.
      - alert: ScryptedHomebridgeAuthEvent
        expr: |
          sum by (container) (count_over_time({host="kdk-dkr-03", container=~"scrypted|homebridge"}
            |~ "(?i)login failed|invalid (password|credentials)|user (created|added)|installNpm|plugin install"
            != "Check credentials"
            !~ "(?i)snapshot|prebuffer|unifi.?protect|rpcresulterror" [10m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: home-assistant
          # Inferred log text since 2026-10-28: promote (drop this label) or
          # delete the rule by 2026-11-27 (alerting-standards §3).
          kdk_inferred: "true"
        annotations:
          summary: "{{ $labels.container }}: login failure, new user or plugin install"
          description: "{{ $labels.container }} on kdk-dkr-03 logged a login failure, a user creation or a plugin install (camera-plugin login failures excluded). Check users and plugins in the Scrypted UI."
          runbook: docs/runbooks/security-alerts.md#home-assistant
