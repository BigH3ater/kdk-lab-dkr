# Cloudflare edge + tunnel (source: vault 10.Homelab/Security/
# cloudflare-edge-posture-2026-10.md section 7). Every selector reads the DMZ
# Traefik's JSON access log ({host="kdk-dkr-dmz-01", container="traefik"} | json)
# or cloudflared's own log. `| json` sanitises header keys, so
# request_Cf-Connecting-Ip becomes request_Cf_Connecting_Ip.
#
# "From the internet" = `entryPointName="tunnel"`: since the two-entrypoint
# split (dmz-proxy, PR #68) cloudflared is the only client of the :8443 `tunnel`
# entrypoint. Equivalent fallback if that field is ever missing:
#   ClientAddr=~"10\\.211\\.2\\.2:.*"   (cloudflared's pinned proxy-dmz address)
# Never `request_Cf_Connecting_Ip!=""`: LAN lines carry "-" there.
#
# Runbook: docs/runbooks/security-alerts.md#edge
groups:
  - name: edge
    interval: 1m
    rules:
      - alert: EdgeNonUSTraffic
        expr: |
          sum by (request_Cf_Ipcountry) (count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "tunnel" | json | entryPointName="tunnel" | request_Cf_Ipcountry!~"US|-?" [15m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: edge
        annotations:
          summary: "Non-US request reached the origin through the tunnel ({{ $labels.request_Cf_Ipcountry }}): the Cloudflare geo rule or a skip rule has a gap"
          description: "A tunnel request from country {{ $labels.request_Cf_Ipcountry }} reached the DMZ Traefik on kdk-dkr-dmz-01. Find the host/path in the traefik line and check the Cloudflare WAF geo rule and any skip rule matching that path."
          runbook: docs/runbooks/security-alerts.md#edge

      # The lab's own synthetic probe (UA `kdk-edge-probe/1`, scripts/edge-probe.sh)
      # POSTs /api/firstfactor through the tunnel and takes a 401 every run; its
      # rate-limit burst was the only thing that tripped this in 7d. Excluding the
      # probe UA keeps real credential-stuffing/scanner 401/403 bursts (any other
      # UA) fully in scope.
      - alert: EdgeAuthFailureBurst
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "tunnel" | json | entryPointName="tunnel" | DownstreamStatus=~"40[13]"
            | RequestPath!~"/api/authz/forward-auth.*"
            | request_User_Agent!~"kdk-edge-probe.*" [5m])) > 60
        for: 5m
        labels:
          severity: warning
          source: loki
          scope: edge
        annotations:
          summary: "More than 60 401/403 per 5m from tunnel traffic for 5m (credential stuffing or a scanner)"
          description: "Tunnel traffic at the DMZ Traefik took more than 60 401/403 per 5m for 5m (edge probe excluded). Group the lines by ClientHost and RequestHost: one IP = WAF block, many IPs on one host = check that app's lockout."
          runbook: docs/runbooks/security-alerts.md#edge

      # Path set mirrors the Cloudflare "Block admin APIs" rule. /System/Endpoint,
      # /System/Info, /System/Info/Public and /System/Ping are client paths the WAF
      # lets through on purpose (jellyfin-web calls /System/Endpoint on every load),
      # so they are not admin paths here either (false positive 2026-10-29).
      # Status-agnostic by design: an admin path reaching the origin AT ALL means
      # the Cloudflare edge block rule was missing or wrong for that path, which is
      # exactly what this critical is for — Jellyfin answering 401/405 is not a
      # reason to stay quiet. The only exclusion is the lab's own edge probe
      # (kdk-edge-probe/1), which deliberately hits these paths to canary the WAF
      # and is surfaced separately by EdgeJellyfinAdminPathProbe (warning) below.
      - alert: EdgeJellyfinAdminPathHit
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "tunnel" | json | entryPointName="tunnel" | RequestHost="jellyfin.kmkdp.com"
            | RequestPath=~"(?i)^/(system/(configuration|logs|restart)|plugins|packages|repositories|scheduledtasks|devices|startup|environment|auth/keys|library/(virtualfolders|refresh)|users/[^/]+/(policy|password)).*"
            | request_User_Agent!~"kdk-edge-probe.*" [5m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          scope: edge
        annotations:
          summary: "A Jellyfin admin path reached the origin through the tunnel: the Cloudflare WAF block rule was bypassed or is missing"
          description: "A non-probe request to a Jellyfin admin path on jellyfin.kmkdp.com reached the DMZ Traefik through the tunnel (any status). Check the WAF block rule expression and Jellyfin Activity for what it did; pull jellyfin.kmkdp.com off the tunnel until fixed."
          runbook: docs/runbooks/security-alerts.md#edge

      # The lab's own edge-probe canary for the same WAF block rule: it hits these
      # admin paths on purpose, so when ITS request reaches the origin (any status)
      # the Cloudflare block rule is missing that path. Warning, not critical: it
      # must be visible even when nobody is reading the probe's PASS/FAIL table, but
      # it is the lab testing itself, so it does not need the pager tier.
      - alert: EdgeJellyfinAdminPathProbe
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "tunnel" | json | entryPointName="tunnel" | RequestHost="jellyfin.kmkdp.com"
            | RequestPath=~"(?i)^/(system/(configuration|logs|restart)|plugins|packages|repositories|scheduledtasks|devices|startup|environment|auth/keys|library/(virtualfolders|refresh)|users/[^/]+/(policy|password)).*"
            | request_User_Agent=~"kdk-edge-probe.*" [5m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: edge
        annotations:
          summary: "The lab's edge probe reached a Jellyfin admin path through the tunnel: the Cloudflare block rule is missing that path"
          description: "The lab's kdk-edge-probe request to a Jellyfin admin path reached the DMZ Traefik through the tunnel, so the Cloudflare block rule is missing that path. Fix the WAF rule expression."
          runbook: docs/runbooks/security-alerts.md#edge

      # Canary for the strip-cf middleware on the LAN entrypoint (PR #68). Traefik
      # logs the request header map AFTER the middleware chain ran, so while
      # strip-cf works a forged Cf-* header is removed before it is logged and
      # this stays silent. It fires when strip-cf is missing from `websecure`
      # (a label/flag regression) and a client sends Cf-* headers.
      - alert: EdgeSpoofedCfHeaders
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="traefik"}
            |= "Cf-Connecting-Ip" | json | entryPointName="websecure" | request_Cf_Connecting_Ip!~"-?" [5m])) > 0
        for: 0m
        labels:
          severity: warning
          source: loki
          scope: edge
        annotations:
          summary: "Cf-Connecting-Ip seen on the LAN entrypoint (websecure): the strip-cf middleware is not applied there"
          description: "A request on the websecure (LAN) entrypoint of the DMZ Traefik still carried Cf-Connecting-Ip after the middleware chain, so strip-cf is not applied there. Check the dmz-proxy websecure middlewares flag; ClientHost names the client."
          runbook: docs/runbooks/security-alerts.md#edge

      - alert: CloudflaredOutdated
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="cloudflared"} |= "is outdated" [1h])) > 0
        for: 0m
        labels:
          severity: info
          source: loki
          scope: edge
        annotations:
          summary: "cloudflared reports a newer release: bump the pinned tag in stacks/dmz-proxy (or merge the Renovate PR)"
          description: "cloudflared on kdk-dkr-dmz-01 logged that it is outdated. Merge the Renovate PR for cloudflare/cloudflared or bump the pinned tag in stacks/dmz-proxy."
          runbook: docs/runbooks/security-alerts.md#edge

      # Health/state rule: for: 5m debounce per alerting-standards §5.
      - alert: CloudflaredEdgeFlapping
        expr: |
          sum(count_over_time({host="kdk-dkr-dmz-01", container="cloudflared"} |= "Lost connection with the edge" [30m])) > 4
        for: 5m
        labels:
          severity: warning
          source: loki
          scope: edge
        annotations:
          summary: "cloudflared lost its edge connection more than 4 times in 30m (WAN/ISP or Cloudflare side)"
          description: "cloudflared on kdk-dkr-dmz-01 logged Lost connection with the edge more than 4 times in 30m. Check UniFi internet health, the Cloudflare status page and docker logs cloudflared."
          runbook: docs/runbooks/security-alerts.md#edge
