# Internal Calibre Content Server on kdk-dkr-01 (Tailscale-only; no public ingress,
# no Authelia). Serves an ebook library over OPDS so the reMarkable's KOReader pulls
# books when it comes online (pull model — replaces the push-only book-sync path,
# which needs the tablet awake+reachable).
#
# Two services from one locally-built image (calibre = calibre-server + calibredb):
#   server  -- runs `calibre-server` on :8081 (web reader + OPDS at /opds).
#   import  -- every INTERVAL, `calibredb add` any EPUB/ebook that Chaptarr has
#              downloaded into /mnt/media/books/ebook (mounted :ro) into the Calibre
#              library, de-duping by title/author. This is what turns Chaptarr's raw
#              output folder into a browsable Calibre library.
#
# IMPORT ROUTES THROUGH THE RUNNING SERVER, NOT the library path directly.
# calibredb and calibre-server are two programs that must not open the same library
# at once: when `import` wrote metadata.db directly while `server` held the library,
# calibre's own guard fired ("Another calibre program is running ... calibredb can
# connect directly to a running calibre Content server") and, worse, books added on
# disk never appeared in OPDS because the long-running server kept serving its cached
# view until a restart (Make It Stick sat on disk, invisible to KOReader, 2026-10-30).
# Adding through the server updates its live copy, so OPDS reflects new books
# immediately and only one process writes the DB.
#
# Calibre only accepts UNAUTHENTICATED writes from localhost: a cross-container
# `calibredb add --with-library http://calibre-server:8081/` returns `Forbidden`
# even with `--enable-local-write`. So `import` SHARES the server's network namespace
# (`network_mode: service:server`) and adds via `http://localhost:8081/`, and the
# server runs with `--enable-local-write`. Only processes in that netns (this
# container + the importer) are "localhost"; the Traefik/LAN path is not.
#
# Reach it at https://calibre.kmkdp.com (Traefik router, NO Authelia — KOReader's
# OPDS client can't do SSO and the LAN is the gate, same exposure as the old raw
# port) or the legacy tailnet path http://10.1.20.20:8081/opds. OPDS catalog URL
# for KOReader: https://calibre.kmkdp.com/opds. Library at /opt/kdk-lab/calibre/library.
name: calibre

# Compose hardening baseline (docs/reference/compose-baseline.md). Services merge
# it with `<<: *hardened` and override only what they need.
x-hardened: &hardened
  image: kdk/calibre:latest
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]            # calibre-server + calibredb need no kernel capabilities
  read_only: true            # rootfs locked; the library volume and tmpfs stay writable
  tmpfs: [/tmp]              # HOME=/tmp — calibre's config/cache + conversion scratch
  restart: unless-stopped
  pids_limit: 256
  mem_limit: 1g               # 512m OOM-killed calibre-server 2026-10-30 19:00 during an import scan
  environment: &env
    TZ: America/Chicago
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  server:
    <<: *hardened
    # Only this service builds the image; `import` reuses the tag. Compose stamps
    # each build with com.docker.compose.service, so two services building the
    # same tag produce two image IDs and whichever finishes last recreates the
    # other on every gitops-sync deploy (paged "calibre-import exited 137" on
    # every merge, 2026-10-25).
    # provenance off: with the containerd image store, BuildKit's provenance
    # attestation gives every (even fully cached) build a new image ID, so each
    # deploy recreated these containers. Off = stable ID, no restart.
    build:
      context: .
      provenance: false
    container_name: calibre-server
    volumes:
      - /opt/kdk-lab/calibre/library:/library
    ports:
      # VLAN 20 address only: keeps the legacy http://10.1.20.20:8081/opds path
      # for KOReader (and tailnet clients routed to 10.1.20.20); calibre.kmkdp.com
      # goes through Traefik on the proxy network.
      - "10.1.20.20:8081:8081"
    networks: [default, proxy]
    healthcheck:
      # OPDS answers 200 (no curl/wget in the image; calibre ships python3).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/opds', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      # deliberately NO forwardauth middleware: OPDS clients (KOReader) can't SSO;
      # LAN/Tailscale is the gate, matching the raw :8081 exposure that predates this.
      traefik.http.routers.calibre.rule: "Host(`calibre.kmkdp.com`)"
      traefik.http.routers.calibre.entrypoints: "websecure"
      traefik.http.routers.calibre.tls.certresolver: "cf"
      traefik.http.services.calibre.loadbalancer.server.port: "8081"
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Create an empty library on first run so the server starts cleanly even
        # before any book has been imported.
        [ -f /library/metadata.db ] || calibredb --with-library /library list >/dev/null 2>&1 || true
        # --enable-local-write: let calibredb modify the library through this server,
        # but ONLY from localhost — i.e. this container and the importer, which shares
        # this network namespace. The Traefik/LAN path is not localhost, so it stays
        # read-only to the world.
        exec calibre-server --port 8081 --listen-on 0.0.0.0 --enable-local-write /library

  import:
    <<: *hardened
    container_name: calibre-import
    # The loop's `sh` is PID 1 otherwise and ignores SIGTERM, so every stop ran
    # out the 10 s grace and was SIGKILLed (137 = paged as a crash). tini
    # forwards TERM, the shell exits 143, and the event watcher ignores that.
    init: true
    mem_limit: 1g             # calibredb add extracts metadata/covers; headroom over the 512m default
    # Share the server's network namespace so calibredb adds from "localhost", which
    # is the only source calibre accepts unauthenticated writes from (a cross-container
    # add returns Forbidden). No own `networks:`/`ports:` — not allowed with network_mode.
    network_mode: "service:server"
    environment:
      <<: *env
      # Add through the running server on localhost (shared netns), never the library path.
      SERVER: http://localhost:8081/
      INCOMING: /incoming
      INTERVAL: "900"
    volumes:
      # Chaptarr's ebook root (host /mnt/media/books/ebook = Chaptarr /data/media/books/ebook).
      # No /library mount: import adds through the server and never touches the DB on disk.
      - /mnt/media/books/ebook:/incoming:ro
    depends_on:
      # The server must be serving before calibredb can add through it (and before
      # this container can join its network namespace).
      server: { condition: service_healthy }
    healthcheck:
      # Liveness of the sidecar loop: each pass stamps /tmp/heartbeat; fail if it
      # is missing or older than two intervals (loop wedged / calibredb hung).
      test: ["CMD", "python3", "-c", "import time,sys,os; p='/tmp/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-float(open(p).read().strip()) < 1900 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[calibre-import] $$(date '+%F %T') scanning $$INCOMING -> $$SERVER";
          date +%s > /tmp/heartbeat;
          out=$$(calibredb add --with-library "$$SERVER" --automerge ignore -r "$$INCOMING" 2>&1);
          # Surface real failures (Forbidden write, errors, tracebacks) in full so
          # Loki/Komodo see a broken import; keep the tail for the normal dup-skip noise.
          if printf '%s' "$$out" | grep -qE 'Forbidden|Error|Traceback'; then
            echo "[calibre-import] calibredb FAILED:";
            printf '%s\n' "$$out";
          else
            printf '%s\n' "$$out" | tail -n 5;
          fi;
          sleep "$$INTERVAL";
        done

# Pinned to this stack's slot in the kdk docker supernet (see docs/reference/docker-ipam.md).
# kdk-dkr-01 owns 10.208.0.0/16; calibre = 10.208.22.0/24. Pinned (not pool-auto) because
# the incident that motivated the whole IPAM plan started here: an auto-assigned
# 192.168.176.0/20 overlapped the DMZ (192.168.191.0/24) and black-holed dkr-01 -> DMZ
# routing (Authelia forward-auth), taking the media stack down (2026-09-19).
networks:
  default:
    ipam:
      config:
        - subnet: 10.208.22.0/24
  proxy:
    external: true
