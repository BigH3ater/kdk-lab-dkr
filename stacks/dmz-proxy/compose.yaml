# DMZ Traefik + cloudflared on kdk-dkr-dmz-01. The tunnel is dashboard-managed
# (operator) and simply forwards to this Traefik; Traefik host-routes.
name: dmz-proxy
services:
  traefik:
    image: traefik:v3.7.16
    container_name: traefik
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy-dmz"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Trusted sources of X-Forwarded-For: the internal Traefik (10.1.20.20),
      # the DMZ host network, and the proxy-dmz Docker network where cloudflared
      # lives (10.211.2.2). Without the last one Traefik discarded Cloudflare's
      # visitor address and rewrote XFF to the cloudflared container IP, so
      # Jellyfin (known proxies = 10.211.2.0/24) logged every tunnel visitor as
      # 10.211.2.2 and could not classify them as remote (2026-10-26).
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.1.20.20/32,192.168.191.0/24,10.211.2.0/24"
      - "--entrypoints.websecure.http.tls.certresolver=cf"
      - "--entrypoints.websecure.http.tls.domains[0].main=kmkdp.com"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.kmkdp.com"
      - "--certificatesresolvers.cf.acme.dnschallenge=true"
      - "--certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cf.acme.email=admin@kmkdp.com"
      - "--certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      # JSON access log to stdout -> Alloy -> Loki ({container="traefik"} | json),
      # read by the Grafana "Traffic Access Logs" dashboard. Headers are dropped
      # except the ones the dashboard uses.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      # Cloudflare's visitor headers (real client IP + geo) for the public routes.
      - "--accesslog.fields.headers.names.Cf-Connecting-Ip=keep"
      - "--accesslog.fields.headers.names.Cf-Ipcountry=keep"
      - "--accesslog.fields.headers.names.Cf-Ipcity=keep"
      - "--accesslog.fields.headers.names.Cf-Region=keep"
      - "--accesslog.fields.headers.names.Cf-Iplatitude=keep"
      - "--accesslog.fields.headers.names.Cf-Iplongitude=keep"
    environment:
      CF_DNS_API_TOKEN: "${CLOUDFLARE_DNS_API_TOKEN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/kdk-lab/dmz-proxy/letsencrypt:/letsencrypt
    networks: [proxy-dmz]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: cloudflared
    restart: unless-stopped
    user: "65532"
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    networks: [proxy-dmz]
networks:
  proxy-dmz:
    name: proxy-dmz
