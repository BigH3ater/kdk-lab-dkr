# Hourly Tdarr transcode-failure validator on kdk-dkr-01 (tdarr-verify
# procedure). Pages Pushover when the DEE wrapper is down, the Tdarr server is
# unreachable, or the transcode-error count rises. Logic in verify.sh + lib.sh
# (both mounted, so Compose interpolation never touches their shell $variables;
# verify.sh sources /lib.sh for DEE health classification and alert de-dup).
# Joins the media stack's host to reach the tdarr server (published :8266) and
# DEE (10.1.1.130 / 10.1.1.131).
name: tdarr-verify
services:
  verify:
    image: alpine:3.24.4@sha256:93b41ef40b1677fce8fcc64ff4af09daddfacf5040afde618bc46c1e2d1cc7d4
    restart: "no"
    network_mode: host
    entrypoint: ["/bin/sh", "/verify.sh"]
    volumes:
      - /etc/kdk:/kdk
      - /mnt/media:/media   # rw: auto re-interleave swaps fixed files in (step 6)
      - ./verify.sh:/verify.sh:ro
      - ./lib.sh:/lib.sh:ro   # DEE classification + alert de-dup; sourced by verify.sh
