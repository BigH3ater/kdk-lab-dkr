# Hourly Tdarr transcode-failure validator on kdk-dkr-01 (tdarr-verify
# procedure). Pages Pushover when the DEE wrapper is down, the Tdarr server is
# unreachable, or the transcode-error count rises. Logic in verify.sh (mounted,
# so Compose interpolation never touches its shell $variables). Joins the media
# stack's host to reach the tdarr server (published :8266) and DEE (10.1.1.130).
name: tdarr-verify
services:
  verify:
    image: alpine:3.20.10@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    network_mode: host
    entrypoint: ["/bin/sh", "/verify.sh"]
    volumes:
      - /etc/kdk:/kdk
      - /mnt/media:/media   # rw: auto re-interleave swaps fixed files in (step 6)
      - ./verify.sh:/verify.sh:ro
