#cloud-config
# kdk-log-01 -- lab log host on kdk-hyp-01 (VM 320): Loki + the Alloy syslog
# receiver (stacks/loki), plus the per-host agents. Template 9000 supplies the
# kdkadmin user, SSH key and DNS; this vendor-data hardens the box and installs
# the runtime. No storage-net NIC and no NFS: Loki data lives on the VM disk at
# /opt/kdk-lab/loki/data (covered by the PBS vzdump of VM 320).
#
# Files embedded below have a canonical copy in git -- keep them identical:
#   /etc/docker/daemon.json            <- hosts/kdk-log-01/daemon.json
#   /etc/nftables.conf                 <- hosts/kdk-log-01/nftables.conf
#   /etc/rsyslog.d/90-kdk-loki.conf    <- hosts/_common/rsyslog.d/90-kdk-loki.conf
hostname: kdk-log-01
fqdn: kdk-log-01.kmkdp.com
timezone: America/Chicago

package_update: true
packages:
  - qemu-guest-agent
  - curl
  - ca-certificates
  - gnupg
  - rsyslog
  - nftables

write_files:
  - path: /etc/ssh/sshd_config.d/98-kdk-admin.conf
    permissions: "0644"
    content: |
      # kdk-log-01 sshd baseline. sshd keeps the FIRST value it reads for a
      # keyword, and sshd_config includes sshd_config.d/*.conf in lexical order.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      # local, not no: VS Code Remote-SSH needs a local port forward; AllowUsers
      # limits logins to kdkadmin. (sshd has no inline comments.)
      AllowTcpForwarding local
      AllowAgentForwarding no
      AllowUsers kdkadmin
      MaxAuthTries 3
      LoginGraceTime 20

  - path: /etc/nftables.conf
    permissions: "0755"
    content: |
      #!/usr/sbin/nft -f
      # kdk-log-01 (10.1.20.21) inbound policy. Installed as /etc/nftables.conf by
      # cloud-init/kdk-log-01-vendor-data.yaml; nftables.service loads it at boot.
      #
      # WHY A SEPARATE TABLE, AND WHY TWO HOOKS
      # ---------------------------------------------------------------------------
      # * Docker owns its own tables (`ip filter`/`ip nat` via iptables-nft, or
      #   `ip docker-*` with the nftables backend) and rewrites them on every
      #   container start. Rules added to those tables are lost or reordered. This
      #   file therefore lives in its own `inet kdk-input` table and NEVER runs
      #   `flush ruleset` (the Debian default /etc/nftables.conf does, which would
      #   wipe Docker's NAT on any `systemctl restart nftables`). The
      #   `table ... {}` + `delete table` pair below makes a reload idempotent
      #   without touching anyone else's tables, and the cloud-init drop-in
      #   nftables.service.d/kdk.conf replaces the unit's ExecStop (`nft flush
      #   ruleset`) with deleting only this table.
      # * A Docker-published port (Loki 3100, syslog 514, cAdvisor 9280) is DNATed
      #   in prerouting (priority dstnat = -100) to a bridge address, so the packet
      #   then traverses FORWARD, never INPUT. An input-hook chain alone would let
      #   every published port through. The `guard` chain hooks prerouting at
      #   priority -150: after conntrack (-200), before Docker's DNAT, so it still
      #   sees the original destination port and applies the same allowlist to
      #   published ports and to host services alike.
      # * `input` (priority 0, policy drop) is the host-service backstop (sshd,
      #   periphery, node_exporter) for anything that is not arriving on $WAN.
      # Multiple base chains on one hook all have to accept a packet, so Docker's
      # own FORWARD/DOCKER-USER rules still apply after ours.
      #
      # Interface: the template 9000 VMs name the first virtio NIC eth0 (dkr-01 has
      # eth0 + eth1). If a rebuild ever renames it, WAN below must follow, or the
      # guard silently stops matching. Verify after build: `ip -br link`.

      define WAN = "eth0"

      table inet kdk-input {}
      delete table inet kdk-input

      table inet kdk-input {
      	# SSH: admin workstation, tailnet clients (routed, not masqueraded), mgmt LAN.
      	set admin_v4 {
      		type ipv4_addr
      		flags interval
      		elements = { 10.1.30.0/24, 100.64.0.0/10, 192.168.3.0/24 }
      	}

      	# Log senders (Loki push :3100, syslog :514): dkr-01, mon-01 (Grafana +
      	# its agent), the Pis, dmz-01, kdk-hyp-01, kdk-dns-01, kdk-nas-01.
      	set log_clients_v4 {
      		type ipv4_addr
      		elements = { 10.1.20.20, 10.1.20.30, 10.1.30.21, 10.1.30.22,
      			     192.168.191.20, 10.1.1.100, 10.1.1.120, 10.1.3.5 }
      	}

      	# Komodo Core (container on kdk-dkr-01, SNATed to the VM address).
      	set komodo_core_v4 {
      		type ipv4_addr
      		elements = { 10.1.20.20 }
      	}

      	# Prometheus on kdk-mon-01 (node_exporter :9100, cAdvisor :9280).
      	set scrapers_v4 {
      		type ipv4_addr
      		elements = { 10.1.20.30 }
      	}

      	# New connections allowed in on $WAN. Shared by both base chains.
      	chain allow_new {
      		tcp dport 22 ip saddr @admin_v4 accept
      		tcp dport 3100 ip saddr @log_clients_v4 accept
      		meta l4proto { tcp, udp } th dport 514 ip saddr @log_clients_v4 accept
      		tcp dport 8120 ip saddr @komodo_core_v4 accept
      		tcp dport { 9100, 9280 } ip saddr @scrapers_v4 accept
      	}

      	chain guard {
      		type filter hook prerouting priority -150; policy accept;
      		iifname != $WAN accept
      		ct state established,related accept
      		ct state invalid drop
      		meta l4proto icmp accept
      		meta l4proto ipv6-icmp accept
      		jump allow_new
      		counter drop
      	}

      	chain input {
      		type filter hook input priority 0; policy drop;
      		iif "lo" accept
      		ct state established,related accept
      		ct state invalid drop
      		iifname != $WAN accept
      		meta l4proto icmp accept
      		meta l4proto ipv6-icmp accept
      		jump allow_new
      		counter drop
      	}
      }

  # Debian's nftables.service stops with `nft flush ruleset`, which would also
  # wipe Docker's NAT/filter tables. Stop = drop only our own table.
  - path: /etc/systemd/system/nftables.service.d/kdk.conf
    permissions: "0644"
    content: |
      [Service]
      ExecStop=
      ExecStop=-/usr/sbin/nft delete table inet kdk-input

  # Written before Docker is installed, so dockerd starts with it.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "default-address-pools": [
          { "base": "10.213.0.0/16", "size": 24 }
        ],
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true,
        "no-new-privileges": true
      }

  - path: /etc/rsyslog.d/90-kdk-loki.conf
    permissions: "0644"
    content: |
      # Forward every local syslog message to the lab log host (kdk-log-01, Alloy
      # syslog receiver -> Loki). TCP with a disk-assisted queue: if kdk-log-01 is
      # down, messages spool under rsyslog's $WorkDirectory (/var/spool/rsyslog on
      # Debian) and are delivered when it returns; retries never give up.
      # Install: copy to /etc/rsyslog.d/90-kdk-loki.conf, `rsyslogd -N1`, then
      # `systemctl restart rsyslog`. Seeded by cloud-init/kdk-log-01-vendor-data.yaml;
      # copied by hand on kdk-dkr-01 and kdk-dkr-dmz-01.
      *.* action(type="omfwd" target="10.1.20.21" port="514" protocol="tcp"
                 action.resumeRetryCount="-1"
                 queue.type="LinkedList" queue.filename="kdkloki"
                 queue.maxDiskSpace="256m" queue.saveOnShutdown="on")

  # Komodo periphery (inbound mode: Core on kdk-dkr-01 connects here).
  # setup-periphery.py keeps an existing config, so this file wins. The auth
  # line (passkeys / core_public_keys) is NOT in git: the owner copies it from
  # kdk-dkr-01's /etc/komodo/periphery.config.toml and then enables the unit.
  - path: /etc/komodo/periphery.config.toml
    permissions: "0640"
    content: |
      root_directory = "/etc/komodo"
      # Same clone location as kdk-dkr-01 (/opt/kdk-lab/stacks/<stack>).
      stack_dir = "/opt/kdk-lab/stacks"
      port = 8120
      bind_ip = "10.1.20.21"
      # Defence in depth behind the nft rule: only Komodo Core's host.
      allowed_ips = ["10.1.20.20"]
      ssl_enabled = true
      # OWNER: append the auth line copied from kdk-dkr-01 here.

runcmd:
  - systemctl enable --now qemu-guest-agent
  - mkdir -p /opt/kdk-lab/stacks /etc/komodo /etc/kdk
  # Loki runs as 10001:10001 and writes only under /loki (= this dir).
  - install -d -o 10001 -g 10001 -m 0750 /opt/kdk-lab/loki /opt/kdk-lab/loki/data /opt/kdk-lab/loki/data/rules
  # sshd: validate before reload so a bad drop-in cannot lock us out.
  - sshd -t && systemctl reload ssh
  # Firewall before Docker: dockerd adds its own tables on start, ours is separate.
  - systemctl daemon-reload
  - nft -c -f /etc/nftables.conf && systemctl enable --now nftables
  - rsyslogd -N1 && systemctl restart rsyslog
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker kdkadmin
  - systemctl restart docker
  # Periphery pinned to Core's release line (docs/services/komodo.md: 2.3.3).
  # Installed but left STOPPED and DISABLED until the auth line is in place:
  # with neither passkeys nor core_public_keys, periphery accepts any caller.
  # HOME must be set: cloud-init runcmd has no HOME and the installer reads
  # os.environ["HOME"] (KeyError on the first build, 2026-10-28).
  - curl -fsSL https://raw.githubusercontent.com/moghtech/komodo/v2.3.3/scripts/setup-periphery.py | HOME=/root python3 - --version v2.3.3
  - systemctl disable --now periphery
  - touch /var/lib/cloud/kdk-log-01-ready
