#cloud-config
hostname: kdk-dkr-dmz-01
fqdn: kdk-dkr-dmz-01.kmkdp.com
timezone: America/Chicago
users:
  - name: kdkadmin
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIISxVOFP6r1EKbRDgtXctnqNII6EEypDpBax3LyOBxDb kdkadmin-ssh-key
package_update: true
packages: [qemu-guest-agent, nfs-common, curl, ca-certificates, gnupg, rsync]
write_files:
  - path: /etc/apt/sources.list.d/nonfree.sources
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: trixie trixie-updates
      Components: main contrib non-free non-free-firmware
  - path: /etc/systemd/system/mnt-media.mount
    content: |
      [Unit]
      Description=tankz3/media (read-only) over storage net
      After=network-online.target
      [Mount]
      What=100.100.100.2:/mnt/tankz3/media
      Where=/mnt/media
      Type=nfs
      Options=nfsvers=4.1,ro,noatime,_netdev
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/mnt-appdata.mount
    content: |
      [Unit]
      Description=tankz3/appdata over storage net
      After=network-online.target
      [Mount]
      What=100.100.100.2:/mnt/tankz3/appdata
      Where=/mnt/appdata
      Type=nfs
      Options=nfsvers=4.1,noatime,_netdev
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/mnt-backup.mount
    content: |
      [Unit]
      Description=tankz3/backup over storage net
      After=network-online.target
      [Mount]
      What=100.100.100.2:/mnt/tankz3/backup
      Where=/mnt/backup
      Type=nfs
      Options=nfsvers=4.1,noatime,_netdev
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl enable --now qemu-guest-agent || true
  - mkdir -p /opt/kdk-lab /etc/komodo /mnt/media /mnt/appdata /mnt/backup
  - curl -sS https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" > /etc/apt/sources.list.d/1password.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y 1password-cli firmware-misc-nonfree intel-microcode
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker kdkadmin
  - systemctl daemon-reload
  - systemctl enable --now mnt-media.mount mnt-appdata.mount mnt-backup.mount
  - touch /var/lib/cloud/kdk-dkr-dmz-01-ready
