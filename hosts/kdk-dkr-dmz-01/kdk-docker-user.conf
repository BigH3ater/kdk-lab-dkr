# kdk-dkr-dmz-01 DOCKER-USER policy (security plan A1.6; reports: hosts C-01/H-09,
# request-apps H-S1, wizarr F4, mobile-apps X-3). Installed as
# /etc/default/kdk-docker-user (root:root 0644) and read by
# /usr/local/sbin/kdk-docker-user.sh. Shell syntax, sourced as root: keep it to
# variable assignments and the three policy verbs below.
#
# Default for every DMZ container: internet yes, anything RFC1918 off its own
# bridges no (VLANs 10.1.0.0/16, the storage net, other DMZ hosts, dkr-01's
# internal Traefik). immich-ml, wizarr and every other app fall under that
# default -- they need no private destination. Traffic between containers on
# the same or another DMZ bridge (seerr -> jellyfin/authelia on proxy-dmz,
# wizarr -> lldap on identity_ldap, anything -> 192.168.191.20:443/6360 which
# Docker DNATs to a container) is bridge-to-bridge and unaffected.
# Host SSH/Periphery/rpcbind/node_exporter from containers are INPUT, not
# FORWARD: they are fenced in /etc/nftables.d/kdk-storage.nft (host_guard).

MODE=enforce

# cAdvisor is published on 192.168.191.20:9280 for mon-01's scrape; containers
# have no business reading it (container names, labels, cgroup paths).
guard_host_port tcp 9280 192.168.191.20

# Seerr and Libreseerr reach Radarr/Sonarr/Chaptarr through the internal Traefik
# on kdk-dkr-01 (extra_hosts *.kmkdp.com -> 10.1.20.20, stacks/dmz-apps). Only
# these two containers, only :443 (plan K12/K13; request-apps H-S1).
allow_ctr seerr      10.1.20.20 tcp 443
allow_ctr libreseerr 10.1.20.20 tcp 443

# Alloy pushes container logs to Loki on kdk-log-01 (security batch 2; UniFi
# rule 192.168.191.20 -> 10.1.20.21:3100). Only the alloy container.
allow_ctr alloy 10.1.20.21 tcp 3100

# Authelia's notifier relays through the Proton Mail Bridge on kdk-dkr-01
# (stacks/apps; UniFi rule 192.168.191.20 -> 10.1.20.20:25). Only authelia.
allow_ctr authelia 10.1.20.20 tcp 25
