#!/usr/sbin/nft -f
# kdk-log-01 (10.1.20.21) inbound policy. Installed as /etc/nftables.conf by
# cloud-init/kdk-log-01-vendor-data.yaml; nftables.service loads it at boot.
#
# WHY A SEPARATE TABLE, AND WHY TWO HOOKS
# ---------------------------------------------------------------------------
# * Docker owns its own tables (`ip filter`/`ip nat` via iptables-nft, or
#   `ip docker-*` with the nftables backend) and rewrites them on every
#   container start. Rules added to those tables are lost or reordered. This
#   file therefore lives in its own `inet kdk-input` table and NEVER runs
#   `flush ruleset` (the Debian default /etc/nftables.conf does, which would
#   wipe Docker's NAT on any `systemctl restart nftables`). The
#   `table ... {}` + `delete table` pair below makes a reload idempotent
#   without touching anyone else's tables, and the cloud-init drop-in
#   nftables.service.d/kdk.conf replaces the unit's ExecStop (`nft flush
#   ruleset`) with deleting only this table.
# * A Docker-published port (Loki 3100, syslog 514, cAdvisor 9280) is DNATed
#   in prerouting (priority dstnat = -100) to a bridge address, so the packet
#   then traverses FORWARD, never INPUT. An input-hook chain alone would let
#   every published port through. The `guard` chain hooks prerouting at
#   priority -150: after conntrack (-200), before Docker's DNAT, so it still
#   sees the original destination port and applies the same allowlist to
#   published ports and to host services alike.
# * `input` (priority 0, policy drop) is the host-service backstop (sshd,
#   periphery, node_exporter) for anything that is not arriving on $WAN.
# Multiple base chains on one hook all have to accept a packet, so Docker's
# own FORWARD/DOCKER-USER rules still apply after ours.
#
# Interface: the template 9000 VMs name the first virtio NIC eth0 (dkr-01 has
# eth0 + eth1). If a rebuild ever renames it, WAN below must follow, or the
# guard silently stops matching. Verify after build: `ip -br link`.

define WAN = "eth0"

table inet kdk-input {}
delete table inet kdk-input

table inet kdk-input {
	# SSH: admin workstation, tailnet clients (routed, not masqueraded), mgmt LAN.
	set admin_v4 {
		type ipv4_addr
		flags interval
		elements = { 10.1.30.0/24, 100.64.0.0/10, 192.168.3.0/24 }
	}

	# Log senders (Loki push :3100, syslog :514): dkr-01, mon-01 (Grafana +
	# its agent), the Pis, dmz-01, kdk-hyp-01, kdk-dns-01, kdk-nas-01.
	set log_clients_v4 {
		type ipv4_addr
		elements = { 10.1.20.20, 10.1.20.30, 10.1.30.21, 10.1.30.22,
			     192.168.191.20, 10.1.1.100, 10.1.1.120, 10.1.3.5 }
	}

	# Komodo Core (container on kdk-dkr-01, SNATed to the VM address).
	set komodo_core_v4 {
		type ipv4_addr
		elements = { 10.1.20.20 }
	}

	# Prometheus on kdk-mon-01 (node_exporter :9100, cAdvisor :9280).
	set scrapers_v4 {
		type ipv4_addr
		elements = { 10.1.20.30 }
	}

	# New connections allowed in on $WAN. Shared by both base chains.
	chain allow_new {
		tcp dport 22 ip saddr @admin_v4 accept
		tcp dport 3100 ip saddr @log_clients_v4 accept
		meta l4proto { tcp, udp } th dport 514 ip saddr @log_clients_v4 accept
		tcp dport 8120 ip saddr @komodo_core_v4 accept
		tcp dport { 9100, 9280 } ip saddr @scrapers_v4 accept
	}

	chain guard {
		type filter hook prerouting priority -150; policy accept;
		iifname != $WAN accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		jump allow_new
		counter drop
	}

	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		iifname != $WAN accept
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		jump allow_new
		counter drop
	}
}
