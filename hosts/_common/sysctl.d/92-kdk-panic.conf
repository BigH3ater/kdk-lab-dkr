# Reboot fast on a kernel oops instead of wedging. VMs only (kdk-dkr-01,
# kdk-dkr-dmz-01, kdk-dkr-04, kdk-log-01). Install: /etc/sysctl.d/92-kdk-panic.conf
# (root:root 0644), then `sysctl --system`. Source of truth: hosts/_common/sysctl.d/
# in BigH3ater/kdk-lab-dkr. Why: docs/runbooks/host-kernel-crash.md.
#
# kdk-dkr-01 on 2026-10-31 and 2026-11-08: kswapd0 oopsed while holding a
# spinlock, every other CPU then spun on that lock (soft lockups, RCU stall), and
# only the QEMU ICH9 TCO watchdog reset the VM, ~55 s later. With these two
# lines the oops becomes a panic and the kernel reboots itself 10 s later; the
# TCO watchdog stays as the backstop for a wedge that never oopses.

# An oops (NULL dereference, kernel BUG, GPF) panics instead of killing only the
# task that hit it and leaving the kernel half-broken.
kernel.panic_on_oops = 1
# After a panic, reboot after 10 s (time for the panic text to reach the serial
# console and, while the network still works, rsyslog -> kdk-log-01).
kernel.panic = 10

# Deliberately NOT set (stay 0):
#   kernel.softlockup_panic   a VM vCPU that the hypervisor deschedules (hyp-01
#                             busy, a vzdump snapshot) can trip a soft lockup on
#                             a healthy guest; the real wedge is already covered
#                             by panic_on_oops + the TCO watchdog, and Loki
#                             KernelOopsOrLockup pages on the lockup lines.
#   kernel.hung_task_panic    hard NFS mounts hang tasks for as long as kdk-nas-01
#                             is down; a NAS reboot would reboot every VM.
#   kernel.panic_on_rcu_stall same false-positive risk as softlockup_panic.
#   kernel.panic_on_warn      a WARN is not fatal (the NVIDIA module warns).
