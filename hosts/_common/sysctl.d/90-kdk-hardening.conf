# kdk-lab kernel hardening, every host. Install: /etc/sysctl.d/90-kdk-hardening.conf
# (root:root 0644), then `sysctl --system`. Source of truth:
# hosts/_common/sysctl.d/ in BigH3ater/kdk-lab-dkr (hosts report L-02).
#
# Deliberately NOT here: net.ipv4.ip_forward (Docker needs it everywhere and
# kdk-dkr-01 routes for the Tailscale subnet router) and rp_filter (Docker and
# the no-SNAT tailnet path rely on the current value).

# Only a parent process may ptrace its children (gdb/strace on your own child
# still works; attaching to an unrelated process needs CAP_SYS_PTRACE).
kernel.yama.ptrace_scope = 1
# Hide kernel pointers from everyone, and the kernel log from non-root.
# cAdvisor reads /dev/kmsg for OOM events: with dmesg_restrict=1 it needs
# CAP_SYSLOG (stacks/observability-agent adds it).
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# No magic SysRq from the keyboard/console (/proc/sysrq-trigger still works for root).
kernel.sysrq = 0
# A host is not a router for redirects (dkr-01 forwards, but never needs to
# tell a peer about a better first hop).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Log packets with impossible source addresses (lands in the kernel log ->
# journald -> rsyslog -> kdk-log-01).
net.ipv4.conf.all.log_martians = 1
