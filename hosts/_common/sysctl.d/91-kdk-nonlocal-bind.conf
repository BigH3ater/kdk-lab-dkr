# Lets Docker publish a port on the host's VLAN address (`10.1.20.20:443:443`)
# even when that address is not up yet at boot. Docker 28+ holds a socket on
# every published host port; on a host whose address comes from DHCP (the Pis)
# a container that starts before the address is configured would otherwise fail
# with "cannot assign requested address" and stay down until someone restarts
# it. Harmless on the VMs (static addresses). Install with 90-kdk-hardening.conf.
net.ipv4.ip_nonlocal_bind = 1
