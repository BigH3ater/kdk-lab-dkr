# Forward every local syslog message to the lab log host (kdk-log-01, Alloy
# syslog receiver -> Loki). TCP with a disk-assisted queue: if kdk-log-01 is
# down, messages spool under rsyslog's $WorkDirectory (/var/spool/rsyslog on
# Debian) and are delivered when it returns; retries never give up.
# Install: copy to /etc/rsyslog.d/90-kdk-loki.conf, `rsyslogd -N1`, then
# `systemctl restart rsyslog`. Seeded by cloud-init/kdk-log-01-vendor-data.yaml;
# copied by hand on kdk-dkr-01 and kdk-dkr-dmz-01.
*.* action(type="omfwd" target="10.1.20.21" port="514" protocol="tcp"
           action.resumeRetryCount="-1"
           queue.type="LinkedList" queue.filename="kdkloki"
           queue.maxDiskSpace="256m" queue.saveOnShutdown="on")
