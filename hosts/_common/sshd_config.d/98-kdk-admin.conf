# kdk-lab SSH baseline, every host. Install: /etc/ssh/sshd_config.d/98-kdk-admin.conf
# (root:root 0644), then `sshd -t && systemctl reload ssh`. Same file on all five
# hosts (the Pis already ran an earlier copy; this one adds LoginGraceTime 20).
# Debian's sshd_config Includes sshd_config.d/*.conf at the TOP, and for sshd the
# first value read wins, so these lines override the defaults further down
# (X11Forwarding yes etc.). Keys set here are not set by cloud-init's
# 50-cloud-init.conf (that one only sets PasswordAuthentication).
# Source of truth: hosts/_common/sshd_config.d/ in BigH3ater/kdk-lab-dkr.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowUsers kdkadmin
MaxAuthTries 3
LoginGraceTime 20

# VS Code Remote-SSH tunnels its server over a local port forward, and the
# fleet default above is "no" (no SOCKS/pivot through a lab host). Allow
# *local* forwards for the admin account only: the forward still terminates
# on this host, -R (remote) and gateway forwards stay off. Unix-socket
# forwarding was tried instead (remoteServerListenOnSocket) and the Pi sshd
# refused it too (2026-10-28), so this is the supported path.
# Match blocks must be the last thing in the file.
Match User kdkadmin
    AllowTcpForwarding local
