# kdk-dkr-04 DOCKER-USER policy (security plan A1.6; same shape as
# hosts/kdk-dkr-dmz-01/kdk-docker-user.conf and hosts/kdk-dkr-01). Installed as
# /etc/default/kdk-docker-user (root:root 0644) and read by
# /usr/local/sbin/kdk-docker-user.sh. Shell syntax, sourced as root: keep it to
# variable assignments and the policy verbs below.
#
# Default for every container on this host: internet yes, anything RFC1918 off
# its own bridges no (the lab VLANs, the storage net, other hosts). The only
# container egress this host needs in Phase A is the observability agent's Alloy
# pushing logs to Loki; everything else (node-exporter, cAdvisor) is a host
# listener fenced in /etc/nftables.d/kdk-storage.nft (host_guard), not FORWARD.
# Phase B workloads add their own allow_ctr lines in the same PR that moves them.

MODE=enforce

# cAdvisor is published on 10.1.20.22:9280 for mon-01's scrape; containers have
# no business reading it (container names, labels, cgroup paths).
guard_host_port tcp 9280 10.1.20.22

# Alloy (observability-agent) pushes container logs to Loki on kdk-log-01. Only
# the alloy container, only :3100. VLAN 20 is same-subnet, so no UniFi rule is
# needed (unlike dmz-01, which crosses from 192.168.191.0/24).
allow_ctr alloy 10.1.20.21 tcp 3100
