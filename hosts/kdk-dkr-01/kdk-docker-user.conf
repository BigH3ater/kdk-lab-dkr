# kdk-dkr-01 DOCKER-USER policy (security plan A1.4/A1.6; hosts report M-04).
# Installed as /etc/default/kdk-docker-user (root:root 0644) and read by
# /usr/local/sbin/kdk-docker-user.sh. Shell syntax, sourced as root: keep it to
# variable assignments and the three policy verbs below.
#
# MODE=log first. dkr-01 runs ~40 stacks and many of them talk to other lab
# hosts; the list below is everything the repo shows, but repo grep is not
# proof. In log mode nothing is dropped: every connection that WOULD be dropped
# is logged to the kernel log with prefix "kdk-du-would-drop: " (journalctl -k).
# Run it for 7 days, add an allow line for anything legitimate that shows up,
# then set MODE=enforce and re-run kdk-docker-user.service.
# Runbook: docs/runbooks/host-firewall.md.
MODE=enforce

# Subnet router: forward everything in/out of tailscale0 (Docker's FORWARD
# policy is DROP and tailscaled writes its own ACCEPTs into iptables-legacy,
# which Docker's nft chain never consults). Replaces the docker-forward sidecar
# in stacks/tailscale-subnet-router.
TAILSCALE=1

# cAdvisor is published on 10.1.20.20:9280 for mon-01's scrape only.
guard_host_port tcp 9280 10.1.20.20

# ---- documented exceptions: bridge containers -> other lab hosts ------------
# DNS to the host's resolvers (10.1.1.53/.54) is added automatically.

# DMZ Traefik (public anyway): jellystat -> jellyfin, internal Traefik
# forward-auth -> sso.kmkdp.com, OIDC discovery for actual/vikunja/komodo,
# homepage widgets, arr -> jellyfin notifications.
allow_dst 192.168.191.20 tcp 443

# Komodo Core (stacks/komodo) -> Periphery on every other host.
allow_dst 192.168.191.20 tcp 8120
allow_dst 10.1.20.30     tcp 8120
allow_dst 10.1.20.21     tcp 8120
allow_dst 10.1.30.21     tcp 8120
allow_dst 10.1.30.22     tcp 8120

# backup-collect -> rsync over SSH from mon-01, dkr-02, dkr-03.
allow_dst 10.1.20.30 tcp 22
allow_dst 10.1.30.21 tcp 22
allow_dst 10.1.30.22 tcp 22

# Internal Traefik file route grafana.kmkdp.com -> Grafana on mon-01.
allow_dst 10.1.20.30 tcp 3000

# Alloy -> Loki on kdk-log-01 (security batch 2).
allow_dst 10.1.20.21 tcp 3100

# AdGuard Home API: adguardhome-sync (apps), adguard-exporter (net-exporters),
# dns-reconcile.
allow_dst 10.1.1.120 tcp 80
allow_dst 10.1.1.121 tcp 80
allow_dst 10.1.1.122 tcp 80

# UniFi gateway kdk-gw-01: unpoller (API 443) and snmp-exporter (SNMPv3 161).
allow_dst 10.1.3.1 tcp 443
allow_dst 10.1.3.1 udp 161

# Tdarr flow -> DEE wrapper on kdk-dee-01.
allow_dst 10.1.1.130 tcp 8484

# remarkable-ocr -> Ollama on the GPU workstation (ollama.kmkdp.com).
allow_dst 10.1.30.218 tcp 11434

# reMarkable tablet over SSH: koreader-highlights, obsidian-to-koreader,
# readwise-koreader, remarkable-ocr.
allow_dst 10.1.30.245 tcp 22
