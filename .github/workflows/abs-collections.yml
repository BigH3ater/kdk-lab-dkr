# Audiobookshelf reading-order collections (docs/services/audiobookshelf.md,
# "Reading-order collections"): unit tests for stacks/audiobookshelf/tools/abs_collections.py
# against a fake ABS API. No network, no token.
name: abs-collections

on:
  pull_request:
    paths:
      - "stacks/audiobookshelf/tools/**"
      - ".github/workflows/abs-collections.yml"
  push:
    branches: [main]
    paths:
      - "stacks/audiobookshelf/tools/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Tests
        run: python -m pytest -q stacks/audiobookshelf/tools/tests
