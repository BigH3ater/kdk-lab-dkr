# scale-bridge (docs/services/scale-bridge.md): pytest for the Body Pod 2 frame
# decoder, the session state machine (synthetic capture replay with a fake GATT
# client), weight-band attribution and the wger client (in-memory API: category
# creation, external_id idempotence, dry-run posts nothing) in stacks/scale-bridge.
name: scale-bridge

on:
  pull_request:
    paths:
      - "stacks/scale-bridge/**"
      - ".github/workflows/scale-bridge.yml"
  push:
    branches: [main]
    paths:
      - "stacks/scale-bridge/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: stacks/scale-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.7
      - name: Tests
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv run --frozen pytest -q
