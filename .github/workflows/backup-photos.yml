# backup-photos: run stacks/backup-photos/tests/guard-test.sh (deletion guard, B2 second remote,
# --max-delete, dry run, copy mode, crash-vs-usage-error pass handling) inside
# the image the stack runs (same digest as stacks/backup-photos/compose.yaml):
# busybox ash + the real rclone, local directories only, no remote, no config.
name: backup-photos

on:
  pull_request:
    paths:
      - "stacks/backup-photos/**"
      - ".github/workflows/backup-photos.yml"
  push:
    branches: [main]
    paths:
      - "stacks/backup-photos/**"
      - ".github/workflows/backup-photos.yml"

permissions:
  contents: read

concurrency:
  group: backup-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: guard-test.sh in the stack's rclone image
        run: >-
          docker run --rm -v "$PWD/stacks/backup-photos:/w:ro" --entrypoint /bin/sh
          rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          /w/tests/guard-test.sh
