# Calibre importer (docs/services/calibre.md, "Import and dedupe"):
# stacks/calibre/importer.py adds each LazyLibrarian file to Calibre once
# (manifest + library content index), never a lone .opf. calibredb is faked.
name: calibre-import

on:
  pull_request:
    paths:
      - "stacks/calibre/**"
      - ".github/workflows/calibre-import.yml"
  push:
    branches: [main]
    paths:
      - "stacks/calibre/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3.12 = the image's python (python:3.12.x-slim), which runs importer.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Tests
        run: python -m pytest -q stacks/calibre/tests
