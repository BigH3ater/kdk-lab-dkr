# Compose hardening baseline (docs/reference/compose-baseline.md).
#   baseline       -- scripts/compose-baseline-check.py against the committed
#                     known-gap list: fails only on NEW gaps (a service that got
#                     worse, or a new service that is not clean).
#   compose-config -- `docker compose config -q` for every stack with placeholder
#                     env files, so broken YAML never reaches main.
#   host-files     -- scripts/check-host-files-sync.py: the two VM cloud-init
#                     files carry the same host baseline files as hosts/ (a
#                     hosts/ edit without --write would otherwise ship a rebuilt
#                     VM without it; #146 slipped through this way).
name: compose-baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # PyYAML = fast path; without it the script falls back to `docker compose config`.
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Check compose baseline
        run: >-
          python scripts/compose-baseline-check.py
          --allow-known scripts/compose-baseline-known-gaps.txt --summary

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's bundled compose is older than the lab's (v5.5.1 on the
      # hosts) and rejects newer schema keys (`build.provenance`); pin the same
      # major so "config -q" here means what it means on the hosts.
      - uses: docker/setup-compose-action@v2.4.0
        with:
          version: v5.6.1
      # Placeholder .env from each .env.tpl (op:// refs never resolved); host-managed
      # env_file paths (e.g. /opt/kdk-lab/home-assistant/secrets.env) are created
      # empty with sudo. Prints which stacks got placeholders or were skipped.
      - name: Validate every stack with docker compose config
        run: scripts/compose-config-check.sh --ci
      # op inject expands op:// URIs in COMMENTS too: a URI without a field breaks the
      # pre_deploy ("invalid secret reference"), a resolvable one writes the secret into
      # .env. Broke wizarr-sync (#201) and the dashboard (2026-10-30). URIs only on
      # real assignments; describe items in words in comments.
      - name: No op:// URIs in template comments
        run: |
          if grep -nE '^[[:space:]]*#.*op://' $(git ls-files 'stacks/**/*.tpl' 'stacks/*/*.tpl'); then
            echo "::error::op:// URI inside a comment in a template (see lines above)"; exit 1
          fi

  host-files:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: cloud-init copies match hosts/
        run: python scripts/check-host-files-sync.py
      - name: Every Komodo stack redacts its Compose Config log
        run: python scripts/check-komodo-redact-wrapper.py
