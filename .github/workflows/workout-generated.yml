# Exercise-plan tools for wger (docs/runbooks/workout-tracking-update.md):
#   - tools/wger_plan.json (both people's plan, wger built-in exercises by uuid) loads and
#     validates, and gen_wger.py turns it into wger 2.7 writes and the --purge-kdk clean-up
#     (fake API, tools/tests/test_gen_wger.py);
#   - the shipped HA config dirs hold no *.bak and no retired helper (tools/tests/test_ha_shipped_config.py).
# Retired: gen_workout.py and the /workout/ Today page (2026-11-06), the treadmill HA
# integration (2026-11-08), gen-workout-guide.py, workout_catalog.* and wger_exercises.json
# (2026-11-14, replaced by wger_plan.json).
name: workout-generated

on:
  pull_request:
    paths:
      - "stacks/home-assistant/tools/**"
      - "stacks/home-assistant/config/dashboards/**"
      - "stacks/home-assistant/config/packages/**"
      - ".github/workflows/workout-generated.yml"
  push:
    branches: [main]
    paths:
      - "stacks/home-assistant/tools/**"
      - "stacks/home-assistant/config/dashboards/**"
      - "stacks/home-assistant/config/packages/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pytest (+ requests for gen_wger)
        run: python -m pip install pytest==8.4.2 requests==2.32.3
      - name: Tests
        run: python -m pytest -q stacks/home-assistant/tools/tests
