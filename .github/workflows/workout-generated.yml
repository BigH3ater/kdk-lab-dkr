# Exercise-plan tools for wger (docs/runbooks/workout-tracking-update.md):
#   - tools/workout_catalog.json loads and validates (workout_catalog.py) and gen_wger.py
#     turns it + a guide output into wger 2.7 writes (fake API, tools/tests/test_gen_wger.py);
#   - gen-workout-guide.py (laptop-only, the --posters input of gen_wger.py) still prefers
#     the range-of-motion PNG and writes workout.json (fake vault; the real one is private);
#   - the shipped HA config dirs hold no *.bak and no retired helper (tools/tests/test_ha_shipped_config.py).
# The in-house HA helper generator (gen_workout.py) and the /workout/ Today page were
# retired 2026-11-06 when wger won the tracking pilot; the treadmill -> wger auto-log
# (treadmill_wger.yaml) was retired 2026-11-08 (walks are logged in the app), and the
# whole treadmill HA integration (treadmill.yaml, the Treadmill dashboard and their
# tests) the same day.
name: workout-generated

on:
  pull_request:
    paths:
      - "stacks/home-assistant/tools/**"
      - "stacks/home-assistant/config/dashboards/**"
      - "stacks/home-assistant/config/packages/**"
      - ".github/workflows/workout-generated.yml"
  push:
    branches: [main]
    paths:
      - "stacks/home-assistant/tools/**"
      - "stacks/home-assistant/config/dashboards/**"
      - "stacks/home-assistant/config/packages/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pytest (+ requests for gen_wger)
        run: python -m pip install pytest==8.4.2 requests==2.32.3
      - name: Tests
        run: python -m pytest -q stacks/home-assistant/tools/tests
