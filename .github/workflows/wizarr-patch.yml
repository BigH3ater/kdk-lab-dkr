# Wizarr local image (docs/services/wizarr.md, "Local image (patched)"):
#   - patches/0001 applies with zero fuzz to the vendored upstream client.py and
#     makes create_user() refuse an existing LDAP entry (stacks/wizarr/tests);
#   - the Dockerfile FROM pin, the compose kdk/wizarr tag and the docs Image row
#     agree, so a Renovate FROM bump stays red until the patch is re-checked.
name: wizarr-patch

on:
  pull_request:
    paths:
      - "stacks/wizarr/**"
      - "docs/services/wizarr.md"
      - ".github/workflows/wizarr-patch.yml"
  push:
    branches: [main]
    paths:
      - "stacks/wizarr/**"
      - "docs/services/wizarr.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Tests
        run: python -m pytest -q stacks/wizarr/tests
